<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APRS Station Map</title>
<link rel="stylesheet" href="/map-assets/maplibre-gl.css">
<link rel="stylesheet" href="../css/common.css">
<style>
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);}

#topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;
}
.topbar-row{
  display:flex;align-items:center;gap:.7rem;padding:0 .9rem;height:36px;
}
.topbar-row + .topbar-row{border-top:1px solid var(--border);}
#topbar h1{font-size:var(--fs-base);letter-spacing:.08em;color:var(--accent);text-transform:uppercase;white-space:nowrap;}
#statusDot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);flex-shrink:0;}
#statusDot.ok{background:var(--accent);}
#statusDot.err{background:var(--red);}
#statusMsg{font-size:var(--fs-small);color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#stationCount{font-size:var(--fs-small);color:var(--amber);white-space:nowrap;}
#countdown{font-size:var(--fs-small);color:var(--text-dim);white-space:nowrap;width:16ch;flex-shrink:0;text-align:right;transition:color .4s;overflow:visible;}
#countdown.green{color:#3fb950;}
#countdown.yellow{color:var(--amber);}
#countdown.red{color:var(--red);}
.home-link{
  margin-left:auto;
  color:#58a6ff;
  text-decoration:none;
  font-size:0.9rem;
  font-weight:bold;
  letter-spacing:1px;
  text-transform:uppercase;
  white-space:nowrap;
}
.home-link:hover{color:#00d98b;}
#filterSel{
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  font-family:var(--mono);font-size:var(--fs-small);padding:3px 6px;border-radius:4px;cursor:pointer;
  width:7rem;max-width:7rem;
}
#filterSel:focus{outline:none;border-color:var(--accent-dim);}
#callFilter{
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  font-family:var(--mono);font-size:var(--fs-small);padding:3px 6px;border-radius:4px;
  width:9rem;max-width:9rem;
}
#callFilter:focus{outline:none;border-color:var(--accent-dim);}
#callFilter::placeholder{color:var(--text-dim);}
#movingBtn{white-space:nowrap;}
#movingBtn.on{opacity:1;color:var(--accent);border-color:var(--accent-dim);}

#map{position:fixed;top:73px;left:0;right:0;bottom:0;}

/* Popup */
.maplibregl-popup-content{
  background:var(--panel);color:var(--text);border:1px solid var(--border);
  border-radius:7px;font-family:var(--mono);font-size:var(--fs-label);padding:9px 12px;
  min-width:160px;max-width:240px;
}
.maplibregl-popup-tip{border-top-color:var(--panel)!important;}
.maplibregl-ctrl-group{background:var(--panel)!important;border:1px solid var(--border)!important;}
.maplibregl-ctrl-group button{background:var(--panel)!important;}
/* Distance scale bar (bottom-left) — themed to match our boxes */
.maplibregl-ctrl-scale{
  background:rgba(13,17,23,.72)!important;
  border:2px solid var(--border)!important;
  border-top:none!important;
  color:var(--amber)!important;
  font-family:var(--mono)!important;
  font-size:var(--fs-small)!important;
  line-height:1.4;padding:0 5px 1px;
}
.pop-call{font-size:var(--fs-subtitle);font-weight:700;color:var(--accent);margin-bottom:4px;}
.pop-row{display:flex;gap:.4rem;margin-top:2px;font-size:var(--fs-small);}
.pop-lbl{color:var(--text-dim);min-width:52px;}
.pop-val{color:var(--text);}
.pop-comment{margin-top:5px;padding-top:5px;border-top:1px solid var(--border);font-size:var(--fs-small);color:var(--text-dim);word-break:break-word;}
/* Digipeater path row (who relayed the packet) */
.pop-path .pop-val{display:flex;flex-wrap:wrap;gap:3px;align-items:center;}
.pop-hop{color:var(--text-dim);}
.pop-hop.used{color:var(--accent);font-weight:700;}
.pop-hop-sep{color:var(--border);}

/* APRS symbol marker — canvas IS the marker element */
.aprs-marker{
  width:24px;height:24px;cursor:pointer;
  display:block;
  image-rendering:pixelated;
}
/* Callsign label above marker */
.call-label{
  font-family:var(--mono);font-size:12px;font-weight:700;
  color:#e8f0f8;
  text-shadow:0 0 3px #0d1117,0 0 3px #0d1117,-1px -1px 0 #0d1117,1px -1px 0 #0d1117,-1px 1px 0 #0d1117,1px 1px 0 #0d1117;
  white-space:nowrap;pointer-events:none;line-height:1;
}
/* Track controls */
#trackWindow{
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  font-family:var(--mono);font-size:var(--fs-small);padding:3px 6px;border-radius:4px;cursor:pointer;
  width:4.5rem;max-width:4.5rem;
}
#trackWindow:focus{outline:none;border-color:var(--accent-dim);}
#clearTrackBtn{display:none;}
.track-sep{color:var(--border);font-size:var(--fs-small);}
#trackMsg{font-size:var(--fs-small);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;display:none;}
#autoFlyBtn{opacity:1;transition:opacity .2s;white-space:nowrap;}
#autoFlyBtn.on{opacity:1;color:var(--accent);border-color:var(--accent-dim);}
#autoPathBtn{white-space:nowrap;}
#autoPathBtn.on{opacity:1;color:#b478ff;border-color:#b478ff;}
#coverageBtn{white-space:nowrap;}
#coverageBtn.on{opacity:1;color:#2dd4bf;border-color:#2dd4bf;}
/* Green "refresh now" button — deliberately obvious on the kiosk */
#mapRefreshBtn{
  display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap;
  color:var(--accent);border-color:var(--accent-dim);
  background:rgba(0,200,100,0.10);
}
#mapRefreshBtn:hover{background:var(--accent-dim);color:#fff;border-color:var(--accent);}
#mapRefreshBtn.paused{color:var(--text-dim);border-color:var(--border);background:none;}
#mapRefreshBtn.paused:hover{color:var(--text);border-color:var(--accent-dim);background:none;}
#mapRefreshBtn .kr-icon{display:inline-block;line-height:1;font-size:1.05em;}
#mapRefreshBtn.spinning{pointer-events:none;}
#mapRefreshBtn.spinning .kr-icon{animation:map-spin .6s linear infinite;}
@keyframes map-spin{to{transform:rotate(360deg);}}
/* Track popup link */
.pop-track-btn{
  display:block;margin-top:6px;padding-top:5px;
  font-size:var(--fs-small);color:var(--blue);cursor:pointer;background:none;border:none;
  font-family:var(--mono);text-align:left;padding-left:0;width:100%;
}
.pop-track-btn:hover{color:var(--accent);}
.pop-track-status{
  margin-top:4px;font-size:var(--fs-small);
  color:#00c8ff;font-family:var(--mono);display:none;
}
.pop-path-status{
  margin-top:4px;font-size:var(--fs-small);
  color:#b478ff;font-family:var(--mono);display:none;
}
/* ── Sonar pings for newly heard stations — single element, no wrapper, MapLibre-safe ── */
/* Three rings embedded in one box-shadow animation, staggered by keyframe offsets */
@keyframes aprs-sonar{
  0%  {box-shadow: 0 0 5px  0px rgba(0,255,80,.9 ), 0 0 0   0px rgba(0,255,80,0  ), 0 0 0   0px rgba(0,255,80,0  );}
  16% {box-shadow: 0 0 5px 16px rgba(0,255,80,.45), 0 0 5px  0px rgba(0,255,80,.9 ), 0 0 0   0px rgba(0,255,80,0  );}
  33% {box-shadow: 0 0 3px 32px rgba(0,255,80,.0 ), 0 0 5px 16px rgba(0,255,80,.45), 0 0 5px  0px rgba(0,255,80,.9 );}
  50% {box-shadow: 0 0 0   0px rgba(0,255,80,0  ), 0 0 3px 32px rgba(0,255,80,.0 ), 0 0 5px 16px rgba(0,255,80,.45);}
  66% {box-shadow: 0 0 0   0px rgba(0,255,80,0  ), 0 0 0   0px rgba(0,255,80,0  ), 0 0 3px 32px rgba(0,255,80,.0 );}
  100%{box-shadow: 0 0 0   0px rgba(0,255,80,0  ), 0 0 0   0px rgba(0,255,80,0  ), 0 0 0   0px rgba(0,255,80,0  );}
}
.aprs-marker.is-new{
  animation:aprs-sonar 2.4s ease-out 3 forwards;
  border-radius:3px;
}
/* persistent glow — replaces is-new after pings finish, until next refresh */
.aprs-marker.is-persistent{
  animation:aprs-glow-breathe 2.5s ease-in-out infinite;
  border-radius:3px;
  box-shadow:0 0 5px 3px rgba(0,255,80,.3);
}
@keyframes aprs-glow-breathe{
  0%,100%{box-shadow:0 0 4px 2px rgba(0,255,80,.2);}
  50%    {box-shadow:0 0 8px 4px rgba(0,255,80,.5);}
}
/* Glowing destination (receiver) node for the RF path — a DOM marker so it uses
   the same cheap CSS box-shadow glow as stations and never touches map layers. */
.path-rx{
  width:12px;height:12px;border-radius:50%;
  background:#fff;border:2px solid #b478ff;
  box-shadow:0 0 6px 3px rgba(180,120,255,.45);
  animation:path-rx-breathe 2.2s ease-in-out infinite;
  pointer-events:none;
}
@keyframes path-rx-breathe{
  0%,100%{box-shadow:0 0 5px 2px rgba(180,120,255,.30);}
  50%    {box-shadow:0 0 12px 6px rgba(180,120,255,.65);}
}
/* Glowing convergence (receiver) node for the Coverage reach-fan — teal twin. */
.cov-rx{
  width:11px;height:11px;border-radius:50%;
  background:#fff;border:2px solid #2dd4bf;
  box-shadow:0 0 6px 3px rgba(45,212,191,.5);
  animation:cov-rx-breathe 2.2s ease-in-out infinite;
  pointer-events:none;
}
@keyframes cov-rx-breathe{
  0%,100%{box-shadow:0 0 5px 2px rgba(45,212,191,.35);}
  50%    {box-shadow:0 0 12px 6px rgba(45,212,191,.7);}
}
/* ── preserved: old box-shadow pulse ─────────────────────────────────────────
@keyframes aprs-pulse{
  0%  {box-shadow:0 0 0 0 rgba(255,180,84,.85);}
  75% {box-shadow:0 0 0 14px rgba(255,180,84,.15);}
  100%{box-shadow:0 0 0 16px rgba(255,180,84,0);}
}
.aprs-marker.is-new-OLD{
  animation:aprs-pulse 2.5s ease-out 4;
  border-radius:2px;
}
────────────────────────────────────────────────────────────────────────────── */
/* New-stations badge — moved to recent panel */
/* Latest-station link — moved to recent panel */
/* Right-side stacked panels (recent-heard stations + map layers) */
#right-stack{
  position:fixed;top:83px;right:10px;z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end;
  max-height:calc(100vh - 70px);
}
/* Recent-heard panel */
#recent-panel{
  background:var(--panel);border:1px solid var(--border);border-radius:7px;
  font-family:var(--mono);font-size:var(--fs-small);min-width:170px;max-width:220px;
  box-shadow:0 2px 8px rgba(0,0,0,.5);
}
#recent-header{
  display:flex;align-items:center;gap:.5rem;padding:6px 10px;
  cursor:pointer;user-select:none;border-radius:7px;
}
#recent-header:hover{background:var(--panel-2);}
#recent-arrow{font-size:10px;color:var(--text-dim);transition:transform .2s;flex-shrink:0;}
#recent-panel.collapsed #recent-arrow{transform:rotate(-90deg);}
#recent-count{color:var(--amber);font-weight:700;flex:1;white-space:nowrap;}
#recent-body{border-top:1px solid var(--border);padding:4px 0;max-height:260px;overflow-y:auto;}
#recent-panel.collapsed #recent-body{display:none;}
.recent-row{
  display:flex;align-items:center;gap:.4rem;
  padding:4px 10px;cursor:pointer;white-space:nowrap;
}
.recent-row:hover{background:var(--panel-2);}
.recent-call{color:var(--accent);font-weight:700;}
.recent-age{color:var(--text-dim);font-size:var(--fs-micro);margin-left:auto;}

/* Map-layer toggle panel (collapsible, stacked beneath the stations panel) */
#layer-panel{
  background:var(--panel);border:1px solid var(--border);border-radius:7px;
  font-family:var(--mono);font-size:var(--fs-small);min-width:170px;max-width:220px;
  box-shadow:0 2px 8px rgba(0,0,0,.5);
}
#layer-header{
  display:flex;align-items:center;gap:.5rem;padding:6px 10px;
  cursor:pointer;user-select:none;border-radius:7px;
}
#layer-header:hover{background:var(--panel-2);}
#layer-arrow{font-size:10px;color:var(--text-dim);transition:transform .2s;flex-shrink:0;}
#layer-panel.collapsed #layer-arrow{transform:rotate(-90deg);}
#layer-title{color:var(--accent);font-weight:700;flex:1;white-space:nowrap;letter-spacing:.04em;}
#layer-body{border-top:1px solid var(--border);padding:7px 10px;}
#layer-panel.collapsed #layer-body{display:none;}
.layer-toggle{display:flex;align-items:center;gap:8px;margin-bottom:5px;cursor:pointer;user-select:none;}
.layer-toggle:last-child{margin-bottom:0;}
.layer-toggle input{accent-color:var(--accent);cursor:pointer;}
.layer-toggle span{color:var(--text);}

/* APRS objects filter panel (dynamic, collapsible) */
#objects-panel{
  background:var(--panel);border:1px solid var(--border);border-radius:7px;
  font-family:var(--mono);font-size:var(--fs-small);min-width:170px;max-width:220px;
  box-shadow:0 2px 8px rgba(0,0,0,.5);
}
#objects-header{
  display:flex;align-items:center;gap:.5rem;padding:6px 10px;
  cursor:pointer;user-select:none;border-radius:7px;
}
#objects-header:hover{background:var(--panel-2);}
#objects-arrow{font-size:10px;color:var(--text-dim);transition:transform .2s;flex-shrink:0;}
#objects-panel.collapsed #objects-arrow{transform:rotate(-90deg);}
#objects-title{color:var(--amber);font-weight:700;flex:1;white-space:nowrap;letter-spacing:.04em;}
#objects-count{color:var(--text-dim);font-size:var(--fs-micro);flex-shrink:0;}
#objects-body{border-top:1px solid var(--border);padding:7px 10px;max-height:240px;overflow-y:auto;}
#objects-panel.collapsed #objects-body{display:none;}
.obj-count{margin-left:auto;color:var(--text-dim);font-size:var(--fs-micro);}
.cat-icon{width:16px;height:16px;image-rendering:pixelated;flex-shrink:0;}
.obj-name{cursor:pointer;}
.obj-name:hover{color:var(--accent);text-decoration:underline;}
.obj-actions{display:flex;gap:.5rem;margin-bottom:6px;}
.obj-actions button{
  background:var(--bg);border:1px solid var(--border);color:var(--text-dim);
  font-family:var(--mono);font-size:var(--fs-micro);padding:1px 6px;border-radius:4px;cursor:pointer;
}
.obj-actions button:hover{border-color:var(--accent-dim);color:var(--text);}

/* Coverage iGate panel — mirrors the objects panel, teal accent */
#coverage-panel{
  background:var(--panel);border:1px solid var(--border);border-radius:7px;
  font-family:var(--mono);font-size:var(--fs-small);min-width:170px;max-width:220px;
  box-shadow:0 2px 8px rgba(0,0,0,.5);
}
#coverage-header{
  display:flex;align-items:center;gap:.5rem;padding:6px 10px;
  cursor:pointer;user-select:none;border-radius:7px;
}
#coverage-header:hover{background:var(--panel-2);}
#coverage-arrow{font-size:10px;color:var(--text-dim);transition:transform .2s;flex-shrink:0;}
#coverage-panel.collapsed #coverage-arrow{transform:rotate(-90deg);}
#coverage-title{color:#2dd4bf;font-weight:700;flex:1;white-space:nowrap;letter-spacing:.04em;}
#coverage-count{color:var(--text-dim);font-size:var(--fs-micro);flex-shrink:0;}
#coverage-body{border-top:1px solid var(--border);padding:7px 10px;max-height:240px;overflow-y:auto;}
#coverage-panel.collapsed #coverage-body{display:none;}
#coverage-body .layer-toggle input{accent-color:#2dd4bf;}

/* Active state for the Grid / Measure toggles (mirrors #autoFlyBtn.on) */
#gridBtn.on,#measureBtn.on{opacity:1;color:var(--accent);border-color:var(--accent-dim);}
/* Crosshair cursor while measuring */
#map.measuring .maplibregl-canvas{cursor:crosshair;}

/* Measure readout panel (bottom-center) */
#measure-panel{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:200;
  background:var(--panel);border:1px solid var(--accent-dim);border-radius:7px;
  font-family:var(--mono);padding:7px 14px;display:none;text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.5);max-width:92vw;
}
#measure-panel.show{display:block;}
#measure-readout{font-size:var(--fs-label);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#measure-readout b{color:var(--accent);}
#measure-hint{font-size:var(--fs-micro);color:var(--text-dim);margin-top:3px;}

/* Base-map attribution label (bottom-right) — click to load a different map */
#basemap-info{
  position:fixed;right:10px;bottom:6px;z-index:150;
  background:rgba(13,17,23,.72);border:1px solid var(--border);border-radius:4px;
  font-family:var(--mono);font-size:var(--fs-small);color:var(--text-dim);
  padding:2px 7px;pointer-events:auto;white-space:nowrap;cursor:pointer;
}
#basemap-info:hover{border-color:var(--accent-dim);color:var(--text);}
#basemap-info b{color:var(--accent);font-weight:700;}
#basemap-info .bm-caret{color:var(--text-dim);margin-left:4px;}
#basemap-info .bm-path{display:block;color:var(--text-dim);font-size:var(--fs-small);opacity:.85;margin-top:1px;max-width:52ch;overflow:hidden;text-overflow:ellipsis;}

/* Leading cell shared by both rows so the first separator lines up vertically */
.lead-cell{display:flex;align-items:center;gap:.7rem;width:300px;flex-shrink:0;}
#coordReadout{
  font-family:var(--mono);font-size:var(--fs-small);color:var(--text-dim);
  white-space:nowrap;display:flex;align-items:center;gap:6px;
}
#coordReadout .cr-lbl{color:var(--text-dim);}
#coordReadout .cr-val{display:inline-block;text-align:right;color:#7ecfff;font-weight:600;}
#coordReadout #crLat{width:9ch;}
#coordReadout #crLon{width:10ch;}
#coordReadout #crZoom{width:4ch;color:var(--amber);}
#coordReadout .cr-sep{color:var(--border);}

/* Base-map loader modal (click bottom-right label → browse Pi / USB for .pmtiles) */
#fs-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;
  display:flex;align-items:center;justify-content:center;
}
#fs-modal.fs-hidden{display:none;}
#fs-dialog{
  background:var(--panel);border:1px solid var(--border);border-radius:7px;
  width:min(560px,92vw);max-height:80vh;display:flex;flex-direction:column;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
#fs-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);}
#fs-title{color:var(--accent);font-weight:700;letter-spacing:1px;flex:1;font-family:var(--mono);}
#fs-close{background:none;border:none;color:var(--text-dim);font-size:1.1rem;cursor:pointer;}
#fs-close:hover{color:var(--red);}
#fs-path{padding:6px 12px;color:var(--blue);font-size:var(--fs-small);word-break:break-all;border-bottom:1px solid var(--border);font-family:var(--mono);}
#fs-list{overflow-y:auto;padding:4px 0;}
.fs-row{padding:6px 14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:var(--fs-small);}
.fs-row:hover{background:var(--bg);}
.fs-dir{color:var(--text);}
.fs-file{color:var(--accent);}
.fs-empty,#fs-msg{padding:10px 14px;color:var(--text-dim);font-size:var(--fs-small);}
#fs-msg:empty{display:none;}

/* ── Themed scrollbars ────────────────────────────────────────────────────────
   Track-less bars whose thumb is tinted to each panel's header accent and
   brightens on hover. WebKit/Chromium (the kiosk engine).
   GOTCHA: do NOT set the standard `scrollbar-width`/`scrollbar-color` here — on
   Chromium 121+ either one disables ALL ::-webkit-scrollbar rules (width
   included), so width edits silently do nothing. WebKit pseudo-elements give
   full width + colour control. */
#recent-body::-webkit-scrollbar,
#objects-body::-webkit-scrollbar,
#coverage-body::-webkit-scrollbar,
#fs-list::-webkit-scrollbar{width:14px;height:20px;}
#recent-body::-webkit-scrollbar-track,
#objects-body::-webkit-scrollbar-track,
#coverage-body::-webkit-scrollbar-track,
#fs-list::-webkit-scrollbar-track{background:transparent;}
#recent-body::-webkit-scrollbar-thumb,
#objects-body::-webkit-scrollbar-thumb,
#coverage-body::-webkit-scrollbar-thumb,
#fs-list::-webkit-scrollbar-thumb{
  border-radius:6px;border:2px solid transparent;background-clip:padding-box;
}
/* Recent-heard + map browser → green */
#recent-body::-webkit-scrollbar-thumb,
#fs-list::-webkit-scrollbar-thumb{background-color:var(--accent-dim);}
#recent-body::-webkit-scrollbar-thumb:hover,
#fs-list::-webkit-scrollbar-thumb:hover{background-color:var(--accent);}
/* APRS info → amber */
#objects-body::-webkit-scrollbar-thumb{background-color:#8a6a1f;}
#objects-body::-webkit-scrollbar-thumb:hover{background-color:var(--amber);}
/* Coverage → teal */
#coverage-body::-webkit-scrollbar-thumb{background-color:#1c7d72;}
#coverage-body::-webkit-scrollbar-thumb:hover{background-color:#2dd4bf;}
</style>
</head>
<body>

<div id="topbar">
  <!-- Row 1 — system status & RF overlays -->
  <div class="topbar-row">
    <div class="lead-cell">
      <h1>APRS Map</h1>
      <div id="statusDot"></div>
      <span id="stationCount"></span>
      <span id="countdown"></span>
    </div>
    <span class="track-sep">|</span>

<script src="/map-assets/pmtiles.js"></script>
<script src="/map-assets/basemap-style.js"></script>
<script>
'use strict';

const HOST = location.hostname;

// Ports default to well-known values; overridden by /server-ports.json on load.
const PORTS = { flask: 8083, graywolf: 8080, kiwix: 8081, aprs_api: 8085 };

async function loadConfig() {
  try {
    const r = await fetch('/server-ports.json', { cache: 'no-store' });
    if (r.ok) {
      const d = await r.json();
      if (d.ok && d.ports) Object.assign(PORTS, d.ports);
    }
  } catch (_) { /* use defaults */ }
}

// ── Sprite sheets (primary and alternate tables) ────────────────────────────
const SPRITE_CELL = 24;
const SPRITE_COLS = 16;
const ALT_TABLE = String.fromCharCode(92); // backslash

const spriteImgs = {};
spriteImgs['/']        = new Image();
spriteImgs[ALT_TABLE]  = new Image();
spriteImgs['/'].src        = '/map-assets/aprs-symbols-24-0.png';
spriteImgs[ALT_TABLE].src  = '/map-assets/aprs-symbols-24-1.png';

// Get pixel offset in sprite for a symbol code char
function symOffset(code) {
  const idx = code.charCodeAt(0) - 33;
  if (idx < 0 || idx > 95) return [0, 0];
  const col = idx % SPRITE_COLS;
  const row = Math.floor(idx / SPRITE_COLS);
  return [col * SPRITE_CELL, row * SPRITE_CELL];
}

// Is this an overlay table char (not '/' and not backslash)?
function isOverlay(table) {
  return table !== '/' && table !== ALT_TABLE;
}

// Build a canvas element as the marker — stable anchor point, no wrapper div
function makeMarkerEl(symTable, symCode) {
  const canvas = document.createElement('canvas');
  canvas.width  = SPRITE_CELL;
  canvas.height = SPRITE_CELL;
  canvas.className = 'aprs-marker';
  canvas.style.width  = SPRITE_CELL + 'px';
  canvas.style.height = SPRITE_CELL + 'px';

  // Pick the right sprite: alternate table for backslash, primary for '/' and overlays
  // Overlays use the alternate sprite sheet at the same symbol position
  const sprite = (isOverlay(symTable) || symTable === ALT_TABLE)
    ? spriteImgs[ALT_TABLE]
    : spriteImgs['/'];

  function draw() {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, SPRITE_CELL, SPRITE_CELL);
    const [sx, sy] = symOffset(symCode);
    ctx.drawImage(sprite, sx, sy, SPRITE_CELL, SPRITE_CELL, 0, 0, SPRITE_CELL, SPRITE_CELL);
    // Draw overlay letter directly into the canvas bottom-right corner
    if (isOverlay(symTable)) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(15, 15, 9, 9);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 7px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(symTable, 19.5, 19.5);
    }
  }

  if (sprite.complete && sprite.naturalWidth > 0) {
    draw();
  } else {
    sprite.addEventListener('load', draw, { once: true });
  }

  return canvas;
}

// ── Map setup ────────────────────────────────────────────────────────────────
// PMTiles: a single-file tile archive read directly by the browser via HTTP
// range requests. Register the protocol, then point the vector source at it.
const origin    = location.origin;
// Deep-link params (parity with the offline maps viewer):
//   ?file=<archive.pmtiles>  ?center=<lon,lat>  ?zoom=<z>
const _params    = new URLSearchParams(location.search);
let   MAP_FILE   = _params.get('file') || 'washington.pmtiles';
const _pc        = _params.get('center');
const _pz        = _params.get('zoom');
const URL_CENTER = _pc ? _pc.split(',').map(Number) : null;
const URL_ZOOM   = (_pz != null && _pz !== '') ? Number(_pz) : null;
const tilesUrl  = 'pmtiles://' + origin + '/maps/' + MAP_FILE;

const pmtilesHttpUrl   = (file) => origin + '/maps/' + file;
const pmtilesSourceUrl = (file) => 'pmtiles://' + pmtilesHttpUrl(file);

// HTML-escape helper (used by the base-map label and the fs browser).
const _escHtml = (s) => String(s).replace(/[&<>"]/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

// Bottom-right label — shows the current base map (name + the path it loads
// from) and acts as the "load map" affordance (click → browse the Pi / USB for
// a different .pmtiles archive).
function updateBasemapInfo(label, path) {
  const el = document.getElementById('basemap-info');
  if (!el) return;
  const name = String(label).replace(/\.pmtiles$/i, '');
  let html = 'Base map: <b>' + name + '</b> <span class="bm-caret">▾</span>';
  if (path) html += '<span class="bm-path">' + _escHtml(path) + '</span>';
  el.innerHTML = html;
}
updateBasemapInfo(MAP_FILE, '/maps/' + MAP_FILE);

const pmtilesProtocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', pmtilesProtocol.tile);

const map = new maplibregl.Map({
  container: 'map',
  style: oasisBaseMapStyle(tilesUrl),
  center: (URL_CENTER && URL_CENTER.length === 2 && URL_CENTER.every(Number.isFinite)) ? URL_CENTER : [-122.1, 47.6],
  zoom: (URL_ZOOM != null && Number.isFinite(URL_ZOOM)) ? URL_ZOOM : 9,
  attributionControl: false
});

map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'bottom-left');

// ── Base-map switching (click the bottom-right label to load a different map) ──
// Fly to an archive's native center/zoom (best-effort). httpUrl is the plain
// (non-protocol) URL the PMTiles reader uses to fetch the archive header.
async function flyToArchive(httpUrl, duration) {
  try {
    const hdr = await new pmtiles.PMTiles(httpUrl).getHeader();
    if (hdr && Number.isFinite(hdr.centerLon) && Number.isFinite(hdr.centerLat)) {
      map.flyTo({ center: [hdr.centerLon, hdr.centerLat], zoom: hdr.centerZoom || 9, duration });
    }
  } catch (e) { /* centering is best-effort */ }
}

function loadMapSource(sourceUrl, httpUrl, label, path) {
  map.getSource('basemap').setUrl(sourceUrl);
  if (label) updateBasemapInfo(label, path);
  map.once('idle', () => flyToArchive(httpUrl, 800));
}

// Swap to a bundled map in the suite's maps/ folder.
function switchMap(filename) {
  MAP_FILE = filename;
  loadMapSource(pmtilesSourceUrl(filename), pmtilesHttpUrl(filename), filename, '/maps/' + filename);
}

// Load a .pmtiles from an arbitrary allowlisted path (Pi disk / USB / mount).
function loadExternalMap(absPath) {
  const httpUrl = origin + '/api/fs/pmtiles?path=' + encodeURIComponent(absPath);
  const label = absPath.split(/[\\/]/).pop();
  loadMapSource('pmtiles://' + httpUrl, httpUrl, label, absPath);
}

// ── "Load base map" filesystem browser ────────────────────────────────────────
const _fsModal = document.getElementById('fs-modal');

async function openFsBrowser(path) {
  const list   = document.getElementById('fs-list');
  const pathEl = document.getElementById('fs-path');
  const msg    = document.getElementById('fs-msg');
  msg.textContent = '';
  list.innerHTML  = '<div class="fs-empty">Loading…</div>';
  try {
    const res = await fetch(origin + '/api/fs/browse?path=' + encodeURIComponent(path), { cache: 'no-store' });
    let d = null;
    try { d = await res.json(); } catch (_) { /* non-JSON body (e.g. a 404/500 HTML page) */ }
    if (!res.ok || !d || !d.ok) {
      list.innerHTML = '';
      const why = (d && d.error) ? d.error
        : (res.status === 404 ? 'HTTP 404 — server has no /api/fs/browse route (restart OASIS with the updated server/app.py)'
                              : 'HTTP ' + res.status + ' ' + res.statusText);
      msg.textContent = 'Browse failed: ' + why;
      console.error('[fs-browse]', res.status, d);
      return;
    }
    pathEl.textContent = d.roots ? 'Select a location:' : d.path;
    let rows = '';
    if (!d.roots && d.parent !== null) {
      rows += '<div class="fs-row fs-dir" data-path="' + _escHtml(d.parent) + '" data-type="dir">..</div>';
    }
    (d.entries || []).forEach(e => {
      const cls   = e.type === 'dir' ? 'fs-dir' : 'fs-file';
      const label = e.type === 'dir' ? _escHtml(e.name) + '/' : _escHtml(e.name);
      rows += '<div class="fs-row ' + cls + '" data-path="' + _escHtml(e.path) + '" data-type="' + e.type + '">' + label + '</div>';
    });
    list.innerHTML = rows || '<div class="fs-empty">No folders or .pmtiles here.</div>';
  } catch (e) {
    list.innerHTML = ''; msg.textContent = 'Browse failed: ' + e.message;
    console.error('[fs-browse]', e);
  }
}

document.getElementById('basemap-info').addEventListener('click', () => {
  _fsModal.classList.remove('fs-hidden');
  openFsBrowser('');
});
document.getElementById('fs-close').addEventListener('click', () => _fsModal.classList.add('fs-hidden'));
_fsModal.addEventListener('click', (e) => { if (e.target === _fsModal) _fsModal.classList.add('fs-hidden'); });
document.getElementById('fs-list').addEventListener('click', (e) => {
  const row = e.target.closest('.fs-row');
  if (!row) return;
  if (row.dataset.type === 'dir') {
    openFsBrowser(row.dataset.path);
  } else {
    loadExternalMap(row.dataset.path);
    _fsModal.classList.add('fs-hidden');
  }
});

// ── Base-map layer toggles ────────────────────────────────────────────────────
// Group the shared base-map layer ids (from basemap-style.js) into the toggles
// shown in the collapsible "Map layers" panel. Mirrors maps/map.html.
const LAYER_GROUPS = {
  roads:     ['road-minor', 'road-secondary', 'road-primary', 'road-motorway', 'road-labels'],
  waterways: ['waterways-line'],
  water:     ['water-poly-fill'],
  buildings: ['buildings-fill'],
  parks:     ['landuse-park'],
  landuse:   ['landcover-wood', 'landcover-grass', 'landuse-residential', 'landuse-commercial', 'landuse-industrial'],
  pois:      ['place-labels', 'pois-circle'],
  peaks:     ['mountain-peak'],
};

function toggleLayerPanel() {
  document.getElementById('layer-panel').classList.toggle('collapsed');
}

document.querySelectorAll('.layer-toggle input').forEach(cb => {
  cb.addEventListener('change', () => {
    const vis = cb.checked ? 'visible' : 'none';
    (LAYER_GROUPS[cb.dataset.group] || []).forEach(id => {
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', vis);
    });
  });
});

// ── APRS object-type classification + filter panel ────────────────────────────
// Each APRS station/object carries a symbol (sym_table + sym_code) that defines
// its icon and, by extension, its type. We classify by symbol code into coarse,
// human-friendly categories. Unknown symbols fall back to "Other". The filter
// panel is built dynamically from whatever categories are actually on the map.
const _OBJ_CATS = {
  // Land vehicles
  '>':['car','Cars'], 'j':['car','Cars'], 'v':['car','Cars'],
  '<':['motorcycle','Motorcycles'],
  'k':['truck','Trucks'], 'u':['truck','Trucks'],
  'R':['rv','RVs / campers'],
  'U':['bus','Buses'],
  '=':['train','Trains'],
  'b':['bicycle','Bicycles'],
  // Air
  "'":['aircraft','Aircraft'], '^':['aircraft','Aircraft'], 'g':['aircraft','Aircraft'],
  'X':['heli','Helicopters'], 'O':['balloon','Balloons'],
  // Marine
  's':['marine','Boats & ships'], 'Y':['marine','Boats & ships'], 'C':['marine','Boats & ships'],
  // People
  '[':['pedestrian','People'], 'p':['pedestrian','People'],
  // Weather
  '_':['wx','Weather'], 'W':['wx','Weather'],
  // RF infrastructure
  '#':['digi','Digipeaters'], '&':['igate','Gateways'],
  'r':['antenna','Antennas'], 'y':['antenna','Antennas'], '`':['antenna','Antennas'],
  // Fixed locations
  '-':['home','Home / QTH'],
  // Public safety / emergency
  '!':['safety','Public safety'], 'P':['safety','Public safety'], 'a':['safety','Public safety'],
  'f':['safety','Public safety'], 'd':['safety','Public safety'], 'c':['safety','Public safety'],
  'A':['safety','Public safety'], 'h':['safety','Public safety'], 'o':['safety','Public safety'],
  '+':['safety','Public safety'],
  // Services / places
  '?':['services','Services / places'], '$':['services','Services / places'],
  ';':['services','Services / places'], 'B':['services','Services / places'],
  'K':['services','Services / places'],
};

function aprsCategory(s) {
  // Weather stations use '_' on both the primary and alternate tables.
  if (s && s.sym_code === '_') return { key:'wx', label:'Weather' };
  const hit = s ? _OBJ_CATS[s.sym_code] : null;
  return hit ? { key:hit[0], label:hit[1] } : { key:'other', label:'Other' };
}

// Representative APRS symbol per category (table, code) — drawn as the row icon.
const _CAT_ICON = {
  car:['/','>'], truck:['/','k'], bus:['/','U'], motorcycle:['/','<'], bicycle:['/','b'],
  rv:['/','R'], aircraft:['/',"'"], heli:['/','X'], balloon:['/','O'], marine:['/','Y'],
  train:['/','='], pedestrian:['/','['], wx:['/','_'], digi:['/','#'], igate:['/','&'],
  antenna:['/','r'], home:['/','-'], safety:['/','P'], services:['/','?'], other:['/','/'],
};
function catIconEl(key) {
  const sym = _CAT_ICON[key] || ['/', '/'];
  const c = makeMarkerEl(sym[0], sym[1]);
  c.className = 'cat-icon';
  c.style.width = '16px';
  c.style.height = '16px';
  return c;
}

// Enabled state per category key (default: enabled). Persists across refreshes.
const objCatState = {};

function toggleObjectsPanel() {
  document.getElementById('objects-panel').classList.toggle('collapsed');
}

// Rebuild the category checkboxes from the current station list, preserving the
// user's enabled/disabled choices and showing a live count per category.
function updateObjectsPanel() {
  const body = document.getElementById('objects-body');
  const countEl = document.getElementById('objects-count');
  const cats = {}; // key -> { label, count }
  const otherRaw = {}; // 'table+code' -> count, for the unclassified bucket
  allStations.forEach(s => {
    const { key, label } = aprsCategory(s);
    if (!cats[key]) cats[key] = { label, count: 0 };
    cats[key].count++;
    if (!(key in objCatState)) objCatState[key] = true; // new category defaults on
    if (key === 'other') {
      const raw = ((s && s.sym_table) || '·') + ((s && s.sym_code) || '·');
      otherRaw[raw] = (otherRaw[raw] || 0) + 1;
    }
  });
  const keys = Object.keys(cats).sort((a, b) => cats[b].count - cats[a].count || cats[a].label.localeCompare(cats[b].label));
  countEl.textContent = keys.length ? keys.length + ' types' : '';
  if (!keys.length) {
    body.innerHTML = '<div style="padding:4px 2px;color:var(--text-dim)">No objects heard yet</div>';
    return;
  }
  // "Other" tooltip lists the raw table+code so unmapped symbols stay visible.
  const otherTip = Object.entries(otherRaw).sort((a, b) => b[1] - a[1]).map(([r, n]) => r + '×' + n).join('  ');
  let html = '<div class="obj-actions"><button onclick="setAllObjects(true)">All</button><button onclick="setAllObjects(false)">None</button></div>';
  html += keys.map(k => {
    const tip = (k === 'other' && otherTip) ? ' title="Unclassified symbols (table+code): ' + _escHtml(otherTip) + '"' : '';
    return '<label class="layer-toggle"' + tip + '><input type="checkbox" data-objcat="' + k + '"' + (objCatState[k] ? ' checked' : '') + '> ' +
      '<span class="obj-name" data-objcat="' + k + '" title="Click to show only this type">' + _escHtml(cats[k].label) + '</span>' +
      '<span class="obj-count">' + cats[k].count + '</span></label>';
  }).join('');
  body.innerHTML = html;
  // Prepend the representative APRS sprite icon to each row.
  body.querySelectorAll('.layer-toggle').forEach(row => {
    const cb = row.querySelector('input[data-objcat]');
    if (!cb) return;
    row.insertBefore(catIconEl(cb.dataset.objcat), cb.nextSibling);
  });
}

function setAllObjects(on) {
  Object.keys(objCatState).forEach(k => objCatState[k] = on);
  updateObjectsPanel();
  applyFilter();
}

// Solo a category — click a category name to show only that type; click the
// soloed type again to restore all.
function soloObject(key) {
  const keys = Object.keys(objCatState);
  const isSolo = objCatState[key] && keys.every(k => k === key || !objCatState[k]);
  keys.forEach(k => objCatState[k] = isSolo ? true : (k === key));
  updateObjectsPanel();
  applyFilter();
}

// Delegated change handler for the dynamically-built category checkboxes.
document.getElementById('objects-body').addEventListener('change', (e) => {
  const cb = e.target.closest('input[data-objcat]');
  if (!cb) return;
  objCatState[cb.dataset.objcat] = cb.checked;
  applyFilter();
});

// Click a category name to solo it (without toggling its checkbox).
document.getElementById('objects-body').addEventListener('click', (e) => {
  const name = e.target.closest('.obj-name');
  if (!name) return;
  e.preventDefault();   // don't let the <label> toggle the checkbox
  e.stopPropagation();
  soloObject(name.dataset.objcat);
});

// ── Station markers ──────────────────────────────────────────────────────────
let markers = [];
let openPopup = null;

function clearMarkers() {
  markers.forEach(m => m.remove());
  markers = [];
}

function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toUTCString().replace(/.*?, /, '').replace(/:(\d\d) GMT/, ' UTC');
}

function fmtCourse(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16] + ' (' + deg + '°)';
}

// ── Geodesy helpers (client-side, offline) ───────────────────────────────────
// 16-point compass cardinal for a bearing in degrees.
function cardinal(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
}

// Great-circle distance between two lat/lon points, in km. Haversine.
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371.0088; // mean Earth radius, km
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// Initial great-circle bearing from point 1 to point 2, in degrees (0–360).
function initialBearing(lat1, lon1, lat2, lon2) {
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
  const dL = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(dL) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(dL);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

// Convert lat/lon to a Maidenhead grid locator (ported from server/maidenhead.py).
// precision: 2 (field), 4 (square), or 6 (subsquare).
function latLonToGrid(lat, lon, precision) {
  precision = precision || 6;
  if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return '';
  let L = lon + 180, B = lat + 90;
  const out = [];
  out.push(String.fromCharCode((L / 20 | 0) + 65));
  out.push(String.fromCharCode((B / 10 | 0) + 65));
  L %= 20; B %= 10;
  out.push(String((L / 2 | 0)));
  out.push(String((B / 1 | 0)));
  L %= 2; B %= 1;
  if (precision >= 6) {
    out.push(String.fromCharCode((L / (2 / 24) | 0) + 97));
    out.push(String.fromCharCode((B / (1 / 24) | 0) + 97));
  }
  return out.slice(0, precision).join('');
}

function buildPopup(s) {
  let html = '<div class="pop-call">' + s.callsign + (s.is_object ? ' <span style="color:var(--amber);font-size:var(--fs-small)">[obj]</span>' : '') + '</div>';
  html += '<div class="pop-row"><span class="pop-lbl">Last heard</span><span class="pop-val">' + fmtTime(s.last_heard) + '</span></div>';
  if (s.speed_mph > 0) {
    html += '<div class="pop-row"><span class="pop-lbl">Speed</span><span class="pop-val">' + s.speed_mph + ' mph</span></div>';
    if (s.course !== null) {
      html += '<div class="pop-row"><span class="pop-lbl">Course</span><span class="pop-val">' + fmtCourse(s.course) + '</span></div>';
    }
  }
  if (s.alt_m && s.alt_m > 0) {
    html += '<div class="pop-row"><span class="pop-lbl">Alt</span><span class="pop-val">' + Math.round(s.alt_m * 3.28084) + ' ft</span></div>';
  }
  if (s.lat != null && s.lon != null) {
    html += '<div class="pop-row"><span class="pop-lbl">Lat / Lon</span><span class="pop-val">' + s.lat.toFixed(4) + ', ' + s.lon.toFixed(4) + '</span></div>';
  }
  html += '<div class="pop-row"><span class="pop-lbl">Via</span><span class="pop-val">' + _escHtml(s.via || 'direct') + '</span></div>';
  if (s.path && s.path.length) {
    const hops = s.path.map(p => {
      const raw = String(p);
      const used = raw.endsWith('*');
      const name = _escHtml(used ? raw.slice(0, -1) : raw);
      return '<span class="pop-hop' + (used ? ' used' : '') + '" title="' + (used ? 'relayed this packet' : 'requested hop (not used)') + '">' + name + (used ? '*' : '') + '</span>';
    }).join('<span class="pop-hop-sep">›</span>');
    html += '<div class="pop-row pop-path"><span class="pop-lbl">Path</span><span class="pop-val">' + hops + '</span></div>';
  }
  if (s.comment) {
    html += '<div class="pop-comment">' + s.comment.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>';
  }
  html += '<div class="pop-track-status" id="pop-track-status-' + s.callsign + '"' +
           (activeTrack === s.callsign && _trackStatusMsg ? ' style="display:block">' + _trackStatusMsg : '>') +
           '</div>';
  html += '<button class="pop-track-btn" onclick="showTrack(\'' + s.callsign + '\')">' +
          (activeTrack === s.callsign ? '✕ Clear track' : '⟳ Show track') + '</button>';
  html += '<div class="pop-path-status" id="pop-path-status-' + s.callsign + '"' +
           (activePath === s.callsign && _pathStatusMsg ? ' style="display:block">' + _escHtml(_pathStatusMsg) : '>') +
           '</div>';
  html += '<button class="pop-track-btn" onclick="showPath(\'' + s.callsign + '\')">' +
          (activePath === s.callsign ? '✕ Clear path' : '⟲ Show path') + '</button>';
  return html;
}

function plotStations(stations) {
  clearMarkers();
  stations.forEach(s => {
    if (s.lat == null || s.lon == null) return;

    const isNew = _newCallsigns.has(s.callsign);
    const markerEl = makeMarkerEl(s.sym_table, s.sym_code);
    // Sonar pings — applied directly to canvas, no wrapper, MapLibre positioning untouched
    if (isNew) {
      markerEl.classList.add('is-new');
      markerEl.addEventListener('animationend', () => {
        markerEl.classList.remove('is-new');
        markerEl.classList.add('is-persistent');
      }, { once: true });
    }

    const popup = new maplibregl.Popup({ offset: 12, closeButton: true, maxWidth: '260px' })
      .setHTML(buildPopup(s));

    const marker = new maplibregl.Marker({ element: markerEl, anchor: 'top-left', offset: [-SPRITE_CELL / 2, -SPRITE_CELL / 2] })
      .setLngLat([s.lon, s.lat])
      .setPopup(popup)
      .addTo(map);

    markers.push(marker);

    // Callsign label — separate marker offset above the icon
    const labelEl = document.createElement('div');
    labelEl.className = 'call-label';
    labelEl.textContent = s.callsign;
    const labelMarker = new maplibregl.Marker({ element: labelEl, anchor: 'bottom', offset: [0, -12] })
      .setLngLat([s.lon, s.lat])
      .addTo(map);
    markers.push(labelMarker);
  });
}

// ── Data fetching ────────────────────────────────────────────────────────────
// Use the same-origin Flask proxy (/api/aprs/stations → 127.0.0.1:8085) to
// avoid cross-origin requests from the browser (page is on :8083, API on :8085).
const API_URL = () => location.origin + '/api/aprs/stations';
const REFRESH_SEC = 15;
let countdown = REFRESH_SEC;
let timer = null;
let autoRefresh = true;     // Refresh button toggles the 15s auto-refresh loop
let allStations = []; // full unfiltered station list
let _prevHeard = {};  // callsign → last_heard string from previous fetch
let _newCallsigns = new Set(); // callsigns new/updated in latest fetch
let _latestStation = null; // station object with most recent last_heard

// ── Callsign filter + movers-only toggle ──────────────────────────────────────
let movingOnly = false;

// Match a callsign against the filter box: blank = all; plain text = prefix
// match (so "K7ISQ" catches every K7ISQ-NN SSID); '*' = wildcard anywhere.
function callMatches(callsign) {
  const q = (document.getElementById('callFilter').value || '').trim().toUpperCase();
  if (!q) return true;
  const cs = (callsign || '').toUpperCase();
  if (q.includes('*')) {
    const re = new RegExp('^' + q.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*') + '$');
    return re.test(cs);
  }
  return cs.startsWith(q);
}

function toggleMoving() {
  movingOnly = !movingOnly;
  document.getElementById('movingBtn').classList.toggle('on', movingOnly);
  applyFilter();
}
document.getElementById('callFilter').addEventListener('input', () => applyFilter());

function applyFilter() {
  const minutes = parseInt(document.getElementById('filterSel').value);
  let filtered = allStations;
  if (minutes > 0) {
    const cutoff = Date.now() - minutes * 60 * 1000;
    filtered = allStations.filter(s => {
      if (!s.last_heard) return false;
      return new Date(s.last_heard).getTime() >= cutoff;
    });
  }
  // APRS object-type filter (categories disabled in the objects panel)
  filtered = filtered.filter(s => objCatState[aprsCategory(s).key] !== false);
  // Callsign filter (prefix / * wildcard) + movers-only toggle
  filtered = filtered.filter(s => callMatches(s.callsign) && (!movingOnly || (s.speed_mph > 0)));
  plotStations(filtered);
  if (coverageOn) _refreshCoverage(filtered);
  const total = allStations.length;
  const shown = filtered.length;
  const scEl = document.getElementById('stationCount');
  scEl.textContent = shown + '/' + total;
  scEl.title = shown + ' shown of ' + total + ' station' + (total !== 1 ? 's' : '');
}

function setStatus(state, msg) {
  const dot = document.getElementById('statusDot');
  dot.className = state; // 'ok', 'err', or ''
  document.getElementById('statusMsg').textContent = msg;
}

function updateCountdown() {
  const el = document.getElementById('countdown');
  el.textContent = 'refresh in: ' + countdown + 's.';
  el.className = countdown >= 10 ? 'green' : countdown >= 5 ? 'yellow' : 'red';
}

function startCountdown() {
  clearInterval(timer);
  if (!autoRefresh) {
    const el = document.getElementById('countdown');
    el.textContent = 'paused';
    el.className = '';
    return;
  }
  countdown = REFRESH_SEC;
  updateCountdown();
  timer = setInterval(() => {
    countdown--;
    updateCountdown();
    if (countdown <= 0) fetchStations();
  }, 1000);
}

async function fetchStations() {
  setStatus('', 'Fetching…');
  try {
    const res = await fetch(API_URL(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'API error');
    allStations = data.stations;
    // ── Detect new/updated stations (B + A) ──────────────────────────────
    _newCallsigns = new Set();
    allStations.forEach(s => {
      if (!_prevHeard[s.callsign] || _prevHeard[s.callsign] !== s.last_heard) {
        _newCallsigns.add(s.callsign);
      }
    });
    // Update previous-heard map for next cycle
    const nextPrev = {};
    allStations.forEach(s => { nextPrev[s.callsign] = s.last_heard; });
    _prevHeard = nextPrev;
    // ── Latest station + recent-heard panel ──────────────────────────────
    _latestStation = allStations.reduce((best, s) => {
      if (!s.last_heard) return best;
      if (!best || s.last_heard > best.last_heard) return s;
      return best;
    }, null);
    const newList = allStations.filter(s => _newCallsigns.has(s.callsign));
    updateRecentPanel(newList);
    updateObjectsPanel();
    applyFilter();
    setStatus('ok', 'Updated ' + new Date().toLocaleTimeString());
    // Refresh active track data (updates trail + auto-fly if enabled)
    if (activeTrack) _loadTrack(activeTrack);
    // Auto-path: draw paths only for stations heard THIS cycle, so previous
    // cycles' paths don't persist. Manual single-path persists when auto is off.
    if (autoPath) { activePath = null; _refreshAutoPaths(); }
    else if (activePath) _refreshPath(false);
    // Handle ?focus=CALLSIGN on first load only
    const focusParam = new URLSearchParams(location.search).get('focus');
    if (focusParam && !_focusHandled) {
      _focusHandled = true;
      const target = allStations.find(s => s.callsign.toUpperCase() === focusParam.toUpperCase());
      if (target) {
        map.flyTo({ center: [target.lon, target.lat], zoom: 12, speed: 1.6 });
        showTrack(target.callsign);
      }
    }
  } catch (e) {
    setStatus('err', 'Error: ' + e.message);
  }
  startCountdown();
}

function toggleAutoFly() {

// Auto-path: keep the RF path of the most-recently-heard station drawn, updating

  autoPath = !autoPath;
  document.getElementById('autoPathBtn').classList.toggle('on', autoPath);
  if (autoPath) {
    // Auto-path and Coverage are mutually exclusive
    if (coverageOn) { coverageOn = false; document.getElementById('coverageBtn').classList.remove('on'); clearCoverage(); setAutoRefresh(true); }
    activePath = null; _refreshAutoPaths();

// Coverage: a filter-aware "reach fan" — a straight, faint amber line from every
// currently-filtered station to its receiver (the last *-used real callsign on
// the map). Lines only; one glowing node at each convergence point.
function toggleCoverage() {
  coverageOn = !coverageOn;
  document.getElementById('coverageBtn').classList.toggle('on', coverageOn);
  if (coverageOn) {
    if (autoPath) { autoPath = false; document.getElementById('autoPathBtn').classList.remove('on'); clearPath(); }
    setAutoRefresh(false);   // freeze the data while studying coverage
    applyFilter();           // builds the fan from the current filtered set
  } else {
    clearCoverage();
    setAutoRefresh(true);     // resume live updates
  }
}

function _refreshCoverage(stations) {
  const src = map.getSource('aprs-coverage');
  if (!src) return;
  const byCall = {};
  allStations.forEach(x => {
    if (x.lat != null && x.lon != null) byCall[String(x.callsign).toUpperCase()] = x;
  });
  const features = [];
  const rxInfo = {}; // receiver (iGate) callsign -> { lon, lat, count }
  (stations || []).forEach(s => {
    if (s.lat == null || s.lon == null) return;
    // Receiver = the LAST *-used real callsign that is on the map.
    let recv = null;
    (s.path || []).forEach(el => {
      const raw = String(el);
      if (!raw.endsWith('*')) return;
      const hit = byCall[raw.slice(0, -1).toUpperCase()];
      if (hit) recv = hit;
    });
    if (!recv || recv.callsign === s.callsign) return;
    const rc = recv.callsign;
    if (!(rc in covRxState)) covRxState[rc] = true;        // new iGate defaults on
    if (!rxInfo[rc]) rxInfo[rc] = { lon: recv.lon, lat: recv.lat, count: 0 };
    rxInfo[rc].count++;
    if (covRxState[rc] === false) return;                  // iGate hidden via panel
    features.push({ type: 'Feature', properties: {},
      geometry: { type: 'LineString', coordinates: [[s.lon, s.lat], [recv.lon, recv.lat]] } });
  });
  src.setData({ type: 'FeatureCollection', features });
  clearCoverageMarkers();
  Object.keys(rxInfo).forEach(rc => {
    if (covRxState[rc] === false) return;
    const el = document.createElement('div');
    el.className = 'cov-rx';
    covMarkers.push(new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([rxInfo[rc].lon, rxInfo[rc].lat]).addTo(map));
  });
  updateCoveragePanel(rxInfo);
}

// Build the Coverage panel: one row per convergence iGate (with a count and a
// checkbox that shows/hides that iGate's whole cluster of lines).
function updateCoveragePanel(rxInfo) {
  const body = document.getElementById('coverage-body');
  const countEl = document.getElementById('coverage-count');
  const keys = Object.keys(rxInfo).sort((a, b) => rxInfo[b].count - rxInfo[a].count || a.localeCompare(b));
  countEl.textContent = keys.length ? keys.length + (keys.length === 1 ? ' iGate' : ' iGates') : '';
  if (!keys.length) {
    body.innerHTML = '<div style="padding:4px 2px;color:var(--text-dim)">No convergence points in view</div>';
    return;
  }
  let html = '<div class="obj-actions"><button onclick="setAllCoverageRx(true)">All</button><button onclick="setAllCoverageRx(false)">None</button></div>';
  html += keys.map(rc =>
    '<label class="layer-toggle"><input type="checkbox" data-covrx="' + _escHtml(rc) + '"' + (covRxState[rc] ? ' checked' : '') + '> ' +
    '<span>' + _escHtml(rc) + '</span><span class="obj-count">' + rxInfo[rc].count + '</span></label>'
  ).join('');
  body.innerHTML = html;
}

function setAllCoverageRx(on) {
  Object.keys(covRxState).forEach(k => covRxState[k] = on);
  if (coverageOn) applyFilter();
}

function toggleCoveragePanel() {
  document.getElementById('coverage-panel').classList.toggle('collapsed');
}

// Delegated change handler for the per-iGate checkboxes.
document.getElementById('coverage-body').addEventListener('change', (e) => {
  const cb = e.target.closest('input[data-covrx]');
  if (!cb) return;
  covRxState[cb.dataset.covrx] = cb.checked;
  if (coverageOn) applyFilter();
});

function clearCoverageMarkers() {
  covMarkers.forEach(m => m.remove());
  covMarkers = [];
}

function clearCoverage() {
  clearCoverageMarkers();
  const src = map.getSource('aprs-coverage');
  if (src) src.setData({ type: 'FeatureCollection', features: [] });
  const body = document.getElementById('coverage-body');
  if (body) body.innerHTML = '<div style="padding:4px 2px;color:var(--text-dim)">Enable Coverage to list iGates</div>';
  const ce = document.getElementById('coverage-count');
  if (ce) ce.textContent = '';
}

// Manual "refresh now" — spin the icon briefly while re-fetching stations.
async function mapRefresh() {
  const btn = document.getElementById('mapRefreshBtn');
  if (btn) btn.classList.add('spinning');
  try { await fetchStations(); }
  finally { if (btn) setTimeout(() => btn.classList.remove('spinning'), 400); }
}

// Set / toggle the 15s auto-refresh loop. Green = auto (default); gray = paused.
function setAutoRefresh(on) {
  autoRefresh = on;
  document.getElementById('mapRefreshBtn').classList.toggle('paused', !on);
  startCountdown();   // green → restart from 15; gray → stop + show "paused"
}
function toggleRefresh() {
  const turningOn = !autoRefresh;
  // Resuming auto-refresh leaves Coverage mode (they are mutually exclusive).
  if (turningOn && coverageOn) {
    coverageOn = false;
    document.getElementById('coverageBtn').classList.remove('on');
    clearCoverage();
  }
  setAutoRefresh(turningOn);
}

function flyToLatest() {
  if (!_latestStation) return;
  map.flyTo({ center: [_latestStation.lon, _latestStation.lat], zoom: Math.max(map.getZoom(), 11), speed: 1.4, essential: true });
}

function toggleRecentPanel() {
  document.getElementById('recent-panel').classList.toggle('collapsed');
}

function updateRecentPanel(newStations) {
  const count = document.getElementById('recent-count');
  const body  = document.getElementById('recent-body');
  count.textContent = newStations.length + ' heard';
  if (!newStations.length) {
    body.innerHTML = '<div style="padding:6px 10px;color:var(--text-dim)">None this cycle</div>';
    return;
  }
  // Sort newest first
  const sorted = [...newStations].sort((a, b) =>
    (b.last_heard || '').localeCompare(a.last_heard || ''));
  body.innerHTML = sorted.map(s => {
    const ageSec = s.last_heard ? Math.round((Date.now() - new Date(s.last_heard)) / 1000) : null;
    const ageStr = ageSec === null ? '' : ageSec < 60 ? ageSec + 's ago' : Math.round(ageSec/60) + 'm ago';
    return `<div class="recent-row" onclick="recentRowClick('${s.callsign}')">
      <span class="recent-call">${s.callsign}</span>
      <span class="recent-age">${ageStr}</span>
    </div>`;
  }).join('');
  // Auto-expand panel when there are new stations
  document.getElementById('recent-panel').classList.remove('collapsed');
}

function recentRowClick(callsign) {
  const s = allStations.find(x => x.callsign === callsign);
  if (s) map.flyTo({ center: [s.lon, s.lat], zoom: Math.max(map.getZoom(), 11), speed: 1.4, essential: true });
  showTrack(callsign);
}

async function showTrack(callsign) {
  // Toggle off if clicking the already-active track
  if (activeTrack === callsign) { clearTrack(); return; }
  activeTrack = callsign;
  document.getElementById('clearTrackBtn').style.display = '';
  await _loadTrack(callsign);
}

async function _loadTrack(callsign) {
  const minutes = parseInt(document.getElementById('trackWindow').value);
  try {
    const qs = new URLSearchParams({ callsign, minutes });
    const res = await fetch('/api/aprs/track?' + qs, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'API error');
    if (data.count < 2) {
      clearTrack();
      const col = data.count === 0 ? 'red' : 'amber';
      setTrackMsg(callsign + ': only ' + data.count + ' pt(s)', col);
      _setPopupTrackStatus(callsign, 'only ' + data.count + ' position(s) in window');
      return;
    }
    const coords = data.points.map(p => [p.lon, p.lat]);
    const last = data.points[data.points.length - 1];
    const features = [
      { type: 'Feature', geometry: { type: 'LineString', coordinates: coords }, properties: {} },
      ...data.points.map((p, i) => ({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [p.lon, p.lat] },
        properties: { timestamp: p.timestamp, speed_mph: p.speed_mph,
                      latest: i === data.points.length - 1 }
      }))
    ];
    map.getSource('aprs-track').setData({ type: 'FeatureCollection', features });
    if (autoFly && last) {
      map.flyTo({ center: [last.lon, last.lat], zoom: Math.max(map.getZoom(), 12), speed: 1.4, essential: true });
    }
    setTrackMsg(callsign + ': ' + data.count + ' pts', 'blue');
    _setPopupTrackStatus(callsign, data.count + ' pts · ' + parseInt(document.getElementById('trackWindow').value || 60) + ' min window');
  } catch (e) {
    clearTrack();
    setTrackMsg('error: ' + e.message);
    _setPopupTrackStatus(activeTrack, 'error: ' + e.message);
  }
}

function _setPopupTrackStatus(callsign, msg) {
  if (!callsign) return;
  if (callsign === activeTrack) _trackStatusMsg = msg;
  const el = document.getElementById('pop-track-status-' + callsign);
  if (!el) return;
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function setTrackMsg(msg, color) {
  const el = document.getElementById('trackMsg');
  el.textContent = msg;
  el.style.display = msg ? 'inline' : 'none';
  if (color === 'red') el.style.color = 'var(--red)';
  else if (color === 'amber') el.style.color = 'var(--amber)';
  else el.style.color = '#00c8ff';
}

function clearTrack() {
  activeTrack = null;
  _trackStatusMsg = '';
  document.getElementById('clearTrackBtn').style.display = 'none';
  setTrackMsg('');
  if (map.getSource('aprs-track')) {
    map.getSource('aprs-track').setData({ type: 'FeatureCollection', features: [] });
  }
}

// ── RF path overlay (digipeater hops) ─────────────────────────────────────────
// Build GeoJSON for a station's RF path. We connect the origin through each
// *used* (has-been-used '*') real-callsign digipeater that is currently on the
// map, in path order. Hops we can't locate (generic aliases like WIDEn-N, or a
// real call that isn't on the map) are *skipped* — the line bridges over them —
// because the meaningful endpoint (our receiver, e.g. K7NWS-2) is the LAST hop
// and is on the map. The final plotted node is flagged 'receiver'.
function buildPathFeatures(s) {
  if (!s || s.lat == null || s.lon == null) return null;
  const byCall = {};
  allStations.forEach(x => {
    if (x.lat != null && x.lon != null) byCall[String(x.callsign).toUpperCase()] = x;
  });

  const nodes = [{ lon: s.lon, lat: s.lat, label: s.callsign }];
  let usedHops = 0, skipped = 0;
  for (const el of (s.path || [])) {
    const raw = String(el);
    if (!raw.endsWith('*')) continue;          // only digis that actually relayed
    usedHops++;
    const base = raw.slice(0, -1).toUpperCase();
    const hit = byCall[base];
    if (!hit) { skipped++; continue; }         // alias / off-map — bridge over it
    nodes.push({ lon: hit.lon, lat: hit.lat, label: hit.callsign });
  }

  const features = [];
  if (nodes.length >= 2) {
    features.push({ type: 'Feature', properties: {},
      geometry: { type: 'LineString', coordinates: nodes.map(n => [n.lon, n.lat]) } });
  }
  // Hop nodes (skip the origin — it already has its station marker). The last
  // plotted hop is the receiver/closest node — emphasized with a white core.
  nodes.forEach((n, i) => {
    if (i === 0) return;
    const isLast = (i === nodes.length - 1);
    features.push({ type: 'Feature', properties: { kind: isLast ? 'receiver' : 'hop', label: n.label },
      geometry: { type: 'Point', coordinates: [n.lon, n.lat] } });
  });
  // Digipeated, but no hop could be located — mark the origin with a '?'.
  if (nodes.length < 2 && usedHops > 0) {
    features.push({ type: 'Feature', properties: { kind: 'incomplete', label: '?' },
      geometry: { type: 'Point', coordinates: [s.lon, s.lat] } });
  }
  return { features, hops: nodes.length - 1, usedHops, skipped };
}

function showPath(callsign) {
  if (activePath === callsign) { clearPath(); return; }
  activePath = callsign;
  _refreshPath(true);
}

function _refreshPath(fit) {
  const s = allStations.find(x => x.callsign === activePath);
  const res = s ? buildPathFeatures(s) : null;
  const src = map.getSource('aprs-path');
  if (src) src.setData({ type: 'FeatureCollection', features: res ? res.features : [] });
  _renderPathRxMarkers(res ? res.features : []);

  if (!res || res.hops === 0) {
    _setPopupPathStatus(activePath, (res && res.usedHops > 0)
      ? 'digipeated via ' + res.usedHops + ' hop(s), none on the map'
      : 'heard direct — no path to plot');
    return;
  }
  let msg = res.hops + ' hop' + (res.hops !== 1 ? 's' : '') + ' plotted';
  if (res.skipped > 0) msg += ' · ' + res.skipped + ' off-map hop' + (res.skipped !== 1 ? 's' : '') + ' bridged';
  _setPopupPathStatus(activePath, msg);

  if (fit) {
    const pts = res.features.filter(f => f.geometry.type === 'Point').map(f => f.geometry.coordinates);
    pts.push([s.lon, s.lat]);
    if (pts.length >= 2) {
      const b = pts.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(pts[0], pts[0]));
      map.fitBounds(b, { padding: 80, maxZoom: 13, duration: 800 });
    }
  }
}

function _setPopupPathStatus(callsign, msg) {
  if (!callsign) return;
  if (callsign === activePath) _pathStatusMsg = msg;
  const el = document.getElementById('pop-path-status-' + callsign);
  if (!el) return;
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function clearPath() {
  activePath = null;
  _pathStatusMsg = '';
  clearPathMarkers();
  const src = map.getSource('aprs-path');
  if (src) src.setData({ type: 'FeatureCollection', features: [] });
}

// Glowing receiver node(s) are rendered as DOM markers (not a circle layer) so
// they reuse the station-style CSS box-shadow glow and never reorder map layers.
function clearPathMarkers() {
  pathMarkers.forEach(m => m.remove());
  pathMarkers = [];
}
function _renderPathRxMarkers(features) {
  clearPathMarkers();
  (features || []).forEach(f => {
    if (f.geometry.type === 'Point' && f.properties && f.properties.kind === 'receiver') {
      const el = document.createElement('div');
      el.className = 'path-rx';
      pathMarkers.push(new maplibregl.Marker({ element: el, anchor: 'center' })
        .setLngLat(f.geometry.coordinates).addTo(map));
    }
  });
}

// Auto-path: rebuild the overlay each refresh from ONLY the stations heard this
// cycle (fresh packets), so paths from previous cycles do not persist. Points
// that coincide (e.g. the shared receiver node) are de-duplicated.
function _refreshAutoPaths() {
  const src = map.getSource('aprs-path');
  if (!src) return;
  let calls = allStations.filter(s => _newCallsigns.has(s.callsign));
  if (!calls.length && _latestStation) calls = [_latestStation];
  const features = [];
  const seen = new Set();
  calls.forEach(s => {
    const res = buildPathFeatures(s);
    if (!res || res.hops === 0) return;
    res.features.forEach(f => {
      if (f.geometry.type === 'Point') {
        const key = f.geometry.coordinates.join(',') + '|' + f.properties.kind + '|' + f.properties.label;
        if (seen.has(key)) return;
        seen.add(key);
      }
      features.push(f);
    });
  });
  src.setData({ type: 'FeatureCollection', features });
  _renderPathRxMarkers(features);
}

// ── Maidenhead grid overlay ──────────────────────────────────────────────────
let gridOn = false;

// Pick the grid level from the current zoom.
// Returns { dLon, dLat, precision } for field / square / subsquare.
function gridLevel(zoom) {
  if (zoom < 5)   return { dLon: 20,     dLat: 10,    precision: 2 }; // field
  if (zoom < 8.5) return { dLon: 2,      dLat: 1,     precision: 4 }; // square
  return            { dLon: 5 / 60, dLat: 2.5 / 60, precision: 6 };    // subsquare
}

function toggleGrid() {
  gridOn = !gridOn;
  document.getElementById('gridBtn').classList.toggle('on', gridOn);
  const vis = gridOn ? 'visible' : 'none';
  map.setLayoutProperty('mh-grid-line', 'visibility', vis);
  map.setLayoutProperty('mh-grid-label', 'visibility', vis);
  if (gridOn) {
    map.on('moveend', drawGrid);
    drawGrid();
  } else {
    map.off('moveend', drawGrid);
    map.getSource('mh-grid').setData({ type: 'FeatureCollection', features: [] });
    map.getSource('mh-grid-labels').setData({ type: 'FeatureCollection', features: [] });
  }
}

function drawGrid() {
  if (!gridOn) return;
  const { dLon, dLat, precision } = gridLevel(map.getZoom());
  const b = map.getBounds();
  // Clamp to valid range and snap outward to cell boundaries.
  const west  = Math.max(-180, Math.floor(b.getWest()  / dLon) * dLon);
  const east  = Math.min( 180, Math.ceil (b.getEast()  / dLon) * dLon);
  const south = Math.max(-90,  Math.floor(b.getSouth() / dLat) * dLat);
  const north = Math.min( 90,  Math.ceil (b.getNorth() / dLat) * dLat);

  const lines = [];
  const labels = [];

  // Safety cap so a runaway viewport can never generate too much geometry.
  const MAX = 400;
  const nV = Math.min(MAX, Math.round((east - west) / dLon) + 1);
  const nH = Math.min(MAX, Math.round((north - south) / dLat) + 1);

  for (let i = 0; i <= nV; i++) {
    const lon = west + i * dLon;
    if (lon > east + 1e-9) break;
    lines.push({ type: 'Feature', geometry: { type: 'LineString',
      coordinates: [[lon, south], [lon, north]] }, properties: {} });
  }
  for (let j = 0; j <= nH; j++) {
    const lat = south + j * dLat;
    if (lat > north + 1e-9) break;
    lines.push({ type: 'Feature', geometry: { type: 'LineString',
      coordinates: [[west, lat], [east, lat]] }, properties: {} });
  }

  // Label each visible cell at its center.
  for (let i = 0; i < nV; i++) {
    const lon = west + i * dLon;
    if (lon >= east) break;
    for (let j = 0; j < nH; j++) {
      const lat = south + j * dLat;
      if (lat >= north) break;
      const cLon = lon + dLon / 2, cLat = lat + dLat / 2;
      const grid = latLonToGrid(cLat, cLon, precision);
      if (grid) labels.push({ type: 'Feature',
        geometry: { type: 'Point', coordinates: [cLon, cLat] },
        properties: { grid } });
    }
  }

  map.getSource('mh-grid').setData({ type: 'FeatureCollection', features: lines });
  map.getSource('mh-grid-labels').setData({ type: 'FeatureCollection', features: labels });
}

// ── Click-to-measure (distance + bearing) ────────────────────────────────────
let measureOn = false;
let measurePts = [];   // array of [lon, lat]

function toggleMeasure() {
  measureOn = !measureOn;
  document.getElementById('measureBtn').classList.toggle('on', measureOn);
  document.getElementById('map').classList.toggle('measuring', measureOn);
  document.getElementById('measure-panel').classList.toggle('show', measureOn);
  if (measureOn) {
    map.doubleClickZoom.disable();
    map.on('click', measureClick);
    map.on('dblclick', measureClear);
    document.addEventListener('keydown', measureKey);
    setMeasureReadout();
  } else {
    map.doubleClickZoom.enable();
    map.off('click', measureClick);
    map.off('dblclick', measureClear);
    document.removeEventListener('keydown', measureKey);
    measurePts = [];
    renderMeasure();
  }
}

function measureKey(e) {
  if (e.key === 'Escape') measureClear();
}

function measureClear(e) {
  if (e && e.preventDefault) e.preventDefault();
  measurePts = [];
  renderMeasure();
  setMeasureReadout();
}

function measureClick(e) {
  // dblclick fires a click first; the dblclick handler clears, so this is fine.
  measurePts.push([e.lngLat.lng, e.lngLat.lat]);
  renderMeasure();
  setMeasureReadout();
}

function renderMeasure() {
  const features = measurePts.map(p => ({
    type: 'Feature', geometry: { type: 'Point', coordinates: p }, properties: {} }));
  if (measurePts.length >= 2) {
    features.push({ type: 'Feature',
      geometry: { type: 'LineString', coordinates: measurePts }, properties: {} });
  }
  if (map.getSource('measure')) {
    map.getSource('measure').setData({ type: 'FeatureCollection', features });
  }
}

function setMeasureReadout() {
  const el = document.getElementById('measure-readout');
  if (measurePts.length === 0) {
    el.innerHTML = 'Click the map to add points';
    return;
  }
  const last = measurePts[measurePts.length - 1];
  const grid = latLonToGrid(last[1], last[0], 6);
  if (measurePts.length === 1) {
    el.innerHTML = `Start <b>${grid}</b> · ${last[1].toFixed(4)}, ${last[0].toFixed(4)} — click next point`;
    return;
  }
  // Cumulative distance along the path.
  let km = 0;
  for (let i = 1; i < measurePts.length; i++) {
    km += haversineKm(measurePts[i-1][1], measurePts[i-1][0],
                      measurePts[i][1],   measurePts[i][0]);
  }
  const mi = km * 0.621371;
  const nm = km * 0.539957;
  // Bearing of the final leg + straight start→end bearing.
  const prev = measurePts[measurePts.length - 2];
  const legBrg = initialBearing(prev[1], prev[0], last[1], last[0]);
  const first  = measurePts[0];
  const e2eBrg = initialBearing(first[1], first[0], last[1], last[0]);
  const startGrid = latLonToGrid(first[1], first[0], 6);
  el.innerHTML =
    `<b>${km.toFixed(2)} km</b> / ${mi.toFixed(2)} mi / ${nm.toFixed(2)} nm` +
    ` · leg <b>${legBrg.toFixed(0)}°</b> ${cardinal(legBrg)}` +
    (measurePts.length > 2 ? ` · end→end ${e2eBrg.toFixed(0)}° ${cardinal(e2eBrg)}` : '') +
    `<br><b>${startGrid}</b> → <b>${grid}</b>`;
}
