<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OASIS - Satellites</title>
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/common/css/sat-detail.css">
<style>
html, body { height: 100%; margin: 0; }
/* Full-screen map, APRS-style. */
/* Map sits below the fixed 2-row header, same as the APRS map. */
#satmap { position: fixed; top: 73px; left: 0; right: 0; bottom: 0; background: #0d1117; }

/* Header — same shape as the APRS map's top bar (two rows). */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column;
}
.topbar-row { display: flex; align-items: center; gap: .7rem; padding: 0 .9rem; height: 36px; }
.topbar-row + .topbar-row { border-top: 1px solid var(--border); }
#topbar h1 { font-size: var(--fs-base); letter-spacing: .08em; color: var(--accent);
  text-transform: uppercase; margin: 0; white-space: nowrap; cursor: pointer; }
.track-sep { color: var(--border); font-size: var(--fs-small); }
.win-lbl { font-size: var(--fs-small); color: var(--text-dim); white-space: nowrap; }
.home-link { color: #58a6ff; text-decoration: none; font-size: .9rem;
  font-weight: bold; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
.home-link:hover { color: #00d98b; }
/* CPU/temp readout (row 1, near HOME) — same colour bands as APRS. */
#crCpu { font-size: var(--fs-small); font-weight: 600; color: var(--text-dim); }
#crCpu.cpu-ok { color: #3fb950; } #crCpu.cpu-warn { color: var(--amber); } #crCpu.cpu-hot { color: var(--red); }
/* Cursor lat/lon readout (row 2, like APRS). */
#coordReadout { display: flex; align-items: center; gap: .5rem; font-size: var(--fs-small); }
#coordReadout .cr-lbl { color: var(--text-dim); }
#coordReadout .cr-val { display: inline-block; text-align: right; color: #7ecfff; font-weight: 600; }
#coordReadout #crLat { width: 8ch; } #coordReadout #crLon { width: 9ch; }
/* Wall clock (row 2, right side). */
#clock { font-size: var(--fs-small); color: var(--amber); font-weight: 600; white-space: nowrap; }
/* SDR recording indicator (row 1). */
#listen-status { display: none; align-items: center; gap: .4rem; font-size: var(--fs-small);
  color: var(--red); font-weight: 600; white-space: nowrap; }
#listen-status.on { display: inline-flex; }
#listen-status .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red);
  animation: recblink 1.2s infinite; }
@keyframes recblink { 50% { opacity: .3; } }
/* Coverage wash — green edge-glow over the map when a plotted sat is above the
   horizon (you're inside its footprint); opacity scales with elevation. */
#coverage-wash { position: fixed; top: 73px; left: 0; right: 0; bottom: 0; z-index: 1;
  pointer-events: none; opacity: 0; transition: opacity 1.2s ease;
  box-shadow: inset 0 0 130px 40px rgba(0,217,139,.4); }
/* Coverage pills — one inline pill in the top header per plotted satellite
   currently above the horizon (in LOS), each in that satellite's track colour. */
#coverage-badge { display: none; gap: 6px; align-items: center; }
#coverage-badge.on { display: inline-flex; flex-wrap: wrap; }
#coverage-badge:not(.on) + .cov-sep { display: none; }   /* no pills → no dangling separator before the clock */
.cov-pill { padding: 2px 10px; border-radius: 12px; white-space: nowrap;
  border: 1px solid currentColor; background: rgba(255,255,255,.06);
  font: 700 var(--fs-small)/1.5 var(--mono); letter-spacing: .05em; }
/* The world map fills the whole map area, undistorted (2:1 letterboxed on the
   dark #satmap background). */
#satmap #world-svg { display: block; width: 100%; height: 100%; }
.grat { stroke: #243b53; stroke-width: .5; }
/* Dark land fill + faint country borders (Natural Earth 110m, public domain). */
.land { fill: #18222f; stroke: rgba(130,150,180,.28); stroke-width: .35; }
.sat-marker, .sat-track, .sat-glyph, .sat-label { cursor: pointer; }
.sat-glyph { font-size: 10px; }
/* Every bird is the SAME glyph tinted by its capability colour, so two voice
   sats are the same green — the shape can never say WHICH one. Separation from
   the dark land fill is therefore the glyph's own job, and it is done by the
   icon's three beam arcs (see SAT_ICON_PATH), not by an outline.
   There WAS a halo here, the station house's .home-mark trick — the same path
   stroked in the map background beneath the filled copy. It was wrong in kind,
   not merely in size: the house is one simple outline, while this icon's solar
   panel arms are ~4 screen px wide, so any outline heavy enough to read filled
   the gaps between them and turned the bird into a blob. Worse, the stroke sat
   INSIDE the scaled group, so it grew with the glyph — the armed satellite, the
   one deliberately made prominent, got the thickest outline of the lot. */
/* The ARMED bird carries NO added decoration — not a ring, not a backing, not
   an outline. Three attempts at drawing something AROUND this marker all failed
   the same way: whatever frames a ~30 px glyph is either too faint to read or
   wide enough to become the thing you look at instead of the satellite.
   What marks it out now is the marker itself — scaled up, and always labelled
   while the others are labelled only inside their pass window. */
/* Name labels. paint-order:stroke puts the dark stroke UNDER the fill, which is
   what makes a small name readable over coastline without a background box.
   font-size and stroke-width are deliberately NOT set here — redraw() emits them
   per element, divided by the map scale so the label lands at a fixed PIXEL size
   on any display. A rule here would beat the presentation attribute and pin the
   size back to user units, which is the bug this replaces. */
.sat-label { font-family: var(--mono); font-weight: 700;
  paint-order: stroke; stroke: #0d1117; stroke-linejoin: round; }
/* Station QTH — the ⌂ house outline from the HOME nav link, in gold. The old
   house emoji drew as tofu (the Pi has no emoji font), so the station never
   appeared on the map at all. Same marker as the traffic map's home-qth icon.
   Stroke widths are pre-multiplied for the group's scale(0.3), so they land at
   roughly the same weight as the country borders rather than hairlines. */
.home-mark { fill: none; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.home-mark .halo { stroke: #0d1117; stroke-width: 5.2; opacity: .85; }
.home-mark .roof { stroke: #ffd257; stroke-width: 2.8; }
/* Click-a-satellite popup (replaces the old MapLibre popup; same pop-* content).
   420px, not the old 300: this is the station's DETAIL view now, and the sky plot
   has to be big enough to read a horizon mask against. The order is frequencies,
   then passes, then the plot last behind a rule — the plot is the only part that
   needs a pass PLOTTED to exist at all, so it belongs where its absence leaves no
   hole. Full width also means an uplink line like "↑ 145.99 FM · CTCSS 67.0" no
   longer has to scroll sideways in a narrow column. */
.sat-popup { position: fixed; z-index: 300; max-width: 420px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px 9px;
  box-shadow: 0 6px 24px rgba(0,0,0,.6); font-size: var(--fs-small); }
/* The ISS lists seven entries; scroll the block, not the page. */
.sat-popup .sp-freqs { max-height: 200px; overflow-y: auto; }
.sat-popup .pop-polar { width: 180px; height: 180px; }
.sat-popup[hidden] { display: none; }
.sat-popup .sp-close { float: right; background: none; border: none; color: var(--text-dim);
  font-size: 18px; line-height: 1; cursor: pointer; padding: 0 0 0 8px; }
.sat-popup .sp-close:hover { color: var(--text); }
.horizon-rim { fill: var(--text-dim); opacity: .22; }
.badge { display: inline-block; font-size: var(--fs-small); font-weight: 700; letter-spacing: .05em;
  padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel-2); }
.badge.ok   { color: #3fb950; border-color: #3fb950; }
.badge.warn { color: #d29922; border-color: #d29922; }

/* Floating Roster card (right side, like the APRS recent-stations panel) —
   wider than APRS since it carries more info, same font size. */
#roster-card {
  position: absolute; top: 81px; right: .75rem; z-index: 5;
  /* 360, not the old 340: the rows carry a downlink picker and a DOPPLER
     readout now, and a frequency that wraps is a frequency you misread. */
  width: 360px; max-width: 46vw; max-height: calc(100vh - 95px);
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0,0,0,.45);
}
#roster-card > header {
  display: flex; align-items: center; gap: .5rem;
  padding: .5rem .7rem; cursor: pointer; user-select: none; border-radius: 8px;
}
#roster-card:not(.collapsed) > header { border-bottom: 1px solid var(--border); }
#roster-card > header:hover { background: var(--panel-2); }
#roster-card > header .arrow { font-size: 10px; color: var(--text-dim); transition: transform .2s; flex-shrink: 0; }
#roster-card.collapsed > header .arrow { transform: rotate(-90deg); }
#roster-card > header .title { color: var(--accent); font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; font-size: var(--fs-small); }
#roster-card > header .count { color: var(--amber); font-size: var(--fs-small); margin-left: auto; }
#roster-card.collapsed #roster { display: none; }
#roster { overflow-y: auto; padding: .5rem; display: flex; flex-direction: column; gap: .45rem; }

.sat-row { position: relative; border: 1px solid var(--border); border-left-width: 4px; border-radius: 6px;
  background: var(--panel-2); padding: .5rem .6rem; }
.sat-row.on { border-color: var(--accent-dim); }
/* BASELINE, not center. The name block grew a second line (designator, orbit,
   pass window), and centring floated the "in 39m / LOS 11m" countdown between
   the two lines instead of sitting on the name it belongs to. Baseline pins it
   to the name's own baseline whatever the sub-line does, and both sides are flex
   columns whose baseline comes from their FIRST line — the name and the
   countdown. */
.sat-row label { display: flex; align-items: baseline; gap: .5rem; cursor: pointer; font-size: var(--fs-base); }
/* The checkbox is exempt: it has no text baseline worth aligning to, and letting
   it sit on one drops it below the row. */
.sat-row label input[type="checkbox"] { accent-color: var(--accent); cursor: pointer;
  align-self: center; }
/* Workability meter — signal-strength bars. More bars + more vivid red as the
   satellite climbs; all bars dim when below the horizon. */
.sat-bottom { display: flex; align-items: flex-end; justify-content: space-between; margin-top: .25rem; }
.sat-signal { display: flex; align-items: flex-end; gap: .4rem; }
.sat-meter { display: inline-flex; align-items: flex-end; gap: 2px; flex-shrink: 0; height: 14px; }
.sat-meter .seg { width: 4px; border-radius: 1px; background: var(--border);
  transition: background .5s ease, box-shadow .5s ease; }
.sat-meter .seg:nth-child(1) { height: 5px; }
.sat-meter .seg:nth-child(2) { height: 7px; }
.sat-meter .seg:nth-child(3) { height: 9px; }
.sat-meter .seg:nth-child(4) { height: 11px; }
.sat-meter .seg:nth-child(5) { height: 14px; }
.sat-row .sat-elev { font-size: var(--fs-base); font-weight: 700; color: var(--text);
  margin-left: auto; white-space: nowrap; }
.sat-row .nm { font-weight: 700; }
/* The catalogue name sits on top, the amateur designator and the orbit class
   under it. SatNOGS calls AO-7 "OSCAR 7" and SO-50 "SAUDISAT 1C", which is
   correct and unrecognisable: every chart, net and QSL card uses the designator,
   and operators were asking what they were looking at. Both are shown because the
   catalogue name is what matches CelesTrak, GPredict and the TLE file. */
.sat-row .nmwrap { display: flex; flex-direction: column; gap: 0; line-height: 1.2; }
/* Sub-line: identity then the pass window, on ONE row. The name row could not
   hold a long name, a clock time AND a countdown without pushing the card wider
   than its column, and these two belong together anyway — what the bird is, and
   when it is up. The countdown stays upstairs: it answers a different question. */
.sat-row .subline { display: flex; align-items: baseline; gap: .4rem; flex-wrap: wrap; }
.sat-row .passwin { font-size: var(--fs-small); color: var(--text-dim);
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.sat-row .desig { font-size: var(--fs-small); font-weight: 700; color: var(--accent);
  letter-spacing: .06em; }
.sat-row .pass-hint { display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
  font-size: var(--fs-small); color: var(--text); margin-left: auto; white-space: nowrap; line-height: 1.25; }
.sat-row .pass-hint .ph-when { color: var(--amber); font-weight: 700; }   /* pre-AOS: "in X min" (waiting) */
.sat-row .pass-hint .ph-when.live { color: var(--green); animation: los-pulse 1.1s ease-in-out infinite; }  /* pass in progress: contact window open */
.sat-row .pass-hint .ph-when.armed { color: var(--amber); font-weight: 800; animation: los-pulse 1.4s ease-in-out infinite; }  /* armed + inside T-10 alert window */
@keyframes los-pulse { 50% { opacity: .35; } }
/* Per-sat pass-alert bell (roster row) — armed rings; disarmed is dim/grey. Only
   rendered for a checked (plotted) satellite. */
.sat-bell { background: none; border: none; cursor: pointer; font-size: var(--fs-small); padding: 0 2px; line-height: 1; color: var(--text-dim); opacity: .9; }
.sat-bell.on { color: var(--amber); opacity: 1; }
/* Global pass-alert mute toggle (header) — amber when live, grey when muted. */
.sat-mute { cursor: pointer; user-select: none; font-size: var(--fs-small); color: var(--amber); }
.sat-mute.muted { color: var(--text-dim); }
/* Quiet hours: dim, not crossed out — the operator did not switch this off,
   the clock did, and it comes back by itself at 07:00. */
.sat-mute.quiet { color: var(--text-dim); opacity: .6; }
.sat-row .chips { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; margin-top: .35rem; }
.chip { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
/* A monitored bird with no TLE in the cache can never compute a pass, so it would
   otherwise sit checked and silently never plot. */
.chip-warn { color: var(--amber); border-color: var(--amber); }
/* Roster filter bar: name search + toggleable tag/band chips (OR within a group,
   AND across groups). Filter state lives in _filters and persists to localStorage. */
.filters { padding: .45rem .5rem .15rem; display: flex; flex-direction: column; gap: .4rem; }
.filters .f-search { width: 100%; box-sizing: border-box; padding: 4px 9px; font-size: var(--fs-small);
  color: var(--text); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; }
.f-group { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; }
.fchip { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim);
  background: none; border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; cursor: pointer; }
.fchip .n { color: var(--text); font-weight: 700; margin-left: .3rem; }
/* Filters dropdown — a compact button (with an active-count badge, so a hidden
   filter is never invisible) that reveals grouped, full-row-tappable checkboxes. */
.f-dd { position: relative; }
.f-dd-btn { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .05em;
  color: var(--text-dim); background: none; border: 1px solid var(--border); border-radius: 4px;
  padding: 2px 9px; cursor: pointer; white-space: nowrap; }
.f-dd-btn.on { color: var(--panel); background: var(--accent); border-color: var(--accent); }
.f-dd-caret { font-size: .8em; margin-left: .15rem; }
.f-dd-panel { position: absolute; top: calc(100% + 5px); left: 0; z-index: 50;
  min-width: 200px; max-height: 66vh; overflow-y: auto; padding: .4rem;
  background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
  box-shadow: 0 8px 22px rgba(0,0,0,.55); }
.f-dd-sect { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-dim); opacity: .7; margin: .5rem .2rem .15rem; }
.f-dd-sect:first-child { margin-top: 0; }
.f-row { display: flex; align-items: center; gap: .55rem; padding: 6px 6px; border-radius: 4px;
  cursor: pointer; font-size: var(--fs-small); color: var(--text); white-space: nowrap; }
.f-row:hover { background: rgba(255,255,255,.06); }
.f-row input { accent-color: var(--accent); width: 16px; height: 16px; flex: none; margin: 0; }
.f-row .n { margin-left: auto; padding-left: 1.2rem; color: var(--text-dim); font-weight: 700; }
.f-dd-clear { display: block; width: 100%; margin-top: .45rem; padding: 5px; text-align: center;
  font-size: var(--fs-micro); color: var(--accent); background: none;
  border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
.fchip.active { color: var(--panel); background: var(--accent); border-color: var(--accent); }
.fchip.active .n { color: var(--panel); opacity: 1; }         /* dark count on the amber active pill */
.sat-row .dl-status .dv { color: var(--text); }               /* device value white; "device:" stays dim (index-consistent) */
.f-clear { font-size: var(--fs-micro); color: var(--accent); background: none; border: none;
  cursor: pointer; padding: 1px 4px; margin-left: auto; }
/* View mode: three independent, mutually-exclusive pills (All / Monitored / In 1h). */
#view-modes .fchip { padding: 2px 9px; }
/* Red "Clear" — wipes the whole monitored list + all pass alerts. */
#view-modes .clear-btn { color: var(--red); border-color: var(--red); margin-left: .5rem; }
#view-modes .clear-btn:hover { background: var(--red); color: #fff; }
/* Downlink mode buttons (checked sat only). Freq is on the face; state comes
   from /listen/status. Two *disabled* looks that must not be confused: busy =
   solid grey ("wait"), unsupported = ghosted/dashed ("never"). */
.dlpick { margin-top: .4rem; }
/* One dropdown instead of a row of buttons. A bird with several downlinks used
   to wrap two or three lines of chips; the select is one line whatever the count,
   which is the space the rest of the card needed.
   ALWAYS enabled, including with no SDR assigned: choosing which frequency you
   care about is reading, not transmitting, and the operator should be able to see
   what a bird offers on a laptop with no dongle at all. Whether that armed
   frequency can actually be captured is the transport's business, and it says so
   itself (see updateTransport's armHint). */
.dlsel { font-family: var(--mono); font-size: var(--fs-small); font-weight: 700;
  width: 100%; padding: 3px 6px; cursor: pointer;
  border: 1px solid var(--border); border-radius: 5px;
  background: var(--panel); color: var(--text);
  transition: border-color .3s ease, color .3s ease; }
.dlsel:focus { outline: none; border-color: var(--accent); }
.dlsel.armed { border-color: var(--accent); color: var(--accent); }
.dlsel.rec { border-color: var(--red); color: var(--red); animation: recpulse 1.2s infinite; }
.dlsel.live { border-color: var(--green); color: var(--green); animation: recpulse 1.2s infinite; }
.dlsel option:disabled { color: var(--text-dim); }
/* Readable, not actionable: dimmed so "you can look but not arm" is visible
   without opening the list, since a select that merely refuses on click reads as
   broken. */
.dlsel.unassigned { color: var(--text-dim); border-style: dashed; }
/* DOPPLER readout — the frequency to dial the OPERATOR'S rig to, for the armed
   downlink. It appears only on the armed row and only while there is a track to
   read, so an empty line never holds space in a 150-row list. Receive-only by
   nature: an RTL-SDR cannot work a transponder, so this is a number to read, not
   a control. */
.dl-doppler { margin-top: .3rem; font-family: var(--mono); font-size: var(--fs-micro);
  color: var(--text-dim); letter-spacing: .02em; }
.dl-doppler .dop-val { color: var(--accent); font-weight: 700; }
.dl-doppler .dop-shift { color: var(--text); }
/* Pre-AOS the number is the bird's arrival frequency, not a live one — say so
   rather than letting a static reading look like a stalled live one. */
.dl-doppler.aos .dop-val { color: var(--text); }
/* RX verdict for the ARMED downlink: can this station actually receive it?
   Green go / amber no is deliberately coarse — the operator wants an answer
   before a pass, not a table. The numbers behind it are in the tooltip. */
.dl-rx { margin-top: .3rem; font-size: var(--fs-micro); font-weight: 700;
  letter-spacing: .04em; display: inline-flex; align-items: center; gap: .35rem; }
.dl-rx .rx-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: var(--text-dim); }
.dl-rx.green, .dl-rx.amber { cursor: pointer; }
.dl-rx.green .rx-dot { background: var(--green); }
.dl-rx.green { color: var(--green); }
.dl-rx.amber .rx-dot { background: var(--amber); }
.dl-rx.amber { color: var(--amber); }
/* NEVER measured is a warning, not a footnote: you can record a whole pass and
   get nothing. It was dim grey and took real effort to notice, so it is amber
   like any other warning — but with a HOLLOW dot, so "unknown" stays telling
   apart from "measured and poor" at a glance. */
.dl-rx.unknown { color: var(--amber); cursor: pointer; text-decoration: underline dotted; }
.dl-rx.unknown .rx-dot { background: transparent; border: 2px solid var(--amber); }
.dl-rx.unknown:hover { color: var(--text); }
/* Measuring takes ~20 s of holding the dongle. Silence for that long reads as a
   hung page, so the pill says what it is doing, in place. Opacity only — an
   infinite box-shadow animation pins the Chromium renderer at 60fps on the
   kiosk, which is a bug this project has already paid for once. */
.dl-rx.busy { color: var(--accent); animation: recpulse 1.1s ease-in-out infinite; }
.dl-rx.busy .rx-dot { background: var(--accent); }
.dl-rx .rx-why { font-weight: 400; color: var(--text-dim); letter-spacing: 0; }
#listen-status.live .rec-dot { background: var(--green); }
/* Capture-mode pills follow the studio convention: REC red, LISTEN green. */
/* Transport cluster (⏺ Rec / ▶ Play / ⏹ Stop) — one dongle, so one global set.
   Acts on the ARMED frequency. Rec red / Play green pulse while running; Stop blue. */
.tbtn { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .05em; padding: 2px 9px;
        border: 1px solid var(--border); border-radius: 999px; background: var(--panel-2);
        color: var(--text-dim); cursor: pointer; font-weight: 700; }
.tbtn:disabled { opacity: .45; cursor: default; border-color: var(--text-dim); }
.tbtn.active { opacity: 1; }   /* running state stays vivid even while non-interactive */
/* READY (armed, in window, not yet running) — coloured outline on a transparent
   fill; pressing fills it in. Same idiom as .dlsel -> .dlsel.armed above, so
   the transport and the frequency picker read as one system.
   Without this the ONLY difference between "you can press this" and "you can't"
   was opacity .6 vs 1 on an already-grey button, which reads as disabled in both
   states — the operator sees a dead transport and assumes the SDR never armed. */
#t-rec:not(:disabled):not(.active)  { border-color: var(--red);   color: var(--red);   background: transparent; }
#t-play:not(:disabled):not(.active) { border-color: var(--green); color: var(--green); background: transparent; }
#t-stop:not(:disabled):not(.active) { border-color: #3b82f6;      color: #3b82f6;      background: transparent; }
#t-rec:not(:disabled):not(.active):hover  { background: var(--red);   color: #fff; }
#t-play:not(:disabled):not(.active):hover { background: var(--green); color: #0d1117; }
#t-stop:not(:disabled):not(.active):hover { background: #3b82f6;      color: #fff; }
#t-rec.active  { background: var(--red);   border-color: var(--red);   color: #fff;    animation: recpulse 1.2s infinite; }
#t-play.active { background: var(--green); border-color: var(--green); color: #0d1117; animation: recpulse 1.2s infinite; }
#t-stop.active { background: #3b82f6;      border-color: #3b82f6;      color: #fff; }
@keyframes recpulse { 50% { opacity: .5; } }
.sat-row .dl-status { font-size: var(--fs-small); color: var(--text-dim); }
.sat-row .dl-status.rec { color: var(--red); font-weight: 700; }
.sat-row .dl-status.live { color: var(--green); font-weight: 700; }
.sat-row .oov { margin-top: .3rem; font-size: var(--fs-micro); color: #d29922; font-weight: 700; }
/* No upcoming pass: dim the row and say plainly why there are no controls. */
.sat-row.no-pass { opacity: .6; }
.sat-row .no-pass-hint { margin-top: .4rem; font-size: var(--fs-small); color: var(--text-dim); font-style: italic; }

/* Popup — reuse the APRS/ADS-B popup look (see .sat-popup for the container). */
.pop-call { font-size: var(--fs-subtitle); font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.pop-chips { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: 5px; }
.pop-row { display: flex; gap: 6px; font-size: var(--fs-small); }
.pop-lbl { color: var(--text-dim); min-width: 46px; }
.pop-val { color: var(--text); }
.pop-sec { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--border); }
.pop-pass { font-size: var(--fs-small); padding: 2px 0; cursor: pointer; color: var(--text); }
.pop-pass:hover { color: var(--accent); }
.pop-pass.active { color: var(--amber); font-weight: 700; }
.pop-polar { display: block; width: 150px; height: 150px; margin: 6px auto 0; }
.ring     { fill: none; stroke: #243b53; stroke-width: .6; }
.cmp      { fill: #7d8ea3; font: 9px monospace; text-anchor: middle; }
.poi-dot  { stroke: #0d1117; stroke-width: 1; }
.poi      { fill: #c9d1d9; font: 8px monospace; text-anchor: middle; }
/* Capability colour key, tucked behind a burger in the map's top-left corner.
   Built from the channel colours (buildLegend) so it never drifts from the map. */
/* top is relative to #satmap (its positioned parent, already at viewport 73px),
   so 8px sits it just under the header — level with the roster card opposite. */
#sat-legend { position: absolute; top: 8px; left: .75rem; z-index: 5; font: 11px system-ui, sans-serif; }
#sat-legend .leg-burger { background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 15px; line-height: 1;
  box-shadow: 0 6px 24px rgba(0,0,0,.45); }
#sat-legend .leg-burger:hover { border-color: var(--text-dim); }
#sat-legend .leg-panel { display: none; margin-top: 6px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 11px; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
#sat-legend:not(.collapsed) .leg-panel { display: block; }
#sat-legend .leg-title { color: var(--text-dim); font-weight: 600; margin-bottom: 5px; letter-spacing: .3px; text-transform: uppercase; font-size: 10px; }
#sat-legend .leg-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; white-space: nowrap; color: var(--text); }
#sat-legend .leg-sw { width: 14px; height: 14px; border-radius: 3px; flex: none; }
/* Break between the three channels and their mixes, so the key reads as
   "primaries, then combinations" rather than one flat list of seven. */
#sat-legend .leg-row:not(.mix) + .leg-row.mix { margin-top: 6px; padding-top: 6px;
  border-top: 1px solid var(--border); }
#sat-legend .leg-note { color: var(--text-dim); margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border); line-height: 1.5; }

/* Horizon editor — a STATION-level overlay, not part of any satellite's popup.
   The popup's sky plot displays the mask; this is the only thing that edits it. */
#horizon-editor { position: fixed; inset: 0; z-index: 400; display: none;
  align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
#horizon-editor.open { display: flex; }
#horizon-editor .he-box { background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px 16px; max-width: 420px; }
#horizon-editor .he-plot { width: 320px; height: 320px; touch-action: none; cursor: crosshair; }
#horizon-editor .he-handle { fill: var(--accent); cursor: grab; }
#horizon-editor .he-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
#horizon-editor .he-msg { color: var(--text-dim); margin-top: 6px; min-height: 1.2em; }
</style>
</head>
<body>

<div id="satmap">
  <svg id="world-svg" viewBox="0 0 720 360" preserveAspectRatio="xMidYMid meet">
    <g id="wg-base"></g><g id="wg-over"></g>
  </svg>

    <div class="leg-panel" id="leg-panel"></div>

</div>
<div id="sat-popup" class="sat-popup" hidden><button class="sp-close" onclick="hideSatPopup()" aria-label="Close">×</button><div class="pop-body"></div></div>

</div>
<!-- Coverage wash: a green edge-glow over the map while a plotted satellite is

<div id="coverage-wash"></div>

<div id="topbar">

    <span class="win-lbl">24 h</span>

    <span class="track-sep">|</span>
    <a href="/" class="home-link">⌂ HOME</a>
  </div>
  <div class="topbar-row">
    <div id="coordReadout">
      <span class="cr-lbl">Lat</span><span id="crLat" class="cr-val">—</span>
      <span class="cr-lbl">Lon</span><span id="crLon" class="cr-val">—</span>
    </div>
    <span class="track-sep">|</span>

              aria-expanded="false">Filters<span id="filter-dd-badge"></span><span class="f-dd-caret">▾</span></button>
      <div class="f-dd-panel" id="filter-dd-panel" hidden></div>
    </div>

    <span class="track-sep">|</span>

<div id="roster-card">
  <header onclick="this.parentElement.classList.toggle('collapsed')">
    <span class="arrow">▾</span>
    <span class="title">Roster</span>
    <span class="count" id="roster-count">—</span>
  </header>
  <div class="filters" id="sat-filters">
    <div class="f-group" id="view-modes">

      <button class="fchip" data-view="monitored" onclick="setView('monitored')">Moni</button>
      <button class="fchip" data-view="soon" onclick="setView('soon')" title="Monitored birds with a pass in the next hour">Mon · 1h</button>
      <button class="fchip" data-view="soon-all" onclick="setView('soon-all')" title="Every bird passing over in the next hour — check one to start monitoring it">All · 1h</button>
      <button class="fchip" id="listenable-chip" onclick="toggleListenable()"
              title="Hide birds with no downlink this station can demodulate. A monitored bird is never hidden.">Listenable<span class="n" id="listenable-n"></span></button>
      <button class="fchip clear-btn" onclick="clearAll()" title="Uncheck every monitored bird and clear all pass-alert bells">Clear</button>
    </div>

           oninput="setSearchFilter(this.value)">

</div>

<!-- Satellites uses a lightweight SVG world map (no MapLibre/WebGL/tiles) — a
     memory win on the Pi, and the whole-globe view is what pass tracks need. -->
<script src="/common/js/sat-bells.js"></script>
<script src="/common/js/speech.js"></script>
<script src="/common/js/quiet-hours.js"></script>
<script src="/common/js/sat-alerts.js"></script>
<script src="/common/js/sat-capability.js"></script>
<script src="/server/satellites/sat-geometry.js"></script>
<script src="/server/satellites/sat-roster.js"></script>
<script src="/server/satellites/satellite.min.js"></script>
<script src="/common/js/sat-look.js"></script>
<script src="/common/js/sat-uplink.js"></script>
<script src="/common/js/horizon.js"></script>
<script src="/common/js/sat-detail.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────────────────
   Roster-driven satellite map. Check a satellite → plot its NEXT pass ground
   track (rise→set arc near the station), coloured per satellite; multiple
   checked = multiple colours. Click a satellite on the map → an APRS-style
   popup with its labels, downlink, next passes, and az/el sky-plot.
   ───────────────────────────────────────────────────────────────────────── */
const WINDOW_H = 24;                       // default prediction window
// Chime glyphs as inline SVG (Material bell / bell-off) — the bell / bell-with-slash emoji render
// blank on Pi Chromium. 1em + currentColor so the .sat-bell / .sat-mute font-size,
// colour, opacity and grayscale filter still apply.
const BELL_ON  = `<svg viewBox="0 0 24 24" width="1.35em" height="1.35em" fill="currentColor" aria-hidden="true" style="vertical-align:-.15em"><path d="M12 2a2 2 0 0 0-2 2v.29C7.12 5.14 5 7.82 5 11v5l-2 2v1h18v-1l-2-2v-5c0-3.18-2.12-5.86-5-6.71V4a2 2 0 0 0-2-2Zm0 20a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2Z"/></svg>`;
const BELL_OFF = `<svg viewBox="0 0 24 24" width="1.35em" height="1.35em" fill="currentColor" aria-hidden="true" style="vertical-align:-.15em"><path d="M20 18.69 7.84 6.14 5.27 3.49 4 4.76l2.8 2.8v.01c-.52.99-.8 2.16-.8 3.42v5l-2 2v1h13.73l2 2L21 19.72l-1-1.03zM12 22c1.11 0 2-.89 2-2h-4c0 1.11.89 2 2 2zm6-7.32V11c0-3.08-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68c-.15.03-.29.08-.42.13l7.92 7.87z"/></svg>`;
let ROSTER = [], STATION = null, PASSES = {};

// ── Roster filters ─────────────────────────────────────────────────────────
// Name search + tag chips + band chips. Within a group the selected values are
// OR'd; the three groups are AND'd. Persisted so a browse session survives a
// reload. Tag order follows the server's closed vocabulary.
const TAG_ORDER = ['WEATHER', 'VOICE', 'FM', 'APRS', 'SSTV', 'LINEAR', 'SSB', 'DATA', 'CREWED'];
const BAND_ORDER = ['VHF', 'UHF', 'L-band'];
// Orbit class is a fourth, independent filter axis, derived from the TLE alone —
// so it works fully offline and even for bare fallback sats (roster-less boxes).
const ORBIT_ORDER = ['LEO', 'MEO', 'GEO', 'HEO'];
let _filters = (() => {
  try {
    const f = JSON.parse(localStorage.getItem('oasis_sat_filters') || '{}');
    return { q: f.q || '', tags: new Set(f.tags || []), bands: new Set(f.bands || []),
             orbit: new Set(f.orbit || []) };
  } catch (e) { return { q: '', tags: new Set(), bands: new Set(), orbit: new Set() }; }
})();
function saveFilters() {
  try {
    localStorage.setItem('oasis_sat_filters', JSON.stringify(
      { q: _filters.q, tags: [..._filters.tags], bands: [..._filters.bands],
        orbit: [..._filters.orbit] }));
  } catch (e) { /* private mode */ }
}
function bandOf(mhz) { return mhz < 300 ? 'VHF' : mhz < 1000 ? 'UHF' : 'L-band'; }
function satBands(s) { return new Set((s.downlinks || []).map(d => bandOf(d.freq_mhz))); }
// Orbit class straight from the two-line element: semi-major axis a from the mean
// motion (Kepler), then LEO/MEO/GEO by mean altitude, HEO by eccentricity (Molniya-
// type). Needs no SatNOGS metadata, so a bare fallback sat still gets a class.
// Cached on the sat (._orbClass) — the TLE doesn't change between refreshes.
function orbitClass(s) {
  if (s._orbClass !== undefined) return s._orbClass;
  let cls = null;
  if (s.l1 && s.l2) {
    try {
      const rec = satellite.twoline2satrec(s.l1, s.l2);
      const n = (rec.no || 0) / 60;                                    // rad/min → rad/s
      if (n > 0) {
        const a = Math.cbrt(398600.4418 / (n * n));                    // semi-major axis, km
        const e = rec.ecco || 0, alt = a - 6378.137;                   // mean altitude, km
        cls = e > 0.25 ? 'HEO' : alt < 2000 ? 'LEO' : alt < 30000 ? 'MEO' : 'GEO';
      }
    } catch (e) { /* unparseable TLE → unclassified */ }
  }
  s._orbClass = cls;
  return cls;
}
// View mode is a separate axis from tag/band/search: 'all' (whole list),
// 'monitored' (checked/plotted birds), 'soon' = "Mon · 1h" (monitored + a pass
// within 1h, matching the kiosk dashboard window: in-progress OR rise ≤ 60 min),
// 'soon-all' = "All · 1h" (ANY roster bird passing in the next hour — discovery;
// check one to start monitoring it). Both 1h views need whole-roster passes,
// which the server fills incrementally, so they populate over the first polls.
let _view = (() => { try { return localStorage.getItem('oasis_sat_view') || 'all'; } catch (e) { return 'all'; } })();
function setView(v) {
  _view = v;
  try { localStorage.setItem('oasis_sat_view', v); } catch (e) { /* private mode */ }
  applyViewButtons(); renderRoster();
}
function applyViewButtons() {
  // [data-view] only: the Listenable and Clear chips share this bar but are not
  // views, and an unqualified selector would strip Listenable's active state on
  // every view change.
  document.querySelectorAll('#view-modes .fchip[data-view]').forEach(b =>
    b.classList.toggle('active', b.dataset.view === _view));
}
// The Listenable filter is an independent axis, not a fifth view: it ANDs with
// whichever view is selected. Default ON — the ~30 birds it hides are ones this
// station cannot demodulate at all, so showing them by default would mean every
// operator's first act is to filter them out.
let _listenable = (() => {
  try { return localStorage.getItem('oasis_sat_listenable') !== 'off'; }
  catch (e) { return true; }
})();
function toggleListenable() {
  _listenable = !_listenable;
  try { localStorage.setItem('oasis_sat_listenable', _listenable ? 'on' : 'off'); }
  catch (e) { /* private mode */ }
  applyListenableChip(); renderRoster();
}
function applyListenableChip() {
  const b = document.getElementById('listenable-chip');
  if (b) b.classList.toggle('active', _listenable);
  const n = document.getElementById('listenable-n');
  // The count is what the filter WOULD show, so it reads the same whether the
  // chip is on or off — it is the size of the set, not of the current view.
  if (n) n.textContent = (typeof ROSTER !== 'undefined' && ROSTER.length)
    ? satroster.listenableCount(ROSTER) : '';
}
function withinHour(s) {
  const p = nextPassOf(s.norad);
  if (!p) return false;
  const now = Date.now();
  const rise = new Date(p.rise).getTime(), set = new Date(p.set).getTime();
  const inPass = rise <= now && now < set;
  return inPass || (rise - now) / 60000 <= 60;
}
function passesFilters(s) {
  // Two independent axes: monitored-only ('monitored','soon') and passing-in-1h
  // ('soon','soon-all'). 'all' = neither; 'soon-all' = any bird passing over now.
  if ((_view === 'monitored' || _view === 'soon') && !isMonitored(s.norad)) return false;
  if ((_view === 'soon' || _view === 'soon-all') && !withinHour(s)) return false;
  // Hide-unless-monitored: a deliberate choice is never overridden by a default.
  // If the operator checked a bird, they know what it is and it stays visible —
  // otherwise a monitored bird could vanish from the list while its pass alert
  // still fires, which is the worst of both.
  if (_listenable && !satroster.isListenable(s) && !isMonitored(s.norad)) return false;
  const q = _filters.q.trim().toLowerCase();
  if (q && !s.name.toLowerCase().includes(q)) return false;
  if (_filters.tags.size && !(s.labels || []).some(l => _filters.tags.has(l))) return false;
  if (_filters.bands.size) {
    const b = satBands(s);
    if (![..._filters.bands].some(x => b.has(x))) return false;
  }
  if (_filters.orbit.size && !_filters.orbit.has(orbitClass(s))) return false;
  return true;
}
function filtersActive() {
  return !!_filters.q || _filters.tags.size > 0 || _filters.bands.size > 0 || _filters.orbit.size > 0;
}
function setSearchFilter(v) { _filters.q = v; saveFilters(); renderRoster(); }
function toggleTagFilter(t) {
  _filters.tags.has(t) ? _filters.tags.delete(t) : _filters.tags.add(t);
  saveFilters(); renderFilterBar(); renderRoster();
}
function toggleBandFilter(b) {
  _filters.bands.has(b) ? _filters.bands.delete(b) : _filters.bands.add(b);
  saveFilters(); renderFilterBar(); renderRoster();
}
function toggleOrbitFilter(o) {
  _filters.orbit.has(o) ? _filters.orbit.delete(o) : _filters.orbit.add(o);
  saveFilters(); renderFilterBar(); renderRoster();
}
function clearFilters() {
  _filters = { q: '', tags: new Set(), bands: new Set(), orbit: new Set() };
  saveFilters();
  const box = document.getElementById('sat-search'); if (box) box.value = '';
  renderFilterBar(); renderRoster();
}
// Build the Filters dropdown from what's actually in the roster: grouped rows
// (Capability / Band / Orbit), each with a stable count, plus an active-count
// badge on the collapsed button so a hidden filter is never invisible.
function renderFilterBar() {
  const box = document.getElementById('sat-search');
  if (box && box.value !== _filters.q) box.value = _filters.q;
  const tagCounts = {}, bandCounts = {}, orbitCounts = {};
  (ROSTER || []).forEach(s => {
    new Set(s.labels || []).forEach(l => tagCounts[l] = (tagCounts[l] || 0) + 1);
    satBands(s).forEach(b => bandCounts[b] = (bandCounts[b] || 0) + 1);
    const oc = orbitClass(s);
    if (oc) orbitCounts[oc] = (orbitCounts[oc] || 0) + 1;
  });
  const row = (val, count, on, fn) =>
    `<label class="f-row"><input type="checkbox" ${on ? 'checked' : ''} onchange="${fn}('${val}')">`
    + `<span>${val}</span><span class="n">${count}</span></label>`;
  const section = (title, order, counts, active, fn) => {
    const present = order.filter(v => counts[v]);
    return present.length
      ? `<div class="f-dd-sect">${title}</div>`
        + present.map(v => row(v, counts[v], active.has(v), fn)).join('')
      : '';
  };
  let html = section('Capability', TAG_ORDER, tagCounts, _filters.tags, 'toggleTagFilter')
           + section('Band', BAND_ORDER, bandCounts, _filters.bands, 'toggleBandFilter')
           + section('Orbit', ORBIT_ORDER, orbitCounts, _filters.orbit, 'toggleOrbitFilter');
  if (!html) html = '<div class="f-dd-sect">No filters available</div>';
  else if (filtersActive()) html += '<button class="f-dd-clear" onclick="clearFilters()">clear all ✕</button>';
  document.getElementById('filter-dd-panel').innerHTML = html;
  const n = _filters.tags.size + _filters.bands.size + _filters.orbit.size;   // active filters
  document.getElementById('filter-dd-badge').textContent = n ? ' · ' + n : '';
  document.getElementById('filter-dd-btn').classList.toggle('on', n > 0);
  applyViewButtons();
  // Here rather than in boot(): renderFilterBar already runs at boot AND after a
  // TLE refresh replaces ROSTER, which is exactly when the chip's count changes.
  applyListenableChip();
}
// Open/close the Filters dropdown; a document-level handler closes it on outside click.
function toggleFilterMenu(e) {
  if (e) e.stopPropagation();
  const p = document.getElementById('filter-dd-panel');
  const willOpen = p.hasAttribute('hidden');
  p.toggleAttribute('hidden', !willOpen);
  document.getElementById('filter-dd-btn').setAttribute('aria-expanded', willOpen ? 'true' : 'false');
}
document.addEventListener('click', (e) => {
  if (!document.contains(e.target)) return;          // target removed by a re-render — ignore
  const dd = document.getElementById('filter-dd');
  const p = document.getElementById('filter-dd-panel');
  if (dd && p && !p.hasAttribute('hidden') && !dd.contains(e.target)) {
    p.setAttribute('hidden', '');
    document.getElementById('filter-dd-btn').setAttribute('aria-expanded', 'false');
  }
});
// norad -> { color, pass, track, l1, l2 }   for each checked/plotted satellite.
const PLOTTED = {};
// Selection colour = an ADDITIVE RGB BLEND of the bird's real capabilities, so
// the colour itself spells the set — no "primary family", no separate flag. Each
// role drives one channel: Voice→green, Imaging→blue, APRS→red/orange. A bird
// that only beacons telemetry (no real role) falls back to the Data-family
// orange. The mixes fall out: Voice+Imaging = cyan, Voice+APRS = yellow,
// Imaging+APRS = magenta, all three = white — so multi-capability birds (ISS, the
// crewed stations) light up on their own. A bare telemetry beacon never blends
// (it is on ~90/130 birds and would warm every colour); it only colours a bird
// that does nothing else. Derived from labels at render, nothing stored. NOTE:
// additive blending lives on the red-green axis, so this deliberately trades the
// Okabe-Ito colourblind-safety for expressiveness (single-op station). Full
// capability detail always lives in the roster labels + popup.
// The channel definitions and the blend now live in common/js/sat-capability.js,
// shared with the kiosk — which paints the same blend as each satellite row's
// edge rail, and decomposes the channels into glyphs because a list row has room
// a map dot does not. Two renderings, one definition of what a bird can do.
// The blended colour for a bird, straight from its roster labels.
function capabilityColor(norad) {
  const s = ROSTER.find(x => x.norad === +norad);
  return oasisSatCapabilityColor(s ? s.labels : []);
}
// Colour key (burger, map top-left). Built from the channel colours so it can
// never drift from the map. Collapsed by default; the open/closed choice persists.
function buildLegend() {
  const p = document.getElementById('leg-panel'); if (!p) return;
  // Every colour the map can draw gets a swatch — the three channels AND their
  // mixes. The mixes used to be prose ("cyan = Voice+Imaging"), which asked the
  // reader to agree with us about where cyan ends and teal begins, and would
  // have gone quietly wrong the first time a channel was recoloured. Each swatch
  // is now the blend itself, computed by the shared module.
  const rows = oasisSatLegendRows().map(r =>
    `<div class="leg-row${r.keys.length > 1 ? ' mix' : ''}"><span class="leg-sw" style="background:${r.color}"></span>${r.label}</div>`).join('');
  p.innerHTML = `<div class="leg-title">Capability · colours mix</div>${rows}`
    + '<div class="leg-note">A bird that only beacons telemetry takes the Data colour.</div>';
  let open = false; try { open = localStorage.getItem('oasis_sat_legend') === 'open'; } catch (e) { /* private mode */ }
  document.getElementById('sat-legend').classList.toggle('collapsed', !open);
}
function toggleLegend() {
  const open = document.getElementById('sat-legend').classList.toggle('collapsed') === false;
  try { localStorage.setItem('oasis_sat_legend', open ? 'open' : 'closed'); } catch (e) { /* private mode */ }
}
// Persisted selection (norad -> colour). PLOTTED is the live subset (only sats
// with an upcoming pass can be drawn); this is the operator's full choice, so it
// survives refresh + server restart. Redrawn on boot and every pass refresh (see syncPlotted),
// which also re-shows each sat's bell — bells persist in the shared roster but
// only render on a plotted sat, so they vanished with the lost selection.
let _satSelected = (() => { try { return JSON.parse(localStorage.getItem('oasis_sat_selected') || '{}'); } catch (e) { return {}; } })();
function saveSelection() { try { localStorage.setItem('oasis_sat_selected', JSON.stringify(_satSelected)); } catch (e) { /* private mode */ } }
// Is this bird MONITORED? That is _satSelected (the operator's choice, mirrored to
// the server roster), NOT PLOTTED. PLOTTED is only what can be drawn right now —
// plotSat() bails without an upcoming pass — so keying the row state off it made a
// selected bird with no computed pass render unchecked, uncoloured and belled-off,
// as if the pick had been lost. Monitoring is a standing choice; drawing is a
// property of the next few hours.
function isMonitored(norad) { return norad in _satSelected; }
// Persist selection to the SHARED server roster (configuration/satellites.json),
// the single source of truth — the 7" kiosk reads its `selected` flag, and
// localStorage keeps only this browser's per-sat colour.
//
// ALWAYS send a set, never a request per satellite. Fanning a set out into one
// fire-and-forget fetch per bird raced itself on the server: each request was a
// load-modify-save of the whole roster, so 20 picks landed 1-2 of them and the
// kiosk showed a fraction of what was monitored here. One request = one atomic
// write server-side (roster.set_selected_many).
function postSelections(map) {
  const selections = {};
  for (const norad in map) selections[+norad] = !!map[norad];
  if (!Object.keys(selections).length) return Promise.resolve();
  return fetch('/api/satellites/select', { method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-OASIS-Request': '1' },
    body: JSON.stringify({ selections }) }).catch(() => {});
}
function postSelect(norad, selected) { return postSelections({ [norad]: selected }); }
// Reconcile this browser's selection with the shared server roster on load, so
// the map and the kiosk agree: adopt any sat the roster marks selected (a pick
// made on another device — e.g. the laptop — shows here too), and push up any
// local-only picks so the server (and kiosk) learn them. Union — nothing dropped.
function reconcileSelection() {
  const push = {};                       // local-only picks the server hasn't got
  (ROSTER || []).forEach(s => {
    const has = s.norad in _satSelected;
    if (s.selected && !has) _satSelected[s.norad] = capabilityColor(s.norad);
    else if (has && !s.selected) push[s.norad] = true;
  });
  saveSelection();
  postSelections(push);                  // ONE request — see postSelections
}
// Re-derive every selected bird's blended colour from its current labels. Runs in
// boot() after the roster loads (capabilityColor needs ROSTER.labels), so
// selections made under an older colour scheme adopt this one. A selection whose
// sat left the roster is kept untouched (can't classify it) and simply won't plot
// until it returns.
function recolorSelection() {
  const next = {};
  for (const norad in _satSelected) if (!ROSTER.some(s => s.norad === +norad)) next[norad] = _satSelected[norad];
  ROSTER.filter(s => s.norad in _satSelected).forEach(s => { next[s.norad] = capabilityColor(s.norad); });
  _satSelected = next;
  saveSelection();
}

async function boot() {
  const meta = await (await fetch('/api/satellites')).json();
  ROSTER = meta.satellites; STATION = meta.station;
  renderFilterBar();
  setTleBadge(meta.tle_age_days);
  renderSatMuteBell();
  // Unlock Web Audio on the operator's first interaction, so a bell armed in a
  // prior session can still chime from the timer (browsers gate audio on gesture).
  ['click', 'keydown', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, _unlockAudio, { once: true }));
  initSatMap();
  buildLegend();                                    // capability colour key (burger, top-left)
  startClock(); updateCpu(); setInterval(updateCpu, 8000);
  pollListen(); setInterval(pollListen, 3000);
  await refreshPasses();
  reconcileSelection();                             // sync local picks ↔ shared server roster (kiosk sees them)
  await reconcileBells();                           // one-time migration up, then the roster wins
  recolorSelection();                               // colour every selected bird by its service class
  await syncPlotted(); renderRoster();               // draw the saved selection + its bells
  setInterval(refreshPasses, 10 * 60 * 1000);      // keep the 24 h pass window fresh over long sessions
  updatePills();                                   // live workability colour
  // In the "In 1h" view, re-render the roster each tick so birds enter/leave the
  // 60-min window on their own and the countdowns tick live (few rows, cheap).
  // Other views just repaint pills — no time-dependent membership there.
  setInterval(() => { (_view === 'soon' || _view === 'soon-all') ? renderRoster() : updatePills(); }, 2000);
  // Flush a rebuild that was held back while a downlink picker was open. focusout
  // (not blur — blur does not bubble) fires as the popup closes; the timeout lets
  // activeElement settle first, or openPicker would still see the select that is
  // on its way out and defer forever. Only the 1 h views have a 2 s renderRoster
  // to retry on their own, so the other views genuinely need this.
  document.getElementById('roster').addEventListener('focusout', e => {
    if (e.target.classList && e.target.classList.contains('dlsel') && _rosterDeferred)
      setTimeout(renderRoster, 0);
  });
}

// Render the TLE-age pill from a cache age in days (null = empty cache).
function setTleBadge(age) {
  const badge = document.getElementById('tle-age');
  badge.textContent = age == null ? 'no TLE data — click to sync' : 'TLE ' + age.toFixed(1) + ' d old';
  badge.className = 'badge ' + (age != null && age < 5 ? 'ok' : 'warn');
}

// Clicking the age pill refreshes the TLE cache from CelesTrak. Online-only: if
// the Pi is offline the server reports it (never fails), and we flash a "no
// internet — try later" note on the pill, then restore the previous state.
let _syncingTle = false;
async function syncTle() {
  if (_syncingTle) return;
  _syncingTle = true;
  const badge = document.getElementById('tle-age');
  const prev = { text: badge.textContent, cls: badge.className };
  badge.textContent = 'syncing TLEs…'; badge.className = 'badge';
  const flash = msg => { badge.textContent = msg; badge.className = 'badge warn';
    setTimeout(() => { badge.textContent = prev.text; badge.className = prev.cls; }, 5000); };
  try {
    const j = await (await fetch('/api/satellites/refresh', { method: 'POST', headers: { 'X-OASIS-Request': '1' } })).json();
    if (j.ok) {
      setTleBadge(j.tle_age_days);
      // Pull the refreshed TLE lines into the roster + recompute pass predictions.
      const meta = await (await fetch('/api/satellites')).json();
      ROSTER = meta.satellites; STATION = meta.station;
      renderFilterBar();
      // A first sync on an offline box flips the roster from bare (no labels →
      // every bird telemetry-orange) to fully labelled. Mirror boot()'s post-roster
      // sequence so the selection recolours + re-plots in place — without this the
      // already-plotted birds keep their bare orange until a manual reload.
      recolorSelection();
      await refreshPasses();                        // recomputes passes AND re-syncs the plots
    } else {
      flash(j.code === 'OFFLINE' ? '⚠ no internet — try later' : '⚠ sync failed — try later');
    }
  } catch (e) {
    flash('⚠ sync failed — try later');
  } finally {
    _syncingTle = false;
  }
}

// Refetch pass predictions + re-render the roster (server-cached, so cheap).
async function refreshPasses() {
  try {
    PASSES = (await (await fetch(`/api/satellites/passes?window=${WINDOW_H}`)).json()).passes || {};
  } catch (e) { /* keep last-good passes */ }
  await syncPlotted();
  renderRoster();
}

// Bring the drawn set in line with the selection + the passes we now hold.
// /passes is computed under a wall-clock budget and deliberately returns partial
// results that fill in over later polls, but the boot-time re-plot only ran once,
// so a bird whose pass arrived on the second poll stayed undrawn for the whole
// session. Runs on every refresh: plot what became drawable, drop what aged out.
// Nothing here touches the selection itself.
async function syncPlotted() {
  for (const norad in _satSelected) {
    const n = +norad;
    if (!ROSTER.some(s => s.norad === n)) continue;    // no longer in the roster
    const pass = nextPassOf(n);
    if (pass && !PLOTTED[n]) await plotSat(n, pass);
    else if (!pass && PLOTTED[n]) unplotSat(n);
  }
  for (const norad in PLOTTED) if (!isMonitored(+norad)) unplotSat(+norad);
}

// The current-or-next pass: skip any whose set time is already past, so a row
// stops showing an elapsed pass the moment it ends (updatePills re-evaluates
// this every 2 s, so the hint advances to the next pass on its own).
function nextPassOf(norad) {
  const now = Date.now();
  return (PASSES[norad] || []).find(p => new Date(p.set).getTime() > now) || null;
}
// Two map windows, both closing at LOS, opening at different leads.
//
// FOOTPRINT — 15 min. It mirrors the countdown pill's lifetime and marks where
// the bird can actually be worked. Drawing it earlier fills the map with
// coverage circles for birds nowhere near usable.
//
// LABEL — 60 min, matching the roster's own "· 1h" views. A name is only
// identity, and identity is wanted from the moment you start planning against a
// pass, not from the moment the pass becomes workable. The set stays bounded
// without any extra gate: syncPlotted() only ever plots birds already in
// _satSelected, so labelling is scoped to birds the operator deliberately chose
// to monitor.
const FOOTPRINT_LEAD_MIN = 15, LABEL_LEAD_MIN = 60;
function inFootprintWindow(norad) {
  const p = nextPassOf(norad);
  return !!p && satgeo.inPassWindow(p.rise, p.set, Date.now(), FOOTPRINT_LEAD_MIN);
}
function inLabelWindow(norad) {
  const p = nextPassOf(norad);
  return !!p && satgeo.inPassWindow(p.rise, p.set, Date.now(), LABEL_LEAD_MIN);
}

// The name as the ROSTER shows it — trailing "[LEO]"-style orbit tag stripped.
// Shared with the map label deliberately: the coverage pills already learned
// this lesson ("same readout as the roster chip, so the two agree on sight"),
// and a bird that reads one way in the list and another on the map is worse
// than one with no label at all, because now you have two names to reconcile.
function bareSatName(name) {
  const m = String(name == null ? '' : name).match(/^(.*?)\s*\[[^\]]*\]\s*$/);
  return m ? m[1] : String(name == null ? '' : name);
}
// Satellite names come from SatNOGS/CelesTrak, not from us, and go into an SVG
// string via innerHTML. One "&" in a name would break the parse for the whole
// overlay — every track and marker, not just that label.
function xmlEsc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

let _rosterDeferred = false;

function renderRoster() {
  // A rebuild replaces the open <select> ELEMENT, not just its options, so it is
  // the most violent of the things that used to close the dropdown. Hold the
  // rebuild while a picker is open — but keep running the in-place updates,
  // because in the 1 h views renderRoster IS the 2 s tick, and simply returning
  // would freeze the elevation meters, the pass hints and the DOPPLER readout
  // for as long as the operator kept the list open.
  if (openPicker()) {
    _rosterDeferred = true;
    updatePills();        // textContent only — safe next to an open popup
    updateListenUI();     // skips the open picker itself
    return;
  }
  _rosterDeferred = false;
  // The 1h views (Mon · 1h / All · 1h) sort by next-pass time — soonest first,
  // in-progress passes at the top (their rise time is already in the past) — which
  // is what you act on. All other views sort alphabetically (natural numeric).
  const byName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base', numeric: true });
  const riseMs = s => { const p = nextPassOf(s.norad); return p ? new Date(p.rise).getTime() : Infinity; };
  const sorter = (_view === 'soon' || _view === 'soon-all')
    ? (a, b) => (riseMs(a) - riseMs(b)) || byName(a, b)
    : byName;
  const shown = ROSTER.filter(passesFilters).sort(sorter);
  const mon = ROSTER.filter(s => isMonitored(s.norad)).length;   // matches the kiosk's roster count
  const tally = shown.length === ROSTER.length
    ? `${ROSTER.length} sats` : `${shown.length} of ${ROSTER.length} sats`;
  document.getElementById('roster-count').textContent = `${mon} monitored - ${tally}`;
  if (!shown.length) {
    // No-data trumps every view: an empty ROSTER means the roster + TLE cache are
    // both empty (a never-synced offline box), not a filter miss — point at the fix.
    const msg = ROSTER.length === 0
                ? 'No satellite data yet — tap the TLE badge above to build the list (needs a connection).'
              : _view === 'soon' ? 'No monitored passes in the next hour.'
              : _view === 'soon-all' ? 'Nothing passing over in the next hour (or passes still computing…).'
              : _view === 'monitored' ? 'Nothing monitored — check a satellite to track it.'
              : filtersActive() ? 'No satellites match the filters.'
              : _listenable ? 'Nothing here this station can demodulate — tap Listenable to show the rest.'
              : 'No satellites to show.';
    document.getElementById('roster').innerHTML =
      `<p style="color:var(--text-dim);padding:.5rem">${msg}</p>`;
    return;
  }
  document.getElementById('roster').innerHTML = shown.map(s => {
    const p = nextPassOf(s.norad);
    const mon = isMonitored(s.norad);       // the pick — survives having no pass
    const noTle = !s.l1;                    // absent from the TLE cache: never plots
    // Line 1 is the name alone; line 2 is what the bird IS — designator and
    // orbit class, or just the class when it has no OSCAR number:
    //   DOSAAF-85       BISONSAT
    //   RS-44 [LEO]     [LEO]
    // Every row gets the second line, including the majority with no
    // designator. It costs height in a 150-row scrolling list, but the class
    // then always sits in the same place, and a name line whose length depends
    // on whether that particular bird happens to have an OSCAR number is worse
    // to scan than a taller row.
    // The tag is taken off the END OF THE NAME rather than from s.orbit, because
    // a roster built before that field existed still carries it in the name;
    // s.orbit is the fallback. End-anchored, so a bracket mid-name is left alone.
    const tagged = s.name.match(/^(.*?)\s*(\[[^\]]*\])\s*$/);
    const bareName = bareSatName(s.name);
    const orbitTag = tagged ? tagged[2] : (s.orbit ? `[${s.orbit}]` : '');
    const subName = [s.designator, orbitTag].filter(Boolean).join(' ');
    // Colour lives with the selection, so a monitored bird keeps its identity
    // between passes instead of going transparent whenever it can't be drawn.
    const color = mon ? (_satSelected[s.norad] || 'transparent') : 'transparent';
    return `<div class="sat-row ${mon ? 'on' : ''} ${p ? '' : 'no-pass'}" style="border-left-color:${color}">
      <label><input type="checkbox" ${mon ? 'checked' : ''}
          onchange="onToggle(${s.norad}, this.checked)">
        <span class="nmwrap"><span class="nm">${bareName}</span><span class="subline">${subName ? `<span class="desig">${subName}</span>` : ''}<span class="passwin" data-norad="${s.norad}">${passWindow(p)}</span></span></span><span class="pass-hint" data-norad="${s.norad}">${passHint(p, s.norad)}</span></label>
      <div class="chips">${s.labels.map(l => `<span class="chip">${l}</span>`).join('')}${noTle ? '<span class="chip chip-warn" title="This satellite is monitored but has no TLE in the cache, so no pass can be computed and it will never plot. Sync TLEs (tap the badge above) while online.">no TLE</span>' : ''}<span class="sat-elev" data-norad="${s.norad}"></span>${mon ? bellBtnHTML(s.norad) : ''}</div>
      ${!p ? `<div class="no-pass-hint">— ${noTle ? 'no TLE in cache' : 'no upcoming pass'} · no SDR controls —</div>`
           : (mon ? `<div class="dlpick">${dlPickerHTML(s)}</div>`
                  + `<div class="dl-rx" data-norad="${s.norad}"></div>`
                  + `<div class="dl-doppler" data-norad="${s.norad}"></div>` : '')}
      <div class="sat-bottom">
        ${mon ? `<span class="dl-status" data-norad="${s.norad}"></span>` : '<span></span>'}
        <span class="sat-meter" data-norad="${s.norad}">${'<span class="seg"></span>'.repeat(5)}</span></div>
    </div>`;
  }).join('');
  updatePills();       // paint the meters immediately (avoid a dim flash until the tick)
  updateListenUI();    // colour the downlink buttons from the latest listen status
}

// Local time, 24 h, ALWAYS. toLocaleTimeString renders "4:00 PM" on a US-locale
// browser, which is the wrong register for a station log — and it made the page
// depend on whichever locale the kiosk happened to boot with, the same trap that
// keeps fmtKm off toLocaleString. Built by hand so it cannot drift.
function fmt(iso) {
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

/* ── Workability pill ──────────────────────────────────────────────────────
   Pure geometry (satellite.js), no SDR. Below the horizon the pill is grey —
   nothing to work, no false expectation. Above the horizon it reddens and
   brightens with elevation: soft pink just peeking over the horizon, vivid red
   and glowing near the zenith (its "hit". PILL_CAP_DEG is where it reads fully
   hot — tune to taste. */
const PILL_CAP_DEG = 50;
// currentLook / fmtKm / elevTrend / trendArrow come from common/js/sat-look.js,
// shared with the kiosk dashboard so the wall and the desk cannot disagree
// about where a bird is. Station is this page's STATION global.
const lookAt = (s) => currentLook(s.l1, s.l2, STATION);
function pillColor(elev) {
  if (elev == null || elev < 0)
    return { css: 'var(--border)', glow: 'none', title: 'below horizon' };
  const t = Math.min(elev / PILL_CAP_DEG, 1);
  const sat = (45 + 50 * t).toFixed(0);       // 45% pale -> 95% vivid
  const light = (64 - 16 * t).toFixed(0);     // 64% soft pink -> 48% vivid red
  const css = `hsl(0, ${sat}%, ${light}%)`;
  return { css, glow: `0 0 ${(3 + 7 * t).toFixed(0)}px hsla(0, ${sat}%, ${light}%, .85)`,
           title: `above horizon · ${elev.toFixed(0)}°` };
}
// How many signal bars to light for a given elevation. Non-linear thresholds
// (deg) so low passes still register and the useful range spreads across bars.
const METER_THRESH = [2, 10, 22, 38, 58];
function meterLevel(elev) {
  if (elev == null || elev < 0) return 0;
  return METER_THRESH.filter(t => elev >= t).length;
}
// Fixed spectrum across the 5 bars — red (low, near the horizon) to blue (high,
// overhead). Astronomical sense: blue = highest / coming right at you. The
// COUNT of lit bars tracks elevation; each bar keeps its own colour.
const BAR_COLORS = ['hsl(0, 85%, 57%)', 'hsl(322, 75%, 60%)', 'hsl(285, 65%, 62%)',
                    'hsl(258, 72%, 64%)', 'hsl(235, 85%, 62%)'];
// Roster hint: rise time + pass PEAK elevation + a live countdown, so the
// number can't be mistaken for the current elevation (that's the nn°↗ chip).
function passHint(p, norad) {
  if (!p) return 'no pass 24h';
  const rise = new Date(p.rise), set = new Date(p.set), now = new Date();
  let when = '', live = false;
  if (now < rise) { const m = Math.round((rise - now) / 60000);
    when = m >= 60 ? `in ${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}m` : `in ${m}m`; }
  else if (now < set) { when = `LOS ${Math.max(1, Math.round((set - now) / 60000))}m`; live = true; }  // contact window open
  // Armed bell + inside the T-10 window → amber emphasis + a bell glyph on the pill.
  const armedSoon = norad != null && bellArmed(norad) && !live && (rise - now) <= 600000 && (rise - now) > 0;
  const cls = 'ph-when' + (live ? ' live' : (armedSoon ? ' armed' : ''));
  // RELATIVE time only — "in 45m", "LOS 4m". The absolute window moved down to
  // the sub-line (passWindow): this row also holds the satellite name, and a long
  // name plus a clock time plus a countdown pushed the card wider than the column.
  // The split is also the honest one — one of these answers "when", the other
  // answers "how long have I got", and they were competing for the same corner.
  return when ? `<span class="${cls}">${armedSoon ? BELL_ON + ' ' : ''}${when}</span>` : '';
}

// The pass itself, on the sub-line beside the designator and orbit class:
// "16:00–16:17 · max 17° SW".
//
// A RANGE, not a single time. It used to read "16:00 · max 17°", which binds the
// two halves together — the natural reading is "at 16:00 it reaches 17 degrees",
// and it does not: 16:00 is AOS and the peak comes minutes later. On AO-7, nine
// of them. The range cannot be misread, and it answers the question that follows
// anyway, since a 19-minute AO-7 pass and a 10-minute ISS pass looked identical.
// Matches the popup, which has always shown a range.
//
// peak_az is guarded because a pass cached before that field existed has none
// (see _PASS_SCHEMA). Compass point rather than bearing: you know your skyline by
// direction, and WHERE it peaks decides whether 17 degrees is workable at all.
function passWindow(p) {
  if (!p) return '';
  const peak = p.peak_az != null ? ' ' + azCompass(p.peak_az) : '';
  return `${fmt(p.rise)}–${fmt(p.set)} · max ${p.max_el.toFixed(0)}°${peak}`;
}
// 8-point compass. Shared vocabulary with the kiosk (dashboard.html azCompass) so
// "NW" means the same thing on both screens.
function azCompass(deg) {
  if (deg == null) return '';
  return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round((((deg % 360) + 360) % 360) / 45) % 8];
}
// ── Pass alerts ──────────────────────────────────────────────────────────────
// Per-sat "bell" arms a Web-Audio Morse-"V" (· · · —) chime for CHECKED (plotted)
// satellites: "VVV" at T-10 min, then "VVV" again at T-5 min — enough lead to get
// the rig on frequency (no AOS chime; by then it's too late to react). Fully
// client-side + offline (synthesised, no audio file). Fire-once-per-pass;
// re-arms next pass.
// The bell is a property of the BIRD, so it lives in the shared server roster
// (`bell`, beside `selected`) — not in this browser. It used to be localStorage
// only, which meant the shack kiosk could never know which passes should wake
// it: you armed a bell on the laptop and the Pi stayed silent. This map is a
// local MIRROR of the roster for instant paint; the server is authoritative and
// re-adopted on every load.
// Monitoring a bird arms this (see onToggle), so the bell is no longer a gate the
// operator has to find — it is the EXCEPTION, for the bird you want on the map
// without being woken by it.
let _satBells = (() => { try { return JSON.parse(localStorage.getItem('oasis_sat_bells') || '{}'); } catch (e) { return {}; } })();
function saveBells() { try { localStorage.setItem('oasis_sat_bells', JSON.stringify(_satBells)); } catch (e) { /* private mode */ } }
// MUTE stays local on purpose. It is a property of the DEVICE, not the bird:
// the shack kiosk should be silenceable overnight while this laptop still
// chimes. Putting it in the roster would silence every screen at once.
let _satMuted = localStorage.getItem('oasis_sat_muted') === '1';
// Quiet hours for pass alerts: 22:00–07:00 local, INDEPENDENT of the hour bell's
// (own key, own override) but sharing its window and semantics via
// common/js/quiet-hours.js. Silent means silent — no VVV, no Jenny.
const SAT_OVR_KEY = 'oasis_sat_quiet_ovr';
let _satOverrideUntil = Number(localStorage.getItem(SAT_OVR_KEY)) || 0;
// ONE place decides. Every alert path and both bell glyphs read this, so the
// page cannot act on one answer and display another.
function satAlertState(now) {
  return oasisSatQuietState(_satMuted, now || new Date(), _satOverrideUntil);
}
function satAlertsSilent() { return satAlertState().silent; }
// Push a `{norad: bool}` set in ONE request — same rule as postSelections. A set
// fanned out into one request per bird raced itself on the server and landed 1-2
// of 20.
function postBells(map) {
  const bells = {};
  for (const norad in map) bells[+norad] = !!map[norad];
  if (!Object.keys(bells).length) return Promise.resolve(null);
  return fetch('/api/satellites/bells', { method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-OASIS-Request': '1' },
    body: JSON.stringify({ bells }) }).then(r => r.json()).catch(() => null);
}
// Adopt the server's armed set as the truth for this browser.
function adoptBells(armed) {
  _satBells = {};
  (armed || []).forEach(n => { _satBells[n] = true; });
  saveBells();
}
// Reconcile this browser's bells with the shared roster on load.
//
// Deliberately NOT a permanent union, unlike reconcileSelection: a union can
// never carry a DISARM across devices — turn a noisy bird off on the laptop and
// the next device to load would re-arm it from its own stale copy and push it
// back up, so the bell could never be switched off for good. Instead the local
// bells are migrated up exactly ONCE (so nothing armed before this change is
// lost), after which the server simply wins.
const BELLS_MIGRATED = 'oasis_sat_bells_migrated';
function _markBellsMigrated() {
  try { localStorage.setItem(BELLS_MIGRATED, '1'); } catch (e) { /* private mode */ }
}
async function reconcileBells() {
  let migrated = false;
  try { migrated = localStorage.getItem(BELLS_MIGRATED) === '1'; } catch (e) { /* private mode */ }
  // The decision itself is common/js/sat-bells.js — pure and unit-tested,
  // because every way it can go wrong loses the operator's alerts silently.
  const plan = oasisBellPlan(
    Object.keys(_satBells).filter(n => _satBells[n]).map(Number),
    (ROSTER || []).filter(s => s.bell).map(s => s.norad),
    migrated);
  if (plan.action === 'migrate') {
    const res = await postBells(Object.fromEntries(plan.push.map(n => [n, true])));
    if (res && res.ok && Array.isArray(res.bells)) {
      _markBellsMigrated();          // only now — see the note in sat-bells.js
      adoptBells(res.bells);
    }
    // Push failed (server down, roster not writable): leave the local mirror
    // alone and retry next load. Better to keep chiming from a stale local bell
    // than to silently disarm the operator.
    return;

  if (plan.markMigrated) _markBellsMigrated();
  adoptBells(plan.adopt);
}
const _alertState = {};   // norad -> { key: pass.rise, t10, t5 }
// The AudioContext itself lives in common/js/sat-alerts.js (one per page); this
// is just the local name the page's gesture handlers already use.
const _unlockAudio = () => oasisSatAudioUnlock();
function bellArmed(norad) { return !!_satBells[norad]; }
function toggleBell(norad) {
  const on = !_satBells[norad];
  if (on) _satBells[norad] = true; else delete _satBells[norad];
  saveBells();
  _unlockAudio();   // this click unlocks the AudioContext so later chimes can play
  renderRoster();   // paint immediately — the write is confirmed below
  // Write through to the shared roster so the kiosk learns about it. Optimistic:
  // the glyph already moved, so on failure we put it back rather than leave the
  // operator believing an alert is armed when the Pi never heard about it.
  postBells({ [norad]: on }).then(res => {
    if (res && res.ok) return;

}
function toggleSatMute() {
  const now = new Date();
  const wasQuiet = satAlertState(now).quiet;
  _satMuted = !_satMuted;
  localStorage.setItem('oasis_sat_muted', _satMuted ? '1' : '0');
  // Un-muting DURING quiet hours means "tonight", not "from tomorrow" — the tap
  // is the operator saying they are awake and waiting for a pass. It expires by
  // itself at 07:00, so nobody has to remember to put the shack back to quiet.
  // Muting clears it: silence should not leave an override armed behind it.
  _satOverrideUntil = (!_satMuted && wasQuiet) ? oasisSatOverrideUntil(now) : 0;
  try { localStorage.setItem(SAT_OVR_KEY, String(_satOverrideUntil)); } catch (e) { /* private mode */ }
  renderSatMuteBell();
  renderRoster();   // re-render so each monitored sat's per-card bell reflects the mute
  // Not just policy for the NEXT alert: cut whatever is sounding right now. The
  // whole VVV goes into the audio graph in one call, so muting mid-chime used to
  // buy silence 2.6 s later — long after the tap that asked for it.
  if (_satMuted) oasisSatSilence();
