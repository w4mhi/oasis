<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OASIS — Satellites</title>
<link rel="stylesheet" href="/map-assets/maplibre-gl.css">
<link rel="stylesheet" href="/css/common.css">
<style>
/* ── Two-column layout: roster (left) / pass schedule (right) ──────── */
.sat-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .75rem;
}
@media (max-width: 760px) {
  .sat-cols { grid-template-columns: 1fr; }
}

.sec-cols {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: .75rem;
  align-items: start;
}
@media (max-width: 760px) {
  .sec-cols { grid-template-columns: 1fr; }
}

/* ── TLE-age badge ───────────────────────────────────────────────── */
.badge {
  display: inline-block;
  font-size: var(--fs-small);
  font-weight: 700;
  letter-spacing: .05em;
  padding: 2px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel-2);
}
.badge.ok   { color: #3fb950; border-color: #3fb950; }
.badge.warn { color: #d29922; border-color: #d29922; }

/* ── Roster rows ─────────────────────────────────────────────────── */
#roster { display: flex; flex-direction: column; gap: .5rem; }
.sat-row {
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel-2);
  padding: .55rem .75rem;
}
.sat-row label {
  display: flex;
  align-items: center;
  gap: .5rem;
  cursor: pointer;
  font-size: var(--fs-base);
}
.sat-row label input[type="checkbox"] {
  accent-color: var(--accent);
  cursor: pointer;
}
.sat-row .chips {
  display: flex;
  flex-wrap: wrap;
  gap: .3rem;
  margin-top: .4rem;
}
.chip {
  font-size: var(--fs-micro);
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 7px;
}
.sat-row .dl {
  margin-top: .3rem;
  font-size: var(--fs-small);
  color: var(--amber);
}

/* ── Pass schedule rows ──────────────────────────────────────────── */
#schedule { display: flex; flex-direction: column; gap: .35rem; }
.pass-row {
  border-bottom: 1px solid var(--panel-2);
  padding: .35rem 0;
  font-size: var(--fs-base);
  color: var(--text);
  cursor: pointer;
}
.pass-row:last-child { border-bottom: none; }
.pass-row b { color: var(--accent); margin-right: .5rem; }
.pass-row:hover { background: var(--panel-2); }
.pass-row.active { background: var(--panel-2); }
.pass-row.active b { color: var(--amber); }

.muted { color: var(--text-dim); font-size: var(--fs-base); font-style: italic; }

/* ── Ground-track map (MapLibre GL — same basemap as the APRS map) ── */
#satmap {
  width: 100%;
  height: 420px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-top: .4rem;
  background: #0d1117;
}

/* ── Polar sky-plot (az/el radar) ───────────────────────────────── */
#polar {
  display: block;
  width: 220px;
  height: 220px;
  background: #0d1117;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-top: .4rem;
}
.ring     { fill: none; stroke: #243b53; stroke-width: .6; }
.cmp      { fill: #7d8ea3; font: 10px monospace; text-anchor: middle; }
.poi-dot  { fill: #58a6ff; stroke: #0d1117; stroke-width: 1; }
.poi-peak { fill: #ffb454; }
.poi      { fill: #c9d1d9; font: 9px monospace; text-anchor: middle; }
/* Polar arc: flown = solid, upcoming = dim/dashed (same language as the map). */
.trk-past   { stroke: #00d98b; stroke-width: 2.5; fill: none; }
.trk-future { stroke: #00d98b; stroke-width: 2; fill: none; stroke-dasharray: 5 4; opacity: .45; }

/* ── Pre-pass alert chips ───────────────────────────────────────────── */
#alerts {
  display: flex;
  flex-direction: column;
  gap: .35rem;
  margin: .5rem 0;
}
.chip-alert {
  display: inline-block;
  align-self: flex-start;
  font-size: var(--fs-base);
  padding: .3rem .7rem;
  border-radius: 6px;
  border: 1px solid var(--accent-dim);
  background: var(--panel-2);
  color: var(--accent);
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="home-link" href="/">⌂ HOME</a>
    <h1>Satellites</h1>
    <p>Roster, label chips, downlinks &amp; upcoming passes &middot; <span id="tle-age" class="badge">loading…</span>
      <button class="sbtn" id="enable-alerts" type="button" onclick="Notification.requestPermission()">Enable alerts</button></p>
  </header>

  <div id="alerts"></div>

  <div class="sat-cols">
    <div class="sec">
      <span class="sec-lbl">Roster</span>
      <div id="roster"><p class="muted">Loading roster…</p></div>
    </div>

    <div class="sec">
      <span class="sec-lbl">Upcoming Passes (next 48 h)</span>
      <div id="schedule"><p class="muted">Loading passes…</p></div>
    </div>
  </div>

  <div class="sec-cols">
    <div class="sec">
      <span class="sec-lbl">Ground Track</span>
      <p id="track-info" class="muted">Click a pass above to plot its ground track.</p>
      <div id="satmap"></div>
    </div>

    <div class="sec">
      <span class="sec-lbl">Sky Plot (Az/El)</span>
      <svg id="polar" viewBox="0 0 220 220"></svg>
    </div>
  </div>

</div>

<script src="/map-assets/maplibre-gl.js"></script>
<script src="/map-assets/pmtiles.js"></script>
<script src="/map-assets/basemap-style.js"></script>
<script src="/server/satellites/sat-geometry.js"></script>
<script src="/server/satellites/satellite.min.js"></script>
<script>
let ROSTER = [], PASSES = {}, STATION = null;
async function boot() {
  const meta = await (await fetch('/api/satellites')).json();
  ROSTER = meta.satellites;
  STATION = meta.station;
  const age = meta.tle_age_days;
  const badge = document.getElementById('tle-age');
  badge.textContent = age == null ? 'no TLE data — run sync' : 'TLE ' + age.toFixed(1) + ' d old';
  badge.className = 'badge ' + (age != null && age < 5 ? 'ok' : 'warn');
  initSatMap();
  renderRoster();
  PASSES = (await (await fetch('/api/satellites/passes?window=48')).json()).passes || {};
  renderSchedule();
  scheduleAlerts();
}
function renderRoster() {
  document.getElementById('roster').innerHTML = ROSTER.map(s => `
    <div class="sat-row">
      <label><input type="checkbox" ${s.selected ? 'checked' : ''}
        onchange="toggle(${s.norad}, this.checked)"> <b>${s.name}</b></label>
      <div class="chips">${s.labels.map(l => `<span class="chip">${l}</span>`).join('')}</div>
      <div class="dl">${(s.downlinks[0] || {}).freq_mhz || ''} MHz</div>
    </div>`).join('');
}
async function toggle(norad, sel) {
  const r = await (await fetch('/api/satellites/select',
    {method:'POST', headers:{'Content-Type':'application/json'},
     body: JSON.stringify({norad, selected: sel})})).json();
  ROSTER = r.satellites; renderRoster();
}
function fmt(iso) { return new Date(iso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function renderSchedule() {
  const rows = [];
  for (const s of ROSTER) {
    for (const p of (PASSES[s.norad] || [])) {
      rows.push({name: s.name, norad: s.norad, p, t: new Date(p.rise).getTime()});
    }
  }
  rows.sort((a,b) => a.t - b.t);
  document.getElementById('schedule').innerHTML = rows.map(r => `
    <div class="pass-row" onclick="selectPass(this, ${r.norad}, '${r.p.rise}', '${r.p.set}')"><b>${r.name}</b>
      ${fmt(r.p.rise)}–${fmt(r.p.set)} · max ${r.p.max_el.toFixed(0)}° · rise ${r.p.rise_az.toFixed(0)}°</div>`).join('')
    || '<div class="muted">No passes ≥10° in the next 48 h.</div>';
}

// Index of the first track point at/after "now". Returns 0 for an entirely-future
// pass (all dashed) and track.length-1 for an entirely-elapsed pass (all solid),
// so splitAtNow() colours the whole track correctly in both corner cases.
function nowIndex(track) {
  if (!track.length) return 0;
  const now = Date.now();
  const first = new Date(track[0].t).getTime();
  const last = new Date(track[track.length - 1].t).getTime();
  if (now <= first) return 0;
  if (now >= last) return track.length - 1;
  return Math.max(0, track.findIndex(p => new Date(p.t).getTime() >= now));
}

/* ── Ground-track map (MapLibre GL + PMTiles) ─────────────────────────
   Its OWN MapLibre map that loads the same offline basemap the APRS map
   uses (washington.pmtiles via /maps/tiles/state/), so satellites match the
   APRS look without touching the APRS map page. The pass ground track is drawn
   as GeoJSON line layers — flown (past) solid, upcoming (future) dashed — with a
   live "now" marker, the same technique as the APRS/ADS-B track layers. */
let _map = null, _mapReady = false;
function initSatMap() {
  if (_map || typeof maplibregl === 'undefined' || typeof oasisBaseMapStyle !== 'function') return;
  try {
    const origin = location.origin;
    const tilesUrl = 'pmtiles://' + origin + '/maps/tiles/state/washington.pmtiles';
    maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);
    _map = new maplibregl.Map({
      container: 'satmap',
      style: oasisBaseMapStyle(tilesUrl),
      center: (STATION && STATION.lon != null) ? [STATION.lon, STATION.lat] : [-122.1, 47.6],
      zoom: 3,
      attributionControl: false,
    });
    _map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-left');
    _map.on('load', () => {
      _map.addSource('sat-track', { type: 'geojson', data: emptyFC() });
      _map.addLayer({
        id: 'sat-track-future', type: 'line', source: 'sat-track',
        filter: ['==', ['get', 'seg'], 'future'],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#00d98b', 'line-width': 2.5, 'line-opacity': 0.5, 'line-dasharray': [2, 1.5] },
      });
      _map.addLayer({
        id: 'sat-track-past', type: 'line', source: 'sat-track',
        filter: ['==', ['get', 'seg'], 'past'],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#00d98b', 'line-width': 3.5, 'line-opacity': 0.95 },
      });
      _map.addSource('sat-home', { type: 'geojson', data: homeFC() });
      _map.addLayer({
        id: 'sat-home', type: 'circle', source: 'sat-home',
        paint: { 'circle-radius': 5, 'circle-color': '#ffb454', 'circle-stroke-width': 2, 'circle-stroke-color': '#0d1117' },
      });
      _map.addSource('sat-now', { type: 'geojson', data: emptyFC() });
      _map.addLayer({
        id: 'sat-now', type: 'circle', source: 'sat-now',
        paint: { 'circle-radius': 6, 'circle-color': '#ffffff', 'circle-stroke-width': 2.5, 'circle-stroke-color': '#00d98b' },
      });
      _mapReady = true;
      if (_liveTrack && _liveTrack.length) { drawTrack(_liveTrack); fitTrack(_liveTrack); }
    });
  } catch (e) {
    document.getElementById('track-info').textContent = 'Map failed to load (offline basemap missing?).';
  }
}
function emptyFC() { return { type: 'FeatureCollection', features: [] }; }
function homeFC() {
  if (!STATION || STATION.lon == null) return emptyFC();
  return { type: 'Feature', geometry: { type: 'Point', coordinates: [STATION.lon, STATION.lat] } };
}

// Push the past/future track to the map source. No fetch, no camera move — safe
// to call every live tick so the solid (flown) portion grows behind the marker.
function drawTrack(track) {
  if (!_mapReady || !_map.getSource('sat-track')) return;
  const { past, future } = satgeo.splitAtNow(track, nowIndex(track));
  const feats = [];
  const addSegs = (pts, seg) => {
    for (const s of satgeo.splitAntimeridian(pts)) {
      if (s.length < 2) continue;
      feats.push({ type: 'Feature', properties: { seg },
        geometry: { type: 'LineString', coordinates: s.map(p => [p.lon, p.lat]) } });
    }
  };
  addSegs(past, 'past');
  addSegs(future, 'future');
  _map.getSource('sat-track').setData({ type: 'FeatureCollection', features: feats });
}
function setNowMarker(lat, lon) {
  if (!_mapReady || !_map.getSource('sat-now')) return;
  _map.getSource('sat-now').setData(
    (lat == null) ? emptyFC()
                  : { type: 'Feature', geometry: { type: 'Point', coordinates: [lon, lat] } });
}
// Frame the pass slice (+ the station) — the workable rise→set arc is regional,
// so this zooms to your area rather than the whole globe.
function fitTrack(track) {
  if (!_mapReady || !track.length) return;
  let minLon = 180, minLat = 90, maxLon = -180, maxLat = -90;
  for (const p of track) {
    if (p.lon < minLon) minLon = p.lon; if (p.lon > maxLon) maxLon = p.lon;
    if (p.lat < minLat) minLat = p.lat; if (p.lat > maxLat) maxLat = p.lat;
  }
  if (STATION && STATION.lon != null) {
    minLon = Math.min(minLon, STATION.lon); maxLon = Math.max(maxLon, STATION.lon);
    minLat = Math.min(minLat, STATION.lat); maxLat = Math.max(maxLat, STATION.lat);
  }
  if (maxLon - minLon < 340) {   // skip fit if the slice wraps the dateline
    _map.fitBounds([[minLon, minLat], [maxLon, maxLat]], { padding: 50, maxZoom: 6, duration: 800 });
  }
}

/* ── Polar sky-plot panel ────────────────────────────────────────── */
function showPolar(track) {
  const CX = 110, CY = 110, R = 90, svg = document.getElementById('polar');
  if (!track || !track.length) { svg.innerHTML = ''; return; }
  let out = '';
  for (const el of [0, 30, 60]) out += `<circle cx="${CX}" cy="${CY}" r="${(R * (90 - el) / 90).toFixed(1)}" class="ring"/>`;
  out += `<text x="${CX}" y="14" class="cmp">N</text><text x="${CX}" y="214" class="cmp">S</text>` +
         `<text x="6" y="${CY + 3}" class="cmp">W</text><text x="206" y="${CY + 3}" class="cmp">E</text>`;
  const pt = p => { const q = satgeo.polar(p.az, p.el, CX, CY, R); return q.x.toFixed(1) + ' ' + q.y.toFixed(1); };
  const { past, future } = satgeo.splitAtNow(track, nowIndex(track));
  const d = a => a.map((p, i) => (i ? 'L' : 'M') + pt(p)).join(' ');
  if (past.length)   out += `<path d="${d(past)}" class="trk-past"/>`;
  if (future.length) out += `<path d="${d(future)}" class="trk-future"/>`;
  // Rise / peak / set markers, each labelled with time + azimuth (+ el at peak).
  const peak = track.reduce((m, p) => (p.el > m.el ? p : m), track[0]);
  const mark = (p, cls, label) => {
    const q = satgeo.polar(p.az, p.el, CX, CY, R);
    return `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="3" class="${cls}"/>` +
           `<text x="${q.x.toFixed(1)}" y="${(q.y - 6).toFixed(1)}" class="poi">${label}</text>`;
  };
  const first = track[0], last = track[track.length - 1];
  out += mark(first, 'poi-dot', `${fmt(first.t)} ${first.az.toFixed(0)}°`);
  if (peak !== first && peak !== last) {
    out += mark(peak, 'poi-dot poi-peak', `${fmt(peak.t)} ${peak.az.toFixed(0)}°az/${peak.el.toFixed(0)}°el`);
  }
  out += mark(last, 'poi-dot', `${fmt(last.t)} ${last.az.toFixed(0)}°`);
  svg.innerHTML = out;
}

function selectPass(el, norad, rise, set) {
  document.querySelectorAll('.pass-row.active').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  showTrack(norad, rise, set);
}

// The currently-plotted pass — stored so the live tick can re-render it (growing
// solid trail) without re-fetching every second.
let _liveTrack = null;
// Bumped on every showTrack() so a slow-resolving fetch from a previously-clicked
// pass row can detect it's superseded and bail instead of clobbering _liveTrack.
let _trackReq = 0;

async function showTrack(norad, rise, set) {
  const info = document.getElementById('track-info');
  info.textContent = 'Loading track…';
  clearInterval(window._satTick);
  const myReq = ++_trackReq;
  const j = await (await fetch(`/api/satellites/track?sat=${norad}&from=${encodeURIComponent(rise)}&to=${encodeURIComponent(set)}`)).json();
  if (myReq !== _trackReq) return;   // a newer showTrack() call superseded this one
  _liveTrack = j.track || [];
  showPolar(_liveTrack);
  drawTrack(_liveTrack);
  fitTrack(_liveTrack);
  setNowMarker(null);
  if (!_liveTrack.length) {
    info.textContent = j.error ? `No track: ${j.error}` : 'No track data for this pass (TLE sync needed?).';
    return;
  }
  info.textContent = '';
  startLive(j.l1, j.l2);
}

// 1 Hz client-side propagation via satellite.js: moves the "now" marker along the
// ground track AND re-renders drawTrack/showPolar each tick so the solid (flown)
// portion grows behind the marker as time advances.
function startLive(l1, l2) {
  clearInterval(window._satTick);
  window._satTick = null;
  if (!l1 || !l2) return;   // no TLE for this sat — static plot only
  const rec = satellite.twoline2satrec(l1, l2);
  window._satTick = setInterval(() => {
    const now = new Date();
    const pv = satellite.propagate(rec, now);
    if (!pv.position) return;
    const gmst = satellite.gstime(now);
    const gd = satellite.eciToGeodetic(pv.position, gmst);
    setNowMarker(satellite.degreesLat(gd.latitude), satellite.degreesLong(gd.longitude));
    if (_liveTrack && _liveTrack.length) { drawTrack(_liveTrack); showPolar(_liveTrack); }
  }, 1000);
}

/* ── Pre-pass alerts (configurable lead times, default 10 + 2 min) ─────── */
const ALERT_LEADS_MIN = [10, 2];
function scheduleAlerts() {
  (document.getElementById('alerts') || {}).innerHTML = '';
  const fired = new Set();
  for (const s of ROSTER.filter(x => x.selected)) {
    const next = (PASSES[s.norad] || [])[0];
    if (!next) continue;
    const rise = new Date(next.rise).getTime();
    for (const lead of ALERT_LEADS_MIN) {
      const at = rise - lead * 60000 - Date.now();
      if (at <= 0) continue;
      setTimeout(() => {
        const key = s.norad + ':' + lead;
        if (fired.has(key)) return;
        fired.add(key);
        showChip(`🛰️ ${s.name} in ${lead} min`);
        if (window.Notification && Notification.permission === 'granted')
          new Notification(`${s.name} rises in ${lead} min`);
      }, at);
    }
  }
}
function showChip(text) {
  const el = document.getElementById('alerts');
  el.innerHTML = `<div class="chip-alert">${text}</div>`;
  setTimeout(() => { el.innerHTML = ''; }, 60000);
}

boot();
</script>
</body>
</html>
