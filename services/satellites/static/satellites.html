<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OASIS — Satellites</title>
<link rel="stylesheet" href="/css/common.css">
<style>
html, body { height: 100%; margin: 0; }
/* Full-screen map, APRS-style. */
/* Map sits below the fixed 2-row header, same as the APRS map. */
#satmap { position: fixed; top: 73px; left: 0; right: 0; bottom: 0; background: #0d1117; }

/* Header — same shape as the APRS map's top bar (two rows). */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column;
}
.topbar-row { display: flex; align-items: center; gap: .7rem; padding: 0 .9rem; height: 36px; }
.topbar-row + .topbar-row { border-top: 1px solid var(--border); }
#topbar h1 { font-size: var(--fs-base); letter-spacing: .08em; color: var(--accent);
  text-transform: uppercase; margin: 0; white-space: nowrap; cursor: pointer; }
.track-sep { color: var(--border); font-size: var(--fs-small); }
.win-lbl { font-size: var(--fs-small); color: var(--text-dim); white-space: nowrap; }
.home-link { color: #58a6ff; text-decoration: none; font-size: .9rem;
  font-weight: bold; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
.home-link:hover { color: #00d98b; }
/* CPU/temp readout (row 1, near HOME) — same colour bands as APRS. */
#crCpu { font-size: var(--fs-small); font-weight: 600; color: var(--text-dim); }
#crCpu.cpu-ok { color: #3fb950; } #crCpu.cpu-warn { color: var(--amber); } #crCpu.cpu-hot { color: var(--red); }
/* Cursor lat/lon readout (row 2, like APRS). */
#coordReadout { display: flex; align-items: center; gap: .5rem; font-size: var(--fs-small); }
#coordReadout .cr-lbl { color: var(--text-dim); }
#coordReadout .cr-val { display: inline-block; text-align: right; color: #7ecfff; font-weight: 600; }
#coordReadout #crLat { width: 8ch; } #coordReadout #crLon { width: 9ch; }
/* Wall clock (row 2, right side). */
#clock { font-size: var(--fs-small); color: var(--amber); font-weight: 600; white-space: nowrap; }
/* SDR recording indicator (row 1). */
#listen-status { display: none; align-items: center; gap: .4rem; font-size: var(--fs-small);
  color: var(--red); font-weight: 600; white-space: nowrap; }
#listen-status.on { display: inline-flex; }
#listen-status .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red);
  animation: recblink 1.2s infinite; }
@keyframes recblink { 50% { opacity: .3; } }
/* Coverage wash — green edge-glow over the map when a plotted sat is above the
   horizon (you're inside its footprint); opacity scales with elevation. */
#coverage-wash { position: fixed; top: 73px; left: 0; right: 0; bottom: 0; z-index: 1;
  pointer-events: none; opacity: 0; transition: opacity 1.2s ease;
  box-shadow: inset 0 0 130px 40px rgba(0,217,139,.4); }
/* Coverage badge — inline pill in the top header (row 1); shown only while a
   plotted sat is above the horizon. */
#coverage-badge { display: none; padding: 2px 10px; border-radius: 12px; white-space: nowrap;
  background: rgba(0,217,139,.14); border: 1px solid var(--green); color: var(--green);
  font: 700 var(--fs-small)/1.5 var(--mono); letter-spacing: .05em; }
/* The world map fills the whole map area, undistorted (2:1 letterboxed on the
   dark #satmap background). */
#satmap #world-svg { display: block; width: 100%; height: 100%; }
.grat { stroke: #243b53; stroke-width: .5; }
/* Dark land fill + faint country borders (Natural Earth 110m, public domain). */
.land { fill: #18222f; stroke: rgba(130,150,180,.28); stroke-width: .35; }
.sat-marker, .sat-track, .sat-glyph { cursor: pointer; }
.sat-glyph { font-size: 10px; }
.home-glyph { font-size: 8px; }
/* Click-a-satellite popup (replaces the old MapLibre popup; same pop-* content). */
.sat-popup { position: fixed; z-index: 300; max-width: 300px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px 9px;
  box-shadow: 0 6px 24px rgba(0,0,0,.6); font-size: var(--fs-small); }
.sat-popup[hidden] { display: none; }
.sat-popup .sp-close { float: right; background: none; border: none; color: var(--text-dim);
  font-size: 18px; line-height: 1; cursor: pointer; padding: 0 0 0 8px; }
.sat-popup .sp-close:hover { color: var(--text); }
.badge { display: inline-block; font-size: var(--fs-small); font-weight: 700; letter-spacing: .05em;
  padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel-2); }
.badge.ok   { color: #3fb950; border-color: #3fb950; }
.badge.warn { color: #d29922; border-color: #d29922; }

/* Floating Roster card (right side, like the APRS recent-stations panel) —
   wider than APRS since it carries more info, same font size. */
#roster-card {
  position: absolute; top: 81px; right: .75rem; z-index: 5;
  width: 340px; max-width: 46vw; max-height: calc(100vh - 95px);
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0,0,0,.45);
}
#roster-card > header {
  display: flex; align-items: center; gap: .5rem;
  padding: .5rem .7rem; cursor: pointer; user-select: none; border-radius: 8px;
}
#roster-card:not(.collapsed) > header { border-bottom: 1px solid var(--border); }
#roster-card > header:hover { background: var(--panel-2); }
#roster-card > header .arrow { font-size: 10px; color: var(--text-dim); transition: transform .2s; flex-shrink: 0; }
#roster-card.collapsed > header .arrow { transform: rotate(-90deg); }
#roster-card > header .title { color: var(--accent); font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; font-size: var(--fs-small); }
#roster-card > header .count { color: var(--amber); font-size: var(--fs-small); margin-left: auto; }
#roster-card.collapsed #roster { display: none; }
#roster { overflow-y: auto; padding: .5rem; display: flex; flex-direction: column; gap: .45rem; }

.sat-row { position: relative; border: 1px solid var(--border); border-left-width: 4px; border-radius: 6px;
  background: var(--panel-2); padding: .5rem .6rem; }
.sat-row.on { border-color: var(--accent-dim); }
.sat-row label { display: flex; align-items: center; gap: .5rem; cursor: pointer; font-size: var(--fs-base); }
.sat-row label input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }
/* Workability meter — signal-strength bars. More bars + more vivid red as the
   satellite climbs; all bars dim when below the horizon. */
.sat-bottom { display: flex; align-items: flex-end; justify-content: space-between; margin-top: .25rem; }
.sat-signal { display: flex; align-items: flex-end; gap: .4rem; }
.sat-meter { display: inline-flex; align-items: flex-end; gap: 2px; flex-shrink: 0; height: 14px; }
.sat-meter .seg { width: 4px; border-radius: 1px; background: var(--border);
  transition: background .5s ease, box-shadow .5s ease; }
.sat-meter .seg:nth-child(1) { height: 5px; }
.sat-meter .seg:nth-child(2) { height: 7px; }
.sat-meter .seg:nth-child(3) { height: 9px; }
.sat-meter .seg:nth-child(4) { height: 11px; }
.sat-meter .seg:nth-child(5) { height: 14px; }
.sat-row .sat-elev { font-size: var(--fs-base); font-weight: 700; color: var(--text);
  margin-left: auto; white-space: nowrap; }
.sat-row .nm { font-weight: 700; }
.sat-row .pass-hint { display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
  font-size: var(--fs-small); color: var(--text); margin-left: auto; white-space: nowrap; line-height: 1.25; }
.sat-row .pass-hint .ph-when { color: var(--amber); font-weight: 700; }   /* pre-AOS: "in X min" (waiting) */
.sat-row .pass-hint .ph-when.live { color: var(--green); animation: los-pulse 1.1s ease-in-out infinite; }  /* pass in progress: contact window open */
.sat-row .pass-hint .ph-when.armed { color: var(--amber); font-weight: 800; animation: los-pulse 1.4s ease-in-out infinite; }  /* armed + inside T-10 alert window */
@keyframes los-pulse { 50% { opacity: .35; } }
/* Per-sat pass-alert bell (roster row) — armed rings; disarmed is dim/grey. Only
   rendered for a checked (plotted) satellite. */
.sat-bell { background: none; border: none; cursor: pointer; font-size: var(--fs-small); padding: 0 2px; line-height: 1; opacity: .5; filter: grayscale(1); }
.sat-bell.on { opacity: 1; filter: none; }
/* Global pass-alert mute toggle (header). */
.sat-mute { cursor: pointer; user-select: none; font-size: var(--fs-small); }
.sat-row .chips { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; margin-top: .35rem; }
.chip { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
/* Roster filter bar: name search + toggleable tag/band chips (OR within a group,
   AND across groups). Filter state lives in _filters and persists to localStorage. */
.filters { padding: .45rem .5rem .15rem; display: flex; flex-direction: column; gap: .4rem; }
.filters .f-search { width: 100%; box-sizing: border-box; padding: 4px 9px; font-size: var(--fs-small);
  color: var(--text); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; }
.f-group { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; }
.fchip { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim);
  background: none; border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; cursor: pointer; }
.fchip .n { color: var(--text); font-weight: 700; margin-left: .3rem; }
#tag-filters .fchip { border-color: rgba(255,255,255,.5); }   /* whiter border for the tag-count pills */
.fchip.active { color: var(--panel); background: var(--accent); border-color: var(--accent); }
.fchip.active .n { color: var(--panel); opacity: 1; }         /* dark count on the amber active pill */
.sat-row .dl-status .dv { color: var(--text); }               /* device value white; "device:" stays dim (index-consistent) */
.f-clear { font-size: var(--fs-micro); color: var(--accent); background: none; border: none;
  cursor: pointer; padding: 1px 4px; margin-left: auto; }
/* View mode: three independent, mutually-exclusive pills (All / Monitored / In 1h). */
#view-modes .fchip { padding: 2px 9px; }
/* Downlink mode buttons (checked sat only). Freq is on the face; state comes
   from /listen/status. Two *disabled* looks that must not be confused: busy =
   solid grey ("wait"), unsupported = ghosted/dashed ("never"). */
.dlbtns { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .4rem; }
.dlbtn { font-family: var(--mono); font-size: var(--fs-small); font-weight: 700; white-space: nowrap;
  border: 1px solid var(--border); border-radius: 5px; padding: 2px 8px; cursor: pointer;
  background: var(--panel); color: var(--text); transition: background .3s ease, color .3s ease, border-color .3s ease; }
.dlbtn.free { border-color: var(--green); color: var(--green); }
.dlbtn.free:hover { background: var(--green); color: #0d1117; }
.dlbtn.rec { border-color: var(--red); background: var(--red); color: #fff; animation: recpulse 1.2s infinite; }
.dlbtn.live { border-color: var(--green); background: var(--green); color: #0d1117; animation: recpulse 1.2s infinite; }
#listen-status.live .rec-dot { background: var(--green); }
/* Capture-mode pills follow the studio convention: REC red, LISTEN green. */
/* Transport cluster (⏺ Rec / ▶ Play / ⏹ Stop) — one dongle, so one global set.
   Acts on the ARMED frequency. Rec red / Play green pulse while running; Stop blue. */
.tbtn { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .05em; padding: 2px 9px;
        border: 1px solid var(--border); border-radius: 999px; background: var(--panel-2);
        color: var(--text-dim); cursor: pointer; font-weight: 700; }
.tbtn:disabled { opacity: .4; cursor: default; }
.tbtn.active { opacity: 1; }   /* running state stays vivid even while non-interactive */
#t-rec.active  { background: var(--red);   border-color: var(--red);   color: #fff;    animation: recpulse 1.2s infinite; }
#t-play.active { background: var(--green); border-color: var(--green); color: #0d1117; animation: recpulse 1.2s infinite; }
#t-stop.active { background: #3b82f6;      border-color: #3b82f6;      color: #fff; }
/* Armed frequency = steady accent highlight (selected, not yet capturing). */
.dlbtn.armed { border-color: var(--accent); background: var(--accent); color: #0d1117; }
.dlbtn.busy { border-color: var(--border); color: var(--text-dim); background: var(--panel-2);
  cursor: not-allowed; opacity: .7; }
.dlbtn.unsupported { border-style: dashed; border-color: var(--border); color: var(--text-dim);
  background: transparent; cursor: not-allowed; opacity: .5; }
@keyframes recpulse { 50% { opacity: .5; } }
.sat-row .dl-status { font-size: var(--fs-small); color: var(--text-dim); }
.sat-row .dl-status.rec { color: var(--red); font-weight: 700; }
.sat-row .dl-status.live { color: var(--green); font-weight: 700; }
.sat-row .oov { margin-top: .3rem; font-size: var(--fs-micro); color: #d29922; font-weight: 700; }
/* No upcoming pass: dim the row and say plainly why there are no controls. */
.sat-row.no-pass { opacity: .6; }
.sat-row .no-pass-hint { margin-top: .4rem; font-size: var(--fs-small); color: var(--text-dim); font-style: italic; }

/* Popup — reuse the APRS/ADS-B popup look (see .sat-popup for the container). */
.pop-call { font-size: var(--fs-subtitle); font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.pop-chips { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: 5px; }
.pop-row { display: flex; gap: 6px; font-size: var(--fs-small); }
.pop-lbl { color: var(--text-dim); min-width: 46px; }
.pop-val { color: var(--text); }
.pop-sec { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--border); }
.pop-pass { font-size: var(--fs-small); padding: 2px 0; cursor: pointer; color: var(--text); }
.pop-pass:hover { color: var(--accent); }
.pop-pass.active { color: var(--amber); font-weight: 700; }
.pop-polar { display: block; width: 150px; height: 150px; margin: 6px auto 0; }
.ring     { fill: none; stroke: #243b53; stroke-width: .6; }
.cmp      { fill: #7d8ea3; font: 9px monospace; text-anchor: middle; }
.poi-dot  { stroke: #0d1117; stroke-width: 1; }
.poi      { fill: #c9d1d9; font: 8px monospace; text-anchor: middle; }
</style>
</head>
<body>

<div id="satmap">
  <svg id="world-svg" viewBox="0 0 720 360" preserveAspectRatio="xMidYMid meet">
    <g id="wg-base"></g><g id="wg-over"></g>
  </svg>
</div>
<div id="sat-popup" class="sat-popup" hidden><button class="sp-close" onclick="hideSatPopup()" aria-label="Close">×</button><div class="pop-body"></div></div>
<!-- Coverage wash: a green edge-glow over the map while a plotted satellite is
     above the horizon (you're inside its footprint). Opacity tracks elevation. -->
<div id="coverage-wash"></div>

<div id="topbar">
  <div class="topbar-row">
    <h1 onclick="location.reload()" title="Reload">Satellites</h1>
    <span class="track-sep">|</span>
    <span id="tle-age" class="badge" onclick="syncTle()" title="Click to rebuild the satellite list from SatNOGS + CelesTrak (needs internet)" style="cursor:pointer">loading…</span>
    <span class="track-sep">|</span>
    <span class="win-lbl">24 h window</span>
    <span class="track-sep">|</span>
    <div class="f-group" id="tag-filters"></div>
    <span class="track-sep">|</span>
    <span class="f-group" id="transport" title="Transport for the armed frequency — Rec to a WAV, Play live in the browser">
      <button class="tbtn" id="t-rec" onclick="transport('rec')">⏺ Rec</button>
      <button class="tbtn" id="t-play" onclick="transport('play')">▶ Play</button>
      <button class="tbtn" id="t-stop" onclick="transport('stop')">⏹ Stop</button>
    </span>
    <span id="listen-status"><span class="rec-dot"></span><span id="listen-text"></span></span>
    <span class="track-sep">|</span>
    <span id="coverage-badge"></span>
    <span style="flex:1"></span>
    <span id="sat-mute" class="sat-mute" title="Mute / unmute pass-alert chimes" onclick="toggleSatMute()">🔔</span>
    <span class="track-sep">|</span>
    <span id="crCpu" title="Pi CPU load · SoC temperature">—</span>
    <span class="track-sep">|</span>
    <a href="/" class="home-link">⌂ HOME</a>
  </div>
  <div class="topbar-row">
    <div id="coordReadout">
      <span class="cr-lbl">Lat</span><span id="crLat" class="cr-val">—</span>
      <span class="cr-lbl">Lon</span><span id="crLon" class="cr-val">—</span>
    </div>
    <span style="flex:1"></span>
    <span id="clock">—</span>
  </div>
</div>


<div id="roster-card">
  <header onclick="this.parentElement.classList.toggle('collapsed')">
    <span class="arrow">▾</span>
    <span class="title">Roster</span>
    <span class="count" id="roster-count">—</span>
  </header>
  <div class="filters" id="sat-filters">
    <div class="f-group" id="view-modes">
      <button class="fchip" data-view="all" onclick="setView('all')">All</button>
      <button class="fchip" data-view="monitored" onclick="setView('monitored')">Monitored</button>
      <button class="fchip" data-view="soon" onclick="setView('soon')" title="Monitored birds with a pass in the next hour">Mon · 1h</button>
      <button class="fchip" data-view="soon-all" onclick="setView('soon-all')" title="Every bird passing over in the next hour — check one to start monitoring it">All · 1h</button>
    </div>
    <input class="f-search" id="sat-search" type="search" placeholder="Search name…" autocomplete="off"
           oninput="setSearchFilter(this.value)">
    <div class="f-group" id="band-filters"></div>
  </div>
  <div id="roster"><p style="color:var(--text-dim);padding:.4rem">Loading roster…</p></div>
</div>

<!-- Satellites uses a lightweight SVG world map (no MapLibre/WebGL/tiles) — a
     memory win on the Pi Zero, and the whole-globe view is what pass tracks need. -->
<script src="/server/satellites/sat-geometry.js"></script>
<script src="/server/satellites/satellite.min.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────────────────
   Roster-driven satellite map. Check a satellite → plot its NEXT pass ground
   track (rise→set arc near the station), coloured per satellite; multiple
   checked = multiple colours. Click a satellite on the map → an APRS-style
   popup with its labels, downlink, next passes, and az/el sky-plot.
   ───────────────────────────────────────────────────────────────────────── */
const WINDOW_H = 24;                       // default prediction window
let ROSTER = [], STATION = null, PASSES = {};

// ── Roster filters ─────────────────────────────────────────────────────────
// Name search + tag chips + band chips. Within a group the selected values are
// OR'd; the three groups are AND'd. Persisted so a browse session survives a
// reload. Tag order follows the server's closed vocabulary.
const TAG_ORDER = ['WEATHER', 'VOICE', 'FM', 'APRS', 'SSTV', 'LINEAR', 'SSB', 'DATA', 'CREWED'];
const BAND_ORDER = ['VHF', 'UHF', 'L-band'];
let _filters = (() => {
  try {
    const f = JSON.parse(localStorage.getItem('oasis_sat_filters') || '{}');
    return { q: f.q || '', tags: new Set(f.tags || []), bands: new Set(f.bands || []) };
  } catch (e) { return { q: '', tags: new Set(), bands: new Set() }; }
})();
function saveFilters() {
  try {
    localStorage.setItem('oasis_sat_filters', JSON.stringify(
      { q: _filters.q, tags: [..._filters.tags], bands: [..._filters.bands] }));
  } catch (e) { /* private mode */ }
}
function bandOf(mhz) { return mhz < 300 ? 'VHF' : mhz < 1000 ? 'UHF' : 'L-band'; }
function satBands(s) { return new Set((s.downlinks || []).map(d => bandOf(d.freq_mhz))); }
// View mode is a separate axis from tag/band/search: 'all' (whole list),
// 'monitored' (checked/plotted birds), 'soon' = "Mon · 1h" (monitored + a pass
// within 1h, matching the kiosk index7 window: in-progress OR rise ≤ 60 min),
// 'soon-all' = "All · 1h" (ANY roster bird passing in the next hour — discovery;
// check one to start monitoring it). Both 1h views need whole-roster passes,
// which the server fills incrementally, so they populate over the first polls.
let _view = (() => { try { return localStorage.getItem('oasis_sat_view') || 'all'; } catch (e) { return 'all'; } })();
function setView(v) {
  _view = v;
  try { localStorage.setItem('oasis_sat_view', v); } catch (e) { /* private mode */ }
  applyViewButtons(); renderRoster();
}
function applyViewButtons() {
  document.querySelectorAll('#view-modes .fchip').forEach(b =>
    b.classList.toggle('active', b.dataset.view === _view));
}
function withinHour(s) {
  const p = nextPassOf(s.norad);
  if (!p) return false;
  const now = Date.now();
  const rise = new Date(p.rise).getTime(), set = new Date(p.set).getTime();
  const inPass = rise <= now && now < set;
  return inPass || (rise - now) / 60000 <= 60;
}
function passesFilters(s) {
  // Two independent axes: monitored-only ('monitored','soon') and passing-in-1h
  // ('soon','soon-all'). 'all' = neither; 'soon-all' = any bird passing over now.
  if ((_view === 'monitored' || _view === 'soon') && !PLOTTED[s.norad]) return false;
  if ((_view === 'soon' || _view === 'soon-all') && !withinHour(s)) return false;
  const q = _filters.q.trim().toLowerCase();
  if (q && !s.name.toLowerCase().includes(q)) return false;
  if (_filters.tags.size && !(s.labels || []).some(l => _filters.tags.has(l))) return false;
  if (_filters.bands.size) {
    const b = satBands(s);
    if (![..._filters.bands].some(x => b.has(x))) return false;
  }
  return true;
}
function filtersActive() { return !!_filters.q || _filters.tags.size > 0 || _filters.bands.size > 0; }
function setSearchFilter(v) { _filters.q = v; saveFilters(); renderRoster(); }
function toggleTagFilter(t) {
  _filters.tags.has(t) ? _filters.tags.delete(t) : _filters.tags.add(t);
  saveFilters(); renderFilterBar(); renderRoster();
}
function toggleBandFilter(b) {
  _filters.bands.has(b) ? _filters.bands.delete(b) : _filters.bands.add(b);
  saveFilters(); renderFilterBar(); renderRoster();
}
function clearFilters() {
  _filters = { q: '', tags: new Set(), bands: new Set() };
  saveFilters();
  const box = document.getElementById('sat-search'); if (box) box.value = '';
  renderFilterBar(); renderRoster();
}
// Build the tag + band chips from what's actually present in the roster, each
// with a count over the full roster (stable, so "WEATHER 6" always reads true).
function renderFilterBar() {
  const box = document.getElementById('sat-search');
  if (box && box.value !== _filters.q) box.value = _filters.q;
  const tagCounts = {}, bandCounts = {};
  (ROSTER || []).forEach(s => {
    new Set(s.labels || []).forEach(l => tagCounts[l] = (tagCounts[l] || 0) + 1);
    satBands(s).forEach(b => bandCounts[b] = (bandCounts[b] || 0) + 1);
  });
  const chip = (val, count, on, fn) =>
    `<button class="fchip ${on ? 'active' : ''}" onclick="${fn}('${val}')">${val}<span class="n">${count}</span></button>`;
  const tags = TAG_ORDER.filter(t => tagCounts[t]);
  const bands = BAND_ORDER.filter(b => bandCounts[b]);
  const clear = filtersActive() ? '<button class="f-clear" onclick="clearFilters()">clear ✕</button>' : '';
  document.getElementById('tag-filters').innerHTML = tags.length
    ? tags.map(t => chip(t, tagCounts[t], _filters.tags.has(t), 'toggleTagFilter')).join('') + clear
    : '';
  document.getElementById('band-filters').innerHTML = bands.length
    ? bands.map(b => chip(b, bandCounts[b], _filters.bands.has(b), 'toggleBandFilter')).join('')
    : '';

}
// norad -> { color, pass, track, l1, l2 }   for each checked/plotted satellite.
const PLOTTED = {};
const PALETTE = ['#00d98b', '#58a6ff', '#ffb454', '#ff7b72', '#bc8cff', '#39d0d8', '#f778ba', '#7ee787'];
const _freeColors = [...PALETTE];
// Persisted selection (norad -> colour). PLOTTED is the live subset (only sats
// with an upcoming pass can be drawn); this is the operator's full choice, so it
// survives refresh + server restart. Restored on boot (see restoreSelection),
// which also re-shows each sat's bell — bells already persist (oasis_sat_bells)
// but only render on a plotted sat, so they vanished with the lost selection.
let _satSelected = (() => { try { return JSON.parse(localStorage.getItem('oasis_sat_selected') || '{}'); } catch (e) { return {}; } })();
function saveSelection() { try { localStorage.setItem('oasis_sat_selected', JSON.stringify(_satSelected)); } catch (e) { /* private mode */ } }
// Persist a selection toggle to the SHARED server roster (configuration/
// satellites.json) so other clients — notably the 7" kiosk, which reads the
// roster's `selected` flag — see the same picks. Fire-and-forget; localStorage
// stays this browser's per-sat colour store.
function postSelect(norad, selected) {
  fetch('/api/satellites/select', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ norad: +norad, selected: !!selected }) }).catch(() => {});
}
// Reconcile this browser's selection with the shared server roster on load, so
// the map and the kiosk agree: adopt any sat the roster marks selected (a pick
// made on another device — e.g. the laptop — shows here too), and push up any
// local-only picks so the server (and kiosk) learn them. Union — nothing dropped.
function reconcileSelection() {
  (ROSTER || []).forEach(s => {
    const has = s.norad in _satSelected;
    if (s.selected && !has) _satSelected[s.norad] = _freeColors.shift() || PALETTE[0];
    else if (has && !s.selected) postSelect(s.norad, true);

  saveSelection();
}
// Claim already-chosen colours so a fresh selection doesn't collide with them.
Object.values(_satSelected).forEach(c => { const i = _freeColors.indexOf(c); if (i >= 0) _freeColors.splice(i, 1); });

async function boot() {
  const meta = await (await fetch('/api/satellites')).json();
  ROSTER = meta.satellites; STATION = meta.station;
  renderFilterBar();
  setTleBadge(meta.tle_age_days);
  if (_satMuted) { const m = document.getElementById('sat-mute');
    if (m) { m.textContent = '🔕'; m.title = 'Unmute pass-alert chimes'; } }
  // Unlock Web Audio on the operator's first interaction, so a bell armed in a
  // prior session can still chime from the timer (browsers gate audio on gesture).
  ['click', 'keydown', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, _unlockAudio, { once: true }));
  initSatMap();
  startClock(); updateCpu(); setInterval(updateCpu, 8000);
  pollListen(); setInterval(pollListen, 3000);
  await refreshPasses();
  reconcileSelection();                             // sync local picks ↔ shared server roster (kiosk sees them)
  await restoreSelection();                         // re-plot the operator's saved satellite selection + bells
  setInterval(refreshPasses, 10 * 60 * 1000);      // keep the 24 h pass window fresh over long sessions
  updatePills();                                   // live workability colour
  // In the "In 1h" view, re-render the roster each tick so birds enter/leave the
  // 60-min window on their own and the countdowns tick live (few rows, cheap).
  // Other views just repaint pills — no time-dependent membership there.
  setInterval(() => { (_view === 'soon' || _view === 'soon-all') ? renderRoster() : updatePills(); }, 2000);
}

// Render the TLE-age pill from a cache age in days (null = empty cache).
function setTleBadge(age) {
  const badge = document.getElementById('tle-age');
  badge.textContent = age == null ? 'no TLE data — click to sync' : 'TLE ' + age.toFixed(1) + ' d old';
  badge.className = 'badge ' + (age != null && age < 5 ? 'ok' : 'warn');
}

// Clicking the age pill refreshes the TLE cache from CelesTrak. Online-only: if
// the Pi is offline the server reports it (never fails), and we flash a "no
// internet — try later" note on the pill, then restore the previous state.
let _syncingTle = false;
async function syncTle() {
  if (_syncingTle) return;
  _syncingTle = true;
  const badge = document.getElementById('tle-age');
  const prev = { text: badge.textContent, cls: badge.className };
  badge.textContent = 'syncing TLEs…'; badge.className = 'badge';
  const flash = msg => { badge.textContent = msg; badge.className = 'badge warn';
    setTimeout(() => { badge.textContent = prev.text; badge.className = prev.cls; }, 5000); };
  try {
    const j = await (await fetch('/api/satellites/refresh', { method: 'POST' })).json();
    if (j.ok) {
      setTleBadge(j.tle_age_days);
      // Pull the refreshed TLE lines into the roster + recompute pass predictions.
      const meta = await (await fetch('/api/satellites')).json();
      ROSTER = meta.satellites; STATION = meta.station;
  renderFilterBar();
      await refreshPasses();
    } else {
      flash(j.offline ? '⚠ no internet — try later' : '⚠ sync failed — try later');
    }
  } catch (e) {
    flash('⚠ sync failed — try later');
  } finally {
    _syncingTle = false;
  }
}

// Refetch pass predictions + re-render the roster (server-cached, so cheap).
async function refreshPasses() {
  try {
    PASSES = (await (await fetch(`/api/satellites/passes?window=${WINDOW_H}`)).json()).passes || {};
  } catch (e) { /* keep last-good passes */ }
  renderRoster();
}

// The current-or-next pass: skip any whose set time is already past, so a row
// stops showing an elapsed pass the moment it ends (updatePills re-evaluates
// this every 2 s, so the hint advances to the next pass on its own).
function nextPassOf(norad) {
  const now = Date.now();
  return (PASSES[norad] || []).find(p => new Date(p.set).getTime() > now) || null;
}
// Footprint is drawn only from 15 min before AOS through LOS — the window where
// it's actually useful (mirrors the countdown pill's lifetime), which also keeps
// the world map uncluttered when the sat is on the far side of its orbit.
function inFootprintWindow(norad) {
  const p = nextPassOf(norad);
  if (!p) return false;
  const now = Date.now();
  return now >= new Date(p.rise).getTime() - 15 * 60000 && now <= new Date(p.set).getTime();
}

function renderRoster() {
  // The 1h views (Mon · 1h / All · 1h) sort by next-pass time — soonest first,
  // in-progress passes at the top (their rise time is already in the past) — which
  // is what you act on. All other views sort alphabetically (natural numeric).
  const byName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base', numeric: true });
  const riseMs = s => { const p = nextPassOf(s.norad); return p ? new Date(p.rise).getTime() : Infinity; };
  const sorter = (_view === 'soon' || _view === 'soon-all')
    ? (a, b) => (riseMs(a) - riseMs(b)) || byName(a, b)
    : byName;
  const shown = ROSTER.filter(passesFilters).sort(sorter);
  const mon = Object.keys(PLOTTED).length;
  const tally = shown.length === ROSTER.length
    ? `${ROSTER.length} sats` : `${shown.length} of ${ROSTER.length} sats`;
  document.getElementById('roster-count').textContent = `${mon} monitored - ${tally}`;
  if (!shown.length) {
    const msg = _view === 'soon' ? 'No monitored passes in the next hour.'
              : _view === 'soon-all' ? 'Nothing passing over in the next hour (or passes still computing…).'
              : _view === 'monitored' ? 'Nothing monitored — check a satellite to track it.'
              : 'No satellites match the filters.';
    document.getElementById('roster').innerHTML =
      `<p style="color:var(--text-dim);padding:.5rem">${msg}</p>`;
    return;
  }
  document.getElementById('roster').innerHTML = shown.map(s => {
    const p = nextPassOf(s.norad);
    const color = PLOTTED[s.norad] ? PLOTTED[s.norad].color : 'transparent';
    return `<div class="sat-row ${PLOTTED[s.norad] ? 'on' : ''} ${p ? '' : 'no-pass'}" style="border-left-color:${color}">
      <label><input type="checkbox" ${PLOTTED[s.norad] ? 'checked' : ''}
          ${p ? '' : 'disabled'} onchange="onToggle(${s.norad}, this.checked)">
        <span class="nm">${s.name}</span><span class="pass-hint" data-norad="${s.norad}">${passHint(p, s.norad)}</span></label>
      <div class="chips">${s.labels.map(l => `<span class="chip">${l}</span>`).join('')}<span class="sat-elev" data-norad="${s.norad}"></span>${PLOTTED[s.norad] ? bellBtnHTML(s.norad) : ''}</div>
      ${!p ? '<div class="no-pass-hint">— no upcoming pass · no SDR controls —</div>'
           : (PLOTTED[s.norad] ? `<div class="dlbtns">${dlBtnsHTML(s)}</div>` : '')}
      <div class="sat-bottom">
        ${PLOTTED[s.norad] ? `<span class="dl-status" data-norad="${s.norad}"></span>` : '<span></span>'}
        <span class="sat-meter" data-norad="${s.norad}">${'<span class="seg"></span>'.repeat(5)}</span></div>
    </div>`;
  }).join('');
  updatePills();       // paint the meters immediately (avoid a dim flash until the tick)
  updateListenUI();    // colour the downlink buttons from the latest listen status
}

function fmt(iso) { return new Date(iso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

/* ── Workability pill ──────────────────────────────────────────────────────
   Pure geometry (satellite.js), no SDR. Below the horizon the pill is grey —
   nothing to work, no false expectation. Above the horizon it reddens and
   brightens with elevation: soft pink just peeking over the horizon, vivid red
   and glowing near the zenith (its "hit". PILL_CAP_DEG is where it reads fully
   hot — tune to taste. */
const PILL_CAP_DEG = 50;
function currentElev(l1, l2) {
  if (!l1 || !l2 || !STATION || STATION.lat == null || typeof satellite === 'undefined') return null;
  try {
    const now = new Date();
    const pv = satellite.propagate(satellite.twoline2satrec(l1, l2), now);
    if (!pv || !pv.position) return null;
    const ecf = satellite.eciToEcf(pv.position, satellite.gstime(now));
    const obs = { longitude: STATION.lon * Math.PI / 180,
                  latitude: STATION.lat * Math.PI / 180, height: 0 };
    return satellite.ecfToLookAngles(obs, ecf).elevation * 180 / Math.PI;   // deg, <0 below horizon
  } catch (e) { return null; }
}
function pillColor(elev) {
  if (elev == null || elev < 0)
    return { css: 'var(--border)', glow: 'none', title: 'below horizon' };
  const t = Math.min(elev / PILL_CAP_DEG, 1);
  const sat = (45 + 50 * t).toFixed(0);       // 45% pale -> 95% vivid
  const light = (64 - 16 * t).toFixed(0);     // 64% soft pink -> 48% vivid red
  const css = `hsl(0, ${sat}%, ${light}%)`;
  return { css, glow: `0 0 ${(3 + 7 * t).toFixed(0)}px hsla(0, ${sat}%, ${light}%, .85)`,
           title: `above horizon · ${elev.toFixed(0)}°` };
}
// How many signal bars to light for a given elevation. Non-linear thresholds
// (deg) so low passes still register and the useful range spreads across bars.
const METER_THRESH = [2, 10, 22, 38, 58];
function meterLevel(elev) {
  if (elev == null || elev < 0) return 0;
  return METER_THRESH.filter(t => elev >= t).length;
}
// Fixed spectrum across the 5 bars — red (low, near the horizon) to blue (high,
// overhead). Astronomical sense: blue = highest / coming right at you. The
// COUNT of lit bars tracks elevation; each bar keeps its own colour.
const BAR_COLORS = ['hsl(0, 85%, 57%)', 'hsl(322, 75%, 60%)', 'hsl(285, 65%, 62%)',
                    'hsl(258, 72%, 64%)', 'hsl(235, 85%, 62%)'];
// Roster hint: rise time + pass PEAK elevation + a live countdown, so the
// number can't be mistaken for the current elevation (that's the ↑nn° text).
function passHint(p, norad) {
  if (!p) return 'no pass 24h';
  const rise = new Date(p.rise), set = new Date(p.set), now = new Date();
  let when = '', live = false;
  if (now < rise) { const m = Math.round((rise - now) / 60000);
    when = m >= 60 ? `in ${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}m` : `in ${m}m`; }
  else if (now < set) { when = `LOS ${Math.max(1, Math.round((set - now) / 60000))}m`; live = true; }  // contact window open
  // Armed bell + inside the T-10 window → amber emphasis + a bell glyph on the pill.
  const armedSoon = norad != null && bellArmed(norad) && !live && (rise - now) <= 600000 && (rise - now) > 0;
  const cls = 'ph-when' + (live ? ' live' : (armedSoon ? ' armed' : ''));
  return `<span class="ph-main">${fmt(p.rise)} · max ${p.max_el.toFixed(0)}°</span>`
       + (when ? `<span class="${cls}">${armedSoon ? '🔔 ' : ''}${when}</span>` : '');
}
// ── Pass alerts ──────────────────────────────────────────────────────────────
// Per-sat "bell" arms a Web-Audio Morse-"V" (· · · —) chime for CHECKED (plotted)
// satellites: "VVV" at T-10 min, then "VVV" again at T-5 min — enough lead to get
// the rig on frequency (no AOS chime; by then it's too late to react). Fully
// client-side + offline (synthesised, no audio file). Bell (per-NORAD) and the
// global mute persist in localStorage. Fire-once-per-pass; re-arms next pass.
let _satBells = (() => { try { return JSON.parse(localStorage.getItem('oasis_sat_bells') || '{}'); } catch (e) { return {}; } })();
let _satMuted = localStorage.getItem('oasis_sat_muted') === '1';
const _alertState = {};   // norad -> { key: pass.rise, t10, t5 }
let _audioCtx = null;
function bellArmed(norad) { return !!_satBells[norad]; }
function _unlockAudio() {   // must be called from a user gesture (bell/mute click) first
  try { if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_audioCtx.state === 'suspended') _audioCtx.resume(); } catch (e) { /* no audio */ }
}
function toggleBell(norad) {
  if (_satBells[norad]) delete _satBells[norad]; else _satBells[norad] = true;
  localStorage.setItem('oasis_sat_bells', JSON.stringify(_satBells));
  _unlockAudio();   // this click unlocks the AudioContext so later chimes can play
  renderRoster();
}
function toggleSatMute() {
  _satMuted = !_satMuted;
  localStorage.setItem('oasis_sat_muted', _satMuted ? '1' : '0');
  const el = document.getElementById('sat-mute');
  if (el) { el.textContent = _satMuted ? '🔕' : '🔔';
    el.title = (_satMuted ? 'Unmute' : 'Mute') + ' pass-alert chimes'; }
  renderRoster();   // re-render so each monitored sat's per-card bell reflects the mute
  _unlockAudio();
}
// Morse "V" = dit dit dit dah, `reps` times, `freq` Hz. dah = 3× dit; 1-unit gaps.
function playMorseV(reps, freq) {
  if (_satMuted) return;
  _unlockAudio();
  const ctx = _audioCtx; if (!ctx) return;
  const unit = 0.075, pattern = [1, 1, 1, 3];
  let t = ctx.currentTime + 0.03;
  for (let r = 0; r < (reps || 1); r++) {
    for (const n of pattern) {
      const dur = n * unit;
      const osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq || 660;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.006);
      g.gain.setValueAtTime(0.3, t + dur - 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
      t += dur + unit;
    }
    t += unit * 3;   // gap between repeated V's
  }
}
// Spoken heads-up at T-10 (after the Vs) — says which sat is coming + how good the
// pass is. Browser speech synthesis; silently no-ops if no voice is installed, so
// the VVV chime always carries the alert regardless. Honours the global mute.
let _voices = [];
function _loadVoices() { try { _voices = speechSynthesis.getVoices() || []; } catch (e) { _voices = []; } }
if (window.speechSynthesis) { _loadVoices(); speechSynthesis.onvoiceschanged = _loadVoices; }
function speak(text) {
  if (_satMuted || !window.speechSynthesis) return;
  if (!_voices.length) _loadVoices();
  if (!_voices.length) return;   // no TTS voice on this box — the chime already fired
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.9; u.pitch = 1.0; u.volume = 1.0;
    const en = _voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
    if (en) u.voice = en;
    speechSynthesis.speak(u);
  } catch (e) { /* ignore */ }
}
// Bell control for a roster row (only rendered for a plotted sat).
function bellBtnHTML(norad) {
  const on = bellArmed(norad);
  // The glyph reflects whether a chime will actually sound: an armed sat rings (🔔),
  // but while the global mute is on even armed sats show the crossed 🔕 — kept bright
  // via .on so it still reads as monitored (a disarmed sat shows a dim/grey 🔕).
  const glyph = (on && !_satMuted) ? '🔔' : '🔕';
  const title = on
    ? (_satMuted
        ? 'Pass alerts armed, but chimes are muted globally (header 🔕). Click to disarm.'
        : 'Pass alerts armed — VVV chime at T-10 + T-5 min. Click to disarm.')
    : 'Arm pass alerts (VVV chime at T-10 + T-5 min before the pass)';
  return `<button class="sat-bell${on ? ' on' : ''}" onclick="toggleBell(${norad})" title="${title}">${glyph}</button>`;
}
// Ridden by updatePills every 2 s: fire the T-10 and T-5 "VVV" chimes, deduped to
// one per tick. Per-sat+pass flags prevent re-firing; T-5 uses a higher pitch.
function _runPassAlerts() {
  let fire = false, freq = 620;
  const t10 = [];   // sats crossing T-10 this tick → spoken heads-up after the Vs
  const now = Date.now();
  for (const norad in PLOTTED) {
    if (!bellArmed(norad)) continue;
    const p = nextPassOf(+norad);
    if (!p) continue;
    const rise = new Date(p.rise).getTime();
    let st = _alertState[norad];
    if (!st || st.key !== p.rise) st = _alertState[norad] = { key: p.rise, t10: false, t5: false };
    const tMinus = rise - now;
    if (!st.t10 && tMinus <= 600000 && tMinus > 0) { st.t10 = true; fire = true; t10.push({ norad: +norad, p }); }
    if (!st.t5  && tMinus <= 300000 && tMinus > 0) { st.t5  = true; fire = true; freq = 780; }  // closer → higher/urgent
  }
  if (fire) playMorseV(3, freq);   // VVV — T-10 (620 Hz), then T-5 (780 Hz)
  // T-10 only: once the Vs finish, speak which sat is coming + the pass quality.
  if (t10.length) setTimeout(() => {
    for (const { norad, p } of t10) {
      const sat = ROSTER.find(s => s.norad === norad);
      if (sat) speak(`${sat.name}, in ten minutes, maximum elevation ${Math.round(p.max_el)} degrees`);
    }
  }, 2600);   // ~length of the VVV chime, so the voice follows it, not overlaps
}

function updatePills() {
  ROSTER.forEach(s => {
    const elev = currentElev(s.l1, s.l2);
    const up = elev != null && elev >= 0;
    const pc = pillColor(elev), lvl = meterLevel(elev);
    const meter = document.querySelector(`.sat-meter[data-norad="${s.norad}"]`);
    if (meter) {
      meter.title = pc.title;
      [...meter.children].forEach((seg, i) => {
        const on = i < lvl;
        seg.style.background = on ? BAR_COLORS[i] : 'var(--border)';
        seg.style.boxShadow = (on && i === lvl - 1) ? `0 0 6px ${BAR_COLORS[i]}` : 'none';   // glow the peak bar
      });
    }
    const et = document.querySelector(`.sat-elev[data-norad="${s.norad}"]`);
    if (et) et.textContent = up ? `↑${elev.toFixed(0)}°` : '';
    const ph = document.querySelector(`.pass-hint[data-norad="${s.norad}"]`);
    if (ph) ph.innerHTML = passHint(nextPassOf(s.norad), s.norad);
  });
  _runPassAlerts();
  updateCoverage();
}

// Coverage wash: tint the local map green while a PLOTTED satellite is above the
// horizon (you're inside its footprint). Opacity + badge scale with elevation —
// faint at the horizon, strong near the zenith.
function updateCoverage() {
  let elev = -1, name = '';
  for (const norad in PLOTTED) {
    const s = ROSTER.find(x => x.norad === +norad);
    if (!s) continue;
    const e = currentElev(s.l1, s.l2);
    if (e != null && e > elev) { elev = e; name = s.name; }
  }
  const wash = document.getElementById('coverage-wash');
  const badge = document.getElementById('coverage-badge');
  if (wash) wash.style.opacity = elev >= 0 ? Math.min(0.16 + elev / 90 * 0.5, 0.62).toFixed(2) : '0';
  if (badge) {
    if (elev >= 0) { badge.style.display = 'inline-block'; badge.textContent = `● IN COVERAGE · ${name} ${elev.toFixed(0)}°`; }
    else badge.style.display = 'none';
  }
}

/* ── Plot / unplot a satellite's next pass ─────────────────────────────── */
async function onToggle(norad, checked) {
  if (checked) {
    if (!(norad in _satSelected)) { _satSelected[norad] = _freeColors.shift() || PALETTE[0]; saveSelection(); }
    await plotSat(norad, nextPassOf(norad));
  } else {
    if (norad in _satSelected) { _freeColors.unshift(_satSelected[norad]); delete _satSelected[norad]; saveSelection(); }
    unplotSat(norad);
  }
  postSelect(norad, checked);          // persist to the shared server roster (kiosk reads it)
  renderRoster();
}

async function plotSat(norad, pass) {
  if (!pass) return;
  // Colour comes from the persisted selection (assigned in onToggle); fall back
  // for any direct caller so behaviour is unchanged when a sat isn't selected.
  const color = _satSelected[norad] || (PLOTTED[norad] ? PLOTTED[norad].color : (_freeColors.shift() || PALETTE[0]));
  const j = await (await fetch(
    `/api/satellites/track?sat=${norad}&from=${encodeURIComponent(pass.rise)}&to=${encodeURIComponent(pass.set)}`)).json();
  PLOTTED[norad] = { color, pass, track: j.track || [], l1: j.l1, l2: j.l2 };
  redraw();
  updateVisibility();
}

// Only removes the drawn/live copy; the selection + its colour are owned by
// onToggle (which frees the colour), so a re-plot of a still-selected sat keeps it.
function unplotSat(norad) {
  delete PLOTTED[norad];
  redraw();
}

// Re-plot the operator's saved selection after the roster + passes are loaded.
// Sats without an upcoming pass right now stay selected (persisted) and re-draw
// when they next have one — nothing is silently dropped.
async function restoreSelection() {
  for (const norad in _satSelected) {
    const n = +norad;
    if (!ROSTER.some(s => s.norad === n)) continue;   // dropped from the roster
    const pass = nextPassOf(n);
    if (pass) await plotSat(n, pass);
  }
  renderRoster();
}

/* ── Map — lightweight SVG world map (no MapLibre/WebGL/tiles) ─────────────── */
// A static base layer (dark countries + graticule + station house) rendered once,
// plus a dynamic overlay (footprint + ground tracks + live markers) redrawn each
// tick. The whole-globe equirectangular view is what pass tracks want, and it
// costs a fraction of MapLibre's memory on the Pi Zero.
let COUNTRIES = null;
async function loadCountries() {
  if (COUNTRIES) return COUNTRIES;
  try { COUNTRIES = (await (await fetch('/server/satellites/world-countries.json')).json()).polys || []; }
  catch (e) { COUNTRIES = []; }
  return COUNTRIES;
}
function initSatMap() {
  const svg = document.getElementById('world-svg');
  if (!svg || svg._wired) return;
  svg._wired = true;
  // Cursor lat/lon readout (row 2) — inverse of the equirectangular projection.
  svg.addEventListener('mousemove', e => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const q = pt.matrixTransform(svg.getScreenCTM().inverse());
    if (q.x < 0 || q.x > 720 || q.y < 0 || q.y > 360) { setCoord(null); return; }
    setCoord({ lat: 90 - q.y / 360 * 180, lng: q.x / 720 * 360 - 180 });
  });
  svg.addEventListener('mouseleave', () => setCoord(null));
  // Click a satellite marker/track → popup; click empty space → close it.
  svg.addEventListener('click', e => {
    const m = e.target.closest('[data-norad]');
    if (m) satClick(+m.dataset.norad, e); else hideSatPopup();
  });
  loadCountries().then(() => { renderBase(); redraw(); });
  setInterval(liveTick, 1000);
}
// Static base — dark country fills + graticule + the station house. Rendered once.
function renderBase() {
  const g = document.getElementById('wg-base');
  if (!g) return;
  const W = 720, H = 360;
  let out = drawCountries(W, H) + drawGraticule(W, H);
  if (STATION && STATION.lon != null) {
    const st = satgeo.project(STATION.lat, STATION.lon, W, H);
    out += `<text class="home-glyph" x="${st.x.toFixed(1)}" y="${st.y.toFixed(1)}" text-anchor="middle" dominant-baseline="central">🏠</text>`;
  }
  g.innerHTML = out;
}
function drawCountries(W, H) {
  if (!COUNTRIES || !COUNTRIES.length) return '';
  return COUNTRIES.map(ring => satgeo.splitAntimeridian(ring.map(c => ({ lon: c[0], lat: c[1] }))).map(seg => {
    if (seg.length < 2) return '';
    const d = seg.map((p, i) => { const q = satgeo.project(p.lat, p.lon, W, H); return (i ? 'L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1); }).join(' ') + ' Z';
    return `<path d="${d}" class="land"/>`;
  }).join('')).join('');
}

// Overlay — footprint + whole-orbit ground track (past-solid / future-dashed) +
// clickable live marker for every plotted sat. Redrawn on plot/unplot + each tick.
function redraw() {
  const g = document.getElementById('wg-over');
  if (!g) return;
  const W = 720, H = 360;
  let out = '';
  for (const norad in PLOTTED) {
    const s = PLOTTED[norad];
    const track = orbitTrack(norad);   // WHOLE orbit — the world view
    if (track.length < 2) continue;
    const pos = (s.l1 && s.l2) ? livePos(s.l1, s.l2) : null;
    // Footprint (under the track) only during the pass window (15 min pre-AOS → LOS).
    if (pos && pos.altKm > 0 && inFootprintWindow(norad)) {
      for (const d of satgeo.footprintPaths(pos.lat, pos.lon, satgeo.footprintRadiusDeg(pos.altKm), W, H))
        out += `<path d="${d}" fill="${s.color}" fill-opacity="0.12" stroke="${s.color}" stroke-opacity="0.45" stroke-width="1"/>`;
    }
    const { past, future } = satgeo.splitAtNow(track, nowIndex(track));
    const draw = (pts, dash) => { for (const seg of satgeo.splitAntimeridian(pts)) { if (seg.length < 2) continue;
      const d = seg.map((p, i) => { const q = satgeo.project(p.lat, p.lon, W, H); return (i ? 'L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1); }).join(' ');
      // non-scaling-stroke → constant pixel width regardless of the SVG's scale-up.
      out += `<path d="${d}" class="sat-track" data-norad="${norad}" fill="none" stroke="${s.color}" stroke-width="${dash ? 1 : 1.5}" vector-effect="non-scaling-stroke"${dash ? ' stroke-dasharray="3 2.5" opacity="0.5"' : ''}/>`; } };
    draw(past, false); draw(future, true);
    // Live marker: just the 🛰️ glyph (its colour association comes from the track).
    if (pos) { const q = satgeo.project(pos.lat, pos.lon, W, H);
      out += `<text class="sat-glyph" data-norad="${norad}" x="${q.x.toFixed(1)}" y="${q.y.toFixed(1)}" text-anchor="middle" dominant-baseline="central">🛰️</text>`; }
  }
  g.innerHTML = out;
}

// First track index at/after now (0 = all future/dashed, last = all past/solid).
function nowIndex(track) {
  if (!track.length) return 0;
  const now = Date.now();
  if (now <= new Date(track[0].t).getTime()) return 0;
  if (now >= new Date(track[track.length - 1].t).getTime()) return track.length - 1;
  return Math.max(0, track.findIndex(p => new Date(p.t).getTime() >= now));
}
function livePos(l1, l2) {
  try {
    const now = new Date(), pv = satellite.propagate(satellite.twoline2satrec(l1, l2), now);
    if (!pv.position) return null;
    const gd = satellite.eciToGeodetic(pv.position, satellite.gstime(now));
    return { lat: satellite.degreesLat(gd.latitude), lon: satellite.degreesLong(gd.longitude),
             altKm: gd.height };   // gd.height is km — drives the footprint radius
  } catch (e) { return null; }
}
function liveTick() { if (Object.keys(PLOTTED).length) redraw(); }

// The world map shows the whole globe — a track is never "out of view", so the
// roster's zoom-out hint never fires.
function updateVisibility() { for (const norad in PLOTTED) PLOTTED[norad].outOfView = false; }

/* ── Popup: click a satellite's track/marker on the map ────────────────── */
let _popupSat = null;
function satClick(norad, e) {
  const sat = ROSTER.find(s => s.norad == norad);
  if (!sat) return;
  _popupSat = sat;
  const el = document.getElementById('sat-popup');
  el.querySelector('.pop-body').innerHTML = popupHTML(sat);
  el.hidden = false;
  const pw = el.offsetWidth || 280, ph = el.offsetHeight || 220;
  const x = (e ? e.clientX : innerWidth / 2) + 12, y = (e ? e.clientY : 100);
  el.style.left = Math.max(8, Math.min(x, innerWidth - pw - 8)) + 'px';
  el.style.top  = Math.max(8, Math.min(y, innerHeight - ph - 8)) + 'px';
}
function hideSatPopup() { const el = document.getElementById('sat-popup'); if (el) el.hidden = true; _popupSat = null; }
function popupHTML(sat) {
  const plotted = PLOTTED[sat.norad];
  const chips = sat.labels.map(l => `<span class="chip">${l}</span>`).join('');
  const dls = sat.downlinks.map(d => `${d.mode} ${d.freq_mhz} MHz`).join(' · ');
  const passes = (PASSES[sat.norad] || []).slice(0, 4).map(p => {
    const active = plotted && plotted.pass.rise === p.rise ? 'active' : '';
    return `<div class="pop-pass ${active}" onclick="pickPass(${sat.norad}, '${p.rise}', '${p.set}')">
      ${fmt(p.rise)}–${fmt(p.set)} · max ${p.max_el.toFixed(0)}° · rise ${p.rise_az.toFixed(0)}°</div>`;
  }).join('') || '<div class="pop-row"><span class="pop-val">No passes in 24 h.</span></div>';
  const polar = (plotted && plotted.track.length) ? skyPlotSVG(plotted.track, plotted.color) : '';
  return `<div class="pop-call">${sat.name}</div>
    <div class="pop-chips">${chips}</div>
    <div class="pop-row"><span class="pop-lbl">Downlink</span><span class="pop-val">${dls || '—'}</span></div>
    <div class="pop-sec"><span class="pop-lbl">Upcoming passes</span>${passes}</div>
    ${polar ? `<div class="pop-sec">${polar}</div>` : ''}`;
}
// Re-plot a specific pass chosen from the popup.
async function pickPass(norad, rise, set) {
  const pass = (PASSES[norad] || []).find(p => p.rise === rise && p.set === set);
  if (pass) { await plotSat(norad, pass); renderRoster();
    const sat = ROSTER.find(s => s.norad == norad), el = document.getElementById('sat-popup');
    if (_popupSat && sat && el && !el.hidden) el.querySelector('.pop-body').innerHTML = popupHTML(sat); }
}

function skyPlotSVG(track, color) {
  const CX = 75, CY = 75, R = 62;
  let out = `<svg class="pop-polar" viewBox="0 0 150 150">`;
  for (const el of [0, 30, 60]) out += `<circle cx="${CX}" cy="${CY}" r="${(R*(90-el)/90).toFixed(1)}" class="ring"/>`;
  out += `<text x="${CX}" y="10" class="cmp">N</text><text x="${CX}" y="147" class="cmp">S</text>` +
         `<text x="6" y="${CY+3}" class="cmp">W</text><text x="144" y="${CY+3}" class="cmp">E</text>`;
  const pt = p => { const q = satgeo.polar(p.az, p.el, CX, CY, R); return q.x.toFixed(1)+' '+q.y.toFixed(1); };
  const { past, future } = satgeo.splitAtNow(track, nowIndex(track));
  const path = (a, dash) => a.length ? `<path d="${a.map((p,i)=>(i?'L':'M')+pt(p)).join(' ')}" fill="none" stroke="${color}" stroke-width="2" ${dash}/>` : '';
  out += path(future, 'stroke-dasharray="4 3" opacity="0.5"') + path(past, '');
  const peak = track.reduce((m, p) => p.el > m.el ? p : m, track[0]);
  const dot = p => { const q = satgeo.polar(p.az, p.el, CX, CY, R);
    return `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="3" class="poi-dot" fill="${color}"/>`; };
  out += dot(track[0]) + dot(peak) + dot(track[track.length-1]);
  return out + '</svg>';
}

/* ── Header chrome: CPU/temp, clock, cursor lat/lon ─────────────────────── */
function setCoord(lngLat) {
  const la = document.getElementById('crLat'), lo = document.getElementById('crLon');
  if (!la || !lo) return;
  if (!lngLat) { la.textContent = '—'; lo.textContent = '—'; return; }
  la.textContent = lngLat.lat.toFixed(4); lo.textContent = lngLat.lng.toFixed(4);
}
// Pi CPU load + SoC temp, polled from the same endpoint the APRS map uses.
// Degrades to "—" when unavailable (e.g. the aprs service isn't running).
async function updateCpu() {
  const el = document.getElementById('crCpu');
  if (!el) return;
  try {
    const d = await (await fetch(location.origin + '/api/aprs/system', { cache: 'no-store' })).json();
    if (!d.ok || typeof d.cpu_pct !== 'number') throw 0;
    const pct = Math.round(d.cpu_pct);
    let txt = pct + '%';
    if (typeof d.cpu_temp_c === 'number') txt += ' · ' + Math.round(d.cpu_temp_c) + '°C';
    el.textContent = txt;
    el.className = pct < 60 ? 'cpu-ok' : pct < 85 ? 'cpu-warn' : 'cpu-hot';
  } catch (_) { el.textContent = '—'; el.className = ''; }
}
function startClock() {
  const tick = () => { const el = document.getElementById('clock');
    if (el) el.textContent = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
  tick(); setInterval(tick, 1000);
}

/* ── World-overview card — equirectangular whole-track SVG, toggled by ☰ ─── */
function drawGraticule(W, H) {
  let out = '';
  for (let lon = -180; lon <= 180; lon += 30) { const a = satgeo.project(90, lon, W, H), b = satgeo.project(-90, lon, W, H);
    out += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="grat"/>`; }
  for (let lat = -90; lat <= 90; lat += 30) { const a = satgeo.project(lat, -180, W, H), b = satgeo.project(lat, 180, W, H);
    out += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="grat"/>`; }
  return out;
}
// One full orbital period of ground track, centred on now, propagated client-side
// from the TLE (satellite.js). This is the WHOLE track that wraps the globe — the
// local map keeps the short workable pass slice. Cached ~20 s per satellite.
function orbitTrack(norad) {
  const s = PLOTTED[norad];
  if (!s || !s.l1 || !s.l2) return [];
  if (s._orbit && Date.now() - s._orbitAt < 20000) return s._orbit;
  const rec = satellite.twoline2satrec(s.l1, s.l2);
  const noRadMin = rec.no || rec.no_kozai || (2 * Math.PI / 100);   // mean motion, rad/min
  const periodMs = (2 * Math.PI / noRadMin) * 60000;                // one orbit
  const now = Date.now(), step = periodMs / 220, pts = [];
  for (let t = now - periodMs / 2; t <= now + periodMs / 2; t += step) {
    const date = new Date(t), pv = satellite.propagate(rec, date);
    if (!pv.position) continue;
    const gd = satellite.eciToGeodetic(pv.position, satellite.gstime(date));
    pts.push({ t: date.toISOString(), lat: satellite.degreesLat(gd.latitude), lon: satellite.degreesLong(gd.longitude) });
  }
  s._orbit = pts; s._orbitAt = now;
  return pts;
}
/* ── SDR listen — record a pass to a WAV on the Pi ───────────────────────── */
let LISTEN = { recording: false };
let _listenErrNorad = null;   // norad whose last start attempt errored (shown in its status line)

// One button per downlink of a checked sat: "mode · freq", state set live below.
function dlBtnsHTML(s) {
  return (s.downlinks || []).map(d => {
    const sup = d.supported ? 1 : 0;
    return `<button class="dlbtn" data-norad="${s.norad}" data-freq="${d.freq_mhz}" data-supported="${sup}"
      ${sup ? `onclick="onDownlinkClick(${s.norad}, ${d.freq_mhz})"` : 'disabled'}>${d.mode} · ${d.freq_mhz}</button>`;
  }).join('');
}
function _busyReason() {
  if ((LISTEN.missing_deps || []).length) return 'SDR tools not installed';
  if (!LISTEN.dongle_present) return 'no RTL-SDR dongle';
  if (!LISTEN.assigned) return 'no device assigned — set one in Setup → Hardware';
  if (LISTEN.recording) { const s = ROSTER.find(x => String(x.norad) === String(LISTEN.norad));
    return `recording ${s ? s.name : 'another satellite'}`; }
  if (LISTEN.streaming) { const s = ROSTER.find(x => String(x.norad) === String(LISTEN.norad));
    return `listening ${s ? s.name : 'a pass'}`; }
  if (LISTEN.busy) return `dongle in use by ${LISTEN.holder || 'another service'}`;
  return 'dongle busy';
}
function _dongleStatus(norad) {
  if (_listenErrNorad === norad && LISTEN && LISTEN._err) return { txt: LISTEN._err, rec: false };
  if ((LISTEN.missing_deps || []).length) return { txt: 'SDR tools not installed', rec: false };
  if (!LISTEN.dongle_present) return { txt: 'no RTL-SDR dongle', rec: false };
  if (!LISTEN.assigned) return { txt: 'device: unassigned', rec: false };
  if ((LISTEN.recording || LISTEN.streaming) && String(LISTEN.norad) === String(norad)) {
    const m = Math.floor(LISTEN.seconds / 60), s = String(LISTEN.seconds % 60).padStart(2, '0');
    const live = !!LISTEN.streaming;
    return { txt: `● ${live ? 'LIVE' : 'REC'} ${m}:${s}`, rec: !live, live };
  }
  if (LISTEN.recording || LISTEN.streaming) { const s = ROSTER.find(x => String(x.norad) === String(LISTEN.norad));
    return { txt: `busy — ${LISTEN.streaming ? 'listening' : 'recording'} ${s ? s.name : 'another'}`, rec: false }; }
  // Resting / busy-by-other: dim "device:" + white value, matching the dashboard.
  const post = LISTEN.busy ? ` — in use by ${LISTEN.holder || 'another service'}` : '';
  return { dev: LISTEN.device || 'free', post, rec: false };
}
// Set every rendered downlink button + status line from the latest LISTEN state.
function updateListenUI() {
  document.querySelectorAll('.dlbtn[data-norad]').forEach(btn => {
    const norad = +btn.dataset.norad, freq = parseFloat(btn.dataset.freq);
    const supported = btn.dataset.supported === '1';
    const dl = (ROSTER.find(s => s.norad === norad) || { downlinks: [] }).downlinks
      .find(d => Math.abs(d.freq_mhz - freq) < 1e-6);
    btn.classList.remove('free', 'armed', 'rec', 'live', 'busy', 'unsupported');
    if (!supported) { btn.classList.add('unsupported'); btn.disabled = true;
      btn.title = dl ? dl.blurb : 'not supported'; return; }
    if (_capturingFreq(norad, freq)) {                    // this one is live → pulse in capture colour
      btn.classList.add(LISTEN.streaming ? 'live' : 'rec'); btn.disabled = true;
      btn.title = LISTEN.streaming ? 'listening — Stop in the header' : 'recording — Stop in the header'; return; }
    if (_capturing()) { btn.classList.add('busy'); btn.disabled = true; btn.title = _busyReason(); return; }
    if (!_dongleFree()) { btn.classList.add('busy'); btn.disabled = true; btn.title = _busyReason(); return; }
    if (!inCaptureWindow(norad)) { btn.classList.add('busy'); btn.disabled = true;
      btn.title = 'not in range yet — armable ~5 min before the pass'; return; }
    if (_isArmed(norad, freq)) { btn.classList.add('armed'); btn.disabled = false;
      btn.title = 'armed — use Rec / Play'; }
    else { btn.classList.add('free'); btn.disabled = false;
      btn.title = `arm ${dl ? dl.mode : ''} ${freq} MHz`; }
  });
  document.querySelectorAll('.dl-status[data-norad]').forEach(el => {
    const st = _dongleStatus(+el.dataset.norad);
    if (st.dev) {                       // "device: " dim + value white (dashboard-consistent)
      el.textContent = 'device: ';
      const v = document.createElement('span'); v.className = 'dv'; v.textContent = st.dev;
      el.append(v);
      if (st.post) el.append(st.post);
    } else {
      el.textContent = st.txt;
    }
    el.classList.toggle('rec', st.rec); el.classList.toggle('live', !!st.live);
  });
  updateTransport();
}
// Capture model — a frequency button ARMS a downlink (steady highlight); the
// header transport (Rec/Play/Stop) then acts on the armed one. One dongle → one
// global transport, so Rec and Play are mutually exclusive. A frequency is
// armable from 5 min before AOS through LOS; arming a new one disarms the old.
let _armed = null;   // { norad, freq } of the selected downlink
function _capturing() { return !!(LISTEN.recording || LISTEN.streaming); }
function _capturingFreq(norad, freq) {
  return _capturing() && String(LISTEN.norad) === String(norad)
    && LISTEN.freq_hz && Math.abs(LISTEN.freq_hz / 1e6 - freq) < 1e-6;
}
function _dongleFree() {
  return LISTEN.dongle_present && LISTEN.assigned && !LISTEN.busy && !(LISTEN.missing_deps || []).length;
}
function inCaptureWindow(norad) {
  const p = nextPassOf(norad);
  if (!p) return false;
  const now = Date.now();
  return now >= new Date(p.rise).getTime() - 5 * 60000 && now <= new Date(p.set).getTime();
}
function _isArmed(norad, freq) {
  return !!_armed && String(_armed.norad) === String(norad) && Math.abs(_armed.freq - freq) < 1e-6;
}

// Live audio: one hidden <audio> plays the /listen/stream endpoint. Closing it
// (pause + drop src) ends the HTTP request, which tears the pipeline down server-side.
let _streamNorad = null, _streamFreq = null;
function _satAudio() {
  let a = document.getElementById('sat-audio');
  if (!a) {
    a = document.createElement('audio');
    a.id = 'sat-audio'; a.autoplay = true; a.style.display = 'none';
    a.addEventListener('error', () => {
      if (_streamNorad != null) { _listenErrNorad = _streamNorad; LISTEN._err = 'listen stream failed'; }
      _streamNorad = _streamFreq = null; updateListenUI();
    });
    // Stream closed by the server (EOF) → drop the client flag so nothing lingers.
    a.addEventListener('ended', () => { _streamNorad = _streamFreq = null; updateListenUI(); });
    document.body.appendChild(a);
  }
  return a;
}
function startStream(norad, freqMhz) {
  _listenErrNorad = null;
  _streamNorad = norad; _streamFreq = freqMhz;
  const a = _satAudio();
  a.src = `/api/satellites/listen/stream?norad=${norad}` + (freqMhz != null ? `&freq_mhz=${freqMhz}` : '');
  a.play().catch(() => {});   // the click IS the user gesture autoplay needs
  updateListenUI();
}
function stopStream() {
  const a = document.getElementById('sat-audio');
  if (a) { a.pause(); a.removeAttribute('src'); a.load(); }
  _streamNorad = _streamFreq = null;
  // Also force the server-side teardown: a browser disconnect often isn't noticed
  // by gunicorn, so the rtl_fm pipeline (and the streaming flag) would otherwise
  // linger and keep every downlink button greyed out.
  fetch('/api/satellites/listen/stop', { method: 'POST' }).catch(() => {});
  pollListen();
}
// Header transport buttons act on the armed frequency.
function transport(action) {
  if (action === 'stop') {
    if (LISTEN.streaming || _streamNorad != null) stopStream(); else stopListen();
    return;
  }
  if (!_armed || _capturing()) return;
  if (action === 'rec') startListen(_armed.norad, _armed.freq);       // → WAV
  else if (action === 'play') startStream(_armed.norad, _armed.freq); // → browser
}
function updateTransport() {
  const rec = document.getElementById('t-rec'), play = document.getElementById('t-play'),
        stop = document.getElementById('t-stop');
  if (!rec) return;
  const capturing = _capturing();
  const canStart = !!_armed && !capturing && _dongleFree() && inCaptureWindow(_armed.norad);
  rec.classList.toggle('active', !!LISTEN.recording);
  play.classList.toggle('active', !!LISTEN.streaming);
  stop.classList.toggle('active', capturing);
  rec.disabled = LISTEN.recording ? true : !canStart;
  play.disabled = LISTEN.streaming ? true : !canStart;
  stop.disabled = !capturing;
  const armHint = _armed ? 'not in range yet (armable ~5 min before the pass)' : 'arm a frequency first';
  rec.title = LISTEN.recording ? 'recording — press Stop' : (canStart ? 'record the armed pass to a WAV' : armHint);
  play.title = LISTEN.streaming ? 'listening — press Stop' : (canStart ? 'listen live to the armed pass' : armHint);
}
// A frequency button ARMS its downlink (toggles); the transport does the rest.
function onDownlinkClick(norad, freqMhz) {
  if (_capturing()) return;   // buttons locked while a capture runs — use Stop
  _armed = _isArmed(norad, freqMhz) ? null : { norad, freq: freqMhz };
  updateListenUI();
}
async function pollListen() {
  const err = LISTEN._err;   // preserve a just-set error across the refresh
  try { LISTEN = await (await fetch('/api/satellites/listen/status')).json(); }
  catch (e) { LISTEN = { recording: false }; }
  if (err && _listenErrNorad != null) LISTEN._err = err;
  // Reconcile the client stream flag against the server: if we think we're
  // streaming but the server is idle and the <audio> isn't actually playing, the
  // stream ended — drop it so buttons don't stay greyed. (Requires the audio to be
  // stopped too, so a just-started stream in the click→first-poll gap isn't cleared.)
  if (_streamNorad != null && !LISTEN.streaming) {
    const a = document.getElementById('sat-audio');
    if (!a || a.paused || a.ended || !a.getAttribute('src')) { _streamNorad = _streamFreq = null; }
  }
  // Reflect an in-progress capture (e.g. after a reload) as the armed frequency,
  // so the transport + card show the running pass rather than an empty selection.
  if (_capturing() && !_armed && LISTEN.norad != null && LISTEN.freq_hz) {
    _armed = { norad: LISTEN.norad, freq: LISTEN.freq_hz / 1e6 };
  }
  const el = document.getElementById('listen-status');
  if (el) {
    if (LISTEN.recording || LISTEN.streaming) {
      el.classList.add('on');
      el.classList.toggle('live', !!LISTEN.streaming);
      const sat = ROSTER.find(s => String(s.norad) === String(LISTEN.norad));
      const m = Math.floor(LISTEN.seconds / 60), s = String(LISTEN.seconds % 60).padStart(2, '0');
      document.getElementById('listen-text').textContent =
        `${LISTEN.streaming ? 'LIVE' : 'REC'} ${sat ? sat.name : LISTEN.norad} ${m}:${s}`;
    } else { el.classList.remove('on', 'live'); }
  }
  updateListenUI();
}
async function startListen(norad, freqMhz) {
  _listenErrNorad = null;
  const body = { norad };
  if (freqMhz != null) body.freq_mhz = freqMhz;
  try {
    const r = await fetch('/api/satellites/listen', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) { _listenErrNorad = norad; LISTEN._err = d.error || 'listen failed'; }
  } catch (e) { _listenErrNorad = norad; LISTEN._err = 'listen request failed'; }
  await pollListen(); updateListenUI();
}
async function stopListen() {
  try { await fetch('/api/satellites/listen/stop', { method: 'POST' }); } catch (e) { /* ignore */ }
  _listenErrNorad = null;
  await pollListen(); updateListenUI();
}

boot();
</script>
</body>
