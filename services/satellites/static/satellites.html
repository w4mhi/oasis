}
// Three states, not two: MUTED (you switched it off) and QUIET (the clock did,
// until 07:00) are different facts and must not look alike — that is the whole
// point of showing the state on the bell at all.
function renderSatMuteBell() {
  const el = document.getElementById('sat-mute');
  if (!el) return;
  const st = satAlertState();
  el.innerHTML = st.silent ? BELL_OFF : BELL_ON;
  el.classList.toggle('muted', _satMuted);
  el.classList.toggle('quiet', !_satMuted && st.quiet && !st.overridden);
  el.title = _satMuted ? 'Pass alerts MUTED on this device — tap to unmute'
    : (st.quiet && !st.overridden)
      ? 'Quiet hours (22:00–07:00) — pass alerts are silent. Tap to enable them until 07:00'
      : st.overridden ? 'Pass alerts enabled for tonight (until 07:00) — tap to mute'
                      : 'Mute pass-alert chimes on this device';
}
// The chime and the voice now live in common/js/sat-alerts.js, shared with the
// kiosk dashboard so the shack hears the same thing whichever screen is awake.
// Both wrappers honour the global (per-DEVICE) mute.
function playMorseV(reps, freq) {
  if (satAlertsSilent()) return;
  oasisSatChime(reps, freq);
}
// Spoken heads-up at T-10 (after the Vs) — says which sat is coming + how good the
// pass is. Silently no-ops if no voice is installed, so the VVV chime always
// carries the alert regardless.
function speak(text) {
  if (satAlertsSilent()) return;
  oasisSpeak(text);
}
// Bell control for a roster row (only rendered for a plotted sat).
function bellBtnHTML(norad) {
  const on = bellArmed(norad);
  // The glyph reflects whether a chime will actually sound: an armed sat shows the
  // ringing bell, but while the global mute is on even armed sats show the crossed
  // bell — kept bright via .on so it still reads as monitored (a disarmed sat shows
  // a dim/grey crossed bell).
  const glyph = (on && !_satMuted) ? BELL_ON : BELL_OFF;
  const title = on
    ? (_satMuted
        ? 'Pass alerts armed, but chimes are muted globally (header mute). Click to disarm.'
        : 'Pass alerts armed — VVV chime at T-10 + T-5 min. Click to disarm.')
    // Monitoring arms the bell, so OFF is now something the operator chose: say
    // so, rather than describing it as a switch they still have to find.
    : 'Alerts OFF for this bird — monitored, but it will not wake the shack. Click to re-arm.';
  return `<button class="sat-bell${on ? ' on' : ''}" onclick="toggleBell(${norad})" title="${title}">${glyph}</button>`;
}
// Ridden by updatePills every 2 s. The threshold logic is the shared, tested
// oasisSatAlertsDue (common/js/sat-alerts.js) — identical to the kiosk's, so the
// two screens can never drift into alerting at different times.
function _runPassAlerts() {
  const birds = [];
  for (const norad in PLOTTED) {
    if (!bellArmed(norad)) continue;
    const p = nextPassOf(+norad);
    const sat = ROSTER.find(s => s.norad === +norad);
    if (p && sat) birds.push({ norad: +norad, name: sat.name, rise: p.rise, max_el: p.max_el });
  }
  const due = oasisSatAlertsDue(birds, Date.now(), _alertState);
  // T-11: have the station synthesise the sentence a minute early, so the voice
  // follows the chime instead of the ~3.6 s Piper takes on a cache miss — and
  // the elevation in the wording makes nearly every pass a miss. Skipped while
  // muted: nothing will say it, so warming it would burn CPU for silence.
  if (!_satMuted) due.prewarm.forEach(b => oasisSpeakWarm(oasisSatSpeech(b)));
  if (due.fire) playMorseV(3, due.freq);   // VVV — T-10 (620 Hz), then T-5 (780 Hz)
  // T-10 only: once the Vs finish, speak which sat is coming + the pass quality.
  if (due.announce.length) setTimeout(() => {
    due.announce.forEach(b => speak(oasisSatSpeech(b)));
  }, OASIS_SAT_CHIME_3_MS);   // let the chime finish first, don't talk over it
}

function updatePills() {
  ROSTER.forEach(s => {
    const look = lookAt(s);
    const elev = look ? look.el : null;
    const up = elev != null && elev >= 0;
    const pc = pillColor(elev), lvl = meterLevel(elev);
    const meter = document.querySelector(`.sat-meter[data-norad="${s.norad}"]`);
    if (meter) {
      meter.title = pc.title;
      [...meter.children].forEach((seg, i) => {
        const on = i < lvl;
        seg.style.background = on ? BAR_COLORS[i] : 'var(--border)';
        seg.style.boxShadow = (on && i === lvl - 1) ? `0 0 6px ${BAR_COLORS[i]}` : 'none';   // glow the peak bar
      });
    }
    // Sampled for EVERY bird, up or not, so the arrow is already right on the
    // first tick a bird clears the horizon instead of blank for two seconds.
    const arrow = trendArrow(elevTrend(s.norad, elev));
    const et = document.querySelector(`.sat-elev[data-norad="${s.norad}"]`);
    if (et) {
      // Range only for monitored birds: it is working detail for a pass you
      // have committed to, and the All view would otherwise put a second number
      // on every row that happens to be overhead.
      const mon = s.norad in _satSelected;
      // Arrow AFTER the value: it qualifies the number it follows, and reading
      // "42° rising" beats "rising 42°". Conditional space so a bird with no
      // trend yet does not leave "42°  · 1 240 km" with a hole in it.
      et.textContent = !up ? '' : `${elev.toFixed(0)}°${arrow ? ' ' + arrow : ''}`
        + (mon ? ' · ' + fmtKm(look.rangeKm) : '');
      et.title = !up ? '' : `${arrow === '↘' ? 'Setting' : arrow === '↗' ? 'Rising' : 'Elevation'} `
        + `${elev.toFixed(1)}°${mon ? ' · slant range ' + fmtKm(look.rangeKm) : ''}`;
    }
    const p = nextPassOf(s.norad);
    const ph = document.querySelector(`.pass-hint[data-norad="${s.norad}"]`);
    if (ph) ph.innerHTML = passHint(p, s.norad);
    // The window is on the tick too, not just the render: outside the 1 h views
    // renderRoster does not run, so a card whose pass rolled over would keep
    // showing the one that already ended.
    const pw = document.querySelector(`.passwin[data-norad="${s.norad}"]`);
    if (pw) pw.textContent = passWindow(p);
  });
  _runPassAlerts();
  updateCoverage();
  // On the tick, not just the render: outside the 1 h views renderRoster does
  // not run, and a frequency readout that only moved when the list happened to
  // rebuild would be worse than none.
  updateDoppler();
}

// Coverage wash: tint the local map green while a PLOTTED satellite is above the
// horizon (you're inside its footprint). Opacity + badge scale with elevation —
// faint at the horizon, strong near the zenith.
function updateCoverage() {
  // Every plotted satellite currently above the horizon (in LOS), brightest
  // (highest elevation) first — each gets its own pill in its own track colour.
  const inLOS = [];
  let maxElev = -1;
  for (const norad in PLOTTED) {
    const s = ROSTER.find(x => x.norad === +norad);
    if (!s) continue;
    // Only during a pass we actually TOLD the operator about. This used to fire
    // on live elevation alone, so a bird making a transit the server never
    // called a pass — /passes discards any culminating below min_elev — lit the
    // pill and the map wash with no card, no 1 h entry and nothing to click.
    // METEOR M2-3 at 5 degrees was the reproduction: pill up, roster empty, and
    // no way to tell which one was lying. The footprint drawing has always
    // gated on this window; the pill simply never did, so the two disagreed on
    // the same screen at the same instant.
    // The per-row chip is deliberately NOT gated: "this bird is at 5 degrees
    // right now" is a true, locally-scoped statement about one row. The pill is
    // the global claim "you have coverage", and that is the one that misled.
    if (!inFootprintWindow(norad)) continue;
    const look = lookAt(s);
    const e = look ? look.el : null;
    if (e != null && e >= 0) {
      inLOS.push({ name: s.name, elev: e, rangeKm: look.rangeKm,
                   arrow: trendArrow(elevTrend(s.norad, e)), color: PLOTTED[norad].color });
      if (e > maxElev) maxElev = e;
    }
  }
  inLOS.sort((a, b) => b.elev - a.elev);
  const wash = document.getElementById('coverage-wash');
  if (wash) wash.style.opacity = maxElev >= 0 ? Math.min(0.16 + maxElev / 90 * 0.5, 0.62).toFixed(2) : '0';
  const badge = document.getElementById('coverage-badge');
  if (badge) {
    badge.classList.toggle('on', inLOS.length > 0);
    badge.replaceChildren(...inLOS.map(s => {
      const pill = document.createElement('span');
      pill.className = 'cov-pill';
      pill.style.color = s.color;                       // border + text in the sat's colour
      // Same readout as the roster chip, so the two agree on sight.
      pill.textContent = `${s.name} ${s.elev.toFixed(0)}°${s.arrow ? ' ' + s.arrow : ''}`
        + ` · ${fmtKm(s.rangeKm)}`;
      pill.title = `${s.name} — ${s.arrow === '↘' ? 'setting' : s.arrow === '↗' ? 'rising' : 'elevation'} `
        + `${s.elev.toFixed(1)}° · slant range ${fmtKm(s.rangeKm)}`;
      return pill;
    }));
  }
}

/* ── Plot / unplot a satellite's next pass ─────────────────────────────── */
// Monitoring a bird ARMS its pass alert, and un-monitoring disarms it. Deciding
// to watch a satellite is deciding you want to be told it is coming; making that
// a second, separate switch meant the pass arrived in silence with nothing on
// screen to explain it — and on the kiosk, which shows the row bell but cannot
// arm it, with no way to put it right on the screen you were looking at.
// The row bell survives as the EXCEPTION: monitor the weather birds for the map
// and coverage, then disarm the ones you don't want waking the shack tonight.
async function onToggle(norad, checked) {
  if (checked) {
    if (!(norad in _satSelected)) { _satSelected[norad] = capabilityColor(norad); saveSelection(); }
    if (!_satBells[norad]) { _satBells[norad] = true; saveBells(); }
    await plotSat(norad, nextPassOf(norad));
  } else {
    if (norad in _satSelected) { delete _satSelected[norad]; saveSelection(); }
    // Cleared, not left behind: an orphan bell on an unmonitored bird is inert
    // (both alert paths walk the monitored set), so it would sit there unseen
    // and then fire months later when the bird was re-selected — a ghost with no
    // visible cause.
    if (_satBells[norad]) { delete _satBells[norad]; saveBells(); }
    unplotSat(norad);
  }
  // Two writes, not one: `selected` and `bell` are separate operator fields and
  // the kiosk reads both. Fired together so the roster never sits in a state
  // where a bird is monitored but unarmed — which is the state this removes.
  postSelect(norad, checked);          // persist to the shared server roster (kiosk reads it)
  postBells({ [norad]: checked });
  renderRoster();
}

// Red "Clear" button — reset the whole watch list in one go: uncheck every
// monitored bird AND disarm every pass-alert bell. Tells the server for each pick
// (so the kiosk clears too), then drops the local selection, the plotted overlays
// (tracks/footprints/markers), the bells and any scheduled chimes. Confirms first,
// since it discards the operator's whole selection.
function clearAll() {
  const sel = Object.keys(_satSelected), bells = Object.keys(_satBells);
  if (!sel.length && !bells.length) return;                 // nothing to clear
  if (!confirm(`Clear all — uncheck ${sel.length} monitored bird(s) and disarm ${bells.length} alert(s)?`)) return;
  postSelections(Object.fromEntries(sel.map(n => [n, false])));   // one write, kiosk too
  postBells(Object.fromEntries(bells.map(n => [n, false])));      // one write, kiosk too
  _satSelected = {}; saveSelection();
  Object.keys(PLOTTED).forEach(n => delete PLOTTED[n]);     // drop tracks/footprints/markers
  _satBells = {}; saveBells();
  for (const k in _alertState) delete _alertState[k];       // cancel any scheduled chimes
  redraw();
  setView('all');   // show the full list again — a Monitored/1h view would now look empty
}

async function plotSat(norad, pass) {
  if (!pass) return;
  // Colour comes from the persisted selection (assigned in onToggle); fall back
  // for any direct caller so behaviour is unchanged when a sat isn't selected.
  const color = _satSelected[norad] || (PLOTTED[norad] ? PLOTTED[norad].color : capabilityColor(norad));
  const j = await (await fetch(
    `/api/satellites/track?sat=${norad}&from=${encodeURIComponent(pass.rise)}&to=${encodeURIComponent(pass.set)}`)).json();
  PLOTTED[norad] = { color, pass, track: j.track || [], l1: j.l1, l2: j.l2 };
  redraw();
  updateVisibility();
}

// Only removes the drawn/live copy; the selection + its colour are owned by
// onToggle (which frees the colour), so a re-plot of a still-selected sat keeps it.
function unplotSat(norad) {
  delete PLOTTED[norad];
  redraw();
}


/* ── Map — lightweight SVG world map (no MapLibre/WebGL/tiles) ─────────────── */
// A static base layer (dark countries + graticule + station house) rendered once,
// plus a dynamic overlay (footprint + ground tracks + live markers) redrawn each
// tick. The whole-globe equirectangular view is what pass tracks want, and it
// costs a fraction of MapLibre's memory on the Pi.
let COUNTRIES = null;
async function loadCountries() {
  if (COUNTRIES) return COUNTRIES;
  try { COUNTRIES = (await (await fetch('/server/satellites/world-countries.json')).json()).polys || []; }
  catch (e) { COUNTRIES = []; }
  return COUNTRIES;
}
function initSatMap() {
  const svg = document.getElementById('world-svg');
  if (!svg || svg._wired) return;
  svg._wired = true;
  // Cursor lat/lon readout (row 2) — inverse of the equirectangular projection.
  svg.addEventListener('mousemove', e => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const q = pt.matrixTransform(svg.getScreenCTM().inverse());
    if (q.x < 0 || q.x > 720 || q.y < 0 || q.y > 360) { setCoord(null); return; }
    setCoord({ lat: 90 - q.y / 360 * 180, lng: q.x / 720 * 360 - 180 });
  });
  svg.addEventListener('mouseleave', () => setCoord(null));
  // Click a satellite marker/track → popup; click empty space → close it.
  svg.addEventListener('click', e => {
    const m = e.target.closest('[data-norad]');
    if (m) satClick(+m.dataset.norad, e); else hideSatPopup();
  });
  measureMapScale();
  addEventListener('resize', () => { measureMapScale(); redraw(); });
  loadCountries().then(() => { renderBase(); redraw(); });
  setInterval(liveTick, 1000);
  // Quiet hours start and end while the page is open. Re-render the bell on
  // the minute so it stops claiming alerts are live at 22:00, and says they
  // are again at 07:00, without waiting for a reload.
  setInterval(renderSatMuteBell, 30000);
}
// CSS pixels per SVG user unit. Everything inside the viewBox scales with the
// map, which is right for the ground tracks and the glyph and WRONG for text: an
// 8-unit label rendered at 21 px on a 1080p panel and 28 px on a 4K one, sized
// like body copy beside a 29 px icon. Tracks dodge this with
// vector-effect="non-scaling-stroke"; there is no such thing for text, so the
// size is divided by the scale instead.
//
// MEASURED, not derived from the window: preserveAspectRatio="xMidYMid meet"
// letterboxes, so the smaller of the two axis fits wins and the other has slack.
// Cached rather than read per frame — getBoundingClientRect forces layout, and
// this redraws at 1 Hz on a Pi 3.
const LABEL_PX = 11, LABEL_HALO_PX = 2.5;
let _mapScale = 1;
function measureMapScale() {
  const svg = document.getElementById('world-svg');
  if (!svg) return;
  const r = svg.getBoundingClientRect();
  if (r.width > 0 && r.height > 0) _mapScale = Math.min(r.width / 720, r.height / 360);
}

// Static base — dark country fills + graticule + the station house. Rendered once.
function renderBase() {
  const g = document.getElementById('wg-base');
  if (!g) return;
  const W = 720, H = 360;
  let out = drawCountries(W, H) + drawGraticule(W, H);
  if (STATION && STATION.lat != null && STATION.lon != null) {
    const st = satgeo.project(STATION.lat, STATION.lon, W, H);
    // Bottom-anchored: the house base sits on the station coordinate, so the
    // scaled group is translated to the point and the path runs upward from y≈0.
    const d = 'M-8.5 -1.2 L-8.5 -11.5 L0 -19.5 L8.5 -11.5 L8.5 -1.2 Z';
    out += `<g class="home-mark" transform="translate(${st.x.toFixed(1)} ${st.y.toFixed(1)}) scale(0.3)">`
         + `<path class="halo" d="${d}"/><path class="roof" d="${d}"/></g>`;
  }
  g.innerHTML = out;
}
function drawCountries(W, H) {
  if (!COUNTRIES || !COUNTRIES.length) return '';
  return COUNTRIES.map(ring => satgeo.splitAntimeridian(ring.map(c => ({ lon: c[0], lat: c[1] }))).map(seg => {
    if (seg.length < 2) return '';
    const d = seg.map((p, i) => { const q = satgeo.project(p.lat, p.lon, W, H); return (i ? 'L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1); }).join(' ') + ' Z';
    return `<path d="${d}" class="land"/>`;
  }).join('')).join('');
}

// Satellite marker glyph — single path in a 122.88 viewBox (PD, by IonutNeagu),
// plus two arcs of our own (below).

// Overlay — footprint + whole-orbit ground track (past-solid / future-dashed) +
// clickable live marker for every plotted sat. Redrawn on plot/unplot + each tick.
//
// TWO layers, not one. Footprints and tracks accumulate in `out`, markers and
// labels in `tops`, and tops is appended last. Emitting each sat's marker inline
// meant the NEXT sat's ground track painted straight over it — with a dozen
// whole orbits on screen (the "All · 1h" view) a bird could sit buried under
// somebody else's line with nothing to click.
function redraw() {
  const g = document.getElementById('wg-over');
  if (!g) return;
  const W = 720, H = 360;
  const fs = LABEL_PX / _mapScale;   // user units that render at LABEL_PX pixels
  let out = '', tops = '';
  for (const norad in PLOTTED) {
    const s = PLOTTED[norad];
    const armed = !!_armed && String(_armed.norad) === String(norad);
    const track = orbitTrack(norad);   // WHOLE orbit — the world view
    if (track.length < 2) continue;
    const pos = (s.l1 && s.l2) ? livePos(s.l1, s.l2) : null;
    // Footprint (under the track) only during the pass window (15 min pre-AOS → LOS).
    if (pos && pos.altKm > 0 && inFootprintWindow(norad)) {
      for (const d of satgeo.footprintPaths(pos.lat, pos.lon, satgeo.footprintRadiusDeg(pos.altKm), W, H))
        out += `<path d="${d}" fill="${s.color}" fill-opacity="0.12" stroke="${s.color}" stroke-opacity="0.45" stroke-width="1"/>`;
    }
    const { past, future } = satgeo.splitAtNow(track, nowIndex(track));
    const draw = (pts, dash) => { for (const seg of satgeo.splitAntimeridian(pts)) { if (seg.length < 2) continue;
      const d = seg.map((p, i) => { const q = satgeo.project(p.lat, p.lon, W, H); return (i ? 'L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1); }).join(' ');
      // non-scaling-stroke → constant pixel width regardless of the SVG's scale-up.
      out += `<path d="${d}" class="sat-track" data-norad="${norad}" fill="none" stroke="${s.color}" stroke-width="${dash ? 1 : 1.5}" vector-effect="non-scaling-stroke"${dash ? ' stroke-dasharray="3 2.5" opacity="0.5"' : ''}/>`; } };
    draw(past, false); draw(future, true);
    // Live marker: an inline-SVG satellite glyph — NOT the satellite emoji, which renders
    // blank inside SVG <text> on Pi Chromium (and needs the colour-emoji font). Icon
    // is a single path (PD, by IonutNeagu) tinted by the sat's capability colour and
    // scaled from its 122.88 box, centred on the sub-point. Clicks still resolve via
    // data-norad on the group (svg 'click' uses closest('[data-norad]')).
    if (pos) { const q = satgeo.project(pos.lat, pos.lon, W, H);
      const x = q.x.toFixed(1), y = q.y.toFixed(1);
      // The armed bird is marked by SIZE and by always carrying its name — not
      // by anything drawn around it. Nothing here animates, either: this
      // overlay's innerHTML is replaced every second by liveTick, so a CSS
      // animation would restart each tick and never complete, and an infinite
      // one is the renderer-pinning trap that cost us a kiosk once already.
      tops += `<g class="sat-glyph" data-norad="${norad}" fill="${s.color}" `
        + `transform="translate(${x} ${y}) scale(${armed ? 0.115 : 0.09}) translate(-61.44 -61.44)">`
        + `<path d="${SAT_ICON_PATH}"/></g>`;
      // Name label — the thing that makes the map answer "where is SO-50"
      // rather than only "what is this one". Always for the armed bird;
      // otherwise on the 1 h LABEL window, which opens well before the
      // footprint's 15 min. Knowing which bird is which is useful while you are
      // still deciding what to work; the footprint is a statement about
      // workability and stays late on purpose.
      if (armed || inLabelWindow(norad)) {
        const sat = ROSTER.find(r => String(r.norad) === String(norad));
        const nm = bareSatName(sat ? sat.name : norad);
        // The gap clears the glyph, so it tracks the glyph's size: the armed
        // one spans 14.1 user units against 11.1, and the bare gap would leave
        // its name almost touching it.
        const a = satgeo.labelAnchor(q.x, q.y, nm.length, W, H,
                                     { fontSize: fs, gap: armed ? 11 : 9 });
        tops += `<text class="sat-label" data-norad="${norad}" x="${a.x.toFixed(1)}" `
          + `y="${a.y.toFixed(1)}" text-anchor="${a.anchor}" font-size="${fs.toFixed(2)}" `
          + `stroke-width="${(LABEL_HALO_PX / _mapScale).toFixed(2)}" `
          + `fill="${s.color}">${xmlEsc(nm)}</text>`;
      }
    }
  }
  g.innerHTML = out + tops;
}

// First track index at/after now (0 = all future/dashed, last = all past/solid).
function nowIndex(track) {
  if (!track.length) return 0;
  const now = Date.now();
  if (now <= new Date(track[0].t).getTime()) return 0;
  if (now >= new Date(track[track.length - 1].t).getTime()) return track.length - 1;
  return Math.max(0, track.findIndex(p => new Date(p.t).getTime() >= now));
}
function livePos(l1, l2) {
  try {
    const now = new Date(), pv = satellite.propagate(satellite.twoline2satrec(l1, l2), now);
    if (!pv.position) return null;
    const gd = satellite.eciToGeodetic(pv.position, satellite.gstime(now));
    return { lat: satellite.degreesLat(gd.latitude), lon: satellite.degreesLong(gd.longitude),
             altKm: gd.height };   // gd.height is km — drives the footprint radius
  } catch (e) { return null; }
}
function liveTick() { if (Object.keys(PLOTTED).length) redraw(); }

// The world map shows the whole globe — a track is never "out of view", so the
// roster's zoom-out hint never fires.
function updateVisibility() { for (const norad in PLOTTED) PLOTTED[norad].outOfView = false; }

/* ── Popup: click a satellite's track/marker on the map ────────────────── */
let _popupSat = null;
function satClick(norad, e) {
  const sat = ROSTER.find(s => s.norad == norad);
  if (!sat) return;
  _popupSat = sat;
  const el = document.getElementById('sat-popup');
  el.querySelector('.pop-body').innerHTML = popupHTML(sat);
  el.hidden = false;
  const pw = el.offsetWidth || 280, ph = el.offsetHeight || 220;
  const x = (e ? e.clientX : innerWidth / 2) + 12, y = (e ? e.clientY : 100);
  el.style.left = Math.max(8, Math.min(x, innerWidth - pw - 8)) + 'px';
  el.style.top  = Math.max(8, Math.min(y, innerHeight - ph - 8)) + 'px';
}
function hideSatPopup() { const el = document.getElementById('sat-popup'); if (el) el.hidden = true; _popupSat = null; }
// The frequency block. This reads the SAME grouped entries as the roster
// dropdown (sat.downlinks is already grouped server-side) — the old flat
// "mode freq" join here predated grouping and printed 9 ISS rows where the card
// showed 7, which is precisely the duplicate-crowding the grouping removed.
// Type / FDN / FUP. No "Frequencies" heading — three labelled columns of
// megahertz need no announcing.
//
// One row per grouped entry, so the row count matches the dropdown exactly.
//
// The card itself now lives in common/js/sat-detail.js, shared with the kiosk
// sheet — one bird must not read differently on the wall and in your hand.
// This supplies only what is page-specific: the horizon, the plotted pass, the
// already-rendered sky plot (the polar projection is page-local, so the module
// takes a fragment rather than reaching for satgeo), and the click target.
function popupHTML(sat) {
  const plotted = PLOTTED[sat.norad];
  return satDetailHTML(sat, {
    passes: PASSES[sat.norad] || [],
    horizon: horizonOf(),
    minElev: minElevOf(),
    track: plotted ? plotted.track : null,
    activeRise: plotted ? plotted.pass.rise : null,
    fmtTime: fmt,
    compass: azCompass,
    onPassClick: 'pickPass',
    plotHTML: (plotted && plotted.track.length) ? skyPlotSVG(plotted.track, plotted.color) : '',
  });
}
// Re-plot a specific pass chosen from the popup.
async function pickPass(norad, rise, set) {
  const pass = (PASSES[norad] || []).find(p => p.rise === rise && p.set === set);
  if (pass) { await plotSat(norad, pass); renderRoster();
    const sat = ROSTER.find(s => s.norad == norad), el = document.getElementById('sat-popup');
    if (_popupSat && sat && el && !el.hidden) el.querySelector('.pop-body').innerHTML = popupHTML(sat); }
}

// The mask and the floor it falls back to. STATION arrives from /api/satellites
// (meta.station); both are absent on a box whose operator has never drawn a
// horizon, which is the common case, not an error.
function horizonOf() { return (STATION && STATION.horizon) || {}; }
function minElevOf() { return (STATION && STATION.min_elev != null) ? STATION.min_elev : 10; }


function skyPlotSVG(track, color) {
  const CX = 75, CY = 75, R = 62;
  let out = `<svg class="pop-polar" viewBox="0 0 150 150">`;
  for (const el of [0, 30, 60]) out += `<circle cx="${CX}" cy="${CY}" r="${(R*(90-el)/90).toFixed(1)}" class="ring"/>`;
  // The mask, as a filled annulus between the outer edge and the skyline: the
  // track visibly dips behind the treeline instead of the operator reading a
  // number and imagining it. evenodd so the sky INSIDE the skyline stays clear
  // and only the blocked rim is shaded. The path itself is built in horizon.js —
  // the editor draws the same rim and it must not be written twice.
  const rim = OasisHorizon.rimPath(horizonOf(), minElevOf(), satgeo.polar, CX, CY, R);
  if (rim) out += `<path class="horizon-rim" fill-rule="evenodd" d="${rim}"/>`;
  out += `<text x="${CX}" y="10" class="cmp">N</text><text x="${CX}" y="147" class="cmp">S</text>` +
         `<text x="6" y="${CY+3}" class="cmp">W</text><text x="144" y="${CY+3}" class="cmp">E</text>`;
  const pt = p => { const q = satgeo.polar(p.az, p.el, CX, CY, R); return q.x.toFixed(1)+' '+q.y.toFixed(1); };
  const { past, future } = satgeo.splitAtNow(track, nowIndex(track));
  const path = (a, dash) => a.length ? `<path d="${a.map((p,i)=>(i?'L':'M')+pt(p)).join(' ')}" fill="none" stroke="${color}" stroke-width="2" ${dash}/>` : '';
  out += path(future, 'stroke-dasharray="4 3" opacity="0.5"') + path(past, '');
  const peak = track.reduce((m, p) => p.el > m.el ? p : m, track[0]);
  const dot = p => { const q = satgeo.polar(p.az, p.el, CX, CY, R);
    return `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="3" class="poi-dot" fill="${color}"/>`; };
  out += dot(track[0]) + dot(peak) + dot(track[track.length-1]);
  return out + '</svg>';
}

// ── Horizon editor ───────────────────────────────────────────────────────────
// The horizon belongs to the STATION, not to any satellite, which is why this is
// a page-level overlay and not a control inside a satellite's popup. The popup's
// sky plot DISPLAYS the mask; only this edits it.
let _hzDraft = {};
// Shared with wireHorizonEditor below: closing the overlay must disarm a drag
// that never got a matching pointerup (e.g. the pointer left the browser
// window entirely), or every mousemove over the rest of the page afterward
// would keep rewriting sectors that are no longer even on screen.
let _hzDragging = false;

function openHorizonEditor() {
  _hzDraft = Object.assign({}, (STATION && STATION.horizon) || {});
  document.getElementById('he-msg').textContent = '';
  document.getElementById('horizon-editor').classList.add('open');
  drawHorizonEditor();
}
function closeHorizonEditor() {
  document.getElementById('horizon-editor').classList.remove('open');
  _hzDragging = false;
}

function drawHorizonEditor() {
  const CX = 75, CY = 75, R = 62;
  const minEl = minElevOf();
  let out = '';
  for (const el of [0, 30, 60]) {
    out += `<circle cx="${CX}" cy="${CY}" r="${(R * (90 - el) / 90).toFixed(1)}" class="ring"/>`;
  }
  out += `<text x="${CX}" y="10" class="cmp">N</text><text x="${CX}" y="147" class="cmp">S</text>` +
         `<text x="6" y="${CY + 3}" class="cmp">W</text><text x="144" y="${CY + 3}" class="cmp">E</text>`;
  // The rim as it stands, so the shape being edited is the shape that will ship —
  // the same rimPath the satellite popup draws, not a second copy of it.
  const rim = OasisHorizon.rimPath(_hzDraft, minEl, satgeo.polar, CX, CY, R);
  if (rim) out += `<path class="horizon-rim" fill-rule="evenodd" d="${rim}"/>`;
  OasisHorizon.SECTORS.forEach((s, i) => {
    const v = _hzDraft[s.name] != null ? _hzDraft[s.name] : minEl;
    const p = satgeo.polar(s.az, v, CX, CY, R);
    out += `<circle class="he-handle" data-i="${i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4"/>`;
  });
  document.getElementById('he-plot').innerHTML = out;
}

// One pointer handler for the whole plot: pick the nearest sector to where the
// pointer is and set its elevation from the radius. Dragging across sectors
// shapes a treeline in one gesture, which is the whole reason this is not a form.
(function wireHorizonEditor() {
  const svg = () => document.getElementById('he-plot');
  function apply(ev) {
    const el = svg(), r = el.getBoundingClientRect();
    // Back out of the 150-unit viewBox to the rendered box.
    const x = (ev.clientX - r.left) / r.width * 150 - 75;
    const y = (ev.clientY - r.top) / r.height * 150 - 75;
    const dist = Math.hypot(x, y);
    const az = ((Math.atan2(x, -y) * 180 / Math.PI) + 360) % 360;
    // polar() maps elevation 90 to the centre and 0 to radius R=62.
    let elev = 90 - Math.min(dist, 62) / 62 * 90;
    elev = Math.max(0, Math.min(89, Math.round(elev)));
    const i = Math.round(az / OasisHorizon.STEP) % OasisHorizon.SECTORS.length;
    _hzDraft[OasisHorizon.SECTORS[i].name] = elev;
    drawHorizonEditor();
  }
  document.addEventListener('pointerdown', e => {
    if (!svg() || !svg().contains(e.target)) return;
    _hzDragging = true; apply(e);
  });
  document.addEventListener('pointermove', e => { if (_hzDragging) apply(e); });
  // No target check on pointerup/pointercancel: a drag that starts on the plot
  // and is released anywhere else on the page (or cancelled, e.g. the pointer
  // left the window) must still terminate cleanly, not just one that ends back
  // over the SVG.
  document.addEventListener('pointerup', () => { _hzDragging = false; });
  document.addEventListener('pointercancel', () => { _hzDragging = false; });
})();

async function saveHorizon() {
  const msg = document.getElementById('he-msg');
  msg.textContent = 'Saving…';
  try {
    const r = await fetch('/api/satellites/horizon', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-OASIS-Request': '1' },
      body: JSON.stringify({ horizon: _hzDraft })
    });
    const j = await r.json();
    if (!r.ok || !j.ok) { msg.textContent = j.error || 'Could not save.'; return; }
    // Adopt it locally so every open plot redraws without a reload. STATION can
    // still be null here (the initial GET /api/satellites failed but the topbar
    // Horizon button stayed clickable) — a save that just succeeded on the
    // server must never be reported as failed because of that.
    if (STATION) STATION.horizon = j.horizon;
    closeHorizonEditor();
    if (_popupSat) satClick(_popupSat.norad, null);
  } catch (e) {
    msg.textContent = 'Could not save: ' + e;
  }
}

/* ── Header chrome: CPU/temp, clock, cursor lat/lon ─────────────────────── */
function setCoord(lngLat) {
  const la = document.getElementById('crLat'), lo = document.getElementById('crLon');
  if (!la || !lo) return;
  if (!lngLat) { la.textContent = '—'; lo.textContent = '—'; return; }
  la.textContent = lngLat.lat.toFixed(4); lo.textContent = lngLat.lng.toFixed(4);
}
// Pi CPU load + SoC temp, polled from the same endpoint the APRS map uses.
// Degrades to "—" when unavailable (e.g. the aprs service isn't running).
async function updateCpu() {
  const el = document.getElementById('crCpu');
  if (!el) return;
  try {
    const d = await (await fetch(location.origin + '/api/aprs/system', { cache: 'no-store' })).json();
    if (!d.ok || typeof d.cpu_pct !== 'number') throw 0;
    const pct = Math.round(d.cpu_pct);
    let txt = pct + '%';
    if (typeof d.cpu_temp_c === 'number') txt += ' · ' + Math.round(d.cpu_temp_c) + '°C';
    el.textContent = txt;
    el.className = pct < 60 ? 'cpu-ok' : pct < 85 ? 'cpu-warn' : 'cpu-hot';
  } catch (_) { el.textContent = '—'; el.className = ''; }
}
function startClock() {
  const tick = () => { const el = document.getElementById('clock');
    if (el) el.textContent = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
  tick(); setInterval(tick, 1000);
}

/* ── World-overview card — equirectangular whole-track SVG, toggled by ☰ ─── */
function drawGraticule(W, H) {
  let out = '';
  for (let lon = -180; lon <= 180; lon += 30) { const a = satgeo.project(90, lon, W, H), b = satgeo.project(-90, lon, W, H);
    out += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="grat"/>`; }
  for (let lat = -90; lat <= 90; lat += 30) { const a = satgeo.project(lat, -180, W, H), b = satgeo.project(lat, 180, W, H);
    out += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="grat"/>`; }
  return out;
}
// One full orbital period of ground track, centred on now, propagated client-side
// from the TLE (satellite.js). This is the WHOLE track that wraps the globe — the
// local map keeps the short workable pass slice. Cached ~20 s per satellite.
function orbitTrack(norad) {
  const s = PLOTTED[norad];
  if (!s || !s.l1 || !s.l2) return [];
  if (s._orbit && Date.now() - s._orbitAt < 20000) return s._orbit;
  const rec = satellite.twoline2satrec(s.l1, s.l2);
  const noRadMin = rec.no || rec.no_kozai || (2 * Math.PI / 100);   // mean motion, rad/min

  }
  // Reflect an in-progress capture (e.g. after a reload) as the armed frequency,
  // so the transport + card show the running pass rather than an empty selection.
  if (_capturing() && !_armed && LISTEN.norad != null && LISTEN.freq_hz) {
    const freq = LISTEN.freq_hz / 1e6;
    // The mode has to be recovered from the ROSTER, not from LISTEN.mode — that
    // field is the capture KIND ("record" / "stream"), and sending it as a
    // downlink mode would be rejected as not-on-this-frequency. Only adopt one
    // when the frequency names exactly one channel; where two share it, no mode
    // is honest, and the server falls back to its historical first-match.
    const sat = ROSTER.find(s => String(s.norad) === String(LISTEN.norad));
    const at = ((sat || {}).downlinks || []).filter(d => Math.abs(d.freq_mhz - freq) < 1e-6);
    _armed = { norad: LISTEN.norad, freq, mode: at.length === 1 ? at[0].mode : null };
  }
  const el = document.getElementById('listen-status');
  if (el) {
    if (LISTEN.recording || LISTEN.streaming) {
      el.classList.add('on');
      el.classList.toggle('live', !!LISTEN.streaming);
      const sat = ROSTER.find(s => String(s.norad) === String(LISTEN.norad));
      const m = Math.floor(LISTEN.seconds / 60), s = String(LISTEN.seconds % 60).padStart(2, '0');
      document.getElementById('listen-text').textContent =
        `${LISTEN.streaming ? 'LIVE' : 'REC'} ${sat ? sat.name : LISTEN.norad} ${m}:${s}`;
    } else { el.classList.remove('on', 'live'); }
  }
  updateListenUI();
}
async function startListen(norad, freqMhz, mode) {
  _listenErrNorad = null;
  const body = { norad };
  if (freqMhz != null) body.freq_mhz = freqMhz;
  // Name the MODE too. A frequency alone is ambiguous where two channels share
  // it with different demodulators, and the server would otherwise take the
  // first — capturing FM when you asked for CW.
  if (mode) body.mode = mode;
  try {
    const r = await fetch('/api/satellites/listen', { method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-OASIS-Request': '1' },
      body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) { _listenErrNorad = norad; LISTEN._err = d.error || 'listen failed'; }
  } catch (e) { _listenErrNorad = norad; LISTEN._err = 'listen request failed'; }
  await pollListen(); updateListenUI();
}
async function stopListen() {
  try { await fetch('/api/satellites/listen/stop', { method: 'POST',
    headers: { 'X-OASIS-Request': '1' } }); } catch (e) { /* ignore */ }
  _listenErrNorad = null;
  await pollListen(); updateListenUI();
}

boot();
</script>
