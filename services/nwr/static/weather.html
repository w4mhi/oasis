<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OASIS - Weather Radio</title>
<link rel="stylesheet" href="/css/common.css">
<style>
body { margin: 0; }
#bar { position: sticky; top: 0; z-index: 10; background: var(--panel);
       border-bottom: 1px solid var(--border);
       display: flex; align-items: center; gap: .7rem; padding: 0 .9rem; height: 44px; }
#bar h1 { font-size: var(--fs-base); letter-spacing: .08em; color: var(--accent);
          text-transform: uppercase; margin: 0; white-space: nowrap; }
.wrap { padding: .9rem; display: grid; gap: .9rem;
        grid-template-columns: minmax(280px, 380px) 1fr; align-items: start; }
@media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--border);
        border-radius: 8px; padding: .8rem; }
.card h2 { margin: 0 0 .6rem; font-size: var(--fs-small); letter-spacing: .06em;
           text-transform: uppercase; color: var(--text-dim); }
.row { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
.row label { min-width: 5.5rem; color: var(--text-dim); font-size: var(--fs-small); }
select { font: inherit; }
select[disabled] { opacity: .45; cursor: not-allowed; }
.note { font-size: var(--fs-small); color: var(--text-dim); margin: 0 0 .6rem; }
#state { font-size: var(--fs-small); color: var(--text-dim); }
#state.live { color: var(--accent); }
#state.warn { color: var(--amber); }
#state.down { color: var(--red); }
table { width: 100%; border-collapse: collapse; font-size: var(--fs-small); }
th { text-align: left; color: var(--text-dim); font-weight: 600;
     border-bottom: 1px solid var(--border); padding: .35rem .4rem; }
td { padding: .35rem .4rem; border-bottom: 1px solid var(--border);
     vertical-align: top; }
tr.matched td { background: rgba(255, 176, 0, .07); }
tr.info td { color: var(--text-dim); }
code.raw { font-size: var(--fs-micro); color: var(--text-dim); word-break: break-all; }
.warn { color: var(--red); font-size: var(--fs-small); }
/* The retune line is ordinary progress, not an alarm: an operator-initiated
   channel change sitting in the same red as "no audio encoder" reads far
   louder than it is. Dim, and never given the .warn class. */
#pin { font-size: var(--fs-small); color: var(--text-dim); }
</style>
</head>
<body>
<div id="bar">
  <h1>Weather Radio</h1>
  <span id="state">checking...</span>
  <span style="flex:1"></span>
  <a href="/index.html">Dashboard</a>
</div>

<div class="wrap">
  <div>
    <div class="card">
      <h2>The watch</h2>
      <p class="note">The watch runs on its own, from boot, in the oasis-nwr
        service. Start it, stop it or give it a dongle in Setup. This page
        reads it and listens in.</p>
      <div class="row">
        <label for="chan">Channel</label>
        <select id="chan"></select>
      </div>
      <div class="row"><span id="pin"></span></div>
      <div class="row"><span id="msg"></span></div>
      <div class="row"><span id="err"></span></div>
      <div class="row"><span id="pre"></span></div>
      <audio id="audio" controls preload="none" style="width:100%;display:none"></audio>
    </div>
  </div>

  <div class="card">
    <h2>Decoded alerts</h2>
    <table>
      <thead><tr><th>Received</th><th>Event</th><th>Areas</th>
                 <th>Expires</th><th>Station</th></tr></thead>
      <tbody id="log"><tr><td colspan="5">Nothing decoded yet.</td></tr></tbody>
    </table>
  </div>
</div>

<script src="/common/js/nwr-card.js"></script>
<script>
'use strict';

// THIS PAGE STARTS NOTHING. The watch is the oasis-nwr daemon -- its own
// systemd unit on 127.0.0.1:8089 -- and service ops owns starting and stopping
// it. v1's Listen, Stop and Scan buttons are gone, and their routes with them:
// a capture spawned from here would spawn a second rtl_fm against the dongle
// the daemon already holds and die at usb_claim_interface, and
// preconditions.busy cannot warn about it, because sdr_rx.dongle_busy()
// excludes the caller's OWN service and oasis-nwr IS nwr's unit -- so busy
// reads false for this page against its own watch. What is left here is a
// reader: pin a channel, listen in on the daemon's audio, read the decode log.

// Every response body is consumed here, on every path. An unread body pins a
// 2 MiB /dev/shm data pipe per request, which cost ~500 MB/h on a live station.
async function api(url, opts) {
  try {
    const r = await fetch(url, Object.assign({ cache: 'no-store' }, opts || {}));
    const text = await r.text();
    let data = null;
    try { data = JSON.parse(text); } catch (_) { data = null; }
    return { ok: r.ok, status: r.status, data: data };
  } catch (_) {
    // A dropped connection or offline tab throws INSIDE fetch() itself,
    // before there is a Response to read -- report it the same way as any
    // other failed request instead of an uncaught rejection that would kill
    // whichever poll() pass was in flight.
    return { ok: false, status: 0, data: null };
  }
}

function post(url, body) {
  return api(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-OASIS-Request': '1' },
    body: JSON.stringify(body || {})
  });
}

const $ = function (id) { return document.getElementById(id); };
const STREAM_URL = '/api/nwr/listen/stream';
// Named because two handlers share it: one writes it, the other clears it and
// must be able to tell it apart from the other message #msg carries.
const STREAM_ERR = 'the audio stream would not open - see the status line above';
let CHANNELS = [];
let polling = false;   // re-entrancy guard for poll() — see Finding 7

function fmtTime(epoch) {
  if (!epoch) { return '-'; }
  const d = new Date(epoch * 1000);
  return d.toISOString().replace('T', ' ').slice(0, 16) + 'Z';
}

function areaText(a) {
  const name = a.state ? (a.name + ', ' + a.state) : a.name;
  if (a.lat !== null && a.lat !== undefined) { return name; }
  if (a.why === 'statewide') { return name + ' (statewide - no pin)'; }
  return name + ' (no coordinates - not plotted)';
}

function chanLabel(hz) {
  const hit = CHANNELS.filter(function (c) { return Number(c.hz) === Number(hz); })[0];
  return hit ? hit.label : ((Number(hz) / 1e6).toFixed(3) + ' MHz');
}

// The <select> value as a /api/nwr/config patch. 'auto' clears the pin and the
// daemon's next channel choice sweeps the band again (choose_channel); any
// other value pins that channel and skips the sweep entirely.
function pinPatch(value) {
  const hz = parseInt(value, 10);
  return { pinned_channel: (value === 'auto' || isNaN(hz)) ? null : hz };
}

// A pin now takes effect at once: POST /api/nwr/config asks the daemon to
// re-read its configuration (routes.py api_nwr_config_set -> daemon
// request_retune), and the supervisor interrupts a healthy capture for it. So
// there is no "stored but not in effect" state left to disclose. What IS worth
// saying is the gap in between -- the seconds where the old capture has stopped
// and the new one has not started -- because that is the page looking dead
// right after a click.
//
// watch.retune_pending is what marks that gap, from the accepted request until
// the capture it asked for is RUNNING. It therefore stays true while a start
// keeps failing, so the words come from `phase`, which reads `retrying` there:
// a pin that cannot be tuned must say it is stuck, not "changing channel"
// forever.
function retuneNote(d) {
  const w = (d && d.watch) || {};
  const cfg = (d && d.config) || {};
  if (!w.reachable || !w.retune_pending) { return ''; }
  const target = cfg.pinned_channel ? chanLabel(cfg.pinned_channel)
                                    : 'the strongest channel';
  if (w.phase === 'retrying') {
    return 'still trying to tune ' + target + ' - the watch will keep retrying';
  }
  return 'changing to ' + target;
}

// The status line: is the watch running, on what channel, and since when.
//
// The state vocabulary is nwrCardState()'s, from common/js/nwr-card.js -- the
// same module both dashboards' Weather Radio cards use. Reimplementing the
// state ladder here is exactly the drift that module was created to end, so
// this only adds what a card has no room for: the time the capture started.
function watchLine(d, nowMs) {
  const w = (d && d.watch) || {};
  const cs = nwrCardState(d, null);
  const parts = [cs.badge];
  if (cs.sub) { parts.push(cs.sub); }
  if (w.listening && w.elapsed_s) {
    parts.push('since ' + fmtTime(Math.round(nowMs / 1000) - w.elapsed_s));
  }
  return { text: parts.join(' - '),
           cls: cs.state === 'up' ? 'live' : (cs.state === 'warn' ? 'warn' : 'down') };
}

// Attaching a src opens NO connection: the element carries preload="none", so
// the browser waits for the operator to press play. An armed element can
// therefore sit here indefinitely without costing the daemon a subscriber, an
// ffmpeg, or one of its three stream slots.
function armStream(el, nowMs) {
  el.setAttribute('src', STREAM_URL + '?t=' + nowMs);
}

// Pausing an <audio> does NOT close its TCP connection: the daemon keeps the
// subscriber and its ffmpeg encoder alive on the other end, and it allows
// MAX_STREAMS = 3 at a time -- so three pauses exhaust the budget and every
// later play answers 503. Orphaned encoders of exactly that shape were found
// running on a live station. Tearing the element down is what actually drops
// the connection, and removeAttribute alone does not do it: the media load
// algorithm runs when src is SET or CHANGED, not when it is removed, so the
// explicit load() below is the line that ends the stream.
function detachStream(el) {
  el.removeAttribute('src');
  el.load();
}

// Play with nothing attached: arm and start. Only reachable if a failed load
// left the element bare, since handlePause re-arms -- but a play button that
// visibly does nothing is worse than the four lines that prevent it.
function handlePlay(el, nowMs) {
  if (el.getAttribute('src')) { return false; }
  armStream(el, nowMs);
  const p = el.play();
  if (p && typeof p.catch === 'function') { p.catch(function () {}); }
  return true;
}

// Pause tears the stream down, then re-arms with a FRESH cache-busting URL so
// the next play opens a new stream rather than resuming a dead one.
function handlePause(el, nowMs) {
  // A 'pause' event that fires while el.paused is false is not the operator:
  // it is the media load algorithm's own pause, queued when armStream()
  // attached a src and already superseded by the play() that followed it.
  // Tearing down there would undo the attach that is still in flight.
  if (el.paused === false) { return false; }
  detachStream(el);
  armStream(el, nowMs);
  return true;
}

function setMsg(text) {
  // #msg is the page's OWN slot -- a refused channel pin, a stream that would
  // not open -- and poll() never writes to it. #err below belongs to the
  // daemon. Two messages, two elements, so neither can erase the other.
  const el = $('msg');
  el.textContent = text || '';
  el.className = text ? 'warn' : '';
}

function renderStatus(d, nowMs) {
  const w = d.watch || {}, pre = d.preconditions || {}, cfg = d.config || {};

  // First, because CHANNELS is what chanLabel() -- and so retuneNote() below --
  // turns a frequency into a channel name with.
  const sel = $('chan');
  if (!CHANNELS.length && (d.channels || []).length) {
    CHANNELS = d.channels;
    const auto = document.createElement('option');
    auto.value = 'auto';
    auto.textContent = 'Auto - the watch picks the strongest';
    sel.appendChild(auto);
    CHANNELS.forEach(function (c) {
      const o = document.createElement('option');
      o.value = String(c.hz);
      o.textContent = c.label + '  ' + (c.hz / 1e6).toFixed(3) + ' MHz';
      sel.appendChild(o);
    });
  }
  // The pin is server state, so every poll re-reads it -- except while the
  // operator has the dropdown open, where rewriting the value would close it
  // under their hand.
  if (sel !== document.activeElement) {
    sel.value = cfg.pinned_channel ? String(cfg.pinned_channel) : 'auto';
  }

  const line = watchLine(d, nowMs);
  const st = $('state');
  st.textContent = line.text;
  st.className = line.cls;

  // Only what the status line does not already say. Missing deps, an
  // unassigned or absent dongle and a busy one are all nwrCardState() states
  // and appear above; repeating them here would just say everything twice.
  //
  // The environment, and only the environment: these describe how the station
  // is built and are red because they need a person with a keyboard. A retune
  // in progress is neither -- it has its own element below, in its own colour.
  const notes = [];
  if (!pre.can_stream) { notes.push('no audio encoder - decode only, no listening in'); }
  if (!pre.can_scan) { notes.push('rtl_power missing - the watch cannot sweep the band'); }
  const pre_el = $('pre');
  pre_el.textContent = notes.join(' | ');
  pre_el.className = notes.length ? 'warn' : '';

  // Server state, so it is re-derived from every poll rather than latched by
  // the click: a retune that finishes, or one the operator started from another
  // browser, both land here on their own.
  $('pin').textContent = retuneNote(d);

  // watch.last_error is a different kind of message from the notes above:
  // those describe the current environment (no encoder, no rtl_power), while
  // last_error is the daemon's own record of why the LAST attempt failed. They
  // used to share #pre, and a poll where every precondition read green wiped a
  // correctly diagnosed start failure off the screen within milliseconds,
  // because the conflict engine does not model a bare rtl_433 holding the
  // dongle, so `notes` came back empty and clobbered it. Giving the error its
  // own element means neither message can erase the other.
  //
  // No client-side staleness flag is needed: supervise() overwrites last_error
  // with the result of every start attempt in the same locked update that sets
  // the phase (services/nwr/common/daemon.py), so a successful start clears it
  // to null and watch.last_error already IS current truth whenever this status
  // arrives -- inventing a second "is this stale" signal here would just
  // duplicate state the daemon already tracks.
  const err_el = $('err');
  err_el.textContent = w.last_error || '';
  err_el.className = w.last_error ? 'warn' : '';

  const au = $('audio');
  if (w.listening) {
    au.style.display = 'block';
    if (!au.getAttribute('src')) { armStream(au, nowMs); }
  } else {
    au.style.display = 'none';
    // A watch that has stopped leaves nothing to hear, and an element left
    // attached behind display:none is the orphaned-encoder shape again.
    if (au.getAttribute('src')) { detachStream(au); }
  }
}

// The status line when there is no status: Flask itself unreachable or 500ing.
//
// Not renderStatus({ok:false}): that would also rewrite the dropdown to Auto
// and report a pin the operator never cleared. Nothing here is known to have
// changed except our ability to ask, so the only thing that moves is the line
// that makes the claim.
//
// The audio element is deliberately left alone. /api/nwr/status and the stream
// are separate requests, a 500 on the first says nothing about the second, and
// tearing the stream down would cut audio off in the operator's ear on a
// transient failure. A stream that really has died raises 'error' on the
// element, which has its own handler.
//
// The vocabulary is nwrCardState()'s -- with `null`, which is exactly its
// "status unavailable" state and until now unreachable from this page.
function renderUnavailable() {
  const cs = nwrCardState(null, null);
  const st = $('state');
  st.textContent = cs.badge + ' - ' + cs.sub;
  st.className = 'down';
}

function renderAlerts(d) {
  const body = $('log');
  body.textContent = '';
  if (!d.alerts.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 5;
    td.textContent = 'Nothing decoded yet.';
    tr.appendChild(td);
    body.appendChild(tr);
    return;
  }
  const active = new Set(d.active);
  d.alerts.forEach(function (a) {
    const tr = document.createElement('tr');
    tr.className = a.type === null ? 'info' : (a.matched ? 'matched' : '');
    const cells = [
      fmtTime(a.received),
      a.event_name + ' (' + a.event + ')' + (a.clock_suspect ? ' [clock suspect]' : ''),
      a.areas.map(areaText).join('; '),
      (active.has(a.id) ? fmtTime(a.expires) : 'expired'),
      a.station
    ];
    cells.forEach(function (text) {
      const td = document.createElement('td');
      td.textContent = text;
      tr.appendChild(td);
    });
    body.appendChild(tr);

    const raw = document.createElement('tr');
    const rtd = document.createElement('td');
    rtd.colSpan = 5;
    const code = document.createElement('code');
    code.className = 'raw';
    code.textContent = a.raw;
    rtd.appendChild(code);
    raw.appendChild(rtd);
    body.appendChild(raw);
  });
}

async function poll() {
  // /api/nwr/status can sit behind a slow rtl_test call (Finding 6), which is
  // long enough that the 5 s setInterval tick can fire again before the
  // previous pass finished -- without this guard the two overlap forever.
  if (polling) { return; }
  polling = true;
  try {
    const s = await api('/api/nwr/status');
    // /api/nwr/status answers `ok: true` even when the watch is dead -- a
    // daemon that is down is an ANSWER there, carried in watch.reachable. So
    // !ok means the SERVER could not be asked, and skipping the render there
    // left the line reading LISTENING - WX7 - since ... for as long as Flask
    // stayed down: the page's one claim about the world, still being made
    // after the page lost the ability to check it.
    if (s.data && s.data.ok) { renderStatus(s.data, Date.now()); }
    else { renderUnavailable(); }
    const a = await api('/api/nwr/alerts?limit=50');
    if (a.data && a.data.ok) { renderAlerts(a.data); }
  } finally {
    polling = false;
  }
}

$('chan').addEventListener('change', async function () {
  const sel = $('chan');
  sel.disabled = true;
  let r;
  try {
    r = await post('/api/nwr/config', pinPatch(sel.value));
  } finally {
    // api() swallows everything today, so this cannot currently throw -- but a
    // dropdown left permanently disabled is an unrecoverable page, and that is
    // too high a price for trusting a helper three functions away to keep
    // never throwing.
    sel.disabled = false;
  }
  // Instant paint, and it stays: poll() writes the daemon's own last_error to
  // #err and never touches #msg, so a refused pin cannot be wiped by the
  // status that lands a moment later.
  //
  // `ok: false` is now only a REFUSED write -- a channel that is not one of the
  // seven. The write succeeding while the watch is down is `ok: true` with
  // retune.reachable false (routes.py: the file is saved either way, and losing
  // the operator's choice because a daemon is not running would be worse). That
  // is worth saying, because the channel they just chose is not going to start
  // being received. retune.reachable is null when there was no reason to ask,
  // so this tests for false, not for falsy.
  const rt = (r.data && r.data.retune) || {};
  setMsg((!r.data || !r.data.ok)
    ? ((r.data && r.data.error) || 'could not set the channel')
    : (rt.reachable === false
        ? 'saved - ' + (rt.detail || 'the watch is not running, so nothing retuned')
        : ''));
  poll();
});

$('audio').addEventListener('play', function () { handlePlay($('audio'), Date.now()); });
$('audio').addEventListener('pause', function () { handlePause($('audio'), Date.now()); });
$('audio').addEventListener('error', function () {
  // The relay refuses with JSON the element cannot render -- 409 while the
  // watch is down, 503 with no encoder or with all three stream slots taken --
  // and all of them surface here as a bare media error.
  setMsg(STREAM_ERR);
  detachStream($('audio'));
  armStream($('audio'), Date.now());
});
// A stream that opened on the retry disproves the warning above, and nothing
// else was clearing it: it stood until the next channel change. Only OUR
// message is cleared -- #msg is also where a refused pin lands, and audio
// starting says nothing about that.
['playing', 'canplay'].forEach(function (ev) {
  $('audio').addEventListener(ev, function () {
    if ($('msg').textContent === STREAM_ERR) { setMsg(''); }
  });
});

// The stream must not outlive the page. Closing the tab does sever the socket,
// but the Dashboard link at the top of this page is a SAME-ORIGIN navigation --
// the case Chromium keeps the frame and its media element alive for, in the
// back/forward cache. The daemon has no reaper: its handler holds the slot
// until a write to the socket raises, which needs the browser to actually
// close. A bfcached page therefore pins one of its three streams, and an
// ffmpeg with it, indefinitely.
//
// 'pagehide', never 'unload': unload disqualifies the page from the bfcache it
// is meant to survive, and is deprecated. A page that is merely HIDDEN is not
// this case and gets no teardown -- audio should keep playing in a backgrounded
// kiosk tab.
window.addEventListener('pagehide', function () {
  detachStream($('audio'));
});

poll();
setInterval(poll, 5000);
</script>
</body>
</html>
