<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icom ID-50 Reference</title>
<link rel="stylesheet" href="/static/cheatsheets/cheatsheet.css">
<style>
:root {
  --fs-title:    1.2rem;
  --fs-subtitle: 0.9rem;
  --fs-base:     0.85rem;
  --fs-label:    0.75rem;
  --fs-small:    0.7rem;
  --fs-micro:    0.65rem;
}

  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --border: #2a3441;
    --accent: #9d7bff;
    --accent-dim: #5a3fb0;
    --amber: #ffb454;
    --text: #d7e0ea;
    --text-dim: #8b97a6;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--mono);
    line-height: 1.5; padding: 1rem; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }

  .search-bar { position: sticky; top: 0; z-index: 10; margin-bottom: 0.8rem; padding-top: 0.25rem; background: var(--bg); }
  #search {
    width: 100%; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: var(--mono);
    font-size: var(--fs-subtitle); padding: 0.75rem 0.9rem; outline: none; transition: border-color 0.15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-dim); }
  .count { font-size: var(--fs-small); color: var(--text-dim); margin: 0.4rem 0.2rem 0; }

  .controls { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; }
  .ctrl-btn {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
    font-family: var(--mono); font-size: var(--fs-label); padding: 0.5rem; border-radius: 6px; cursor: pointer;
  }
  .ctrl-btn:hover { color: var(--accent); border-color: var(--accent-dim); }

  .sec { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); margin-bottom: 0.8rem; overflow: hidden; }
  .sec-head {
    padding: 0.85rem 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.6rem; user-select: none;
  }
  .sec-head:hover { background: var(--panel-2); }
  .sec-title { font-size: var(--fs-subtitle); color: var(--accent); flex: 1; font-weight: 700; letter-spacing: 0.02em; }
  .sec-tag {
    font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); border: 1px solid var(--border); border-radius: 4px; padding: 0.1rem 0.4rem;
  }
  .chev { color: var(--text-dim); font-size: var(--fs-base); transition: transform 0.2s; }
  .sec.open .chev { transform: rotate(90deg); }
  .sec-body { display: none; padding: 0.25rem 1rem 1rem; border-top: 1px solid var(--border); }
  .sec.open .sec-body { display: block; }

  .note {
    margin: 0.7rem 0 0.3rem; font-size: var(--fs-base); color: var(--amber);
    background: rgba(255,180,84,0.06); border: 1px solid rgba(255,180,84,0.22);
    border-radius: 6px; padding: 0.5rem 0.7rem;
  }
  .note.crit { color: #ff8d6b; background: rgba(255,90,60,0.07); border-color: rgba(255,90,60,0.28); }
  .note .nlabel { font-weight: 700; text-transform: uppercase; font-size: var(--fs-small); letter-spacing: 0.08em; }

  .lead { font-size: var(--fs-base); color: var(--text-dim); margin-top: 0.7rem; }

  /* step list */
  ol.steps { list-style: none; counter-reset: step; margin: 0.6rem 0 0; }
  ol.steps > li {
    counter-increment: step; position: relative; padding: 0.4rem 0 0.4rem 2.1rem;
    font-size: var(--fs-subtitle); border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  ol.steps > li:last-child { border-bottom: none; }
  ol.steps > li::before {
    content: counter(step); position: absolute; left: 0; top: 0.45rem;
    width: 1.45rem; height: 1.45rem; background: var(--panel-2);
    border: 1px solid var(--accent-dim); color: var(--accent);
    border-radius: 50%; font-size: var(--fs-small); display: flex; align-items: center; justify-content: center;
  }
  ol.steps ul.sub { list-style: none; margin: 0.35rem 0 0.1rem; padding-left: 0.2rem; }
  ol.steps ul.sub li {
    font-size: var(--fs-base); color: var(--text-dim); padding: 0.12rem 0 0.12rem 0.9rem; position: relative;
  }
  ol.steps ul.sub li::before { content: "\2192"; position: absolute; left: 0; color: var(--accent-dim); }

  /* key:value rows (quick reference & shortcuts) */
  .kv { margin-top: 0.5rem; }
  .kv-row {
    display: flex; gap: 0.6rem; align-items: baseline; padding: 0.4rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.04); font-size: var(--fs-subtitle);
  }
  .kv-row:last-child { border-bottom: none; }
  .kv-k { color: var(--text); flex: 1 1 50%; }
  .kv-v {
    flex: 1 1 50%; color: var(--accent); font-weight: 600; text-align: right;
    white-space: pre-wrap; word-break: break-word;
  }

  /* command blocks (bot style) */
  .cmd { margin-top: 0.75rem; }
  .cmd-label { font-size: var(--fs-small); text-transform: uppercase; letter-spacing: 0.1em; color: var(--amber); margin-bottom: 0.3rem; }
  .code {
    background: #0a0e13; border: 1px solid var(--border); border-radius: 6px;
    padding: 0.55rem 0.7rem; font-size: var(--fs-subtitle); color: var(--text);
    white-space: pre-wrap; word-break: break-word; position: relative;
  }
  .code .hl { color: var(--accent); font-weight: 700; }
  .copy {
    position: absolute; top: 0.4rem; right: 0.4rem; background: var(--panel-2);
    border: 1px solid var(--border); color: var(--text-dim); font-family: var(--mono);
    font-size: var(--fs-micro); padding: 0.2rem 0.45rem; border-radius: 4px; cursor: pointer;
  }
  .copy:hover { color: var(--accent); border-color: var(--accent-dim); }
  .copy.done { color: var(--accent); }
  .example { margin-top: 0.4rem; font-size: var(--fs-base); color: var(--text-dim); border-left: 2px solid var(--accent-dim); padding-left: 0.6rem; }
  .example b { color: var(--amber); font-weight: 600; }

  /* settings / menu tables */
  table.menu { width: 100%; border-collapse: collapse; margin-top: 0.6rem; font-size: var(--fs-base); }
  table.menu th {
    text-align: left; color: var(--amber); font-size: var(--fs-micro); text-transform: uppercase;
    letter-spacing: 0.08em; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border);
  }
  table.menu td { padding: 0.35rem 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: top; }
  table.menu td.m { color: var(--accent); font-weight: 700; white-space: nowrap; width: 1%; }
  table.menu tr:last-child td { border-bottom: none; }

  a { color: var(--accent); }
  .no-results { text-align: center; color: var(--text-dim); padding: 2rem; display: none; }
  footer { text-align: center; color: var(--text-dim); font-size: var(--fs-small); margin-top: 1.5rem; padding-bottom: 1rem; }
  footer .home { display: inline-block; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home-link" href="/">⌂ HOME</a>
    <h1>Icom ID-50</h1>
    <p>Quick reference, D-STAR, GPS &amp; picture TX. · Rev 20251028</p>
  </header>

  <div class="search-bar">
    <input id="search" type="text" placeholder="Search settings, steps, menus&hellip;" autocomplete="off" spellcheck="false">
    <div class="count" id="count"></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="expandAll">Expand all</button>
    <button class="ctrl-btn" id="collapseAll">Collapse all</button>
  </div>

  <div id="list"></div>
  <div class="no-results" id="noResults">Nothing matches that search.</div>

  <footer>
    <a class="home" href="index.html">&#8592; All radios</a>
    <div>Offline reference &middot; tap a section to expand</div>
  </footer>
</div>

<script>
const SECTIONS = [{"title": "Quick Reference", "tag": "shortcuts", "blocks": [{"type": "kv", "rows": [["Change Power Setting", "Long Press [LO] on DPAD*"], ["VFO Mode", "Press [V/MHZ]"], ["MR Mode", "Press [MR]"], ["Turn Tone/TQSL on", "[Quick] → TONE"], ["Set PL Tone", "[Menu] → SET → DUP/Tone → Repeater Tone"], ["Offset", "[Menu] → SET → DUP/Tone → Offset Freq"], ["Offset Direction", "[Quick] → DUP"], ["Squelch", "Press squelch under PTT and rotate top knob"], ["WX Channels", "In MR Mode, press [MR] button"], ["WX Alert", "[Quick] → Weather Alert – On/Off**"]]}, {"type": "note", "text": "*If Long Press [LO] doesn’t work, check your button setting in [MENU] → SET → Function → LO/CALL. Set to “Standard”."}, {"type": "note", "text": "**If WX Alert is ON, you’ll hear brief breaks in audio as the radio checks for incoming NOAA alerts."}]}, {"title": "Program Repeater", "tag": "procedure", "blocks": [{"type": "note", "text": "Press [V/MHz] to change MHz."}, {"type": "steps", "items": ["In VFO mode, enter RX freq", "Change offset direction if needed", "Turn on TONE if needed", "Set TONE/TSQL", "TEST SETTINGS by keying repeater", "Long Press [MW] → Write to Selected", "Set Group/Channel", "Press [MW] → YES"]}]}, {"title": "Enter Alpha Name", "tag": "procedure", "blocks": [{"type": "note", "text": "V/MHz is the delete/backspace key."}, {"type": "steps", "items": ["Go to memory in MR mode", "Long Press [MR] → Edit", "[Quick] → NAME", "Use top knob to select characters", "When done, press center button on DPAD twice", "Press [MR] → YES"]}]}, {"title": "Nearby Repeater Search", "tag": "dstar", "blocks": [{"type": "note", "text": "Must have GPS lock for this to work."}, {"type": "note", "text": "Need repeater list on SD card from dstarinfo.com. Recommend downloading your own list rather than relying on the built-in list."}, {"type": "steps", "items": ["Choose A/B Band", "Long Press [DR] on bottom of DPAD", "Press middle button on DPAD → Near Repeater → ALL/DV/FM"]}]}, {"title": "Connecting to a Laptop for GPS", "tag": "gps", "blocks": [{"type": "menu", "cols": ["Menu Path", "Value"], "rows": [["SET → Function → Set Serialport Function", "DV Data"], ["SET → Function → USB Connect", "Serial Port"], ["GPS → GPS Set → GPS Select", "ON"], ["GPS → GPS Set → GPS Option → SBAS", "ON"], ["GPS → GPS Set → GPS Option → GLONASS", "ON"], ["GPS → GPS Set → GPS Option → Power Save", "Auto"], ["GPS → GPS Set → GPS Option → Satellite Info", "ALL (Top Option)"], ["GPS → GPS Set → GPS Out", "ON"], ["GPS → GPS TX Mode → NMEA → GPS Sentence", "Check GGA Only"]]}]}, {"title": "Send Picture", "tag": "dstar", "blocks": [{"type": "note", "text": "Need the ST-ID50A app on your phone. Only tested on Android."}, {"type": "steps", "items": ["Take/Select image in app", "Send image to radio", "Set Frequency", "Set Mode to DV", "Menu → Picture"]}, {"type": "lead", "text": "To change which image is transmitted:"}, {"type": "steps", "items": ["Highlight TX", "Press center button on DPAD", "[Quick] → TX Picture Set → TX Picture", "Up/Down DPAD to select image", "Center DPAD button to select", "V/MHZ twice to get back to main screen", "[Quick] → TX ALL → OK"]}, {"type": "note", "text": "Can use V/MHZ to cancel sending."}]}];

const list = document.getElementById('list');
const search = document.getElementById('search');
const count = document.getElementById('count');
const noResults = document.getElementById('noResults');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// allow <hl> inline marker for highlighting commands/keys
function fmt(s){ return esc(s).replace(/\[\[hl\]\]/g,'<span class="hl">').replace(/\[\[\/hl\]\]/g,'</span>'); }

function renderBlock(b) {
  let h = '';
  if (b.type === 'lead') {
    h += `<div class="lead">${fmt(b.text)}</div>`;
  } else if (b.type === 'kv') {
    h += `<div class="kv">`;
    b.rows.forEach(r => { h += `<div class="kv-row"><span class="kv-k">${fmt(r[0])}</span><span class="kv-v">${fmt(r[1])}</span></div>`; });
    h += `</div>`;
  } else if (b.type === 'steps') {
    h += `<ol class="steps">`;
    b.items.forEach(it => {
      if (typeof it === 'string') { h += `<li>${fmt(it)}</li>`; }
      else {
        h += `<li>${fmt(it.t)}`;
        if (it.sub) { h += `<ul class="sub">`; it.sub.forEach(s => h += `<li>${fmt(s)}</li>`); h += `</ul>`; }
        h += `</li>`;
      }
    });
    h += `</ol>`;
  } else if (b.type === 'menu') {
    h += `<table class="menu"><thead><tr><th>${esc(b.cols[0])}</th><th>${esc(b.cols[1])}</th></tr></thead><tbody>`;
    b.rows.forEach(r => { h += `<tr><td class="m">${fmt(r[0])}</td><td>${fmt(r[1])}</td></tr>`; });
    h += `</tbody></table>`;
  } else if (b.type === 'cmd') {
    if (b.usecase) h += `<div class="lead">${fmt(b.usecase)}</div>`;
    if (b.to) h += `<div class="cmd"><div class="cmd-label">To</div><div class="code"><span class="hl">${esc(b.to)}</span><button class="copy" data-copy="${esc(b.to)}">copy</button></div></div>`;
    if (b.body) h += `<div class="cmd"><div class="cmd-label">Body / Command</div><div class="code">${fmt(b.body)}<button class="copy" data-copy="${esc(b.copy != null ? b.copy : b.body.replace(/\[\[\/?hl\]\]/g,''))}">copy</button></div></div>`;
    if (b.example) h += `<div class="example"><b>Example:</b> ${esc(b.example)}</div>`;
  } else if (b.type === 'note') {
    h += `<div class="note ${b.crit ? 'crit' : ''}"><span class="nlabel">${b.crit ? 'Critical: ' : 'Note: '}</span>${fmt(b.text)}</div>`;
  }
  return h;
}

function render() {
  list.innerHTML = '';
  SECTIONS.forEach(sec => {
    const el = document.createElement('div');
    el.className = 'sec';
    let bodyHtml = '';
    let searchText = sec.title + ' ' + (sec.tag || '');
    sec.blocks.forEach(b => {
      bodyHtml += renderBlock(b);
      searchText += ' ' + JSON.stringify(b);
    });
    el.dataset.search = searchText.toLowerCase().replace(/\[\[\/?hl\]\]/g,'');
    el.innerHTML = `
      <div class="sec-head">
        <span class="sec-title">${esc(sec.title)}</span>
        ${sec.tag ? `<span class="sec-tag">${esc(sec.tag)}</span>` : ''}
        <span class="chev">&#9656;</span>
      </div>
      <div class="sec-body">${bodyHtml}</div>`;
    el.querySelector('.sec-head').addEventListener('click', () => el.classList.toggle('open'));
    list.appendChild(el);
  });
  list.querySelectorAll('.copy').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const txt = btn.dataset.copy;
      const done = () => { btn.textContent='copied'; btn.classList.add('done'); setTimeout(()=>{btn.textContent='copy';btn.classList.remove('done');},1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
      else fallbackCopy(txt, done);
    });
  });
}
function fallbackCopy(txt, cb){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');cb();}catch(e){} document.body.removeChild(ta);
}
function filter(){
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  list.querySelectorAll('.sec').forEach(el => {
    const match = !q || el.dataset.search.includes(q);
    el.style.display = match ? '' : 'none';
    if (match){ shown++; if (q) el.classList.add('open'); }
  });
  noResults.style.display = shown===0 ? 'block' : 'none';
  count.textContent = q ? shown+' of '+SECTIONS.length+' sections' : SECTIONS.length+' sections';
}
document.getElementById('expandAll').addEventListener('click', ()=> list.querySelectorAll('.sec').forEach(el=>el.classList.add('open')));
document.getElementById('collapseAll').addEventListener('click', ()=> list.querySelectorAll('.sec').forEach(el=>el.classList.remove('open')));
search.addEventListener('input', filter);
render(); filter();
</script>
</body>
</html>
