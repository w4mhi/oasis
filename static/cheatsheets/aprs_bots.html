<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APRS Bots Reference</title>
<link rel="stylesheet" href="/static/cheatsheets/cheatsheet.css">
<style>
:root {
  --fs-title:    1.2rem;
  --fs-subtitle: 0.9rem;
  --fs-base:     0.85rem;
  --fs-label:    0.75rem;
  --fs-small:    0.7rem;
  --fs-micro:    0.65rem;
}

  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --border: #2a3441;
    --accent: #00d98b;
    --accent-dim: #0a7a52;
    --amber: #ffb454;
    --text: #d7e0ea;
    --text-dim: #8b97a6;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    line-height: 1.5;
    padding: 1rem;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 820px; margin: 0 auto; }

  .search-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    margin-bottom: 1rem;
    padding-top: 0.25rem;
    background: var(--bg);
  }
  #search {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: var(--fs-subtitle);
    padding: 0.75rem 0.9rem;
    outline: none;
    transition: border-color 0.15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-dim); }

  .count {
    font-size: var(--fs-small);
    color: var(--text-dim);
    margin: 0.4rem 0.2rem 0;
  }

  .bot {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    margin-bottom: 0.8rem;
    overflow: hidden;
  }
  .bot-head {
    padding: 0.85rem 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    user-select: none;
  }
  .bot-head:hover { background: var(--panel-2); }
  .tocall {
    font-size: var(--fs-subtitle);
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--accent);
    background: rgba(0,217,139,0.08);
    border: 1px solid var(--accent-dim);
    border-radius: 5px;
    padding: 0.15rem 0.5rem;
    white-space: nowrap;
  }
  .name { font-size: var(--fs-subtitle); color: var(--text); flex: 1; }
  .chev { color: var(--text-dim); font-size: var(--fs-base); transition: transform 0.2s; }
  .bot.open .chev { transform: rotate(90deg); }

  .bot-body {
    display: none;
    padding: 0 1rem 1rem;
    border-top: 1px solid var(--border);
  }
  .bot.open .bot-body { display: block; }

  .field { margin-top: 0.85rem; }
  .label {
    font-size: var(--fs-small);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--amber);
    margin-bottom: 0.3rem;
  }
  .usecase { color: var(--text-dim); font-size: var(--fs-base); }

  .code {
    background: #0a0e13;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.55rem 0.7rem;
    font-size: var(--fs-subtitle);
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
  }
  .to-val { color: var(--accent); font-weight: 700; }

  .copy {
    position: absolute;
    top: 0.4rem; right: 0.4rem;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: var(--fs-micro);
    padding: 0.2rem 0.45rem;
    border-radius: 4px;
    cursor: pointer;
  }
  .copy:hover { color: var(--accent); border-color: var(--accent-dim); }
  .copy.done { color: var(--accent); }

  .example {
    margin-top: 0.4rem;
    font-size: var(--fs-base);
    color: var(--text-dim);
    border-left: 2px solid var(--accent-dim);
    padding-left: 0.6rem;
  }
  .example b { color: var(--amber); font-weight: 600; }

  .note {
    margin-top: 0.5rem;
    font-size: var(--fs-base);
    color: var(--amber);
    background: rgba(255,180,84,0.06);
    border: 1px solid rgba(255,180,84,0.2);
    border-radius: 6px;
    padding: 0.5rem 0.7rem;
  }

  a { color: var(--accent); }

  .no-results {
    text-align: center;
    color: var(--text-dim);
    padding: 2rem;
    display: none;
  }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: var(--fs-small);
    margin-top: 1.5rem;
    padding-bottom: 1rem;
  }

  .controls {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.8rem;
  }
  .ctrl-btn {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: var(--fs-label);
    padding: 0.5rem;
    border-radius: 6px;
    cursor: pointer;
  }
  .ctrl-btn:hover { color: var(--accent); border-color: var(--accent-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="home-bar">
      <button class="theme-toggle" id="theme-toggle" type="button" onclick="toggleTheme()"
              title="Toggle light / dark theme" aria-label="Toggle light / dark theme"><span id="theme-glyph">&#9728;</span></button>
      <a class="home-link" href="/">⌂ HOME</a>
    </div>
    <h1>APRS Bots</h1>
    <p>Field reference &mdash; send a message To the callsign shown, with the listed Body.</p>
  </header>

  <div class="search-bar">
    <input id="search" type="text" placeholder="Search bots, commands, use cases&hellip;" autocomplete="off" spellcheck="false">
    <div class="count" id="count"></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="expandAll">Expand all</button>
    <button class="ctrl-btn" id="collapseAll">Collapse all</button>
  </div>

  <div id="list"></div>
  <div class="no-results" id="noResults">No bots match that search.</div>

  <footer><a class="home" href="index.html" style="display:inline-block;margin-bottom:0.5rem;color:var(--accent)">&#8592; All radios</a><div>Offline reference &middot; tap a bot to expand</div></footer>
</div>

<script>
const BOTS = [
  {
    to: "FIND",
    name: "Find an operator",
    usecase: "Tells you when an operator was last heard. Use it to check if an operator is currently on APRS and within range of a digi/igate before trying to message them.",
    body: "<Call Sign + SSID>"
  },
  {
    to: "SMS",
    name: "Text a cell phone",
    usecase: "Send and receive SMS text messages to/from cell phones. The phone number must first be opted in through aprs.wiki.",
    body: "@<Phone Number> <message>",
    links: [["Opt-in website", "https://aprs.wiki/"], ["How-to video", "https://youtu.be/IgwY6I4FlgI"]]
  },
  {
    to: "APSPOT",
    name: "Spot a POTA activation",
    usecase: "Spot your Parks On The Air activation using APRS.",
    body: "!POTA <PARK#> <FREQ> <MODE> <Comment>",
    example: "!POTA US-1234 7.256 SSB QRP Activation",
    links: [["Demo video", "https://youtu.be/ONyNH0n45AQ"]]
  },
  {
    to: "WHO-IS",
    name: "Look up an operator",
    usecase: "Returns the operator's name, license class, and state.",
    body: "<Call Sign>"
  },
  {
    to: "WXBOT",
    name: "Weather forecast",
    usecase: "Get weather for your current location (from your last position report), or specify a location. Pick one keyword for the body.",
    body: "Today | Tonight | Tomorrow | <Zip Code>"
  },
  {
    to: "REPEAT",
    name: "Local repeater info",
    usecase: "Get local repeater info. N1 returns the closest repeater; N2 returns the closest two, and so on.",
    body: "N1"
  },
  {
    to: "EMAIL",
    name: "Send an email",
    usecase: "Send email to any email address.",
    body: "<email address> <message>",
    example: "n0call@arrl.net This is my email message sent from APRS"
  },
  {
    to: "WLNK-1",
    name: "Winlink over APRS",
    usecase: "Send and receive Winlink messages over APRS. Cumbersome but it works.",
    body: "Use the command list below. Start by sending any characters to LOGIN.",
    links: [["Walkthrough video", "https://youtu.be/Uq09DOSM1yE"]],
    commands: [
      ["LOGIN", "Send any characters to start. The CMS replies with a 3-digit challenge \u2014 each digit is a position of a character within your password (see RESP)."],
      ["RESP", "Six-character response to the challenge. Send the three password characters matching the challenge positions, plus three characters of your choosing, in any order. Ex: password AbC123, challenge 425 \u2192 send 1b2Qz5 (1=4th, b=2nd, 2=5th char)."],
      ["LOGOFF", "Login expires after ~2 hours. Log out manually anytime with B or BYE."],
      ["H or ?", "Help"],
      ["L", "List messages"],
      ["R#", "Read message number #"],
      ["Y#", "Reply to message number #"],
      ["SP <email> <subject>", "Start a message. Next line(s) = body. End the message with /EX on its own."],
      ["K#", "Kill (delete) message number #"],
      ["G#", "Show the # closest Winlink gateways to your location."]
    ]
  },
  {
    to: "ISS",
    name: "Next ISS pass",
    usecase: "Get the next International Space Station pass based on your location.",
    body: "Next"
  },
  {
    to: "ANSRVR",
    name: "Group messaging",
    usecase: "Group messaging. APRS Thursday uses this for check-ins.",
    body: "See command list below.",
    commands: [
      ["J <GROUP>", "Create or join a group"],
      ["CQ <GROUP> <message>", "Send a message to the group"],
      ["U <GROUP>", "Leave the group"],
      ["LIST", "Returns which groups you belong to"]
    ],
    note: "Group subscriptions expire in 24 hours. For APRS Thursday, check in with: CQ HOTG <Your Message>"
  }
];

const list = document.getElementById('list');
const search = document.getElementById('search');
const count = document.getElementById('count');
const noResults = document.getElementById('noResults');

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render() {
  list.innerHTML = '';
  BOTS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'bot';
    el.dataset.search = (b.to + ' ' + b.name + ' ' + b.usecase + ' ' + b.body +
      (b.commands ? ' ' + b.commands.map(c=>c[0]+' '+c[1]).join(' ') : '') +
      (b.note || '')).toLowerCase();

    let html = `
      <div class="bot-head">
        <span class="tocall">${esc(b.to)}</span>
        <span class="name">${esc(b.name)}</span>
        <span class="chev">&#9656;</span>
      </div>
      <div class="bot-body">
        <div class="field">
          <div class="label">Use case</div>
          <div class="usecase">${esc(b.usecase)}</div>
        </div>
        <div class="field">
          <div class="label">To</div>
          <div class="code"><span class="to-val">${esc(b.to)}</span><button class="copy" data-copy="${esc(b.to)}">copy</button></div>
        </div>`;

    if (b.body) {
      html += `
        <div class="field">
          <div class="label">Body</div>
          <div class="code">${esc(b.body)}<button class="copy" data-copy="${esc(b.body)}">copy</button></div>
        </div>`;
    }

    if (b.example) {
      html += `<div class="example"><b>Example:</b> ${esc(b.example)}</div>`;
    }

    if (b.commands) {
      html += `<div class="field"><div class="label">Commands</div>`;
      b.commands.forEach(c => {
        html += `<div class="code" style="margin-bottom:0.4rem"><span class="to-val">${esc(c[0])}</span> &mdash; ${esc(c[1])}</div>`;
      });
      html += `</div>`;
    }

    if (b.links) {
      html += `<div class="field"><div class="label">Links</div><div class="usecase">`;
      html += b.links.map(l => `<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join(' &middot; ');
      html += `</div></div>`;
    }

    if (b.note) {
      html += `<div class="note">${esc(b.note)}</div>`;
    }

    html += `</div>`;
    el.innerHTML = html;

    el.querySelector('.bot-head').addEventListener('click', () => el.classList.toggle('open'));
    list.appendChild(el);
  });

  list.querySelectorAll('.copy').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const txt = btn.dataset.copy;
      const done = () => { btn.textContent = 'copied'; btn.classList.add('done'); setTimeout(()=>{btn.textContent='copy';btn.classList.remove('done');},1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
      } else { fallbackCopy(txt, done); }
    });
  });
}

function fallbackCopy(txt, cb) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e){}
  document.body.removeChild(ta);
}

function filter() {
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  list.querySelectorAll('.bot').forEach(el => {
    const match = !q || el.dataset.search.includes(q);
    el.style.display = match ? '' : 'none';
    if (match) { shown++; if (q) el.classList.add('open'); }
  });
  noResults.style.display = shown === 0 ? 'block' : 'none';
  count.textContent = q ? shown + ' of ' + BOTS.length + ' bots' : BOTS.length + ' bots';
}

document.getElementById('expandAll').addEventListener('click', () =>
  list.querySelectorAll('.bot').forEach(el => el.classList.add('open')));
document.getElementById('collapseAll').addEventListener('click', () =>
  list.querySelectorAll('.bot').forEach(el => el.classList.remove('open')));

search.addEventListener('input', filter);
render();
filter();
</script>
</body>
</html>
