<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Dashboard</title>
<link rel="stylesheet" href="../css/common.css">
<style>
#lastUpdate{font-size:var(--fs-small);color:var(--text-dim);}
#refreshBtn{background:transparent;border:1px solid var(--border);color:var(--text-dim);
  font-family:var(--mono);font-size:var(--fs-small);padding:3px 10px;border-radius:4px;cursor:pointer;}
#refreshBtn:hover{color:var(--accent);border-color:var(--accent-dim);}

/* Services strip */
.svc-strip{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.9rem;}
.svc-card{display:flex;align-items:center;gap:.5rem;flex:1;min-width:140px;
  background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:.38rem .7rem;transition:border-color .3s;}
.svc-card.up{border-color:var(--accent-dim);}
.svc-card.down{border-color:#7a1010;}
.svc-card.warn{border-color:var(--amber-dim);}
.svc-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);flex-shrink:0;transition:background .3s;}
.svc-dot.up{background:var(--accent);}
.svc-dot.down{background:var(--red);}
.svc-dot.warn{background:var(--amber);}
.svc-name{font-size:var(--fs-small);font-weight:700;color:var(--text);}
.svc-sub{font-size:var(--fs-micro);color:var(--text-dim);}
.svc-badge{margin-left:auto;font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);}
.svc-badge.up{color:var(--accent);}
.svc-badge.down{color:var(--red);}
.svc-badge.warn{color:var(--amber);}

/* Collapsible section */
.sec-toggle{display:flex;align-items:center;gap:.45rem;cursor:pointer;user-select:none;margin-bottom:.6rem;}
.sec-toggle .sec-label{margin-bottom:0;}
.sec-arrow{font-size:.65rem;color:var(--amber);transition:transform .25s;display:inline-block;}
.sec-toggle.open .sec-arrow{transform:rotate(90deg);}
.sec-body{overflow:hidden;transition:max-height .3s ease, opacity .25s ease;}
.sec-body.collapsed{max-height:0;opacity:0;pointer-events:none;}
.sec-body.expanded{max-height:600px;opacity:1;}

/* System stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.6rem;margin-bottom:.9rem;}
.stat-card{border:1px solid var(--border);border-radius:9px;background:var(--panel);padding:.75rem 1rem;}
.stat-label{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:.3rem;}
.stat-val{font-size:var(--fs-title);font-weight:700;color:var(--accent);}
.stat-val.warn{color:var(--amber);}
.stat-val.bad{color:var(--red);}
.stat-sub{font-size:var(--fs-small);color:var(--text-dim);margin-top:.15rem;}

/* Bar */
.bar-wrap{margin-top:.4rem;}
.bar-track{background:var(--panel-2);border-radius:3px;height:5px;overflow:hidden;}
.bar-fill{height:5px;border-radius:3px;transition:width .4s;}

/* APRS stations table */
.aprs-panel{border:1px solid var(--border);border-radius:9px;background:var(--panel);
  padding:.75rem 1rem;margin-bottom:.9rem;}
tr:last-child .age-ok{color:var(--accent);}
.age-warn{color:var(--amber);}
.age-old{color:var(--red);}
</style>
</head>
<body>
<div class="wrap">

<header>
  <a class="home-link" href="/">🏠 HOME</a>
  <h1>OASIS — Server Status</h1>
  <p>Real-time health and status of all server routes.</p>
  <span id="lastUpdate"></span>
  <button id="refreshBtn" onclick="refresh()">↺ Refresh</button>
</header>

<!-- Services -->
<div class="sec-toggle" id="svcToggle" onclick="toggleServices()">
  <span class="sec-arrow" id="svcArrow">&#9654;</span>
  <span class="sec-label">Services</span>
</div>
<div class="sec-body collapsed" id="svcBody">
  <div class="svc-strip" id="svcGrid"></div>
</div>

<!-- System -->
<div class="sec-toggle" id="sysToggle" onclick="toggleSystem()">
  <span class="sec-arrow" id="sysArrow">&#9654;</span>
  <span class="sec-label">System</span>
</div>
<div class="sec-body collapsed" id="sysBody">
  <div class="stat-grid" id="statGrid"></div>
</div>

<!-- APRS -->
<div class="aprs-panel">
  <div class="sec-label" style="margin-bottom:.5rem">APRS Stations <span id="aprsCount" style="color:var(--text-dim);font-size:var(--fs-small);text-transform:none;letter-spacing:0"></span></div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Callsign</th><th>Last Heard</th><th>Age</th><th>Speed</th><th>Via</th><th>Comment</th></tr></thead>
    <tbody id="aprsTbody"><tr><td colspan="6" style="color:var(--text-dim)">Loading…</td></tr></tbody>
  </table></div>
</div>

<footer id="countdown"></footer>

</div>
<script>
'use strict';

const HOST = location.hostname;
const REFRESH_SEC = 30;

// ── Service-discovery ────────────────────────────────────────────────────────
// Ports default to well-known values; /server-ports.json overrides them
// if the server is running on non-standard ports.
const PORTS = { flask: 8083, graywolf: 8080, kiwix: 8081, aprs_api: 8085 };

async function loadConfig() {
  try {
    const r = await fetch('/server-ports.json', { cache: 'no-store' });
    if (r.ok) {
      const d = await r.json();
      if (d.ok && d.ports) Object.assign(PORTS, d.ports);
    }
  } catch (_) { /* use defaults */ }
}

let countdownVal = REFRESH_SEC;
let countdownTimer = null;

// ── Service definitions ───────────────────────────────────────────────────────
const SERVICES = [
  {
    id: 'flask', name: 'Flask',
    check: async () => {
      const r = await fetch('/api/server-info', { cache: 'no-store' });
      if (!r.ok) return { up: false, sub: `HTTP ${r.status}` };
      const d = await r.json();
      return { up: true, badge: 'UP', sub: `v${d.flask_version} :${d.port}` };
    }
  },
  {
    id: 'wsgi', name: 'Web Server',
    check: async () => {
      const r = await fetch('/api/server-info', { cache: 'no-store' });
      if (!r.ok) return { up: false, sub: `HTTP ${r.status}` };
      const d = await r.json();
      const g = d.wsgi === 'gunicorn';
      return { up: true, warn: !g,
        badge: g ? 'gunicorn' : 'werkzeug (dev)',
        sub: `v${d.wsgi_version} :${d.port}` };
    }
  },
  {
    id: 'gw', name: 'GrayWolf',
    check: async () => {
      await fetch(`http://${HOST}:${PORTS.graywolf}/`, { cache: 'no-store', mode: 'no-cors' });
      return { up: true, badge: 'UP', sub: `:${PORTS.graywolf}` };
    }
  },
  {
    id: 'kiwix', name: 'Kiwix',
    check: async () => {
      await fetch(`http://${HOST}:${PORTS.kiwix}/`, { cache: 'no-store', mode: 'no-cors' });
      return { up: true, badge: 'UP', sub: `:${PORTS.kiwix}` };
    }
  },
  {
    id: 'aprs', name: 'APRS Stats API',
    check: async () => {
      const r = await fetch(`http://${HOST}:${PORTS.aprs_api}/health`, { cache: 'no-store' });
      if (!r.ok) return { up: false, sub: `:${PORTS.aprs_api}` };
      const d = await r.json();
      return { up: true, warn: !d.db_exists, badge: 'UP',
        sub: d.db_exists ? `DB found :${PORTS.aprs_api}` : `no DB :${PORTS.aprs_api}` };
    }
  },
  {
    id: 'fcc', name: 'FCC Database',
    check: async () => {
      const r = await fetch('/health', { cache: 'no-store' });
      if (!r.ok) return { up: false, sub: 'server error' };
      const d = await r.json();
      return { up: true, warn: !d.index_present,
        badge: d.index_present ? 'UP' : 'WARN',
        sub: d.index_present ? `${(d.zip_entries||0).toLocaleString()} ZIP` : 'index not built' };
    }
  },
  {
    id: 'maps', name: 'Offline Maps',
    check: async () => {
      const r = await fetch('/api/browse?path=maps', { cache: 'no-store' });
      if (!r.ok) return { up: false, sub: 'browse error' };
      const d = await r.json();
      const n = (d.entries||[]).filter(e => e.name.endsWith('.pmtiles')).length;
      return { up: true, warn: n === 0,
        badge: n > 0 ? 'UP' : 'WARN',
        sub: n > 0 ? `${n} PMTiles` : 'no tiles' };
    }
  },
];

// ── Render services ───────────────────────────────────────────────────────────
function buildServiceCards() {
  const grid = document.getElementById('svcGrid');
  grid.innerHTML = '';
  SERVICES.forEach(svc => {
    const card = document.createElement('div');
    card.className = 'svc-card';
    card.id = 'card-' + svc.id;
    card.innerHTML = `
      <div class="svc-dot" id="dot-${svc.id}"></div>
      <div><div class="svc-name">${svc.name}</div><div class="svc-sub" id="sub-${svc.id}">—</div></div>
      <span class="svc-badge" id="badge-${svc.id}">—</span>
    `;
    grid.appendChild(card);
  });
}

async function checkService(svc) {
  const dot   = document.getElementById('dot-'   + svc.id);
  const badge = document.getElementById('badge-' + svc.id);
  const sub   = document.getElementById('sub-'   + svc.id);
  const card  = document.getElementById('card-'  + svc.id);
  try {
    const result = await Promise.race([
      svc.check(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))
    ]);
    const state = result.up ? (result.warn ? 'warn' : 'up') : 'down';
    dot.className   = 'svc-dot '   + state;
    badge.className = 'svc-badge ' + state;
    card.className  = 'svc-card '  + state;
    badge.textContent = result.badge || (result.up ? 'UP' : 'DOWN');
    if (sub) sub.textContent = result.sub || '';
  } catch (e) {
    dot.className   = 'svc-dot down';
    badge.className = 'svc-badge down';
    card.className  = 'svc-card down';
    badge.textContent = e.message === 'timeout' ? 'TIMEOUT' : 'DOWN';
    if (sub) sub.textContent = '';
  }
}

// ── System toggle ──────────────────────────────────────────────────────────
let svcExpanded = false;
function toggleServices() {
  svcExpanded = !svcExpanded;
  document.getElementById('svcBody').className   = 'sec-body ' + (svcExpanded ? 'expanded' : 'collapsed');
  document.getElementById('svcToggle').className = 'sec-toggle' + (svcExpanded ? ' open' : '');
}

let sysExpanded = false;
function toggleSystem() {
  sysExpanded = !sysExpanded;
  document.getElementById('sysBody').className    = 'sec-body ' + (sysExpanded ? 'expanded' : 'collapsed');
  document.getElementById('sysToggle').className  = 'sec-toggle' + (sysExpanded ? ' open' : '');
}

// ── System stats ──────────────────────────────────────────────────────────────
function barColor(pct, amber = 70, red = 90) {
  if (pct >= red)   return 'var(--red)';
  if (pct >= amber) return 'var(--amber)';
  return 'var(--accent)';
}

function valClass(pct, amber = 70, red = 90) {
  if (pct >= red)   return 'bad';
  if (pct >= amber) return 'warn';
  return '';
}

function fmtUptime(sec) {
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (d > 0) return `${d}d ${h}h ${m}m`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function tempLabel(t) {
  if (t == null) return '';
  if (t >= 80) return 'hot';
  if (t >= 65) return 'warm';
  return 'normal';
}

function renderStats(d) {
  const grid = document.getElementById('statGrid');

  const stats = [
    {
      label: 'CPU',
      val:   d.cpu_pct != null ? d.cpu_pct.toFixed(1) + '%' : '—',
      sub:   d.cpu_count != null ? `${d.cpu_count} cores` : '',
      pct:   d.cpu_pct, amber: 70, red: 90
    },
    {
      label: 'Temperature',
      val:   d.cpu_temp_c != null ? `${d.cpu_temp_c} °C` : '—',
      sub:   tempLabel(d.cpu_temp_c),
      pct:   d.cpu_temp_c, amber: 65, red: 80
    },
    {
      label: 'RAM',
      val:   d.ram ? d.ram.pct.toFixed(1) + '%' : '—',
      sub:   d.ram ? `${d.ram.used_mb} / ${d.ram.total_mb} MB` : '',
      pct:   d.ram ? d.ram.pct : null, amber: 70, red: 90
    },
    {
      label: d.disk && d.disk.label ? `Disk (${d.disk.label})` : 'Disk',
      val:   d.disk && !d.disk.error ? d.disk.pct.toFixed(1) + '%' : '—',
      sub:   d.disk && !d.disk.error
               ? `${d.disk.used_gb} / ${d.disk.total_gb} GB · ${d.disk.free_gb} free`
               : (d.disk && d.disk.error) || '',
      pct:   d.disk && !d.disk.error ? d.disk.pct : null, amber: 70, red: 90
    },
    {
      label: 'Load',
      val:   d.load ? d.load.avg1.toFixed(2) : '—',
      sub:   d.load ? `1-min avg · ${d.load.cores} cores` : 'not available',
      pct:   d.load ? d.load.pct : null, amber: 75, red: 100
    },
    {
      label: 'Uptime',
      val:   d.uptime_sec != null ? fmtUptime(d.uptime_sec) : '—',
      sub:   d.boot_str ? `booted ${d.boot_str}` : '',
      pct:   null
    },
    {
      label: 'FCC DB',
      val:   d.fcc_db_date || '—',
      sub:   d.fcc_db_date ? 'last updated' : 'path not found',
      pct:   null
    },
  ];

  grid.innerHTML = stats.map(s => `
    <div class="stat-card">
      <div class="stat-label">${s.label}</div>
      <div class="stat-val ${s.pct != null ? valClass(s.pct, s.amber, s.red) : ''}">${s.val}</div>
      ${s.sub ? `<div class="stat-sub">${s.sub}</div>` : ''}
      ${s.pct != null ? `
        <div class="bar-wrap">
          <div class="bar-track">
            <div class="bar-fill" style="width:${Math.min(s.pct,100).toFixed(1)}%;background:${barColor(s.pct, s.amber, s.red)}"></div>
          </div>
        </div>` : ''}
    </div>
  `).join('');
}

async function fetchSystem() {
  try {
    const r = await fetch('/api/system', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.ok) renderStats(d);
  } catch (e) {
    document.getElementById('statGrid').innerHTML =
      `<div class="stat-card"><div class="stat-label">System</div><div class="stat-val bad">Unavailable</div><div class="stat-sub">${e.message}</div></div>`;
  }
}

// ── APRS stations ─────────────────────────────────────────────────────────────
function fmtAge(iso) {
  if (!iso) return { text: '—', cls: '' };
  const sec = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (sec < 0)  return { text: 'just now', cls: 'age-ok' };
  if (sec < 3600) {
    const m = Math.floor(sec / 60);
    return { text: m + 'm ago', cls: m < 30 ? 'age-ok' : 'age-warn' };
  }
  const h = Math.floor(sec / 3600);
  return { text: h + 'h ago', cls: h < 6 ? 'age-warn' : 'age-old' };
}

function fmtLastHeard(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toISOString().replace('T', ' ').slice(0, 16) + 'Z';
}

async function fetchAPRS() {
  const tbody = document.getElementById('aprsTbody');
  try {
    const r = await fetch(`http://${HOST}:${PORTS.aprs_api}/api/aprs/stations`, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'API error');

    document.getElementById('aprsCount').textContent =
      `— ${d.count} station${d.count !== 1 ? 's' : ''}`;

    if (!d.stations.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="color:var(--text-dim)">No stations in history DB.</td></tr>';
      return;
    }

    tbody.innerHTML = d.stations.map(s => {
      const age = fmtAge(s.last_heard);
      const speed = s.speed_mph > 0 ? s.speed_mph + ' mph' : '';
      const course = s.course != null && s.speed_mph > 0
        ? ' ' + ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(s.course/22.5)%16]
        : '';
      return `<tr>
        <td style="color:var(--accent);font-weight:700">${s.callsign}${s.is_object ? ' <span style="color:var(--amber);font-size:var(--fs-micro)">[obj]</span>' : ''}</td>
        <td>${fmtLastHeard(s.last_heard)}</td>
        <td class="${age.cls}">${age.text}</td>
        <td>${speed}${course}</td>
        <td style="color:var(--text-dim)">${s.via || ''}</td>
        <td style="color:var(--text-dim);max-width:200px;overflow:hidden;text-overflow:ellipsis">${s.comment || ''}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="6" style="color:var(--red)">Error: ${e.message}</td></tr>`;
  }
}

// ── Countdown ─────────────────────────────────────────────────────────────────
function startCountdown() {
  clearInterval(countdownTimer);
  countdownVal = REFRESH_SEC;
  countdownTimer = setInterval(() => {
    countdownVal--;
    document.getElementById('countdown').textContent = `Auto-refresh in ${countdownVal}s`;
    if (countdownVal <= 0) refresh();
  }, 1000);
}

// ── Main refresh ──────────────────────────────────────────────────────────────
async function refresh() {
  document.getElementById('lastUpdate').textContent =
    'Updated ' + new Date().toLocaleTimeString();

  // Services — all in parallel
  await Promise.allSettled(SERVICES.map(checkService));

  // System + APRS in parallel
  await Promise.allSettled([fetchSystem(), fetchAPRS()]);

  startCountdown();
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadConfig().then(() => {
  buildServiceCards();
  refresh();
});
</script>
</body>
</html>
