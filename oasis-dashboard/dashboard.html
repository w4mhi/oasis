<!doctype html>
<meta charset="utf-8">
<!-- Lives in /oasis-dashboard/ but link/fetch targets are site-root paths. -->
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OASIS — DashboardX</title>
<script src="/common/js/units.js"></script>
<script src="/common/js/geo.js"></script>
<script src="/common/js/format.js"></script>
<script src="/common/js/adsb.js"></script>
<style>
  /* ── palette + font: copied verbatim from kiosk.css (dashboard_old) ───── */
  :root{
    --bg:#0a0e11; --panel:#10161b; --panel-2:#141c22; --raise:#18222a;
    --border:#222d35; --border-soft:#1a242b;
    --text:#cdd8e0; --dim:#7e8d99; --faint:#4c5b66;
    --accent:#35d0a0; --up:#35d0a0; --warn:#f6a821; --down:#ff5b4a;
    --amber:#f4b64a; --blue:#5cb8ff; --purple:#b478ff;
    --r:.9rem;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  html{ font-size:clamp(13px, 1.9vh, 24px); }
  body{ background:var(--bg); color:var(--text); font-family:var(--mono);
        -webkit-font-smoothing:antialiased; overflow:hidden; }
  .kiosk{ width:100vw; height:100vh; display:flex; flex-direction:column; gap:.8rem;
          padding:.8rem; position:relative; overflow:hidden; }

  /* ── TOP: travel clock — LOCAL (left) · UTC · midcard (right) ─────────── */
  .clock{ display:flex; gap:1rem; align-items:stretch; }
  .face{
    flex:1 1 0; position:relative; overflow:hidden;
    background:linear-gradient(180deg,var(--raise),var(--panel));
    border:1px solid var(--border); border-radius:.8rem;
    padding:1.1rem 1.3rem 1rem 1.6rem;
  }
  .face::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:.4rem; }
  .face.loc::before{ background:var(--blue); }
  .face.utc::before{ background:var(--amber); }
  .face .zn{ display:flex; align-items:baseline; gap:.8rem; }
  .face .zn .z{ font-size:1.1rem; letter-spacing:.22em; font-weight:700; }
  .face.loc .z{ color:var(--blue); }
  .face.utc .z{ color:var(--amber); }
  .face .zn .tz{ font-size:1.25rem; color:var(--dim); letter-spacing:.04em; }
  .face .time{ font-size:3.2rem; line-height:1.02; font-weight:600;
    letter-spacing:.01em; margin-top:.35rem; font-variant-numeric:tabular-nums; }
  .face.loc .time{ color:var(--blue); }
  .face.utc .time{ color:var(--amber); }
  .face .time .s{ font-size:1.6rem; opacity:.62; }
  .face .date{ font-size:1.2rem; color:var(--dim); letter-spacing:.04em; margin-top:.25rem; }

  /* ── middle: station/grid + GPS + units pills, boxed to clock height ──── */
  .midcard{ flex:0 0 auto; display:flex; flex-direction:column;
            justify-content:center; align-items:center; gap:.6rem;
            background:linear-gradient(180deg,var(--raise),var(--panel));
            border:1px solid var(--border); border-radius:.8rem;
            padding:.6rem .7rem; }

  /* ── callsign + GPS pills: copied verbatim from kiosk.css ─────────────── */
  .callpill{ display:inline-flex; align-items:center; gap:.7rem; padding:.35rem 1.1rem; border-radius:999px;
             border:1px solid var(--border); background:var(--panel-2); font-size:1.05rem; cursor:pointer; }
  .callpill .cs{ color:var(--accent); font-weight:700; letter-spacing:.05em; }
  .callpill .sep{ color:var(--faint); } .callpill .gr{ color:var(--warn); font-weight:600; }
  .callrow{ display:flex; align-items:center; gap:.8rem; }
  .gpspill{ display:flex; align-items:center; gap:.5rem; padding:.3rem 1rem;
            border-radius:999px; border:1px solid var(--border); background:var(--panel-2); font-size:1.05rem; }
  .gpspill .mode{ font-weight:700; }
  /* Fixed states show a satellite count (used/seen, e.g. 3/4); acquiring / no-receiver
     show a status dot instead — red + pulsing while acquiring, faint when idle. */
  .gpspill .sub{ font-variant-numeric:tabular-nums; letter-spacing:.03em; }
  .gpspill .sub:empty{ display:none; }   /* no count on NO FIX / NO GPS → no stray gap before the dot */
  .gpspill .gdot{ width:.7rem; height:.7rem; border-radius:50%; display:none; flex:none; }
  #k-gps.nogps .mode{ color:var(--dim); }
  #k-gps.nogps .gdot{ display:inline-block; background:var(--faint); }
  #k-gps.nofix .mode{ color:var(--down); }
  #k-gps.nofix .gdot{ display:inline-block; background:var(--down);
                      animation:gpspulse 1.1s ease-in-out infinite; }
  #k-gps.fix2d .mode,#k-gps.fix2d .sub{ color:var(--warn); }
  #k-gps.fix3d .mode,#k-gps.fix3d .sub{ color:var(--accent); }
  @keyframes gpspulse{ 0%,100%{ opacity:1;  transform:scale(1);   box-shadow:0 0 .5rem 0 var(--down); }
                       50%    { opacity:.35; transform:scale(.65); box-shadow:0 0 0 0 var(--down); } }

  /* ── system stats pill + units toggle share one row, matched heights ──── */
  .sysrow{ display:flex; gap:.8rem; align-items:stretch; }
  .upill{ flex:0 0 auto; display:flex; align-items:center; justify-content:center;
          font-size:1rem; letter-spacing:.05em; color:var(--blue);
          border:1px solid var(--border); border-radius:.8rem;
          background:var(--panel-2); padding:.3rem 1.1rem; cursor:pointer; }
  .upill:hover{ border-color:var(--blue); color:var(--text); }
  /* ── system bar — one pill, stats packed as CPU: 5% | RAM: 36% | … ─────── */
  .sysbar{ flex:1 1 auto; display:flex; flex-wrap:wrap; align-items:baseline;
    justify-content:flex-start; gap:.3rem .5rem;
    padding:.55rem 1.3rem; border-radius:.8rem;
    border:1px solid var(--border); background:var(--panel-2);
    font-size:1rem; color:var(--text); font-variant-numeric:tabular-nums; }
  .sysbar .srow{ display:flex; align-items:baseline; gap:.3rem; }
  .sysbar .k{ color:var(--text); letter-spacing:.05em; }
  .sysbar .k::after{ content:":"; color:var(--dim); }               /* CPU: */
  .sysbar .srow:not(:last-child)::after{ content:"|"; color:var(--faint); margin-left:.2rem; }
  .sysbar .v{ font-weight:700; }
  .sysbar .v.ok{ color:var(--accent); } .sysbar .v.warm{ color:var(--warn); } .sysbar .v.hot{ color:var(--down); }
  .sysbar .srow.ip .v{ color:var(--dim); font-weight:400; }

  /* ── SDR service bar — dot + label per RTL consumer, side to side ─────── */
  .svcbar{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:.3rem .9rem; padding:.4rem 1rem; border-radius:.8rem;
    border:1px solid var(--border); background:var(--panel-2);
    font-size:1rem; color:var(--text); letter-spacing:.05em; font-weight:400; }
  .svcbar .s{ display:flex; align-items:center; gap:.45rem; }
  .svcbar .dot{ width:.85rem; height:.85rem; border-radius:50%; box-sizing:border-box;
    background:transparent; border:2px solid var(--text); }          /* not assigned: hollow white */
  .svcbar .dot.assigned{ background:var(--warn); border-color:var(--warn); }   /* rtl assigned */
  .svcbar .dot.inuse{ background:var(--accent); border-color:var(--accent); }  /* in use */

  /* ── BOTTOM lists: traffic + satellites cards — copied verbatim from kiosk.css ── */
  .row{ display:flex; gap:.8rem; min-height:0; }
  .row.bot{ flex:1 1 auto; min-height:0; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--r);
         padding:1rem 1.2rem; min-width:0; display:flex; flex-direction:column; }
  .hd{ display:flex; align-items:center; gap:.8rem; margin-bottom:.6rem; }
  .hd .lbl{ font-size:1.05rem; letter-spacing:.16em; color:var(--dim); font-weight:700; }
  .hd .meta{ margin-left:auto; font-size:1.1rem; color:var(--faint); font-variant-numeric:tabular-nums; }

  .traffic{ flex:1 1 auto; min-width:0; }
  .traffic .hd{ flex-wrap:wrap; row-gap:.4rem; border-bottom:1px solid var(--border); padding-bottom:.5rem; }
  .livebadge{ display:inline-flex; align-items:center; gap:.35rem; font-size:1rem; font-weight:700; letter-spacing:.1em; }
  .livebadge .lvd{ font-size:.85rem; line-height:1; }
  .livebadge.ok{ color:var(--accent); } .livebadge.ok .lvd{ text-shadow:0 0 .5rem var(--accent); }
  .livebadge.warn{ color:var(--warn); }
  .livebadge.down{ color:var(--down); }
  .heard{ color:var(--warn); font-weight:700; font-variant-numeric:tabular-nums; font-size:1.05rem; }
  .fchip{ font-size:1rem; font-weight:700; letter-spacing:.04em; padding:.25rem .8rem; border-radius:999px;
          border:1px solid var(--border); background:var(--panel-2); cursor:pointer; }
  .fchip.rf{ color:var(--accent); border-color:rgba(53,208,160,.45); }
  .fchip.is{ color:var(--blue); border-color:rgba(92,184,255,.45); }
  .fchip.aprs{ color:var(--text); border-color:rgba(205,216,224,.45); }
  .fchip.adsb{ color:var(--purple); border-color:rgba(180,120,255,.45); }
  .fchip.off{ color:var(--faint); border-color:var(--border); background:transparent; opacity:.55; }
  .tbl{ display:flex; flex-direction:column; min-height:0; flex:1 1 auto; }
  .tscroll{ flex:1 1 auto; min-height:0; overflow-y:auto; margin-right:-.6rem; padding-right:10px; }
  .tscroll::-webkit-scrollbar, .satscroll::-webkit-scrollbar{ width:14px; }
  .tscroll::-webkit-scrollbar-track, .satscroll::-webkit-scrollbar-track{ background:var(--panel); border-radius:4px; }
  .tscroll::-webkit-scrollbar-thumb, .satscroll::-webkit-scrollbar-thumb{
    background:color-mix(in srgb, var(--accent) 40%, var(--border)); border-radius:4px; }
  .tscroll::-webkit-scrollbar-thumb:hover, .satscroll::-webkit-scrollbar-thumb:hover{ background:var(--accent); }
  .trow{ display:grid; grid-template-columns:1.3fr 2.6rem 1fr 1.3fr 1.1fr; gap:.7rem; align-items:center;
         padding:.34rem .2rem; border-bottom:1px solid var(--border); font-size:1.2rem; cursor:pointer; }
  .trow:hover{ background:var(--panel-2); border-radius:.5rem; }
  .trow .call{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .call.rf{ color:var(--accent); } .call.is{ color:var(--blue); } .call.air{ color:var(--purple); }
  .trow .sym{ display:inline-block; width:24px; height:24px; background-repeat:no-repeat;
              image-rendering:pixelated; vertical-align:middle; }
  .age,.dist,.grid{ color:var(--dim); font-variant-numeric:tabular-nums; font-size:1.1rem; white-space:nowrap; }
  .age.age-ok{ color:var(--accent); } .age.age-warn{ color:var(--warn); } .age.age-old{ color:var(--dim); }
  .trow.empty{ color:var(--faint); cursor:default; }
  .trow.empty:hover{ background:none; }

  .sats{ flex:none; width:28rem; min-width:0; }
  .satscroll{ flex:1 1 auto; min-height:0; overflow-y:auto; margin-right:-.6rem; padding-right:10px; }
  .sat{ padding:.6rem .9rem .7rem; border:1px solid var(--border); border-radius:.8rem; margin-bottom:.5rem; }
  .sat:last-child{ margin-bottom:0; }
  .sat .l1{ display:flex; align-items:baseline; gap:.8rem; font-size:1.35rem; }
  .sat .nm{ font-weight:700; color:var(--text); min-width:6.6rem; }
  .sat .aos{ color:var(--dim); font-variant-numeric:tabular-nums; }
  .sat .cd{ margin-left:auto; color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; }
  .sat .l2{ font-size:1.1rem; color:var(--faint); margin-top:.2rem; letter-spacing:.02em; }
  .sat.now{ background:rgba(53,208,160,.07); border:1px solid var(--accent); border-radius:.8rem;
            padding:.6rem .9rem .7rem; margin-bottom:.5rem; }
  .sat.now .cd,.sat.now .l2{ color:var(--accent); }
  .sat.soon{ background:rgba(246,168,33,.07); border:1px solid var(--warn); border-radius:.8rem;
             padding:.6rem .9rem .7rem; margin-bottom:.5rem; }
  .sat.soon .cd,.sat.soon .l2{ color:var(--warn); }
  .sat.soon .pulse{ background:var(--warn); box-shadow:0 0 .8rem 0 var(--warn); }
  .satempty{ color:var(--faint); font-size:1.15rem; padding:.4rem .2rem; }
  .pulse{ display:inline-block; width:.8rem; height:.8rem; border-radius:50%; background:var(--accent);
          box-shadow:0 0 .8rem 0 var(--accent); margin-right:.5rem; vertical-align:middle; }

  /* ── detail sheet (row → full card) — copied verbatim from kiosk.css ──── */
  .sheet{ position:absolute; left:0; right:0; bottom:0; transform:translateY(110%); transition:transform .18s;
          background:var(--panel); border-top:1px solid var(--accent); border-radius:1.4rem 1.4rem 0 0; z-index:6; padding:1.4rem 1.6rem; }
  .sheet.open{ transform:translateY(0); }
  .sheet .sh-head{ display:flex; align-items:center; gap:1rem; margin-bottom:.8rem; }
  .sheet .sh-call{ color:var(--accent); font-weight:700; font-size:1.7rem; }
  .sheet .sh-x{ margin-left:auto; color:var(--dim); cursor:pointer; font-size:1.8rem; }
  .sheet .kv{ display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem 1.8rem; font-size:1.2rem; }
  .sheet .kv .k{ color:var(--dim); } .sheet .kv .v{ color:var(--text); }
  .sheet .full{ margin-top:.8rem; color:var(--text); font-size:1.2rem; }

  /* ── OPS / REFRESH buttons — copied verbatim from kiosk.css ───────────── */
  .btnrow{ display:flex; gap:.6rem; }
  .ops{ font-family:var(--mono); font-size:1.2rem; font-weight:700; letter-spacing:.12em;
        color:var(--accent); text-align:center; border:1px solid var(--accent);
        background:rgba(53,208,160,.08); border-radius:.6rem; padding:.45rem 1.3rem; cursor:pointer; }
  .refresh-btn{ color:var(--blue); border-color:var(--blue); background:rgba(92,184,255,.08); }
  .refresh-btn:active{ background:rgba(92,184,255,.18); }
</style>

<div class="kiosk">

  <!-- ── TOP: travel clock — LOCAL (left) · UTC · midcard (right) ───────── -->
  <div class="clock">
    <div class="face loc">
      <div class="zn"><span class="z">LOCAL</span><span class="tz" id="loc-tz">local</span></div>
      <div class="time" id="loc-t">--:--<span class="s">:--</span></div>
      <div class="date" id="loc-d">—</div>
    </div>
    <div class="face utc">
      <div class="zn"><span class="z">UTC</span><span class="tz">Zulu</span></div>
      <div class="time" id="utc-t">--:--<span class="s">:--</span></div>
      <div class="date" id="utc-d">—</div>
    </div>
    <div class="midcard">
      <div class="callrow">
        <span class="callpill" onclick="editCallsignGrid()" title="Edit callsign &amp; grid">
          <span class="cs" id="k-callsign">N0CALL</span><span class="sep">·</span><span class="gr" id="k-grid">—</span>
        </span>
        <div class="gpspill nogps" id="k-gps"><span class="mode" id="k-gps-mode">GPS —</span><span class="sub" id="k-gps-sub"></span><span class="gdot" id="k-gps-dot"></span></div>
      </div>
      <!-- RTL/SDR assignment pill: dot (hollow=unassigned, amber=rtl assigned, green=in use) -->
      <div class="svcbar" id="svcbar">
        <span class="s"><span class="dot" id="dot-aprs"></span>APRS</span>
        <span class="s"><span class="dot" id="dot-adsb"></span>ADS-B</span>
        <span class="s"><span class="dot" id="dot-owrx"></span>ORX</span>
        <span class="s"><span class="dot" id="dot-sat"></span>SAT</span>
      </div>
      <div class="btnrow">
        <button class="ops" onclick="openOv('ops')">OPS</button>
        <button class="ops refresh-btn" onclick="location.reload()">REFRESH</button>
      </div>
    </div>
  </div>

  <!-- ── System stats pill + units toggle, inline on one row ────────────── -->
  <div class="sysrow">
    <div class="sysbar">
      <div class="srow"><span class="k">CPU</span><span class="v" id="k-cpu">—</span></div>
      <div class="srow"><span class="k">RAM</span><span class="v" id="k-ram">—</span></div>
      <div class="srow"><span class="k">LOAD</span><span class="v" id="k-load">—</span></div>
      <div class="srow"><span class="k">TEMP</span><span class="v" id="k-temp" style="cursor:pointer" title="Tap to toggle °C / °F">—</span></div>
      <div class="srow"><span class="k">DISK</span><span class="v" id="k-disk">—</span></div>
      <div class="srow ip"><span class="k">IP</span><span class="v" id="k-ip">—</span></div>
    </div>
    <span class="upill" id="k-units" onclick="toggleUnits()" title="Toggle imperial / metric">IMPERIAL</span>
  </div>

  <!-- ── BOTTOM: APRS/ADS-B traffic | satellites ────────────────────────── -->
  <div class="row bot">

    <div class="card traffic">
      <div class="hd">
        <span class="livebadge ok" id="k-aprs-live"><span class="lvd">●</span><span class="lvtxt">LIVE</span></span>
        <span class="heard" id="k-aprs-count">—</span>
        <span class="fchip rf"   id="f-rf"   onclick="toggleFilter('rf')"   title="RF stations">RF</span>
        <span class="fchip is"   id="f-is"   onclick="toggleFilter('is')"   title="Internet (APRS-IS) stations">IS</span>
        <span class="fchip aprs" id="f-aprs" onclick="toggleFilter('aprs')" title="APRS stations">APRS</span>
        <span class="fchip adsb" id="f-adsb" onclick="toggleFilter('adsb')" title="ADS-B aircraft">ADS-B</span>
      </div>
      <div class="tbl">
        <div class="tscroll" id="aprsScroll"></div>
      </div>
    </div>

    <div class="card sats">
      <div class="hd"><span class="lbl">SATELLITES</span><span class="meta" id="k-sat-meta">—</span></div>
      <div class="satscroll" id="satBody"><div class="satempty">…</div></div>
    </div>

  </div>

  <!-- DETAIL SHEET -->
  <div class="sheet" id="sheet">
    <div class="sh-head"><span class="sh-call" id="shCall">—</span><span class="sh-x" onclick="closeSheet()">✕</span></div>
    <div class="kv">
      <span class="k">Last heard</span><span class="v" id="shHeard">—</span>
      <span class="k">Age</span><span class="v" id="shAge">—</span>
      <span class="k">Via</span><span class="v" id="shVia">—</span>
      <span class="k">Speed</span><span class="v" id="shSpd">—</span>
      <span class="k">Grid</span><span class="v" id="shGrid">—</span>
      <span class="k">Dist</span><span class="v" id="shDist">—</span>
    </div>
    <div class="full" id="shCmt"></div>
  </div>

</div>

<script>
// OPS overlay isn't built on this dashboard yet — stub so the button is a no-op.
function openOv(_which) { /* TODO: OPS overlay */ }

// ── Travel clock — Local + UTC, each its own date ────────────────────────────
function tick() {
  const n = new Date(), p = x => String(x).padStart(2,'0');
  const dw = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
        mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const set = (id, html) => { const e = document.getElementById(id); if (e) e.innerHTML = html; };
  const txt = (id, s)    => { const e = document.getElementById(id); if (e) e.textContent = s; };
  set('loc-t', p(n.getHours())+':'+p(n.getMinutes())+'<span class="s">:'+p(n.getSeconds())+'</span>');
  txt('loc-d', dw[n.getDay()]+' · '+p(n.getDate())+' '+mo[n.getMonth()]+' '+n.getFullYear());
  set('utc-t', p(n.getUTCHours())+':'+p(n.getUTCMinutes())+'<span class="s">:'+p(n.getUTCSeconds())+'</span>');
  txt('utc-d', dw[n.getUTCDay()]+' · '+p(n.getUTCDate())+' '+mo[n.getUTCMonth()]+' '+n.getUTCFullYear());
  try { const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'local';
        txt('loc-tz', tz.split('/').pop().replace('_',' ')); } catch (_) {}
}
tick(); setInterval(tick, 1000);

// ── Callsign / Grid (copied from dashboard_old) ──────────────────────────────
function loadCallsignGrid() {
  document.getElementById('k-callsign').textContent = localStorage.getItem('oasis_callsign') || 'N0CALL';
  document.getElementById('k-grid').textContent     = localStorage.getItem('oasis_grid')     || '—';
}
function editCallsignGrid() {
  const cs = prompt('Callsign:', localStorage.getItem('oasis_callsign') || 'N0CALL'); if (cs === null) return;
  const gr = prompt('Grid square (e.g. CN87):', localStorage.getItem('oasis_grid') || ''); if (gr === null) return;
  localStorage.setItem('oasis_callsign', cs.trim().toUpperCase());
  localStorage.setItem('oasis_grid',     gr.trim().toUpperCase());
  loadCallsignGrid();
}
async function seedCallsignGrid() {
  if (localStorage.getItem('oasis_callsign')) return;
  try { const r = await fetch('/station.json', { cache: 'no-store' }); if (!r.ok) return;
        const d = await r.json();
        if (d.callsign) localStorage.setItem('oasis_callsign', String(d.callsign).toUpperCase());
        if (d.grid)     localStorage.setItem('oasis_grid',     String(d.grid).toUpperCase());
        loadCallsignGrid(); } catch (_) {}
}
loadCallsignGrid(); seedCallsignGrid();

// ── Units toggle (copied from dashboard_old, trimmed to the units pill) ──────
function renderUnits() { const el = document.getElementById('k-units'); if (el) el.textContent = isImperial() ? 'IMPERIAL' : 'METRIC'; }
function toggleUnits() { OasisUnits.toggleUnits(); renderUnits(); renderTemp(); applyAprsFilter(); }
renderUnits();

// ── System stats (copied from dashboard_old) ─────────────────────────────────
function setKStat(id, text, cls) { const el = document.getElementById(id); if (!el) return; el.textContent = text; el.className = 'v' + (cls ? ' ' + cls : ''); }
let _lastTempC = null;
function renderTemp() {
  const cls = _lastTempC != null ? (_lastTempC >= 80 ? 'hot' : _lastTempC >= 65 ? 'warm' : 'ok') : '';
  setKStat('k-temp', fmtTemp(_lastTempC), cls);
}
(function () { const el = document.getElementById('k-temp'); if (el) el.addEventListener('click', toggleUnits); })();

// ── GPS fix → pill (HDOP intentionally omitted) ──────────────────────────────
// Fixes read "GPS 3D 2/3" / "GPS 2D 3/4" (mode + satellites used/seen), green for
// 3D, amber for 2D. NO FIX (a receiver is configured, acquiring) reads "GPS NO FIX"
// + a red pulsing dot. NO GPS (no receiver) reads "GPS NO GPS" + a faint dot.
//
// A configured device (g.device) — not the fix mode — decides "installed". gpsd is
// socket-activated and can answer with mode 0 even when GPS was never set up (the
// socket is pulled in transitively, e.g. by pat), so keying "no receiver" on
// mode<0 wrongly showed acquiring/red on a box with no GPS. Empty device ⇒ NO GPS.
let _gpsCountLast = '';   // last satellite count for the current fix (see _gpsFixCount)
function renderGps(g) {
  const card = document.getElementById('k-gps'); if (!card) return;
  const hasReceiver = !!(g && g.device);   // a gpsd device is configured
  const mode = g ? (g.mode||0) : -1;
  const used = (g && g.used != null) ? g.used : null;
  const seen = (g && g.seen != null) ? g.seen : null;
  let state, modeTxt, sub = '';
  if (!hasReceiver)  { state='nogps'; modeTxt='NO GPS'; _gpsCountLast = ''; }   // not installed → faint dot
  else if (mode>=3)  { state='fix3d'; modeTxt='3D';     sub = _gpsFixCount(used, seen); }
  else if (mode===2) { state='fix2d'; modeTxt='2D';     sub = _gpsFixCount(used, seen); }
  else               { state='nofix'; modeTxt='NO FIX'; _gpsCountLast = ''; }   // acquiring → red pulsing dot
  card.className = 'gpspill '+state;
  const m = document.getElementById('k-gps-mode'); if (m) m.textContent = 'GPS '+modeTxt;
  const s = document.getElementById('k-gps-sub'); if (s) s.textContent = sub;
}
// Satellite count for a fix, held sticky. gpsd sends fix mode (TPV) and satellite
// counts (SKY) as separate messages, and a poll can catch a TPV without a
// satellite-bearing SKY that cycle — a fix with no used/seen. A blank count then
// means "no fresh reading", not "zero sats", so keep showing the last known count
// until a fresh one arrives (reset when the fix is lost, in renderGps).
function _gpsFixCount(used, seen) {
  const c = _gpsCount(used, seen);
  if (c) _gpsCountLast = c;
  return _gpsCountLast;
}
// Satellites used-in-fix / in-view, e.g. "3/4". '' when the poll carried no count
// OR when seen is 0 — a "fix" claiming zero satellites is contradictory (transient
// bad gpsd data), so we treat it as no count and let _gpsFixCount hold the last real
// value instead of flashing 0/0.
function _gpsCount(used, seen) {
  if (!seen) return '';
  return (used != null ? used : '?') + '/' + seen;
}
async function fetchStats() {
  try {
    const r = await fetch('/api/system', { cache:'no-store', signal: AbortSignal.timeout(4000) });
    if (!r.ok) return;
    const d = await r.json();
    const ipEl = document.getElementById('k-ip'); if (ipEl && d.ip) ipEl.textContent = d.ip;
    renderGps(d.gps);
    if (d.cpu_pct != null) setKStat('k-cpu', `${Math.round(d.cpu_pct)}%`, d.cpu_pct>=90?'hot':d.cpu_pct>=70?'warm':'ok');
    _lastTempC = d.cpu_temp_c; renderTemp();
    if (d.ram?.pct != null) setKStat('k-ram', `${Math.round(d.ram.pct)}%`, d.ram.pct>=90?'hot':d.ram.pct>=70?'warm':'ok');
    if (d.disk?.pct != null && !d.disk.error) setKStat('k-disk', `${Math.round(d.disk.pct)}%`, d.disk.pct>=90?'hot':d.disk.pct>=70?'warm':'ok');
    setKStat('k-load', d.load?.avg1 != null ? d.load.avg1.toFixed(2) : 'n/a', d.load?.pct!=null?(d.load.pct>=100?'hot':d.load.pct>=75?'warm':'ok'):'');
  } catch (_) {}
}
fetchStats(); setInterval(fetchStats, 5000);

// ── SDR service dots (assignment from hardware, in-use from systemd) ──────────
// dot: hollow white = no RTL assigned · amber = RTL assigned · green = in use.
const SDR_SVCS = [
  { id:'aprs', hw:'aprs',       unit:'aprs-sdr-feed' },
  { id:'adsb', hw:'adsb',       unit:'dump1090-fa' },
  { id:'owrx', hw:'openwebrx',  unit:null },            // no OASIS unit → can't detect "in use"
  { id:'sat',  hw:'satellites', unit:'satellites-listen' },
];
async function isUnitActive(unit) {
  if (!unit) return false;
  try { const r = await fetch('/api/health/service?name='+unit, { cache:'no-store' });
        return r.ok && (await r.json()).active === 'active'; } catch (_) { return false; }
}
// SAT has no systemd unit — its recorder is an ad-hoc rtl_fm subprocess. "In use"
// means WE hold the dongle (recording/streaming); `busy` alone can be another
// service holding the shared dongle, so don't use it.
async function satInUse() {
  try { const r = await fetch('/api/satellites/listen/status', { cache:'no-store' });
        if (!r.ok) return false; const d = await r.json();
        return !!(d.recording || d.streaming); } catch (_) { return false; }
}
async function svcInUse(svc) { return svc.id === 'sat' ? satInUse() : isUnitActive(svc.unit); }
async function fetchSdrStatus() {
  let hw = {};
  try { const r = await fetch('/api/hardware/devices', { cache:'no-store' }); if (r.ok) hw = await r.json(); } catch (_) {}
  const byId = {}; (hw.devices || []).forEach(x => byId[x.id] = x);
  const services = hw.services || {};
  await Promise.all(SDR_SVCS.map(async svc => {
    const dot = document.getElementById('dot-'+svc.id); if (!dot) return;
    const info = services[svc.hw];
    const dev  = info && info.device_id ? byId[info.device_id] : null;
    const assigned = !!(dev && dev.kind === 'rtl-sdr');
    const inUse = await svcInUse(svc);
    dot.className = 'dot' + (inUse ? ' inuse' : assigned ? ' assigned' : '');
  }));
}
fetchSdrStatus(); setInterval(fetchSdrStatus, 8000);

// ── esc + home coords ────────────────────────────────────────────────────────
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function loadHomeCoords() {
  fetch('/station.json').then(r => r.ok ? r.json() : null).then(d => {
    if (!d || !d.lat || !d.lon) return;
    OasisGeo.setHomeCoords(d.lat, d.lon);
    if (_allAprsStations.length) applyAprsFilter();
  }).catch(() => {});
}

// ── APRS + ADS-B live traffic (copied from dashboard_old, trimmed to the list) ─
let _allAprsStations = [];
let _showRF = true, _showIS = true, _showAPRS = true, _showADSB = true;
const MAX_ROWS = 60;   // more vertical room on this layout → show more records
let _renderAt = 0, _renderTimer = null;
function aprsSource(s) {
  const v = String(s.via||'').trim().toLowerCase();
  if (v==='rf') return 'rf'; if (v==='is') return 'is';
  const hay = (v+' '+((s.path||[]).join(' '))).toUpperCase();
  return (hay.includes('TCPIP')||hay.includes('IGATE')||/\bQA[A-Z]/.test(hay)) ? 'is' : 'rf';
}
function toggleFilter(which) {
  if (which==='rf') _showRF=!_showRF; else if (which==='is') _showIS=!_showIS;
  else if (which==='aprs') _showAPRS=!_showAPRS; else if (which==='adsb') _showADSB=!_showADSB;
  const states = { rf:_showRF, is:_showIS, aprs:_showAPRS, adsb:_showADSB };
  Object.entries(states).forEach(([k,on]) => { const el = document.getElementById('f-'+k); if (el) el.classList.toggle('off', !on); });
  applyAprsFilter();
}
function aprsIconHtml(s) {
  const table = s.sym_table||'/', code = s.sym_code||'-';
  let idx = code.charCodeAt(0)-33; if (idx<0||idx>95) idx=0;
  const x = -((idx%16)*24), y = -(Math.floor(idx/16)*24), sheet = table==='/'?0:1;
  return `<span class="sym" style="background-image:url('/map-assets/aprs-symbols-24-${sheet}.png');background-position:${x}px ${y}px"></span>`;
}
function renderAprsRows(list) {
  const body = document.getElementById('aprsScroll'); if (!body) return;
  body.innerHTML = '';
  if (!list.length) { body.innerHTML = '<div class="trow empty"><span style="grid-column:1/-1">No stations to show.</span></div>'; return; }
  const frag = document.createDocumentFragment();
  list.forEach(s => {
    const call = s.callsign || s.c || '—';
    const ac = s._kind==='aircraft', src = ac ? 'air' : aprsSource(s);
    const age = fmtAge(s.last_heard||s.timestamp||s.time);
    const dist = distFromHome(s.lat, s.lon) || '';
    const grid = gridSquare(s.lat, s.lon) || '';
    const r = document.createElement('div'); r.className = 'trow';
    r.innerHTML = `<span class="call ${src}">${esc(call)}</span><span>${aprsIconHtml(s)}</span><span class="age ${age.cls}">${esc(age.text)}</span><span class="dist">${esc(dist)}</span><span class="grid">${esc(grid)}</span>`;
    r.onclick = () => openSheet(s);
    frag.appendChild(r);
  });
  body.appendChild(frag);
}
function applyAprsFilter() {
  let list = [];
  if (_showAPRS) list = list.concat(_allAprsStations);
  if (_showADSB) list = list.concat(_adsbListRows());
  if (!_showRF || !_showIS) list = list.filter(s => s._kind==='aircraft' || (aprsSource(s)==='is' ? _showIS : _showRF));
  const total = list.length;
  list.sort((a,b) => _lhEpoch(b.last_heard||b.timestamp||b.time) - _lhEpoch(a.last_heard||a.timestamp||a.time));
  const cEl = document.getElementById('k-aprs-count'); if (cEl) cEl.textContent = total;
  renderAprsRows(list.slice(0, MAX_ROWS));
}
function scheduleAprsRender() {
  const since = Date.now() - _renderAt;
  if (since >= 15000) { _renderAt = Date.now(); applyAprsFilter(); }
  else if (!_renderTimer) _renderTimer = setTimeout(() => { _renderTimer = null; _renderAt = Date.now(); applyAprsFilter(); }, 15000 - since);
}
function setAprsLive(state) {
  const el = document.getElementById('k-aprs-live'); if (!el) return;
  el.className = 'livebadge ' + state;
  const t = el.querySelector('.lvtxt'); if (t) t.textContent = (state === 'down') ? 'OFFLINE' : 'LIVE';
}
async function fetchAPRS() {
  try {
    const r = await fetch('/api/aprs/stations', { cache:'no-store', signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    if (!d.ok) { setAprsLive('down'); _allAprsStations=[]; scheduleAprsRender(); return; }
    _allAprsStations = d.stations;
    const times = d.stations.map(s => s.last_heard||s.timestamp||s.time).filter(Boolean).map(t => _lhEpoch(t)).filter(Boolean);
    if (times.length) {
      const m = Math.round((Date.now()-Math.max(...times))/60000);
      setAprsLive(m < 5 ? 'ok' : m < 30 ? 'warn' : 'down');
    } else { setAprsLive('down'); }
    scheduleAprsRender();
  } catch (e) { setAprsLive('down'); _allAprsStations=[]; scheduleAprsRender(); }
}

// ADS-B fold (mirrors dashboard_old / map.html)
let _adsbAircraft = [], _adsbRecent = [], _adsbNow = 0;
function _lhEpoch(s) { if (!s) return 0; const norm = String(s).replace('Z','+00:00').replace(' ','T').replace(/(\.\d{3})\d+/,'$1'); const t = new Date(norm).getTime(); return isNaN(t)?0:t; }
function _adsbForList() {
  const byHex = {};
  _adsbRecent.forEach(a => { byHex[a.hex] = Object.assign({}, a, { _ts:a.ts, _live:false }); });
  _adsbAircraft.forEach(a => { const seen = (typeof a.seen==='number')?a.seen:0; byHex[a.hex] = Object.assign({}, a, { _ts:_adsbNow-seen, _live:true }); });
  return Object.values(byHex);
}
function _adsbListRows() {
  return _adsbForList().filter(a => (a.lat!=null && a.lon!=null) || !a._live).map(a => {
    const positioned = a.lat!=null && a.lon!=null;
    const altFt = (a.alt_baro==null||a.alt_baro==='ground') ? null : (isFinite(Number(a.alt_baro))?Number(a.alt_baro):null);
    const _sym = (typeof acSymbol === 'function') ? acSymbol(a) : ['/', a.category === 'A7' ? 'X' : "'"];
    return { _kind:'aircraft', callsign:(a.flight||a.hex||'').trim()||(a.hex||'?'), sym_table:_sym[0], sym_code:_sym[1],
      lat:positioned?a.lat:null, lon:positioned?a.lon:null, speed_mph:(a.gs!=null)?Math.round(a.gs*1.15078):0, course:(a.track!=null)?a.track:null,
      alt_m:(altFt!=null)?altFt/3.28084:null, last_heard:new Date(a._ts*1000).toISOString(), via:'adsb', comment:a.squawk?('sq '+a.squawk):'' };
  });
}
async function refreshAdsb() {
  try { const r = await fetch('/api/adsb/aircraft', { cache:'no-store', signal: AbortSignal.timeout(5000) });
        if (!r.ok) { _adsbAircraft=[]; scheduleAprsRender(); return; }
        const j = await r.json(); _adsbAircraft = j.aircraft||[]; _adsbNow = (typeof j.now==='number')?j.now:(Date.now()/1000); scheduleAprsRender(); } catch (_) {}
}
async function refreshAdsbRecent() {
  try { const r = await fetch('/api/adsb/recent?hours=24', { cache:'no-store', signal: AbortSignal.timeout(8000) });
        if (!r.ok) return; _adsbRecent = (await r.json()).aircraft||[]; scheduleAprsRender(); } catch (_) {}
}

// ── Detail sheet (row → full card) ───────────────────────────────────────────
function openSheet(s) {
  document.getElementById('shCall').textContent  = s.callsign || s.c || '—';
  document.getElementById('shHeard').textContent = s.last_heard || s.h || '—';
  const ageSec = s.last_heard ? Math.floor((Date.now()-_lhEpoch(s.last_heard))/1000) : null;
  document.getElementById('shAge').textContent   = ageSec != null ? (ageSec<60?ageSec+'s ago':Math.floor(ageSec/60)+'m ago') : (s.a?s.a+' ago':'—');
  document.getElementById('shVia').textContent   = (s._kind==='aircraft'?'ADS-B':aprsSource(s).toUpperCase());
  document.getElementById('shSpd').textContent   = s.speed_mph != null ? fmtSpeed(s.speed_mph) : (s.sp||'—');
  document.getElementById('shGrid').textContent  = gridSquare(s.lat,s.lon) || '—';
  document.getElementById('shDist').textContent  = distFromHome(s.lat,s.lon) || '—';
  document.getElementById('shCmt').textContent   = s.comment || s.cmt || '(no comment)';
  document.getElementById('sheet').classList.add('open');
}
function closeSheet() { document.getElementById('sheet').classList.remove('open'); }

// ── Satellites (copied from dashboard_old) ───────────────────────────────────
function azCompass(deg) { if (deg == null) return ''; return ['N','NE','E','SE','S','SW','W','NW'][Math.round((((deg%360)+360)%360)/45)%8]; }
let _satSel = [], _satPasses = {};
async function fetchSats() {
  try { const m = await (await fetch('/api/satellites', { cache:'no-store' })).json(); _satSel = (m.satellites||[]).filter(s => s.selected); } catch (_) { _satSel = []; }
  try { _satPasses = (await (await fetch('/api/satellites/passes?window=24', { cache:'no-store' })).json()).passes || {}; } catch (_) {}
  renderSats();
}
function renderSats() {
  const body = document.getElementById('satBody'), meta = document.getElementById('k-sat-meta');
  if (!body) return;
  const now = Date.now();
  const items = [];
  _satSel.forEach(s => {
    const norad = s.norad || s.id;
    const passes = _satPasses[norad] || _satPasses[String(norad)] || [];
    const p = passes.map(x => ({ ...x, _r:new Date(x.rise).getTime(), _s:new Date(x.set).getTime() }))
                    .filter(x => x._s > now).sort((a,b) => a._r - b._r)[0];
    if (!p) return;
    const inPass = p._r <= now && now < p._s;
    const mins = Math.round((p._r - now)/60000);
    if (!inPass && mins > 60) return;                 // 1 h window
    items.push({ name:s.name || ('#'+norad), p, inPass, mins, dl:(s.downlinks && s.downlinks[0]) });
  });
  items.sort((a,b) => (b.inPass?1:0)-(a.inPass?1:0) || a.p._r - b.p._r);
  if (meta) meta.textContent = _satSel.length + ' monitored · ' + items.length + ' in 1h';
  if (!items.length) { body.innerHTML = '<div class="satempty">no monitored passes in the next hour</div>'; return; }
  const hm = t => { const d = new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
  body.innerHTML = items.map(it => {
    const el = Math.round(it.p.max_el || 0), dir = azCompass(it.p.rise_az);
    if (it.inPass) {
      const arc = `${esc(azCompass(it.p.rise_az))}→${esc(azCompass(it.p.set_az))}`;
      return `<div class="sat now"><div class="l1"><span class="nm"><span class="pulse"></span>${esc(it.name)}</span><span class="aos">overhead</span><span class="cd">NOW</span></div><div class="l2">el ${el}° ↗ · ${arc} · LOS ${hm(it.p._s)}</div></div>`;
    }
    const soon = it.mins <= 10;
    const nm = soon ? `<span class="nm"><span class="pulse"></span>${esc(it.name)}</span>` : `<span class="nm">${esc(it.name)}</span>`;
    const l2 = soon ? `rise ${esc(dir)} · ${el}° max · get ready` : `rise ${esc(dir)} · ${el}° max`;
    return `<div class="sat${soon?' soon':''}"><div class="l1">${nm}<span class="aos">${hm(it.p._r)}</span><span class="cd">↑ ${it.mins}m</span></div><div class="l2">${l2}</div></div>`;
  }).join('');
}

// ── Traffic + satellites init/timers ─────────────────────────────────────────
loadHomeCoords();
fetchAPRS();          setInterval(fetchAPRS, 10000);
refreshAdsb();        setInterval(refreshAdsb, 5000);
refreshAdsbRecent();  setInterval(refreshAdsbRecent, 60000);
fetchSats();          setInterval(fetchSats, 60000);
</script>
