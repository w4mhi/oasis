<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OASIS - Repeater Guide</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.group-label {
  font-size: var(--fs-small);
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--amber);
  margin: 1.3rem .2rem .6rem;
}
.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: .7rem;
}
@media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

a.card {
  display: block;
  text-decoration: none;
  color: var(--text);
  border: 1px solid color-mix(in srgb, var(--cardaccent, var(--accent)) 35%, transparent);
  border-radius: 6px;
  background: var(--panel);
  padding: .9rem 1rem;
  transition: border-color .3s, background .15s;
}
a.card:hover { background: var(--panel-2); border-color: var(--cardaccent, var(--accent)); }
.card-model {
  font-size: var(--fs-subtitle);
  font-weight: 700;
  color: var(--cardaccent, var(--accent));
  letter-spacing: .03em;
}
.card-type {
  font-size: var(--fs-label);
  color: var(--text-dim);
  margin-top: .3rem;
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="home-link" href="/">⌂ HOME</a>
    <h1>Repeater Guide</h1>
    <p>Step-by-step repeater programming using CHIRP — offline reference.</p>
  </header>

  <div class="group-label">Kenwood</div>
  <div class="grid">
    <a class="card" href="kenwood-tm-v71.html" style="--cardaccent:#ffb454">
      <div class="card-model">TM-V71A</div>
      <div class="card-type">Mobile · Dual Band · Cross-Band Repeater · APRS TNC</div>
    </a>
  </div>

  <div class="group-label">Yaesu</div>
  <div class="grid">
    <a class="card" href="yaesu-ftm-500dr.html" style="--cardaccent:#00d98b">
      <div class="card-model">FTM-500DR</div>
      <div class="card-type">Mobile · C4FM / FM · Dual Band · 50W · APRS</div>
    </a>
  </div>

  <footer style="text-align:center;color:var(--text-dim);font-size:var(--fs-small);margin-top:1.8rem;padding-bottom:1rem;">
    Offline reference &middot; no network required
  </footer>

</div>
</body>
</html>
