<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Net Check-in Log</title>
<link rel="stylesheet" href="/map-assets/maplibre-gl.css">
<link rel="stylesheet" href="../css/common.css">
<style>
/* Header */
.net-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.5rem;}
.net-meta label{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);display:block;margin-bottom:2px;}
.net-meta input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:var(--fs-base);padding:4px 8px;border-radius:5px;}
.net-meta input:focus{outline:none;border-color:var(--accent);}

/* Check-in form */
.checkin{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:1rem 1.25rem;margin-bottom:.9rem;}
.form-row{display:flex;flex-wrap:wrap;gap:.45rem;align-items:flex-end;}
.field input[type=text]:focus{outline:none;border-color:var(--accent);}
.field input.filled{border-color:var(--accent-dim);}
.w-call{width:110px;}
.w-name{width:200px;min-width:150px;}
.w-city{width:155px;min-width:120px;}
.w-st{width:46px;}
.w-grid{width:80px;}
.w-notes{flex:1;min-width:150px;}
.form-row{display:flex;flex-wrap:wrap;gap:.45rem;align-items:flex-end;}
.form-row-2{display:flex;flex-wrap:wrap;gap:.45rem;align-items:flex-end;margin-top:.45rem;}
.form-row-2 .field,.form-row-2 .field:last-child{margin-bottom:.5rem;}
.call-wrap{position:relative;display:flex;align-items:center;gap:.35rem;}
#lkstat{font-size:var(--fs-micro);pointer-events:none;white-space:nowrap;}
/* Suggestion dropdown */
#call-suggestions{position:absolute;top:calc(100% + 4px);left:0;min-width:160px;background:var(--panel);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:200;display:none;overflow:hidden;}
#call-suggestions.open{display:block;}
.sug-item{padding:5px 10px;font-family:var(--mono);font-size:var(--fs-base);color:var(--text);cursor:pointer;display:flex;justify-content:space-between;gap:1rem;white-space:nowrap;}
.sug-item:hover{background:var(--panel-2);color:var(--accent);}
.sug-call{font-weight:700;color:var(--accent);}
.sug-name{font-size:var(--fs-small);color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;max-width:120px;}
.s-ok{color:var(--accent);}
.s-nf{color:var(--amber);}
.s-err{color:var(--red);}
.traffic-row{display:flex;align-items:center;gap:6px;padding-bottom:1px;}
.traffic-row label{font-size:var(--fs-base);color:var(--text-dim);cursor:pointer;}
.traffic-row input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;}
.log-btn:active{transform:scale(.97);}

/* Sortable columns */
th.sortable{cursor:pointer;user-select:none;}
th.sortable:hover{color:var(--text);}
th.sort-asc::after{content:' ▲';color:var(--accent);}
th.sort-desc::after{content:' ▼';color:var(--accent);}
.log-section{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:1rem 1.25rem;}
.log-hdr{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.7rem;}
.log-actions{display:flex;gap:.4rem;}
.sec-btn{background:transparent;color:var(--text-dim);border:1px solid var(--border);font-family:var(--mono);font-size:var(--fs-label);padding:4px 11px;border-radius:5px;cursor:pointer;}
.sec-btn:hover{color:var(--text);border-color:var(--text-dim);}
.sec-btn.danger:hover{color:var(--red);border-color:var(--red);}
#count{font-size:var(--fs-small);color:var(--text-dim);margin-left:.5rem;}
td.notes-cell{white-space:normal;max-width:200px;word-break:break-word;}
td.c-call{color:var(--accent);font-weight:700;}
.c-traf{color:var(--amber);font-weight:700;}
#empty-msg{color:var(--text-dim);font-size:var(--fs-base);text-align:center;padding:1.2rem 0;}
.edit-in{background:var(--bg);border:1px solid var(--accent-dim);color:var(--text);font-family:var(--mono);font-size:var(--fs-base);padding:2px 5px;border-radius:3px;width:100%;min-width:30px;}
.edit-in:focus{outline:none;border-color:var(--accent);}
tr.editing td{background:var(--panel-2);}
.edit-btn{font-size:var(--fs-small);padding:2px 7px;opacity:.45;}
.edit-btn:hover{opacity:1;}

/* Print */
@media print{
  body{background:#fff;color:#000;}
  .checkin,.actions,.tabs-row{display:none!important;}
  header h1,.sec-label,#count{color:#000;}
  .net-meta input{border:none;color:#000;background:#fff;}
  .log-section{border:1px solid #ccc;border-radius:0;background:#fff;}
  th{color:#555;}
  .c-call,.c-traf{color:#000;}
  #view-map{display:none!important;}
}

/* Tabs on log section */
.tabs-row{display:flex;gap:3px;border-bottom:1px solid var(--border);margin-bottom:.7rem;}
.ltab{background:transparent;border:1px solid transparent;border-bottom:none;color:var(--text-dim);font-family:var(--mono);font-size:var(--fs-small);text-transform:uppercase;letter-spacing:.08em;padding:6px 14px;cursor:pointer;border-radius:5px 5px 0 0;margin-bottom:-1px;}
.ltab:hover{color:var(--text);}
.ltab.active{color:var(--accent);background:var(--panel);border-color:var(--border);border-bottom-color:var(--panel);}
.lview{display:none;}
.lview.active{display:block;}

/* Map view */
#net-map-container{width:100%;height:480px;border-radius:7px;overflow:hidden;border:1px solid var(--border);}
.map-bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem;}
.map-bar .spacer{flex:1;}
#mapViewStatus{font-size:var(--fs-label);color:var(--text-dim);}
#mapViewStatus.ok{color:var(--accent);}
#mapSkipped{font-size:var(--fs-small);color:var(--amber);margin-top:.35rem;}
.maplibregl-popup-content{background:var(--panel);color:var(--accent);border:1px solid var(--border);border-radius:5px;font-family:var(--mono);font-size:var(--fs-base);font-weight:700;padding:6px 10px;}
.maplibregl-popup-tip{border-top-color:var(--panel)!important;}
.maplibregl-ctrl-group{background:var(--panel)!important;border:1px solid var(--border)!important;}
.maplibregl-ctrl-group button{background:var(--panel)!important;}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="wrap">

  <header>
    <div class="home-bar">
      <button class="theme-toggle" id="theme-toggle" type="button" onclick="toggleTheme()"
              title="Toggle light / dark theme" aria-label="Toggle light / dark theme"><span id="theme-glyph">&#9728;</span></button>
      <a class="home-link" href="/">⌂ HOME</a>
    </div>
    <h1>Net Check-in Log</h1>
    <p>Log station check-ins during a net operation.</p>
  </header>

  <div class="actions">
    <button class="sbtn" onclick="window.print()" title="Print the log using your browser's print dialog">Print</button>
    <button class="sbtn" onclick="exportCSV()" title="Export all check-ins to a CSV file">Export CSV</button>
    <button class="sbtn" onclick="document.getElementById('importFile').click()" title="Import a previously exported net log CSV">Import CSV</button>
    <input type="file" id="importFile" accept=".csv,text/csv,text/plain" style="display:none" onchange="importCSV(this)">
    <button class="sbtn" onclick="sendToICS309()" title="Copy this log into ICS-309 and open it in a new tab">→ ICS-309</button>
    <button class="sbtn danger" onclick="clearLog()" title="Clear all check-ins and reset the log">Clear</button>
  </div>

  <div class="sec">
    <span class="sec-lbl">Net Details</span>
    <div class="net-meta">
      <div><label for="nn">Net name</label><input type="text" id="nn" placeholder="e.g. ARES/RACES Net"></div>
      <div><label for="nf">Frequency</label><input type="text" id="nf" placeholder="146.520 MHz"></div>
      <div><label for="nc">Net control</label><input type="text" id="nc" placeholder="N0CALL" autocorrect="off" autocapitalize="characters"></div>
      <div><label for="nd">Date (UTC)</label><input type="text" id="nd"></div>      <div><label for="mapFileSel">Map file</label><select id="mapFileSel" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);font-family:var(--mono);font-size:var(--fs-base);padding:4px 8px;border-radius:5px;cursor:pointer;"><option value="">(loading…)</option></select></div>    </div>
  </div>

  <div class="checkin">
    <div class="sec-label">Check-in</div>
    <div class="form-row">
      <div class="field w-call">
        <label for="fc">Callsign</label>
        <div class="call-wrap">
          <input type="text" id="fc" placeholder="N0CALL" autocomplete="off" autocapitalize="characters">
          <span id="lkstat"></span>
          <div id="call-suggestions"></div>
        </div>
      </div>
    </div>
    <div class="form-row-2">
      <div class="field w-name"><label for="fn">Name</label><input type="text" id="fn" placeholder="—"></div>
      <div class="field w-city"><label for="fci">City</label><input type="text" id="fci" placeholder="—"></div>
      <div class="field w-st"><label for="fs">ST</label><input type="text" id="fs" placeholder="—"></div>
      <div class="field w-grid"><label for="fg">Grid</label><input type="text" id="fg" placeholder="—"></div>
      <div class="field">
        <label>&nbsp;</label>
        <div class="traffic-row">
          <input type="checkbox" id="ft" name="traffic">
          <label for="ft">Traffic</label>
        </div>
      </div>
      <div class="field w-notes"><label for="fo">Notes</label><input type="text" id="fo" placeholder="optional"></div>
      <div class="field"><label>&nbsp;</label><button class="sec-btn" onclick="logCheckin()">+ Log</button></div>
    </div>
  </div>

  <div class="log-section">
    <div class="log-hdr">
      <span class="sec-label" style="margin:0;">Log<span id="count"></span></span>
    </div>
    <div class="tabs-row">
      <button class="ltab active" data-lview="log">Check-ins</button>
      <button class="ltab" data-lview="map">Map</button>
    </div>
    <div class="lview active" id="view-log">
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th class="sortable" onclick="sortBy('seq')">#</th>
              <th class="sortable" onclick="sortBy('utc')">UTC</th>
              <th>Local</th>
              <th class="sortable" onclick="sortBy('call')">Callsign</th>
              <th class="sortable" onclick="sortBy('name')">Name</th>
              <th class="sortable" onclick="sortBy('city')">City</th>
              <th class="sortable" onclick="sortBy('state')">ST</th>
              <th>Grid</th>
              <th class="sortable" onclick="sortBy('traffic')">Traffic</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="11" id="empty-msg">No check-ins yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="lview" id="view-map">
      <div class="map-bar">
        <span id="mapViewStatus">No check-ins yet.</span>
        <span class="spacer"></span>
        <button class="sec-btn" id="mapFitBtn">Fit</button>
      </div>
      <div id="net-map-container"></div>
      <div id="mapSkipped"></div>
      <div id="mapNoFile" style="display:none;color:var(--text-dim);font-size:var(--fs-base);text-align:center;padding:2rem 0;">No .pmtiles files found in <code>maps/</code>. Add a PMTiles file and restart the server.</div>
    </div>
  </div>

</div>
<script>
const API = '/api/lookup';
const rows = [];
let seq = 0, lastCall = '';
let sortCol = 'seq', sortDir = 1; // 1=asc, -1=desc

function sortBy(col) {
  if (sortCol === col) { sortDir *= -1; }
  else { sortCol = col; sortDir = 1; }
  document.querySelectorAll('th.sortable').forEach(th => th.classList.remove('sort-asc','sort-desc'));
  const active = [...document.querySelectorAll('th.sortable')].find(th =>
    th.getAttribute('onclick') === 'sortBy(\''+col+'\')'
  );
  if (active) active.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
  rebuildTable();
}

function rebuildTable() {
  // Always sort before rendering so new entries land in the right position
  rows.sort((a, b) => {
    let av = a[sortCol] ?? '', bv = b[sortCol] ?? '';
    if (sortCol === 'seq') { av = +av; bv = +bv; }
    else if (sortCol === 'traffic') { av = av ? 1 : 0; bv = bv ? 1 : 0; }
    else { av = String(av).toLowerCase(); bv = String(bv).toLowerCase(); }
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });
  const tb = document.getElementById('tbody');
  tb.innerHTML = '';
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="11" id="empty-msg">No check-ins yet.</td></tr>';
    return;
  }
  rows.forEach(e => addRow(e));
}

document.getElementById('nd').value = new Date().toISOString().slice(0,10) + ' UTC';

['nn','nf','nc','nd'].forEach(id => document.getElementById(id).addEventListener('input', persist));

loadPersisted();

const fc = document.getElementById('fc');
fc.addEventListener('input', function(){ this.value = this.value.toUpperCase(); clearFill(); setStatus('',''); lastCall=''; this.dataset.lat=''; this.dataset.lon=''; hideSuggestions(); });
fc.addEventListener('keydown', function(e){ if(e.key==='Enter'){e.preventDefault();doLookup();} if(e.key==='Tab'&&this.value&&this.value!==lastCall) doLookup(); });
fc.addEventListener('blur', function(){ setTimeout(hideSuggestions, 150); if(this.value && this.value!==lastCall) doLookup(); });
document.getElementById('fo').addEventListener('keydown', function(e){ if(e.key==='Enter'){e.preventDefault();logCheckin();} });

function setStatus(txt,cls){ const s=document.getElementById('lkstat'); s.textContent=txt; s.className=cls; if(txt!=='?') hideSuggestions(); }

// ── Callsign suggestions (prefix search + Levenshtein rank) ──────────────────
function lev(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

function callPrefix(call){
  // Use the full typed string as the search prefix so "W4M" → "W4M*"
  // and returns W4ME, W4MHI, etc.
  // Fall back to district prefix only if input is ≤2 chars (e.g. "W4").
  if(call.length > 2) return call;
  const m = call.match(/^([A-Z]{1,2}\d)/);
  if(m) return m[1];
  return call;
}

function hideSuggestions(){
  const el=document.getElementById('call-suggestions');
  el.classList.remove('open'); el.innerHTML='';
}

async function suggestCallsigns(typed){
  if(typed.length < 2) return;
  const prefix = callPrefix(typed);
  try{
    const res = await fetch(API+'?callsign='+encodeURIComponent(prefix+'*'));
    const d = await res.json();
    if(!d.ok || !d.prefix || !d.results?.length){ hideSuggestions(); return; }
    // rank by Levenshtein distance to what the user typed
    const ranked = d.results
      .filter(r=>r.callsign)
      .map(r=>({...r, dist:lev(typed, r.callsign)}))
      .sort((a,b)=>a.dist-b.dist)
      .slice(0,10);
    if(!ranked.length){ hideSuggestions(); return; }
    const el=document.getElementById('call-suggestions');
    el.innerHTML=ranked.map(r=>
      `<div class="sug-item" onmousedown="pickSuggestion('${r.callsign}')">`+
      `<span class="sug-call">${x(r.callsign)}</span>`+
      `<span class="sug-name">${x(r.name||'')}</span>`+
      `</div>`
    ).join('');
    el.classList.add('open');
  } catch(_){ hideSuggestions(); }
}

function pickSuggestion(call){
  hideSuggestions();
  const fc=document.getElementById('fc');
  fc.value=call; lastCall='';
  doLookup().then(()=>{ document.getElementById('fn').focus(); });
}

function clearFill(){
  ['fn','fci','fs','fg'].forEach(id=>{ const el=document.getElementById(id); el.value=''; el.classList.remove('filled'); });
}

function autoFill(r){
  const set=(id,v)=>{ const el=document.getElementById(id); el.value=v||''; if(v) el.classList.add('filled'); };
  set('fn',r.name); set('fci',r.city); set('fs',r.state); set('fg',r.grid);
  // Store raw lat/lon from ZIP centroid for accurate map plotting
  document.getElementById('fc').dataset.lat = r.lat ?? '';
  document.getElementById('fc').dataset.lon = r.lon ?? '';
}

async function doLookup(){
  const call = fc.value.trim(); if(!call) return; if(call===lastCall) return;
  lastCall = call; setStatus('…','');
  try {
    const res = await fetch(API+'?callsign='+encodeURIComponent(call));
    const d = await res.json();
    if(!d.ok){ setStatus('err','s-err'); return; }
    if(d.found){ autoFill(d.result); setStatus('✓','s-ok'); document.getElementById('fo').focus(); }
    else { setStatus('?','s-nf'); suggestCallsigns(call); }
  } catch(e){
    setStatus('no API','s-err');
  }
}

function utcNow(){ return new Date().toISOString().slice(11,16)+'Z'; }

function utcToLocal(utcStr){
  // utcStr is like "14:32Z" — combine with today's date to parse
  if (!utcStr) return '';
  const t = utcStr.replace('Z','');
  const iso = new Date().toISOString().slice(0,10) + 'T' + t + ':00Z';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});
}

function logCheckin(){
  const call = fc.value.trim(); if(!call){ fc.focus(); return; }
  seq = rows.length ? Math.max(...rows.map(r => r.seq)) + 1 : 1;
  const e = {
    seq, utc:utcNow(), call,
    name:document.getElementById('fn').value.trim(),
    city:document.getElementById('fci').value.trim(),
    state:document.getElementById('fs').value.trim(),
    grid:document.getElementById('fg').value.trim(),
    lat: fc.dataset.lat ? parseFloat(fc.dataset.lat) : null,
    lon: fc.dataset.lon ? parseFloat(fc.dataset.lon) : null,
    traffic:document.getElementById('ft').checked,
    notes:document.getElementById('fo').value.trim()
  };
  rows.push(e); updateCount(); persist();
  rebuildTable();
  if (window.updateNetMap) window.updateNetMap(rows);
  ['fc','fn','fci','fs','fg','fo'].forEach(id=>{ const el=document.getElementById(id); el.value=''; el.classList.remove('filled'); });
  fc.dataset.lat = ''; fc.dataset.lon = '';
  document.getElementById('ft').checked=false;
  setStatus('',''); lastCall=''; fc.focus();
}

function renderRow(e){
  const tr = document.getElementById('row-'+e.seq);
  tr.className='';
  tr.innerHTML=`<td>${e.seq}</td><td>${x(e.utc)}</td><td>${utcToLocal(e.utc)}</td><td class="c-call">${x(e.call)}</td><td>${x(e.name)}</td><td>${x(e.city)}</td><td>${x(e.state)}</td><td>${x(e.grid)}</td><td>${e.traffic?'<span class="c-traf">Y</span>':''}</td><td class="notes-cell">${x(e.notes)}</td><td style="white-space:nowrap"><button class="sec-btn edit-btn" onclick="editRow(${e.seq})">edit</button> <button class="sec-btn edit-btn" style="color:var(--red)" onclick="deleteRow(${e.seq})">del</button></td>`;
}

function deleteRow(seq){
  const e = rows.find(r=>r.seq===seq);
  if (!e) return;
  if (!confirm('Delete check-in for ' + e.call + '?')) return;
  rows.splice(rows.indexOf(e), 1);
  // Renumber in insertion order (by UTC time, then original seq) before reassigning
  rows.sort((a,b) => a.utc < b.utc ? -1 : a.utc > b.utc ? 1 : 0);
  rows.forEach((r, i) => r.seq = i + 1);
  updateCount(); persist();
  rebuildTable();
  if (window.updateNetMap) window.updateNetMap(rows);
}

function addRow(e){
  const tb=document.getElementById('tbody');
  const em=document.getElementById('empty-msg'); if(em) em.parentNode.remove();
  const tr=document.createElement('tr'); tr.id='row-'+e.seq;
  tb.appendChild(tr); renderRow(e);
}

function editRow(seq){
  const e=rows.find(r=>r.seq===seq);
  const tr=document.getElementById('row-'+seq);
  tr.className='editing';
  tr.innerHTML=`<td>${e.seq}</td>`+
    `<td><input class="edit-in" id="eu-${seq}" value="${xv(e.utc)}" style="width:62px"></td>`+
    `<td style="color:var(--text-dim)">${utcToLocal(e.utc)}</td>`+
    `<td><input class="edit-in" id="ec-${seq}" value="${xv(e.call)}" style="width:75px"></td>`+
    `<td><input class="edit-in" id="en-${seq}" value="${xv(e.name)}" style="width:130px"></td>`+
    `<td><input class="edit-in" id="eci-${seq}" value="${xv(e.city)}" style="width:105px"></td>`+
    `<td><input class="edit-in" id="es-${seq}" value="${xv(e.state)}" style="width:32px"></td>`+
    `<td><input class="edit-in" id="eg-${seq}" value="${xv(e.grid)}" style="width:52px"></td>`+
    `<td style="text-align:center"><input type="checkbox" id="et-${seq}" ${e.traffic?'checked':''} style="accent-color:var(--accent);width:14px;height:14px;cursor:pointer"></td>`+
    `<td class="notes-cell"><input class="edit-in" id="eo-${seq}" value="${xv(e.notes)}"></td>`+
    `<td style="white-space:nowrap;vertical-align:middle">`+
      `<button class="sec-btn" style="margin-right:3px" onclick="saveRow(${seq})">Save</button>`+
      `<button class="sec-btn" onclick="cancelEdit(${seq})">Cancel</button>`+
    `</td>`;
  document.getElementById('ec-'+seq).focus();
}

async function saveRow(seq){
  const e=rows.find(r=>r.seq===seq);
  const oldCall = e.call;
  const newCall = document.getElementById('ec-'+seq).value.trim().toUpperCase();
  e.utc   = document.getElementById('eu-'+seq).value.trim();
  e.call  = newCall;
  e.name  = document.getElementById('en-'+seq).value.trim();
  e.city  = document.getElementById('eci-'+seq).value.trim();
  e.state = document.getElementById('es-'+seq).value.trim();
  e.grid  = document.getElementById('eg-'+seq).value.trim();
  e.traffic = document.getElementById('et-'+seq).checked;
  e.notes = document.getElementById('eo-'+seq).value.trim();
  // Re-fetch FCC data if the callsign was changed
  if (newCall && newCall !== oldCall) {
    try {
      const res = await fetch('/api/lookup?callsign=' + encodeURIComponent(newCall));
      const d = await res.json();
      if (d.ok && d.found) {
        e.name  = d.result.name  || e.name;
        e.city  = d.result.city  || e.city;
        e.state = d.result.state || e.state;
        e.grid  = d.result.grid  || e.grid;
        e.lat   = d.result.lat   != null ? d.result.lat : e.lat;
        e.lon   = d.result.lon   != null ? d.result.lon : e.lon;
      }
    } catch(_) {}
  }
  renderRow(e); persist();
  rebuildTable();
  if (window.updateNetMap) window.updateNetMap(rows);
}

function cancelEdit(seq){ renderRow(rows.find(r=>r.seq===seq)); }

function x(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function xv(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function updateCount(){
  document.getElementById('count').textContent = ' — '+rows.length+' station'+(rows.length!==1?'s':'');
}

function clearLog(){
  if(rows.length && !confirm('Clear all '+rows.length+' check-in'+(rows.length!==1?'s':'')+' ?')) return;
  rows.length=0; seq=0;
  document.getElementById('tbody').innerHTML='<tr><td colspan="11" id="empty-msg">No check-ins yet.</td></tr>';
  document.getElementById('count').textContent=''; persist();
  if (window.updateNetMap) window.updateNetMap(rows);
}

function persist(){
  const header = {
    nn: document.getElementById('nn').value,
    nf: document.getElementById('nf').value,
    nc: document.getElementById('nc').value,
    nd: document.getElementById('nd').value,
  };
  try { localStorage.setItem('net-log', JSON.stringify({rows, seq, header})); } catch(e){}
}

function loadPersisted(){
  try {
    const raw = localStorage.getItem('net-log');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.header) {
      ['nn','nf','nc','nd'].forEach(id => {
        if (data.header[id]) document.getElementById(id).value = data.header[id];
      });
    }
    if (data.rows && data.rows.length) {
      seq = data.seq || 0;
      data.rows.forEach(e => { rows.push(e); addRow(e); });
      updateCount();
      window._netRows = rows;
    }
  } catch(e){}
}

function csv(v){ const s=String(v??''); return /[,"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }

// ── Send to ICS-309 ───────────────────────────────────────────────────────────
function sendToICS309() {
  if (!rows.length) { showToast('No check-ins to send.', 'err'); return; }

  const nn = document.getElementById('nn').value.trim();
  const nc = document.getElementById('nc').value.trim();
  const nd = document.getElementById('nd').value.trim();
  const nf = document.getElementById('nf').value.trim();

  // Build a UTC time string HHmmZ from an ISO timestamp (e.g. "2026-06-13T18:05:00.000Z")
  function toHHmmZ(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return String(d.getUTCHours()).padStart(2,'0') + String(d.getUTCMinutes()).padStart(2,'0') + 'Z';
  }

  // Map each check-in row to an ICS-309 log row.
  // Format: time=HHmmZ, msg="name — city, state [notes]", fcs=station call, tcs=net control call
  const ics309rows = rows.map(r => {
    const parts = [];
    if (r.name)  parts.push(r.name);
    if (r.city || r.state) parts.push([r.city, r.state].filter(Boolean).join(', '));
    if (r.notes) parts.push(r.notes);
    if (r.traffic) parts.push('(traffic)');
    return {
      time: toHHmmZ(r.utc),
      msg:  parts.join(' — '),
      fcs:  r.call || '',
      fmn:  '',
      tcs:  nc,
      tmn:  '',
    };
  });

  // Write into the ICS-309 localStorage store
  const payload = {
    'f-inc':       nn || 'Net Log',
    'f-net':       nn + (nf ? ' (' + nf + ')' : ''),
    'f-df':        nd,
    'f-dt':        nd,
    'f-tf':        rows.length ? toHHmmZ(rows[0].utc) : '',
    'f-tt':        rows.length ? toHHmmZ(rows[rows.length-1].utc) : '',
    'f-op-name':   '',
    'f-op-call':   nc,
    'f-op-sig':    '',
    'f-prep-name': '',
    'f-prep-pos':  '',
    'f-prep-dt':   '',
    rows: ics309rows,
  };

  try {
    localStorage.setItem('ics-309', JSON.stringify(payload));
  } catch(e) {
    showToast('Could not write to localStorage: ' + e.message, 'err', 6000);
    return;
  }

  showToast('✓ ' + rows.length + ' check-in' + (rows.length !== 1 ? 's' : '') + ' sent to ICS-309', 'ok', 4000);
  window.open('/static/ics-309/ics-309.html', '_blank');
}

function exportCSV(){
  const meta = [
    '# Net: '+csv(document.getElementById('nn').value),
    '# Freq: '+csv(document.getElementById('nf').value),
    '# NCS: '+csv(document.getElementById('nc').value),
    '# Date: '+csv(document.getElementById('nd').value),
    '# Exported: '+new Date().toISOString()
  ];
  const hdr = ['#','UTC','Callsign','Name','City','State','Grid','Traffic','Notes'].join(',');
  const body = rows.map(e=>[e.seq,e.utc,e.call,e.name,e.city,e.state,e.grid,e.traffic?'Y':'',e.notes].map(csv).join(','));
  const blob = new Blob([[...meta,hdr,...body].join('\r\n')],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download='net-log-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}

function importCSV(input) {
  const file = input.files[0];
  if (!file) return;
  if (rows.length && !confirm('Import CSV? This will replace the current log.')) {
    input.value = ''; return;
  }
  const reader = new FileReader();
  reader.onerror = () => { showToast('Could not read file.', 'err'); input.value = ''; };
  reader.onload = function(e) {
    try {
      const lines = e.target.result.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');

      function parseLine(line) {
        const fields = []; let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') {
            if (inQ && line[i+1] === '"') { cur += '"'; i++; }
            else inQ = !inQ;
          } else if (c === ',' && !inQ) { fields.push(cur); cur = ''; }
          else cur += c;
        }
        fields.push(cur);
        return fields;
      }

      const header = {}, imported = [];
      let pastHeader = false;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        // Meta comment lines
        if (trimmed.startsWith('# Net: '))  { header.nn = trimmed.slice(7).trim(); return; }
        if (trimmed.startsWith('# Freq: ')) { header.nf = trimmed.slice(8).trim(); return; }
        if (trimmed.startsWith('# NCS: '))  { header.nc = trimmed.slice(7).trim(); return; }
        if (trimmed.startsWith('# Date: ')) { header.nd = trimmed.slice(8).trim(); return; }
        if (trimmed.startsWith('#')) return; // other comment lines

        const fields = parseLine(trimmed);
        // Skip the column header row
        if (!pastHeader && fields[0].trim() === '#') { pastHeader = true; return; }
        if (!pastHeader) { pastHeader = true; } // no header row found, proceed

        if (fields.length < 3) return;
        const seqN = parseInt(fields[0]);
        if (isNaN(seqN)) return;
        imported.push({
          seq:     seqN,
          utc:     (fields[1]||'').trim(),
          call:    (fields[2]||'').trim().toUpperCase(),
          name:    (fields[3]||'').trim(),
          city:    (fields[4]||'').trim(),
          state:   (fields[5]||'').trim(),
          grid:    (fields[6]||'').trim(),
          traffic: (fields[7]||'').trim().toUpperCase() === 'Y',
          notes:   (fields[8]||'').trim(),
          lat:     null,
          lon:     null,
        });
      });

      if (!imported.length) { showToast('No check-in rows found in file.', 'err'); input.value = ''; return; }

      // Apply to form
      rows.length = 0; seq = 0;
      document.getElementById('tbody').innerHTML = '<tr><td colspan="11" id="empty-msg">No check-ins yet.</td></tr>';

      if (header.nn) document.getElementById('nn').value = header.nn;
      if (header.nf) document.getElementById('nf').value = header.nf;
      if (header.nc) document.getElementById('nc').value = header.nc;
      if (header.nd) document.getElementById('nd').value = header.nd;

      imported.forEach(e => { rows.push(e); addRow(e); seq = Math.max(seq, e.seq); });
      updateCount();
      persist();
      if (window.updateNetMap) window.updateNetMap(rows);
      input.value = '';
      showToast('Imported ' + imported.length + ' check-in' + (imported.length !== 1 ? 's' : '') + '.', 'ok');
    } catch(err) {
      showToast('Import failed: ' + err.message, 'err', 5000);
      input.value = '';
    }
  };
  reader.readAsText(file);
}

// ---- Tab switching ----
document.querySelectorAll('.ltab').forEach(tab => {

<script src="/map-assets/maplibre-gl.js"></script>
<script src="/map-assets/pmtiles.js"></script>
<script>
(function(){
  'use strict';

  const origin = window.location.origin;
  let currentFile = null;

  // PMTiles protocol — tiles read directly from a .pmtiles archive via HTTP
  // range requests (no MBTiles server endpoint involved).
  maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);

  // Maidenhead grid square → center [lon, lat]
  // Supports 4-char (e.g. EM65) and 6-char (e.g. EM65ab) squares
  function gridToLatLon(grid) {
    if (!grid || grid.length < 4) return null;
    const g = grid.toUpperCase();
    const A = g.charCodeAt(0) - 65;
    const B = g.charCodeAt(1) - 65;
    const C = parseInt(g[2], 10);
    const D = parseInt(g[3], 10);
    if (isNaN(C) || isNaN(D) || A < 0 || A > 17 || B < 0 || B > 17) return null;
    let lon = (A * 20) - 180 + (C * 2);
    let lat = (B * 10) - 90 + D;
    if (g.length >= 6) {
      const E = g.charCodeAt(4) - 65;
      const F = g.charCodeAt(5) - 65;
      if (E >= 0 && E < 24 && F >= 0 && F < 24) {
        lon += (E * 5/60) + (2.5/60);
        lat += (F * 2.5/60) + (1.25/60);
      } else {
        lon += 1.0; lat += 0.5;
      }
    } else {
      lon += 1.0; lat += 0.5;
    }
    return [lon, lat];
  }

  function buildStyle(file) {
    const tilesUrl = 'pmtiles://' + origin + '/maps/' + file;
    return {
      version: 8,
      glyphs: origin + '/map-assets/fonts/{fontstack}/{range}.pbf',
      sources: { map: { type: 'vector', url: tilesUrl } },
      layers: [
        { id: 'background', type: 'background', paint: { 'background-color': '#1a1f2e' } },
        { id: 'water-poly', type: 'fill', source: 'map', 'source-layer': 'water',
          paint: { 'fill-color': '#0d2d50', 'fill-opacity': 0.95 } },
        { id: 'park-fill', type: 'fill', source: 'map', 'source-layer': 'park',
          paint: { 'fill-color': '#14311a', 'fill-opacity': 0.7 } },
        { id: 'landuse-fill', type: 'fill', source: 'map', 'source-layer': 'landuse',
          filter: ['match', ['get', 'class'], ['residential', 'commercial', 'industrial'], true, false],
          paint: { 'fill-color': '#161b2e', 'fill-opacity': 0.85 } },
        { id: 'buildings', type: 'fill', source: 'map', 'source-layer': 'building',
          minzoom: 13,
          paint: { 'fill-color': '#1e2540', 'fill-outline-color': '#2e3d66', 'fill-opacity': 0.8 } },
        { id: 'waterways', type: 'line', source: 'map', 'source-layer': 'waterway',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#1565c0', 'line-width': ['interpolate',['linear'],['zoom'],8,1.5,14,5], 'line-opacity': 0.9 } },
        { id: 'roads-casing', type: 'line', source: 'map', 'source-layer': 'transportation',
          filter: ['match', ['get', 'class'], ['motorway','trunk','primary','secondary','tertiary'], true, false],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#000', 'line-opacity': 0.6, 'line-width': ['interpolate',['linear'],['zoom'],8,['match',['get','class'],['motorway','trunk'],5,'primary',3,'secondary',2,1],16,['match',['get','class'],['motorway','trunk'],20,'primary',14,'secondary',10,'tertiary',7,4]] } },
        { id: 'roads-fill', type: 'line', source: 'map', 'source-layer': 'transportation',
          filter: ['match', ['get', 'class'], ['motorway','trunk','primary','secondary','tertiary'], true, false],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': ['match',['get','class'],['motorway','trunk'],'#ff6b00','primary','#e8960a','secondary','#c9b40a','tertiary','#888899','#555566'],
            'line-width': ['interpolate',['linear'],['zoom'],6,['match',['get','class'],['motorway','trunk'],2,'primary',1,0.5],16,['match',['get','class'],['motorway','trunk'],18,'primary',12,'secondary',8,'tertiary',5,3]] } },
        { id: 'road-labels', type: 'symbol', source: 'map', 'source-layer': 'transportation_name',
          minzoom: 13,
          layout: { 'symbol-placement': 'line', 'text-field': ['get','name'], 'text-font': ['Open Sans Regular'], 'text-size': 11, 'text-max-angle': 30, 'text-allow-overlap': false },
          paint: { 'text-color': '#e8e8ff', 'text-halo-color': '#080810', 'text-halo-width': 1.5 } },
        { id: 'place-labels', type: 'symbol', source: 'map', 'source-layer': 'place',
          filter: ['match', ['get', 'class'], ['city', 'town', 'village', 'suburb'], true, false],
          layout: { 'text-field': ['get','name'], 'text-font': ['Open Sans Regular'], 'text-size': ['interpolate',['linear'],['zoom'],6,10,12,14], 'text-anchor': 'left', 'text-offset': [0.5,0], 'text-allow-overlap': false },
          paint: { 'text-color': '#d7e0ea', 'text-halo-color': '#0d1117', 'text-halo-width': 1.5 } }
      ]
    };
  }

  let netMap = null;
  let stationMarkers = [];

  function initMap(file) {
    if (netMap) { netMap.remove(); netMap = null; stationMarkers = []; }
    currentFile = file;
    netMap = new maplibregl.Map({
      container: 'net-map-container',
      style: buildStyle(file),
      zoom: 4,
      center: [-98, 38],
      attributionControl: false
    });
    netMap.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
    netMap.on('load', () => { plotRows(window._netRows || []); });
  }

  function clearMarkers() {
    stationMarkers.forEach(m => m.remove());
    stationMarkers = [];
  }

  function plotRows(rows) {
    clearMarkers();
    const statusEl = document.getElementById('mapViewStatus');
    const skippedEl = document.getElementById('mapSkipped');

    if (!rows || !rows.length) {
      statusEl.textContent = 'No check-ins yet.';
      statusEl.className = '';
      skippedEl.textContent = '';
      return;
    }

    const plotted = [];
    const skipped = [];

    rows.forEach(r => {
      // Prefer ZIP-centroid lat/lon from FCC API; fall back to grid math
      let ll = null;
      if (r.lat != null && r.lon != null) {
        ll = [r.lon, r.lat];
      } else {
        ll = gridToLatLon(r.grid);
      }
      if (!ll) { skipped.push(r.call + (r.grid ? ' ('+r.grid+')' : ' (no grid)')); return; }

      // Canvas dot marker — stable anchor, no wrapper div
      const canvas = document.createElement('canvas');
      canvas.width = 13; canvas.height = 13;
      canvas.style.width = '13px'; canvas.style.height = '13px';
      canvas.style.cursor = 'pointer';
      const ctx = canvas.getContext('2d');
      ctx.beginPath();
      ctx.arc(6.5, 6.5, 5, 0, 2 * Math.PI);
      ctx.fillStyle = '#00d98b';
      ctx.fill();
      ctx.strokeStyle = '#0d1117';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Glow
      ctx.beginPath();
      ctx.arc(6.5, 6.5, 5.5, 0, 2 * Math.PI);
      ctx.strokeStyle = 'rgba(0,217,139,0.35)';
      ctx.lineWidth = 3;
      ctx.stroke();

      const popup = new maplibregl.Popup({ offset: 10, closeButton: false })
        .setText(r.call);

      const marker = new maplibregl.Marker({ element: canvas, anchor: 'center' })
        .setLngLat(ll)
        .setPopup(popup)
        .addTo(netMap);
      stationMarkers.push(marker);

      // Callsign label — separate marker anchored bottom, offset above the dot
      const labelEl = document.createElement('div');
      labelEl.textContent = r.call;
      labelEl.style.cssText = [
        'font-family:ui-monospace,\'SF Mono\',monospace',
        'font-size:10px','font-weight:700','color:#00d98b',
        'text-shadow:0 0 3px #0d1117,0 0 3px #0d1117,-1px -1px 0 #0d1117,1px 1px 0 #0d1117',
        'white-space:nowrap','pointer-events:none','line-height:1'
      ].join(';');
      const labelMarker = new maplibregl.Marker({ element: labelEl, anchor: 'bottom', offset: [0, -9] })
        .setLngLat(ll)
        .addTo(netMap);
      stationMarkers.push(labelMarker);

      plotted.push(r.call);
    });

    statusEl.textContent = plotted.length + ' station' + (plotted.length !== 1 ? 's' : '') + ' plotted.';
    statusEl.className = plotted.length ? 'ok' : '';

    if (skipped.length) {
      skippedEl.textContent = '⚠ No grid: ' + skipped.join(', ');
    } else {
      skippedEl.textContent = '';
    }

    // Auto-fit to plotted stations
    if (plotted.length) {
      const coords = rows.map(r => {
        if (r.lat != null && r.lon != null) return [r.lon, r.lat];
        return gridToLatLon(r.grid);
      }).filter(Boolean);
      if (coords.length === 1) {
        netMap.flyTo({ center: coords[0], zoom: 9, duration: 600 });
      } else {
        const lons = coords.map(c => c[0]);
        const lats = coords.map(c => c[1]);
        netMap.fitBounds(
          [[Math.min(...lons)-0.5, Math.min(...lats)-0.5], [Math.max(...lons)+0.5, Math.max(...lats)+0.5]],
          { padding: 60, duration: 600 }
        );
      }
    }
  }

  // Populate the map file dropdown from /api/browse
  async function populateMapSel() {
    const sel = document.getElementById('mapFileSel');
    const noFile = document.getElementById('mapNoFile');
    const container = document.getElementById('net-map-container');
    try {
      const res = await fetch('/api/browse?path=maps');
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      const files = (data.entries || []).filter(e => e.name.endsWith('.pmtiles'));
      if (!files.length) {
        sel.style.display = 'none';
        container.style.display = 'none';
        noFile.style.display = '';
        return;
      }
      sel.innerHTML = files.map(f => `<option value="${f.name}">${f.name.replace(/\.pmtiles$/,'')}</option>`).join('');
      sel.style.display = '';
    } catch(e) {
      sel.innerHTML = '<option>(error loading files)</option>';
    }
  }

  window.showNetMap = function() {
    const sel = document.getElementById('mapFileSel');
    const chosen = sel.value;
    if (!chosen) { populateMapSel(); return; }
    if (!netMap || currentFile !== chosen) {
      initMap(chosen);
    } else {
      netMap.resize();
      plotRows(window._netRows || []);
    }
  };

  window.updateNetMap = function(rows) {
    window._netRows = rows;
    if (document.getElementById('view-map').classList.contains('active')) {
      plotRows(rows);
    }
  };

  document.getElementById('mapFileSel').addEventListener('change', function() {
    if (document.getElementById('view-map').classList.contains('active')) {
      initMap(this.value);
    }
  });

  document.getElementById('mapFitBtn').addEventListener('click', function() {
    if (!netMap || !window._netRows || !window._netRows.length) return;
    const coords = (window._netRows).map(r => {
      if (r.lat != null && r.lon != null) return [r.lon, r.lat];
      return gridToLatLon(r.grid);
    }).filter(Boolean);
    if (!coords.length) return;
    if (coords.length === 1) { netMap.flyTo({ center: coords[0], zoom: 9 }); return; }
    const lons = coords.map(c=>c[0]), lats = coords.map(c=>c[1]);
    netMap.fitBounds([[Math.min(...lons)-.5,Math.min(...lats)-.5],[Math.max(...lons)+.5,Math.max(...lats)+.5]],{padding:60,duration:600});
  });

  populateMapSel();
})();

function showToast(msg, type, duration) {
  duration = duration || 3500;
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.className = 'toast'; }, duration);
}
</script>
