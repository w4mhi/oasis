<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Card</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.wrap { max-width: 1280px; }
.op    { color: var(--amber); font-size: .82rem; white-space: nowrap;
         width: 220px; vertical-align: top; padding-top: 7px; }
.steps { color: var(--text); font-size: .82rem; vertical-align: top;
         white-space: pre-wrap; line-height: 1.55; }
tr.row-section td {
  background: var(--panel-2);
  color: var(--text-dim);
  font-size: .6rem;
  text-transform: uppercase;
  letter-spacing: .12em;
  padding: 6px 8px 5px;
  border-bottom: 1px solid var(--border);
}
tr.empty-steps .op { color: var(--text-dim); }
.na { color: var(--border); }
#load-error {
  color: var(--text-dim);
  font-size: var(--fs-small);
  padding: 1rem .2rem;
}
@media print {
  body { background: #fff; color: #000; }
  header { background: #fff !important; border-color: #ccc !important; }
  header h1, header p { color: #000 !important; }
  .actions { display: none !important; }
  .tbl-wrap { overflow: visible; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #ccc !important; }
  tr.row-section td { background: #eee !important; color: #444 !important; }
  .op { color: #555 !important; }
  .steps { color: #000 !important; }
  .na { color: #aaa !important; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="home-link" href="/">🏠 HOME</a>
    <a class="home-link" href="index.html" style="margin-left:.6rem">← Radio Cards</a>
    <h1 id="radio-title">…</h1>
    <p id="radio-subtitle">Radio reference card</p>
  </header>

  <div class="actions">
    <button class="sbtn" onclick="window.print()" title="Print this reference card">🖨 Print</button>
    <button class="sbtn" onclick="savePage()" title="Download this card as a standalone HTML file">Save</button>
  </div>

  <div class="sec">
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Operation</th><th>Steps</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="2" id="load-error">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

</div>
<script>
'use strict';

const METADATA_KEYS = ['Brand', 'Color', 'FormFactor'];
const TAG_OPS    = ['Dual Watch', 'GPS/APRS', 'Bluetooth'];
const TXPOWER_OP = 'TX Power';
const POLL_MS    = 10000;

function isPresent(v) {
  const s = (v || '').trim();
  return s && s !== 'N/A' && s.toUpperCase() !== 'TBD' && s !== '—';
}

// Frequency (MHz) → ham band name
const FREQ_MAP = [
  { min: 1.8,  max: 30,   label: 'HF'    },  // 160m – 10m
  { min: 50,   max: 54,   label: '6m'    },
  { min: 144,  max: 148,  label: '2m'    },
  { min: 222,  max: 226,  label: '1.25m' },
  { min: 420,  max: 450,  label: '70cm'  },
  { min: 902,  max: 928,  label: '33cm'  },
  { min: 1240, max: 1300, label: '23cm'  },
];
const BAND_NAME_RES = [
  { re: /\b(HF|160m|80m|60m|40m|30m|20m|17m|15m|12m|10m)\b/i, label: 'HF'    },
  { re: /\b6m\b/i,                                              label: '6m'    },
  { re: /\b4m\b/i,                                              label: '4m'    },
  { re: /\b2m\b/i,                                              label: '2m'    },
  { re: /\b1\.25m\b/i,                                          label: '1.25m' },
  { re: /\b70cm\b/i,                                            label: '70cm'  },
  { re: /\b33cm\b/i,                                            label: '33cm'  },
  { re: /\b23cm\b/i,                                            label: '23cm'  },
];
const BAND_ORDER = ['HF', '6m', '4m', '2m', '1.25m', '70cm', '33cm', '23cm'];

function freqToLabel(mhz) {
  const f = parseFloat(mhz);
  for (const b of FREQ_MAP) { if (f >= b.min && f <= b.max) return b.label; }
  return null;
}

function scanBands(text, seen) {
  for (const b of BAND_NAME_RES) { if (b.re.test(text)) seen.add(b.label); }
  for (const m of text.matchAll(/\b(\d+(?:\.\d+)?)\s*mhz/gi)) {
    const lbl = freqToLabel(m[1]); if (lbl) seen.add(lbl);
  }
}

function parseBand(bandOp) {
  if (!isPresent(bandOp)) return '';
  const seen = new Set();
  const txRe = /TX\s*\[([^\]]*)\]([^;]*)/gi;
  let m, hasTx = false;
  while ((m = txRe.exec(bandOp)) !== null) {
    hasTx = true;
    scanBands(m[1], seen);
    const paren = m[2].match(/\((\d[^)]+)\)/);
    if (paren) {
      if (/^[\d/]+$/.test(paren[1])) {
        for (const n of paren[1].split('/')) { const l = freqToLabel(n); if (l) seen.add(l); }
      } else {
        scanBands(paren[1], seen);
      }
    }
  }
  if (!hasTx) {
    const slash = bandOp.match(/(\d+(?:\/\d+)+)\s*mhz/i);
    if (slash) {
      for (const n of slash[1].split('/')) { const l = freqToLabel(n); if (l) seen.add(l); }
    } else {
      scanBands(bandOp, seen);
    }
  }
  return BAND_ORDER.filter(b => seen.has(b)).join('/');
}

// Digital mode tag: reads the 'Digital Modes' data row directly
function parseModes(digitalModesCell) {
  return isPresent(digitalModesCell) ? digitalModesCell.trim() : '';
}

// ── CSV parser ────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  const src = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  let cur = '', inQ = false, fields = [];
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (inQ) {
      if (c === '"' && src[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') { inQ = false; }
      else { cur += c; }
    } else {
      if (c === '"') { inQ = true; }
      else if (c === ',') { fields.push(cur); cur = ''; }
      else if (c === '\n') {
        fields.push(cur); cur = '';
        if (fields.some(f => f.trim())) rows.push(fields);
        fields = [];
      } else { cur += c; }
    }
  }
  fields.push(cur);
  if (fields.some(f => f.trim())) rows.push(fields);
  return rows;
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Render table for the selected radio ──────────────────────────────────────
function renderRadio(rows, radioName) {
  const tbody = document.getElementById('tbody');

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="2" id="load-error">CSV is empty.</td></tr>';
    return;
  }

  const headers = rows[0].map(h => h.trim());
  const colIdx  = headers.indexOf(radioName);

  if (colIdx === -1) {
    tbody.innerHTML =
      '<tr><td colspan="2" id="load-error">Radio "' + esc(radioName) +
      '" not found in radio-cards.csv. Check the column header spelling.</td></tr>';
    return;
  }

  // Extract metadata and data values for this radio
  let accentColor = 'var(--accent)';
  const metaVals  = Object.create(null);
  const dataVals  = Object.create(null);
  for (const row of rows.slice(1)) {
    const op  = (row[0] || '').trim();
    const val = (row[colIdx] || '').trim();
    if (!op) continue;
    if (op === 'Color') accentColor = val || accentColor;
    if (METADATA_KEYS.includes(op)) { metaVals[op] = val; }
    else { dataVals[op] = val; }
  }

  // Build subtitle: FormFactor · Band · TXmax · presence tags
  const subtitleParts = [];
  if (metaVals['FormFactor']) subtitleParts.push(metaVals['FormFactor']);
  const band  = parseBand(dataVals['Band Operation']);
  const modes = parseModes(dataVals['Digital Modes']);
  if (band)  subtitleParts.push(band);
  if (modes) subtitleParts.push(modes);
  const txRaw = dataVals[TXPOWER_OP] || '';
  const txMatch = txRaw.match(/(\d+(?:\.\d+)?)\s*W/i);
  if (txMatch) subtitleParts.push(txMatch[1] + 'W');
  TAG_OPS.forEach(op => { if (isPresent(dataVals[op])) subtitleParts.push(op); });
  const cardType = subtitleParts.join(' · ') || 'Radio reference card';

  // Update page title and header
  document.title = radioName;
  const titleEl    = document.getElementById('radio-title');
  const subtitleEl = document.getElementById('radio-subtitle');
  titleEl.textContent    = radioName;
  titleEl.style.color    = accentColor;
  subtitleEl.textContent = cardType;

  // Build table rows (skip metadata rows)
  const html = [];
  for (const row of rows.slice(1)) {
    const op    = (row[0]       || '').trim();
    const steps = (row[colIdx]  || '').trim();

    if (!op) continue;
    if (METADATA_KEYS.includes(op)) continue;

    // Section row: operation present, every radio column is blank
    const isSection = headers.slice(1).every((_, i) => !(row[i + 1] || '').trim());
    if (isSection) {
      html.push('<tr class="row-section"><td colspan="2">' + esc(op) + '</td></tr>');
      continue;
    }

    const hasSteps = steps !== '';
    const rowClass = hasSteps ? '' : ' class="empty-steps"';
    const stepsHtml = hasSteps ? esc(steps) : '<span class="na">—</span>';
    html.push(
      '<tr' + rowClass + '>' +
        '<td class="op">'    + esc(op)    + '</td>' +
        '<td class="steps">' + stepsHtml  + '</td>' +
      '</tr>'
    );
  }

  tbody.innerHTML = html.join('');
}

// ── Save standalone page ─────────────────────────────────────────────────────
function savePage() {
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = document.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.html';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Fetch + poll ─────────────────────────────────────────────────────────────
const radioName  = new URLSearchParams(location.search).get('radio') || '';
let   lastCSVText = null;

if (!radioName) {
  document.getElementById('radio-title').textContent = 'No radio selected';
  document.getElementById('tbody').innerHTML =
    '<tr><td colspan="2" id="load-error">No <code>?radio=</code> parameter in URL. ' +
    '<a href="index.html">← Back to Radio Cards</a></td></tr>';
} else {
  async function loadCSV() {
    try {
      const res  = await fetch('radio-cards.csv?_=' + Date.now());
      const text = await res.text();
      if (text !== lastCSVText) {
        lastCSVText = text;
        renderRadio(parseCSV(text), radioName);
      }
    } catch (err) {
      if (lastCSVText === null) {
        document.getElementById('tbody').innerHTML =
          '<tr><td colspan="2" id="load-error">Could not load radio-cards.csv — ' +
          'serving from a local server is required.</td></tr>';
      }
    }
  }

  loadCSV();
  setInterval(loadCSV, POLL_MS);
}
</script>
</body>
</html>
