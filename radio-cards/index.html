<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OASIS - Radio Cards</title>
<link rel="stylesheet" href="../css/common.css">
<style>
.group-label {
  font-size: var(--fs-small);
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--amber);
  margin: 1.3rem .2rem .6rem;
}
.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: .7rem;
}
@media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

a.card {
  display: block;
  text-decoration: none;
  color: var(--text);
  border: 1px solid color-mix(in srgb, var(--cardaccent, var(--accent)) 35%, transparent);
  border-radius: 6px;
  background: var(--panel);
  padding: .9rem 1rem;
  transition: border-color .3s, background .15s;
}
a.card:hover { background: var(--panel-2); border-color: var(--cardaccent, var(--accent)); }
/* Light mode: bright per-card accents glow on the pale background — mix each
   with charcoal so the hue stays but renders dark and readable. */
:root[data-theme="light"] a.card { border-color: color-mix(in srgb, var(--cardaccent, var(--accent)) 50%, #1c2430); }
:root[data-theme="light"] a.card:hover { border-color: color-mix(in srgb, var(--cardaccent, var(--accent)) 60%, #1c2430); }
:root[data-theme="light"] .card-model { color: color-mix(in srgb, var(--cardaccent, var(--accent)) 45%, #1c2430); }
.card-model {
  font-size: var(--fs-subtitle);
  font-weight: 700;
  color: var(--cardaccent, var(--accent));
  letter-spacing: .03em;
}
.card-type {
  font-size: var(--fs-label);
  color: var(--text-dim);
  margin-top: .3rem;
}
#content-error {
  color: var(--text-dim);
  font-size: var(--fs-small);
  padding: 1rem .2rem;
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="home-link" href="/">⌂ HOME</a>
    <h1>Radio Cards</h1>
    <p>Quick-reference cards for field use — operations, menus, and memory programming.</p>
  </header>

  <div id="content"></div>

  <footer style="text-align:center;color:var(--text-dim);font-size:var(--fs-small);margin-top:1.8rem;padding-bottom:1rem;">
    Offline reference &middot; no network required
  </footer>

</div>
<script>
'use strict';

const METADATA_KEYS = ['Brand', 'Color', 'FormFactor'];
const TAG_OPS    = ['Dual Watch', 'GPS/APRS', 'Bluetooth'];
const TXPOWER_OP = 'TX Power';
const POLL_MS    = 10000;

function isPresent(v) {
  const s = (v || '').trim();
  return s && s !== 'N/A' && s.toUpperCase() !== 'TBD' && s !== '—';
}

// Frequency (MHz) → ham band name
const FREQ_MAP = [
  { min: 1.8,  max: 30,   label: 'HF'    },  // 160m – 10m
  { min: 50,   max: 54,   label: '6m'    },
  { min: 144,  max: 148,  label: '2m'    },
  { min: 222,  max: 226,  label: '1.25m' },
  { min: 420,  max: 450,  label: '70cm'  },
  { min: 902,  max: 928,  label: '33cm'  },
  { min: 1240, max: 1300, label: '23cm'  },
];
// Named band patterns that map to canonical labels (HF bands collapse to 'HF')
const BAND_NAME_RES = [
  { re: /\b(HF|160m|80m|60m|40m|30m|20m|17m|15m|12m|10m)\b/i, label: 'HF'    },
  { re: /\b6m\b/i,                                              label: '6m'    },
  { re: /\b4m\b/i,                                              label: '4m'    },
  { re: /\b2m\b/i,                                              label: '2m'    },
  { re: /\b1\.25m\b/i,                                          label: '1.25m' },
  { re: /\b70cm\b/i,                                            label: '70cm'  },
  { re: /\b33cm\b/i,                                            label: '33cm'  },
  { re: /\b23cm\b/i,                                            label: '23cm'  },
];
const BAND_ORDER = ['HF', '6m', '4m', '2m', '1.25m', '70cm', '33cm', '23cm'];

function freqToLabel(mhz) {
  const f = parseFloat(mhz);
  for (const b of FREQ_MAP) { if (f >= b.min && f <= b.max) return b.label; }
  return null;
}

// Scan a text fragment for band names and frequencies; add to seen Set
function scanBands(text, seen) {
  for (const b of BAND_NAME_RES) { if (b.re.test(text)) seen.add(b.label); }
  for (const m of text.matchAll(/\b(\d+(?:\.\d+)?)\s*mhz/gi)) {
    const lbl = freqToLabel(m[1]); if (lbl) seen.add(lbl);
  }
}

// Extract compact TX band string (e.g. "2m/70cm", "HF/6m/2m/70cm")
function parseBand(bandOp) {
  if (!isPresent(bandOp)) return '';
  const seen = new Set();
  // Try TX sections first: "TX [bracket] (parens)"
  const txRe = /TX\s*\[([^\]]*)\]([^;]*)/gi;
  let m, hasTx = false;
  while ((m = txRe.exec(bandOp)) !== null) {
    hasTx = true;
    scanBands(m[1], seen);                     // scan bracket content
    const paren = m[2].match(/\((\d[^)]+)\)/);
    if (paren) {
      // slash-separated bare numbers: (144/430)
      if (/^[\d/]+$/.test(paren[1])) {
        for (const n of paren[1].split('/')) { const l = freqToLabel(n); if (l) seen.add(l); }
      } else {
        scanBands(paren[1], seen);             // scan paren content
      }
    }
  }
  if (!hasTx) {
    // No TX keyword — simple formats: "144/430 MHZ" or "144MHz, 430MHz ..."
    const slash = bandOp.match(/(\d+(?:\/\d+)+)\s*mhz/i);
    if (slash) {
      for (const n of slash[1].split('/')) { const l = freqToLabel(n); if (l) seen.add(l); }
    } else {
      scanBands(bandOp, seen);
    }
  }
  return BAND_ORDER.filter(b => seen.has(b)).join('/');
}

// Digital mode tag: reads the 'Digital Modes' data row directly
function parseModes(digitalModesCell) {
  return isPresent(digitalModesCell) ? digitalModesCell.trim() : '';
}

function buildSubtitle(meta, data, radio) {
  const parts = [];
  if (meta['FormFactor'][radio]) parts.push(meta['FormFactor'][radio]);
  const band  = parseBand(data['Band Operation']);
  const modes = parseModes(data['Digital Modes']);
  if (band)  parts.push(band);
  if (modes) parts.push(modes);
  const txRaw = data[TXPOWER_OP] || '';
  const txMatch = txRaw.match(/(\d+(?:\.\d+)?)\s*W/i);
  if (txMatch) parts.push(txMatch[1] + 'W');
  TAG_OPS.forEach(op => { if (isPresent(data[op])) parts.push(op); });
  return parts.join(' · ');
}

// ── CSV parser (handles quoted fields with embedded commas/newlines) ──────────
function parseCSV(text) {
  const rows = [];
  const src = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  let cur = '', inQ = false, fields = [];
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (inQ) {
      if (c === '"' && src[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') { inQ = false; }
      else { cur += c; }
    } else {
      if (c === '"') { inQ = true; }
      else if (c === ',') { fields.push(cur); cur = ''; }
      else if (c === '\n') {
        fields.push(cur); cur = '';
        if (fields.some(f => f.trim())) rows.push(fields);
        fields = [];
      } else { cur += c; }
    }
  }
  fields.push(cur);
  if (fields.some(f => f.trim())) rows.push(fields);
  return rows;
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Render index from parsed CSV rows ────────────────────────────────────────
function renderIndex(rows) {
  if (!rows.length) return;

  const headers = rows[0].map(h => h.trim());   // ['Operation', 'FT-2DR', ...]
  const radioNames = headers.slice(1);           // column names = radio names

  // Extract metadata rows and data rows per radio
  const meta      = {};
  const radioData = Object.create(null);
  METADATA_KEYS.forEach(k => { meta[k] = {}; });
  radioNames.forEach(name => { radioData[name] = Object.create(null); });

  for (const row of rows.slice(1)) {
    const op = (row[0] || '').trim();
    if (!op) continue;
    if (METADATA_KEYS.includes(op)) {
      radioNames.forEach((name, i) => {
        meta[op][name] = (row[i + 1] || '').trim();
      });
    } else {
      radioNames.forEach((name, i) => {
        radioData[name][op] = (row[i + 1] || '').trim();
      });
    }
  }

  // Group radios by brand, preserving CSV column order
  const brandOrder = [];
  const brandMap   = Object.create(null);
  for (const radio of radioNames) {
    const brand = meta['Brand'][radio] || 'Other';
    if (!brandMap[brand]) { brandMap[brand] = []; brandOrder.push(brand); }
    brandMap[brand].push(radio);
  }

  // Build HTML
  let html = '';
  for (const brand of brandOrder) {
    html += '<div class="group-label">' + esc(brand) + '</div><div class="grid">';
    for (const radio of brandMap[brand]) {
      const color    = meta['Color'][radio] || 'var(--accent)';
      const cardType = buildSubtitle(meta, radioData[radio], radio);
      const url      = 'radio.html?radio=' + encodeURIComponent(radio);
      html +=
        '<a class="card" href="' + url + '" style="--cardaccent:' + esc(color) + '">' +
          '<div class="card-model">' + esc(radio) + '</div>' +
          '<div class="card-type">'  + esc(cardType) + '</div>' +
        '</a>';
    }
    html += '</div>';
  }

  document.getElementById('content').innerHTML = html;
}

// ── Fetch + poll ─────────────────────────────────────────────────────────────
let lastCSVText = null;

async function loadCSV() {
  try {
    const res  = await fetch('radio-cards.csv?_=' + Date.now());
    const text = await res.text();
    if (text !== lastCSVText) {
      lastCSVText = text;
      renderIndex(parseCSV(text));
    }
  } catch (err) {
    if (lastCSVText === null) {
      document.getElementById('content').innerHTML =
        '<p id="content-error">Could not load radio-cards.csv — serving from a local server is required.</p>';
    }
  }
}

loadCSV();
setInterval(loadCSV, POLL_MS);
</script>
</body>
</html>
