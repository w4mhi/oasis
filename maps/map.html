<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emergency Maps — Offline</title>
  <link rel="stylesheet" href="/map-assets/maplibre-gl.css">
  <script src="/map-assets/maplibre-gl.js"></script>
  <script src="/map-assets/pmtiles.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d1a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      width: 100vw; height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    #topbar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 5px 14px;
      background: #080810;
      border-bottom: 1px solid #ff6b0033;
      font-size: 0.85rem;
      z-index: 10;
      flex-shrink: 0;
    }
    #topbar .label   { color: #ff6b00; font-weight: bold; letter-spacing: 1.5px; font-size: 0.9rem; }
    #coords          { color: #7ecfff; min-width: 300px; }
    #zoom-level      { color: #888; }
    #status          { color: #ffb300; }
    #status.ok       { color: #4caf50; }
    #status.error    { color: #ff5252; }

    #topbar .home-link {
      margin-left: auto;
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    #topbar .home-link:hover { color: #00d98b; }

    #map-sel {
      background: #0d0d1a;
      color: #e0e0e0;
      border: 1px solid #ff6b0055;
      border-radius: 3px;
      padding: 2px 6px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #map-sel:focus { outline: none; border-color: #ff6b00; }

    #load-maps-btn {
      background: #0d0d1a;
      color: #e0e0e0;
      border: 1px solid #ff6b0055;
      border-radius: 3px;
      padding: 2px 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    #load-maps-btn:hover { border-color: #ff6b00; color: #fff; }

    /* Filesystem map browser modal */
    #fs-modal {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    #fs-modal.fs-hidden { display: none; }
    #fs-dialog {
      background: #0d0d1a;
      border: 1px solid #ff6b0055;
      border-radius: 5px;
      width: min(560px, 92vw);
      max-height: 80vh;
      display: flex; flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #fs-head {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid #1e2a4a;
    }
    #fs-title { color: #ff6b00; font-weight: bold; letter-spacing: 1px; flex: 1; }
    #fs-close {
      background: none; border: none; color: #888;
      font-size: 1.1rem; cursor: pointer;
    }
    #fs-close:hover { color: #ff5252; }
    #fs-path {
      padding: 6px 12px; color: #7ecfff;
      font-size: 0.8rem; word-break: break-all;
      border-bottom: 1px solid #1e2a4a;
    }
    #fs-list { overflow-y: auto; padding: 4px 0; }
    .fs-row {
      padding: 6px 14px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .fs-row:hover { background: #161b2e; }
    .fs-dir  { color: #e0e0e0; }
    .fs-file { color: #4caf50; }
    .fs-empty, #fs-msg { padding: 10px 14px; color: #888; font-size: 0.8rem; }
    #fs-msg:empty { display: none; }

    /* Map */
    #map { flex: 1; width: 100%; }

    /* Layer panel */
    #layer-panel {
      position: absolute;
      top: 44px; right: 10px;
      background: rgba(8, 8, 16, 0.93);
      border: 1px solid #1e2a4a;
      border-radius: 3px;
      padding: 10px 13px;
      z-index: 10;
      font-size: 0.85rem;
      min-width: 145px;
    }
    #layer-panel h3 {
      color: #4caf50; font-size: 0.75rem;
      letter-spacing: 1.5px; margin-bottom: 8px;
      text-transform: uppercase;
    }
    .layer-toggle {
      display: flex; align-items: center;
      gap: 8px; margin-bottom: 5px;
      cursor: pointer; user-select: none;
    }
    .layer-toggle input { accent-color: #4caf50; cursor: pointer; }
    .layer-toggle span  { color: #ccc; }

    /* Diagnostics */
    #diagnostics {
      position: absolute;
      bottom: 28px; left: 10px;
      background: rgba(8,8,16,0.88);
      border: 1px solid #1e2a4a;
      border-radius: 3px;
      padding: 6px 10px;
      font-size: 0.75rem; color: #666;
      z-index: 10; max-width: 400px;
      line-height: 1.6;
    }
    #diagnostics .val { color: #4caf50; }

    /* Popup */
    .maplibregl-popup-content {
      background: #0d0d1a;
      color: #e0e0e0;
      border: 1px solid #2a3a5a;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      padding: 8px 10px;
      max-width: 260px;
    }
    .maplibregl-popup-tip { border-top-color: #2a3a5a; }
    .popup-row td:first-child { color: #7ecfff; padding-right: 10px; white-space: nowrap; }
    .popup-row td:last-child  { color: #e0e0e0; }
  </style>
</head>
<body>

<div id="topbar">
  <span class="label">⚠ OFFLINE MAPS</span>
  <select id="map-sel" title="Switch map"></select>
  <button id="load-maps-btn" title="Browse for .pmtiles maps on disk / USB">Load maps</button>
  <span id="coords">Move mouse over map…</span>
  <span id="zoom-level">Zoom: —</span>
  <span id="status">Loading…</span>
  <a href="/" class="home-link">⌂ HOME</a>
</div>

<div id="map"></div>

<!-- Filesystem map browser (Load maps → browse Pi / USB for .pmtiles) -->
<div id="fs-modal" class="fs-hidden">
  <div id="fs-dialog">
    <div id="fs-head">
      <span id="fs-title">Load maps</span>
      <button id="fs-close" title="Close">✕</button>
    </div>
    <div id="fs-path">—</div>
    <div id="fs-list"></div>
    <div id="fs-msg"></div>
  </div>
</div>

<div id="layer-panel">
  <h3>Layers</h3>
  <label class="layer-toggle"><input type="checkbox" data-group="roads"     checked> <span>Roads</span></label>
  <label class="layer-toggle"><input type="checkbox" data-group="waterways" checked> <span>Waterways</span></label>
  <label class="layer-toggle"><input type="checkbox" data-group="water"     checked> <span>Water bodies</span></label>
  <label class="layer-toggle"><input type="checkbox" data-group="buildings" checked> <span>Buildings</span></label>
  <label class="layer-toggle"><input type="checkbox" data-group="parks"     checked> <span>Parks / Nature</span></label>
  <label class="layer-toggle"><input type="checkbox" data-group="landuse"   checked> <span>Land use</span></label>
  <label class="layer-toggle"><input type="checkbox" data-group="pois"      checked> <span>POIs / Places</span></label>
</div>

<div id="diagnostics">
  Layers detected: <span id="layer-names" class="val">inspecting…</span><br>
  Click any feature to see its OSM properties.
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
// Priority: URL params > PMTiles archive header center > neutral fallback
const _params    = new URLSearchParams(window.location.search);
let   MAP_FILE   = _params.get('file') || 'washington.pmtiles';
const _pc        = _params.get('center');
const _pz        = _params.get('zoom');
const URL_CENTER = _pc ? _pc.split(',').map(Number) : null;
const URL_ZOOM   = _pz ? Number(_pz) : null;

const origin = window.location.origin;

// ── PMTiles ─────────────────────────────────────────────────────────────────
// Tiles live in a single .pmtiles archive read by the browser via HTTP range
// requests. Center/zoom come from each archive's own header (getHeader()).
const pmtilesProtocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', pmtilesProtocol.tile);

const pmtilesHttpUrl   = (file) => `${origin}/maps/${file}`;
const pmtilesSourceUrl = (file) => `pmtiles://${pmtilesHttpUrl(file)}`;

// Fly to an archive's native center/zoom (best-effort). httpUrl is the plain
// (non-protocol) URL the PMTiles reader uses to fetch the archive header.
async function flyToArchive(httpUrl, duration) {
  try {
    const hdr = await new pmtiles.PMTiles(httpUrl).getHeader();
    if (hdr && Number.isFinite(hdr.centerLon) && Number.isFinite(hdr.centerLat)) {
      map.flyTo({ center: [hdr.centerLon, hdr.centerLat],
                  zoom: hdr.centerZoom || 9, duration });
    }
  } catch(e) { /* centering is best-effort */ }
}

// ── Populate map file dropdown ────────────────────────────────────────────────
(async () => {
  const sel = document.getElementById('map-sel');
  try {
    const res  = await fetch('/api/browse?path=maps');
    const data = await res.json();
    const files = (data.entries || []).filter(e => e.name.endsWith('.pmtiles')).map(e => e.name);
    files.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f;
      opt.textContent = f.replace('.pmtiles', '');
      if (f === MAP_FILE) opt.selected = true;
      sel.appendChild(opt);
    });
  } catch(e) {
    const opt = document.createElement('option');
    opt.value = MAP_FILE;
    opt.textContent = MAP_FILE.replace('.pmtiles', '');
    sel.appendChild(opt);
  }
  sel.addEventListener('change', () => switchMap(sel.value));
})();

// ── Diagnostics ───────────────────────────────────────────────────────────────
(async () => {
  try {
    const meta   = await new pmtiles.PMTiles(pmtilesHttpUrl(MAP_FILE)).getMetadata();
    const layers = (meta.vector_layers || []).map(l => l.id).join(', ');
    document.getElementById('layer-names').textContent = layers || '(none found)';
    console.log('[PMTiles] metadata:', meta);
  } catch(e) {
    document.getElementById('layer-names').textContent = 'error — see console';
    console.error('[PMTiles] metadata fetch failed:', e);
  }
})();

// ── Map ──────────────────────────────────────────────────────────────────────
const tilesUrl = pmtilesSourceUrl(MAP_FILE);

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    glyphs: `${origin}/map-assets/fonts/{fontstack}/{range}.pbf`,
    sources: {
      map: { type: 'vector', url: tilesUrl }
    },
    layers: [

      // ── Background ────────────────────────────────────────────────────────
      { id: 'background', type: 'background',
        paint: { 'background-color': '#111827' } },

      // ── Water bodies ──────────────────────────────────────────────────────
      { id: 'water-poly-fill', type: 'fill',
        source: 'map', 'source-layer': 'water',
        paint: { 'fill-color': '#1a3a5c' } },

      // ── Waterways ─────────────────────────────────────────────────────────
      { id: 'waterways-line', type: 'line',
        source: 'map', 'source-layer': 'waterway',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': '#1a4a7a',
          'line-width': ['interpolate', ['linear'], ['zoom'], 8, 1, 14, 4]
        }
      },

      // ── Land cover ────────────────────────────────────────────────────────
      { id: 'landcover-wood', type: 'fill',
        source: 'map', 'source-layer': 'landcover',
        filter: ['==', ['get', 'class'], 'wood'],
        paint: { 'fill-color': '#1a2e1a', 'fill-opacity': 0.8 } },

      { id: 'landcover-grass', type: 'fill',
        source: 'map', 'source-layer': 'landcover',
        filter: ['match', ['get', 'class'], ['grass', 'crop', 'scrub'], true, false],
        paint: { 'fill-color': '#1e2e18', 'fill-opacity': 0.6 } },

      // ── Parks / nature ────────────────────────────────────────────────────
      { id: 'landuse-park', type: 'fill',
        source: 'map', 'source-layer': 'landuse',
        filter: ['match', ['get', 'class'], ['park', 'national_park', 'nature_reserve'], true, false],
        paint: { 'fill-color': '#162616', 'fill-opacity': 0.7 } },

      // ── Land use ──────────────────────────────────────────────────────────
      { id: 'landuse-residential', type: 'fill',
        source: 'map', 'source-layer': 'landuse',
        filter: ['==', ['get', 'class'], 'residential'],
        paint: { 'fill-color': '#1a1a2a', 'fill-opacity': 0.5 } },

      { id: 'landuse-commercial', type: 'fill',
        source: 'map', 'source-layer': 'landuse',
        filter: ['match', ['get', 'class'], ['commercial', 'retail'], true, false],
        paint: { 'fill-color': '#1e1a22', 'fill-opacity': 0.5 } },

      { id: 'landuse-industrial', type: 'fill',
        source: 'map', 'source-layer': 'landuse',
        filter: ['==', ['get', 'class'], 'industrial'],
        paint: { 'fill-color': '#1a1e22', 'fill-opacity': 0.5 } },

      // ── Roads — minor / service / track / path ────────────────────────────
      { id: 'road-minor', type: 'line',
        source: 'map', 'source-layer': 'transportation',
        filter: ['match', ['get', 'class'], ['minor', 'service', 'track', 'path'], true, false],
        minzoom: 12,
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#2a2a3a', 'line-width': 1 } },

      // ── Roads — secondary / tertiary ──────────────────────────────────────
      { id: 'road-secondary', type: 'line',
        source: 'map', 'source-layer': 'transportation',
        filter: ['match', ['get', 'class'], ['secondary', 'tertiary'], true, false],
        minzoom: 9,
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#3a3a4e', 'line-width': ['interpolate', ['linear'], ['zoom'], 9, 1, 14, 3] } },

      // ── Roads — primary ───────────────────────────────────────────────────
      { id: 'road-primary', type: 'line',
        source: 'map', 'source-layer': 'transportation',
        filter: ['==', ['get', 'class'], 'primary'],
        minzoom: 7,
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#4a4a20', 'line-width': ['interpolate', ['linear'], ['zoom'], 7, 1, 14, 4] } },

      // ── Roads — motorway / trunk ──────────────────────────────────────────
      { id: 'road-motorway', type: 'line',
        source: 'map', 'source-layer': 'transportation',
        filter: ['match', ['get', 'class'], ['motorway', 'trunk'], true, false],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#8b5a00', 'line-width': ['interpolate', ['linear'], ['zoom'], 5, 1, 14, 6] } },

      // ── Buildings ─────────────────────────────────────────────────────────
      { id: 'buildings-fill', type: 'fill',
        source: 'map', 'source-layer': 'building',
        minzoom: 12,
        paint: {
          'fill-color': '#1e2030',
          'fill-outline-color': '#2a2a4a',
          'fill-opacity': ['interpolate', ['linear'], ['zoom'], 12, 0.5, 15, 0.9]
        }
      },

      // ── Road labels ───────────────────────────────────────────────────────
      { id: 'road-labels', type: 'symbol',
        source: 'map', 'source-layer': 'transportation_name',
        minzoom: 13,
        layout: {
          'symbol-placement':  'line',
          'symbol-spacing':    250,
          'text-field':        ['get', 'name'],
          'text-font':         ['Open Sans Regular'],
          'text-size':         ['interpolate', ['linear'], ['zoom'], 13, 10, 17, 13],
          'text-max-angle':    30,
          'text-padding':      5,
          'text-allow-overlap': false
        },
        paint: {
          'text-color':      '#e8e8ff',
          'text-halo-color': '#080810',
          'text-halo-width': 1.5
        }
      },

      // ── Place labels — cities / towns ─────────────────────────────────────
      { id: 'place-labels', type: 'symbol',
        source: 'map', 'source-layer': 'place',
        filter: ['match', ['get', 'class'], ['city', 'town'], true, false],
        layout: {
          'text-field':        ['get', 'name'],
          'text-font':         ['Open Sans Regular'],
          'text-size':         ['interpolate', ['linear'], ['zoom'], 5, 10, 12, 14],
          'text-anchor':       'center',
          'text-padding':      6,
          'text-max-width':    8,
          'text-allow-overlap': false
        },
        paint: {
          'text-color':      '#e0e0e0',
          'text-halo-color': '#080810',
          'text-halo-width': 1.5
        }
      },

      // ── POIs — villages, suburbs, neighbourhoods ──────────────────────────
      { id: 'pois-circle', type: 'symbol',
        source: 'map', 'source-layer': 'place',
        filter: ['match', ['get', 'class'], ['village', 'suburb', 'hamlet', 'neighbourhood', 'quarter'], true, false],
        minzoom: 9,
        layout: {
          'text-field':        ['get', 'name'],
          'text-font':         ['Open Sans Regular'],
          'text-size':         ['interpolate', ['linear'], ['zoom'], 9, 10, 14, 13],
          'text-anchor':       'center',
          'text-padding':      4,
          'text-allow-overlap': false
        },
        paint: {
          'text-color':      '#b0b0c0',
          'text-halo-color': '#080810',
          'text-halo-width': 1.2
        }
      },

      // ── Mountain peaks ────────────────────────────────────────────────────
      { id: 'mountain-peak', type: 'symbol',
        source: 'map', 'source-layer': 'mountain_peak',
        minzoom: 9,
        layout: {
          'text-field':   ['concat', ['get', 'name'], '\n', ['get', 'ele_ft'], 'ft'],
          'text-font':    ['Open Sans Regular'],
          'text-size':    10,
          'text-anchor':  'top',
          'text-offset':  [0, 0.3]
        },
        paint: {
          'text-color':      '#a0c0a0',
          'text-halo-color': '#080810',
          'text-halo-width': 1
        }
      }

    ]
  },
  center:  URL_CENTER || [-121.83, 47.28],
  zoom:    URL_ZOOM   || 9,
  maxZoom: 19,
  minZoom: 4
});

// ── Controls ──────────────────────────────────────────────────────────────────
map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'imperial', maxWidth: 120 }), 'bottom-left');

// ── Coordinate display ────────────────────────────────────────────────────────
map.on('mousemove', (e) => {
  document.getElementById('coords').textContent =
    `Lat ${e.lngLat.lat.toFixed(6)}   Lon ${e.lngLat.lng.toFixed(6)}`;
  document.getElementById('zoom-level').textContent =
    `Zoom: ${map.getZoom().toFixed(1)}`;
});

// ── Switch map file ───────────────────────────────────────────────────────────
// Swap the basemap to a new PMTiles source; re-center from its header on idle.
function loadMapSource(sourceUrl, httpUrl) {
  map.getSource('map').setUrl(sourceUrl);
  map.once('idle', () => flyToArchive(httpUrl, 600));
}

function switchMap(filename) {
  MAP_FILE = filename;
  loadMapSource(pmtilesSourceUrl(filename), pmtilesHttpUrl(filename));
}

// Load a .pmtiles from an arbitrary allowlisted path (USB / external mount).
function loadExternalMap(absPath) {
  const httpUrl = `${origin}/api/fs/pmtiles?path=${encodeURIComponent(absPath)}`;
  loadMapSource('pmtiles://' + httpUrl, httpUrl);
}

// ── "Load maps" filesystem browser ──────────────────────────────────────────
const _fsModal = document.getElementById('fs-modal');
const _escHtml = (s) => String(s).replace(/[&<>"]/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

async function openFsBrowser(path) {
  const list   = document.getElementById('fs-list');
  const pathEl = document.getElementById('fs-path');
  const msg    = document.getElementById('fs-msg');
  msg.textContent = '';
  list.innerHTML  = '<div class="fs-empty">Loading…</div>';
  try {
    const res = await fetch(`${origin}/api/fs/browse?path=${encodeURIComponent(path)}`, { cache: 'no-store' });
    let d = null;
    try { d = await res.json(); } catch(_) { /* non-JSON body (e.g. a 404/500 HTML page) */ }
    if (!res.ok || !d || !d.ok) {
      list.innerHTML = '';
      const why = (d && d.error) ? d.error
        : (res.status === 404 ? `HTTP 404 — server has no /api/fs/browse route (restart OASIS with the updated server/app.py)`
                              : `HTTP ${res.status} ${res.statusText}`);
      msg.textContent = 'Browse failed: ' + why;
      console.error('[fs-browse]', res.status, d);
      return;
    }

    pathEl.textContent = d.roots ? 'Select a location:' : d.path;
    let rows = '';
    if (!d.roots && d.parent !== null) {
      rows += `<div class="fs-row fs-dir" data-path="${_escHtml(d.parent)}" data-type="dir">..</div>`;
    }
    (d.entries || []).forEach(e => {
      const cls   = e.type === 'dir' ? 'fs-dir' : 'fs-file';
      const label = e.type === 'dir' ? _escHtml(e.name) + '/' : _escHtml(e.name);
      rows += `<div class="fs-row ${cls}" data-path="${_escHtml(e.path)}" data-type="${e.type}">${label}</div>`;
    });
    list.innerHTML = rows || '<div class="fs-empty">No folders or .pmtiles here.</div>';
  } catch(e) {
    list.innerHTML = ''; msg.textContent = 'Browse failed: ' + e.message;
    console.error('[fs-browse]', e);
  }
}

document.getElementById('load-maps-btn').addEventListener('click', () => {
  _fsModal.classList.remove('fs-hidden');
  openFsBrowser('');
});
document.getElementById('fs-close').addEventListener('click', () => _fsModal.classList.add('fs-hidden'));
_fsModal.addEventListener('click', (e) => { if (e.target === _fsModal) _fsModal.classList.add('fs-hidden'); });
document.getElementById('fs-list').addEventListener('click', (e) => {
  const row = e.target.closest('.fs-row');
  if (!row) return;
  if (row.dataset.type === 'dir') {
    openFsBrowser(row.dataset.path);
  } else {
    loadExternalMap(row.dataset.path);
    _fsModal.classList.add('fs-hidden');
  }
});

// ── Status + initial positioning ──────────────────────────────────────────────
map.on('load', async () => {
  const s = document.getElementById('status');
  s.textContent = '● OFFLINE OK';
  s.className = 'ok';

  if (URL_CENTER && URL_ZOOM) return;
  flyToArchive(pmtilesHttpUrl(MAP_FILE), 800);
});

map.on('error', (e) => {
  const s = document.getElementById('status');
  s.textContent = '✗ ERROR — see console';
  s.className = 'error';
  console.error('[MapLibre error]', e);
});

// ── Click → property popup ────────────────────────────────────────────────────
const CLICKABLE_LAYERS = [
  'water-poly-fill', 'waterways-line',
  'landcover-wood', 'landcover-grass',
  'landuse-park',
  'landuse-residential', 'landuse-commercial', 'landuse-industrial',
  'road-minor', 'road-secondary', 'road-primary', 'road-motorway',
  'buildings-fill', 'place-labels', 'pois-circle', 'mountain-peak',
];

map.on('click', (e) => {
  const features = map.queryRenderedFeatures(e.point, { layers: CLICKABLE_LAYERS });
  if (!features.length) return;

  const props = features[0].properties;
  const rows  = Object.entries(props)
    .filter(([, v]) => v !== null && v !== '' && v !== 'null')
    .map(([k, v]) => `<tr class="popup-row"><td>${k}</td><td>${v}</td></tr>`)
    .join('');
  if (!rows) return;

  new maplibregl.Popup({ closeButton: true, maxWidth: '280px' })
    .setLngLat(e.lngLat)
    .setHTML(`<table style="border-collapse:collapse;width:100%">${rows}</table>`)
    .addTo(map);
});

['road-minor', 'road-secondary', 'road-primary', 'road-motorway', 'pois-circle', 'mountain-peak'].forEach(id => {
  map.on('mouseenter', id, () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', id, () => map.getCanvas().style.cursor = '');
});

// ── Layer toggles ─────────────────────────────────────────────────────────────
const LAYER_GROUPS = {
  roads:     ['road-minor', 'road-secondary', 'road-primary', 'road-motorway', 'road-labels'],
  waterways: ['waterways-line'],
  water:     ['water-poly-fill'],
  buildings: ['buildings-fill'],
  parks:     ['landuse-park'],
  landuse:   ['landcover-wood', 'landcover-grass', 'landuse-residential', 'landuse-commercial', 'landuse-industrial'],
  pois:      ['place-labels', 'pois-circle', 'mountain-peak'],
};

document.querySelectorAll('.layer-toggle input').forEach(cb => {
  cb.addEventListener('change', () => {
    const vis = cb.checked ? 'visible' : 'none';
    (LAYER_GROUPS[cb.dataset.group] || []).forEach(id => {
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', vis);
    });
  });
});
</script>
</body>
</html>
