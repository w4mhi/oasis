name: offline-manifest

# Guards the offline package manifest + reader: suite-aware package selection,
# capability gates, and newest-source-wins resolution — the behaviour that the
# "bookworm bundle / librtlsdr 0.6.0 on Trixie" bug exposed. Also byte-compiles
# every script, lints with ruff (config: ruff.toml), and confirms the thin
# CLIs still parse args.

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "features/**"
      - "common/**"
      - "server/**"
      - "services/**"
      - "displays/**"
      - "ruff.toml"
      - ".github/workflows/offline-manifest.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "common/**"
      - "server/**"
      - "services/**"
      - "displays/**"
      - "ruff.toml"
  workflow_dispatch:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifest JSON
        run: python3 -c "import json; json.load(open('scripts/offline-manifest.json'))"

      - name: Manifest self-tests (suite-aware · gates · newest-source-wins)
        run: python3 tests/test_offline_manifest.py

      - name: Byte-compile all scripts
        run: python3 -m py_compile $(git ls-files 'scripts/*.py' 'common/*.py' 'tests/*.py' 'setup-oasis.py' 'features/*/*.py' 'services/*/*.py' 'services/*/common/*.py' 'server/*.py' 'server/routes/*.py' 'small-screen/*.py')

      # Dev/CI-only tool — never a runtime dependency; the offline wheel set
      # stays Flask-only. Rules and rationale live in ruff.toml.
      - name: Lint (ruff)
        run: |
          python3 -m pip install --quiet ruff
          python3 -m ruff check .

      - name: Thin CLIs still parse --help
        run: |
          set -e
          for s in setup-server; do
            echo "  --help: $s"
            python3 "scripts/$s.py" --help >/dev/null
          done
          echo "  --help: install-rtl-sdr"
          python3 features/rtl-sdr/install-rtl-sdr.py --help >/dev/null
          echo "  --help: webssh install"
          python3 services/webssh/install.py --help >/dev/null
          echo "  --help: kiwix install"
          python3 services/kiwix/install.py --help >/dev/null
          echo "  --help: winlink install"
          python3 services/winlink/install.py --help >/dev/null
          echo "  --help: fcc_database install"
          python3 services/fcc_database/install.py --help >/dev/null
          echo "  --help: graywolf install"
          python3 services/graywolf/install.py --help >/dev/null
          echo "  --help: setup-oasis"
          python3 setup-oasis.py --help >/dev/null
