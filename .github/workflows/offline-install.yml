name: server-setup

# Verifies that setup-server.py produces a working server environment on every
# supported {platform, python} combination. Wheels are downloaded from PyPI at
# run time (not committed to the repo).

on:
  push:
    paths:
      - "scripts/requirements.txt"
      - "scripts/setup-server.py"
      - "server/app.py"
      - "common/lookup.py"
      - ".github/workflows/offline-install.yml"
  pull_request:
    paths:
      - "scripts/requirements.txt"
      - "scripts/setup-server.py"
      - "server/app.py"
      - "common/lookup.py"
  workflow_dispatch:

jobs:
  setup-server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install server dependencies
        run: python3 scripts/setup-server.py
      - name: Import the app
        run: |
          python3 -c "import sys; sys.path.insert(0, '.'); from common import lookup"
        shell: bash
