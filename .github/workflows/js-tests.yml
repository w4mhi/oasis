name: js-tests

# Front-end gate: pure-function unit tests plus a syntax/hygiene sweep over EVERY
# tracked HTML/JS asset (tests/js/front-end-gate.test.js). Node is a dev/CI tool
# only; the Pi never runs it.
#
# The path filter deliberately matches any .html/.js/.css in the tree. It used to
# list `index.html`, `oasis-dashboard/**` and `maps/**` only, which meant a change
# to services/, static/, server/system/ or tools/ did not even start this workflow
# — the gate existed but never ran for most of the front-end.

on:
  push:
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - ".github/workflows/js-tests.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - ".github/workflows/js-tests.yml"
  workflow_dispatch:

jobs:
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Covers both the pure-function suites and front-end-gate.test.js, which
      # syntax-checks every inline <script> block and every authored .js file, and
      # rejects curly quotes inside a tag. Deliberately one mechanism rather than a
      # separate YAML step, so `/preflight` runs the identical gate before a push.
      - name: JS unit tests + front-end syntax/hygiene gate
        run: node --test 'tests/js/**/*.test.js'
