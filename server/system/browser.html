<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OASIS - File Browser</title>
<link rel="stylesheet" href="../../css/common.css">
<style>
.breadcrumb {
  font-size: var(--fs-label);
  color: var(--text-dim);
  margin-bottom: .9rem;
  word-break: break-all;
}
.breadcrumb a { color: var(--blue); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb span { color: var(--text-dim); margin: 0 .25rem; }

.entry-list { list-style: none; padding: 0; margin: 0; }
.entry-list li {
  display: flex;
  align-items: center;
  gap: .6rem;
  padding: .4rem .6rem;
  border-bottom: 1px solid var(--border);
  font-size: var(--fs-base);
}
.entry-list li:last-child { border-bottom: none; }
.entry-list li:hover { background: var(--panel); border-radius: 5px; }

.entry-icon { flex-shrink: 0; width: 1.2rem; display: inline-flex;
              align-items: center; justify-content: center; color: var(--text-dim); }
.entry-dir .entry-icon { color: var(--blue); }
.breadcrumb svg { vertical-align: -2px; }
.entry-name { flex: 1; }
.entry-name a { color: var(--text); text-decoration: none; }
.entry-name a:hover { color: var(--accent); }
.entry-dir a { color: var(--blue); }
.entry-meta { font-size: var(--fs-small); color: var(--text-dim); white-space: nowrap; }

#status { font-size: var(--fs-base); color: var(--text-dim); padding: .5rem 0; }

.filter-row { display: flex; gap: .5rem; margin-bottom: .75rem; }
.filter-row input {
  flex: 1; background: var(--panel); border: 1px solid var(--border);
  border-radius: 5px; color: var(--text); font-family: var(--mono);
  font-size: var(--fs-base); padding: .35rem .6rem;
}
.filter-row input:focus { outline: none; border-color: var(--accent-dim); }
.filter-clear {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  font-family: var(--mono); font-size: var(--fs-label); padding: .35rem .65rem;
  border-radius: 5px; cursor: pointer; display: none;
}
.filter-clear:hover { color: var(--accent); border-color: var(--accent-dim); }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="home-bar">
    <button class="theme-toggle" id="theme-toggle" type="button" onclick="toggleTheme()"
            title="Toggle light / dark theme" aria-label="Toggle light / dark theme"><span id="theme-glyph">&#9728;</span></button>
    <a class="home-link" href="/">⌂ HOME</a>
  </div>
  <h1 id="page-title">File Browser</h1>
  <p id="page-sub"></p>
</header>

<div class="sec">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div class="filter-row" id="filterRow" style="display:none">
    <input type="text" id="filterInput" placeholder="Filter by name…" autocomplete="off" spellcheck="false">
    <button class="filter-clear" id="filterClear" title="Clear filter">&#x2715;</button>
  </div>
  <div id="status">Loading…</div>
  <ul class="entry-list" id="entry-list"></ul>
</div>

</div>

<script>
const params = new URLSearchParams(location.search);
const rootPath = (params.get('path') || '').replace(/\/$/, '');
let currentPath = params.get('browse') || rootPath;

function fmtSize(bytes) {
  if (bytes == null) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function fmtDate(ts) {
  return new Date(ts * 1000).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

function buildBreadcrumb(path) {
  const bc = document.getElementById('breadcrumb');
  const parts = path ? path.split('/').filter(Boolean) : [];
  let html = `<a href="browser.html?path=${encodeURIComponent(rootPath)}&browse=${encodeURIComponent(rootPath)}">${icon('folder')} ${rootPath || '/'}</a>`;
  let built = rootPath;
  parts.slice(rootPath.split('/').filter(Boolean).length).forEach((p, i) => {
    built += '/' + p;
    html += `<span>›</span><a href="browser.html?path=${encodeURIComponent(rootPath)}&browse=${encodeURIComponent(built)}">${p}</a>`;
  });
  bc.innerHTML = html;
}

function load(path) {
  currentPath = path;
  history.replaceState(null, '', `browser.html?path=${encodeURIComponent(rootPath)}&browse=${encodeURIComponent(path)}`);

  const title = rootPath.split('/').filter(Boolean).pop() || 'File Browser';
  document.getElementById('page-title').textContent = title;
  document.getElementById('page-sub').textContent = path || 'Browse user files';
  document.title = 'OASIS - ' + title;

  buildBreadcrumb(path);
  document.getElementById('status').textContent = 'Loading…';
  document.getElementById('entry-list').innerHTML = '';

  fetch(`/api/browse?path=${encodeURIComponent(path)}`)
    .then(r => r.json())
    .then(data => {
      document.getElementById('status').textContent = '';
      if (!data.ok) { document.getElementById('status').textContent = data.error; return; }

      const list = document.getElementById('entry-list');

      // Up one level (if not already at root)
      if (path !== rootPath) {
        const parent = path.substring(0, path.lastIndexOf('/')) || rootPath;
        const li = document.createElement('li');
        li.innerHTML = `<span class="entry-icon">${icon('up')}</span><span class="entry-name"><a href="#" data-nav="${parent}">.. (up)</a></span>`;
        list.appendChild(li);
      }

      if (!data.entries.length && path === rootPath) {
        const li = document.createElement('li');
        li.innerHTML = '<span style="color:var(--text-dim)">Empty folder</span>';
        list.appendChild(li);
      }

      data.entries.forEach(e => {
        const li = document.createElement('li');
        li.dataset.name = e.name;
        const isDir = e.type === 'dir';
        const entryPath = path + '/' + e.name;

        if (isDir) {
          li.className = 'entry-dir';
          li.innerHTML = `
            <span class="entry-icon">${icon('folder')}</span>
            <span class="entry-name"><a href="#" data-nav="${entryPath}">${e.name}/</a></span>
            <span class="entry-meta"></span>`;
        } else {
          const href = '/' + entryPath;
          li.innerHTML = `
            <span class="entry-icon">${fileIcon(e.name)}</span>
            <span class="entry-name"><a href="${href}" target="_blank" rel="noopener">${e.name}</a></span>
            <span class="entry-meta">${fmtSize(e.size)} · ${fmtDate(e.modified)}</span>`;
        }
        list.appendChild(li);
      });

      list.querySelectorAll('[data-nav]').forEach(a => {
        a.addEventListener('click', ev => { ev.preventDefault(); load(a.dataset.nav); });
      });

      // Show filter only when there are enough entries to warrant it
      filterRow.style.display = data.entries.length > 5 ? 'flex' : 'none';
      filterInput.value = '';
      filterClear.style.display = 'none';
    })
    .catch(() => { document.getElementById('status').textContent = 'Failed to load directory.'; });
}

// ── Icons ─────────────────────────────────────────────────────────────────────
// Inline SVG, stroked in currentColor — NOT emoji. Raspberry Pi OS ships no
// emoji font, so every emoji here rendered as a tofu box on the device this page
// exists to browse. 16x16, so they line up with the text baseline in .entry-icon.
const SVG = {
  folder: '<path d="M1.5 3.5h4l1.5 2h7.5v8h-13z"/>',
  up:     '<path d="M8 13V3.5"/><path d="M4 7.5L8 3.5l4 4"/>',
  file:   '<path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M9.5 1.5v3h3"/>',
  image:  '<rect x="1.5" y="2.5" width="13" height="11" rx="1"/><circle cx="5.5" cy="6" r="1.2"/><path d="M2 11.5l3.5-3 3 2.5 2.5-2 3 3"/>',
  audio:  '<path d="M9.5 2.5v8"/><circle cx="7" cy="11" r="2.2"/><path d="M9.5 2.5l4 1.2v2.2l-4-1.2z"/>',
  video:  '<rect x="1.5" y="3.5" width="9" height="9" rx="1"/><path d="M10.5 7l4-2.5v7l-4-2.5z"/>',
  archive:'<rect x="2.5" y="2.5" width="11" height="11" rx="1"/><path d="M7 2.5v3M9 5.5v3M7 8.5v3"/>',
  web:    '<circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2.2 2 9.8 0 12M8 2C6 4.2 6 11.8 8 14"/>',
  text:   '<path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M5.5 7.5h5M5.5 10h5"/>',
  data:   '<path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M5.5 11.5v-2M8 11.5v-4M10.5 11.5v-3"/>',
};

function icon(key) {
  return '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" ' +
         'stroke="currentColor" stroke-width="1.3" stroke-linecap="round" ' +
         'stroke-linejoin="round" aria-hidden="true">' + (SVG[key] || SVG.file) + '</svg>';
}

function fileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  const map = { pdf:'text', png:'image', jpg:'image', jpeg:'image', gif:'image', svg:'image',
                mp3:'audio', wav:'audio', ogg:'audio',
                mp4:'video', avi:'video', mkv:'video',
                zip:'archive', gz:'archive', tar:'archive',
                html:'web', htm:'web',
                txt:'text', md:'text', csv:'data', json:'data', xml:'data' };
  return icon(map[ext] || 'file');
}

// ── Filter ────────────────────────────────────────────────────────────────────
const filterInput = document.getElementById('filterInput');
const filterClear = document.getElementById('filterClear');
const filterRow   = document.getElementById('filterRow');

function applyFilter() {
  const q = filterInput.value.trim().toLowerCase();
  filterClear.style.display = q ? 'block' : 'none';
  document.querySelectorAll('#entry-list li[data-name]').forEach(li => {
    li.style.display = (!q || li.dataset.name.toLowerCase().includes(q)) ? '' : 'none';
  });
}

filterInput.addEventListener('input', applyFilter);
filterClear.addEventListener('click', () => { filterInput.value = ''; applyFilter(); filterInput.focus(); });

load(currentPath);
</script>
</body>
</html>
